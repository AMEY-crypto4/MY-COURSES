const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const CM_MODE = IS_SQL ? 'text/x-sqlite' : 'javascript';

function loadProgress(){ try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); } catch(e){ return new Set(); } }
function saveProgress(set){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...set])); } catch(e){} }
function loadDrafts(){ try { return JSON.parse(localStorage.getItem(DRAFTS_KEY) || '{}'); } catch(e){ return {}; } }
function saveDraft(id, code){ try { const d = loadDrafts(); d[id] = code; localStorage.setItem(DRAFTS_KEY, JSON.stringify(d)); } catch(e){} }

const state = { completed: loadProgress(), drafts: loadDrafts(), openTabs: [], activeId: null, cm: null };
document.getElementById('titleText').textContent = COURSE.title;

function escapeHtml(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- JS runner (Web Worker sandbox) ---------- */
const JS_WORKER_SRC = `
self.onmessage = function(e){
  const code = e.data.code, testsCode = e.data.testsCode || '';
  const logs = [];
  function fmt(a){
    if (a === undefined) return 'undefined';
    if (a === null) return 'null';
    if (typeof a === 'function') return '[Function]';
    if (typeof a === 'object') {
      try { if (a instanceof Map) return 'Map(' + JSON.stringify([...a]) + ')'; if (a instanceof Set) return 'Set(' + JSON.stringify([...a]) + ')'; return JSON.stringify(a); } catch(err){ return String(a); }
    }
    return String(a);
  }
  const fake = { log: function(){ logs.push(Array.prototype.map.call(arguments, fmt).join(' ')); } };
  fake.info = fake.warn = fake.error = fake.debug = fake.log;
  let error = null; const results = [];
  try {
    const runner = new Function('__results', '__logs', 'console', code + '\\n' + testsCode);
    runner(results, logs, fake);
  } catch(err){ error = err.message; }
  self.postMessage({ logs: logs, error: error, results: results });
};
`;
function runJs(code, testsCode, onDone){
  let finished = false, worker;
  try { worker = new Worker(URL.createObjectURL(new Blob([JS_WORKER_SRC], { type:'application/javascript' }))); }
  catch(e){ onDone({ logs:[], error:'Could not start the sandbox: ' + e.message, results:[], timedOut:false }); return; }
  const timer = setTimeout(() => { if (finished) return; finished = true; worker.terminate(); onDone({ logs:[], error:null, results:[], timedOut:true }); }, COURSE.timeoutMs || 5000);
  worker.onmessage = (e) => { if (finished) return; finished = true; clearTimeout(timer); worker.terminate(); onDone({ logs:e.data.logs, error:e.data.error, results:e.data.results, timedOut:false }); };
  worker.onerror = (e) => { if (finished) return; finished = true; clearTimeout(timer); worker.terminate(); onDone({ logs:[], error:e.message, results:[], timedOut:false }); };
  worker.postMessage({ code, testsCode });
}
function buildTestsCode(tests){
  const helpers = "function __throws(fn, expectedMessage){ try { fn(); return false; } catch(e){ return expectedMessage === undefined ? true : e.message === expectedMessage; } }\n" +
                  "function __eq(a, b){ return JSON.stringify(a) === JSON.stringify(b); }\n";
  return helpers + tests.map(t => {
    const d = JSON.stringify(t.desc);
    return 'try { var __pass = !!(' + t.check + '); __results.push({desc: ' + d + ', pass: __pass}); } catch(__e){ __results.push({desc: ' + d + ', pass:false, error: __e.message}); }';
  }).join('\n');
}

/* ---------- SQL runner (sql.js in a persistent Web Worker) ---------- */
let sqlWorker = null, sqlSeq = 0, sqlWarm = false;
function getSqlWorker(){
  if (sqlWorker) return sqlWorker;
  const src = "importScripts('" + SQLJS_BASE + "sql-wasm.js');\n" + SQLCORE_SRC + "\n" +
  "let SQLP=null;\n" +
  "self.onmessage=async function(e){const d=e.data;try{if(!SQLP)SQLP=await initSqlJs({locateFile:f=>'" + SQLJS_BASE + "'+f});" +
  "const out=runSqlJob(SQLP,d.job);self.postMessage({id:d.id,ok:true,out:out});}catch(err){self.postMessage({id:d.id,ok:false,error:String(err&&err.message||err)});}};";
  sqlWorker = new Worker(URL.createObjectURL(new Blob([src], { type:'application/javascript' })));
  return sqlWorker;
}
function runSql(job, onDone){
  let w;
  try { w = getSqlWorker(); } catch(e){ onDone({ ok:false, error:'Could not start the SQL engine: ' + e.message }); return; }
  const id = ++sqlSeq; let finished = false;
  const timer = setTimeout(() => {
    if (finished) return; finished = true;
    try { w.terminate(); } catch(e){}
    sqlWorker = null; sqlWarm = false;
    onDone({ ok:false, timedOut:true });
  }, sqlWarm ? 6000 : 25000);
  w.onmessage = (e) => {
    if (e.data.id !== id || finished) return;
    finished = true; clearTimeout(timer); sqlWarm = true; onDone(e.data);
  };
  w.onerror = (e) => {
    if (finished) return; finished = true; clearTimeout(timer);
    try { w.terminate(); } catch(_){}
    sqlWorker = null; sqlWarm = false;
    onDone({ ok:false, error:'SQL engine failed to load (' + (e.message || 'network?') + '). Check your internet connection and try again.' });
  };
  w.postMessage({ id, job });
}
function sqlSetupFor(lesson){
  const ds = DATASETS[lesson.dataset || COURSE.defaultDataset] || { sql:'' };
  return ds.sql + '\n' + (lesson.setupExtra || '');
}
function renderTable(set, maxRows){
  if (!set) return '';
  maxRows = maxRows || 60;
  const head = '<tr>' + set.columns.map(c => '<th>' + escapeHtml(c) + '</th>').join('') + '</tr>';
  const rows = set.values.slice(0, maxRows).map(r => '<tr>' + r.map(v => {
    if (v === null) return '<td class="null">NULL</td>';
    if (typeof v === 'number') return '<td class="num">' + (Math.round(v*1e6)/1e6) + '</td>';
    if (v instanceof Uint8Array) return '<td class="null">BLOB</td>';
    return '<td>' + escapeHtml(v) + '</td>';
  }).join('') + '</tr>').join('');
  const more = set.values.length > maxRows ? '<div class="result-note">… showing first ' + maxRows + ' of ' + set.values.length + ' rows</div>' : '';
  return '<table class="result">' + head + rows + '</table>' + more;
}

/* ---------- Sidebar / tabs ---------- */
const collapsedFolders = new Set();
function renderSidebar(){
  const tree = document.getElementById('sidebarTree'); tree.innerHTML = '';
  MODULES.forEach((mod, mi) => {
    const lessons = LESSONS.filter(l => l.module === mi);
    const folder = document.createElement('div');
    folder.className = 'folder' + (collapsedFolders.has(mi) ? ' collapsed' : '');
    const head = document.createElement('div'); head.className = 'folder-head';
    const doneCount = lessons.filter(l => state.completed.has(l.id)).length;
    head.innerHTML = '<span class="folder-chevron">▾</span><span>' + (mi+1) + '. ' + mod.title + '</span><span style="margin-left:auto;color:var(--text-dim);font-weight:400;font-size:11px;">' + doneCount + '/' + lessons.length + '</span>';
    head.onclick = () => { if (collapsedFolders.has(mi)) collapsedFolders.delete(mi); else collapsedFolders.add(mi); renderSidebar(); };
    folder.appendChild(head);
    const wrap = document.createElement('div'); wrap.className = 'folder-files';
    lessons.forEach(l => {
      const item = document.createElement('div');
      item.className = 'file-item' + (l.id === state.activeId ? ' active' : '') + (state.completed.has(l.id) ? ' done' : '');
      item.innerHTML = '<span class="file-dot"></span><span class="file-icon">' + (l.type === 'predict' ? '?' : (IS_SQL ? '▤' : '{}')) + '</span><span>' + l.file + '</span>';
      item.onclick = () => openLesson(l.id);
      wrap.appendChild(item);
    });
    folder.appendChild(wrap); tree.appendChild(folder);
  });
}
function renderTabs(){
  const bar = document.getElementById('tabbar'); bar.innerHTML = '';
  if (!state.openTabs.length){ bar.innerHTML = '<div class="tab-empty">No lesson open</div>'; return; }
  state.openTabs.forEach(id => {
    const lesson = LESSONS.find(l => l.id === id); if (!lesson) return;
    const tab = document.createElement('div');
    tab.className = 'tab' + (id === state.activeId ? ' active' : '');
    tab.innerHTML = '<span>' + lesson.file + '</span><span class="tab-close">✕</span>';
    tab.querySelector('span:first-child').onclick = () => openLesson(id);
    tab.querySelector('.tab-close').onclick = (e) => { e.stopPropagation(); closeTab(id); };
    bar.appendChild(tab);
  });
  const act = bar.querySelector('.tab.active'); if (act && act.scrollIntoView) act.scrollIntoView({ inline:'nearest', block:'nearest' });
}
function closeTab(id){
  const idx = state.openTabs.indexOf(id); if (idx === -1) return;
  state.openTabs.splice(idx, 1);
  if (state.activeId === id){
    if (state.openTabs.length) openLesson(state.openTabs[Math.max(0, idx-1)]);
    else { state.activeId = null; renderWelcome(); renderTabs(); renderSidebar(); updateStatusBar(); }
  } else renderTabs();
}

/* ---------- Welcome ---------- */
function renderWelcome(){
  const scroll = document.getElementById('editorScroll');
  const total = LESSONS.length, done = state.completed.size, pct = Math.round((done/total)*100), hasProgress = done > 0;
  scroll.innerHTML =
    '<div class="welcome">' +
      '<span class="welcome-badge">Interactive Course · ' + MODULES.length + ' Modules · ' + total + ' Lessons</span>' +
      '<h1>' + COURSE.title + '</h1>' +
      '<p class="lede">' + COURSE.lede + '</p>' +
      '<div class="welcome-steps">' + COURSE.steps.map((s, i) => '<div class="welcome-step"><b>0' + (i+1) + ' ' + s[0] + '</b><span>' + s[1] + '</span></div>').join('') + '</div>' +
      '<div class="welcome-progress"><div class="row"><span>Overall progress</span><span>' + done + ' / ' + total + ' lessons (' + pct + '%)</span></div><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div></div>' +
      '<button class="btn-primary" id="welcomeStartBtn">' + (hasProgress ? 'Resume where you left off →' : 'Start Lesson 1 →') + '</button>' +
      (hasProgress ? '<button class="btn-ghost" id="resetAllBtn">Reset all progress</button>' : '') +
      '<div class="course-map-note"><b>Course map:</b> ' + COURSE.mapNote + '</div>' +
    '</div>';
  document.getElementById('welcomeStartBtn').onclick = () => {
    const next = hasProgress ? (LESSONS.find(l => !state.completed.has(l.id)) || LESSONS[0]) : LESSONS[0];
    openLesson(next.id);
  };
  const rb = document.getElementById('resetAllBtn');
  if (rb) rb.onclick = () => { if (confirm('Reset all progress and saved drafts for this course?')) { state.completed = new Set(); state.drafts = {}; saveProgress(state.completed); try { localStorage.removeItem(DRAFTS_KEY); } catch(e){} renderWelcome(); renderSidebar(); updateStatusBar(); } };
  updateStatusBar();
}

/* ---------- Lesson ---------- */
function openLesson(id){
  const lesson = LESSONS.find(l => l.id === id); if (!lesson) return;
  state.activeId = id;
  if (!state.openTabs.includes(id)){ state.openTabs.push(id); if (state.openTabs.length > 6) state.openTabs.shift(); }
  closeSidebarMobile(); renderTabs(); renderSidebar(); renderLessonBody(lesson); updateStatusBar();
}
function lessonIndex(id){ return LESSONS.findIndex(l => l.id === id); }
function datasetPanel(lesson){
  if (!IS_SQL) return '';
  const ds = DATASETS[lesson.dataset || COURSE.defaultDataset];
  if (!ds || !ds.doc) return '';
  return '<details class="dataset"' + (lesson.openDataset ? ' open' : '') + '><summary>▸ Tables used in this lesson (' + ds.name + ')</summary><pre>' + escapeHtml(ds.doc) + '</pre></details>';
}
function renderLessonBody(lesson){
  const scroll = document.getElementById('editorScroll');
  const idx = lessonIndex(lesson.id);
  let html = '<div class="lesson">' +
    '<span class="lesson-eyebrow">MODULE ' + (lesson.module+1) + ': ' + MODULES[lesson.module].title.toUpperCase() + ' &middot; LESSON ' + (idx+1) + ' OF ' + LESSONS.length + '</span>' +
    '<h2>' + lesson.title + '</h2>' +
    '<div class="concept">' + lesson.concept + '</div>' +
    (lesson.task ? '<div class="task"><strong>Your task:</strong> ' + lesson.task + '</div>' : '') +
    datasetPanel(lesson);
  if (lesson.type === 'predict'){
    html += '<div id="predictHost"></div>';
  } else {
    html +=
      '<div class="editor-toolbar"><button class="toolbar-btn run" id="runBtn">▶ Run</button><button class="toolbar-btn" id="resetBtn">Reset</button><div class="toolbar-spacer"></div></div>' +
      '<div id="cmHost"></div>' +
      '<div class="output-panel" id="outputPanel"><div class="output-section-head">' + (IS_SQL ? 'RESULT' : 'OUTPUT') + '</div>' +
        '<div class="output-log" id="outputLog"><span class="empty">Click Run to see ' + (IS_SQL ? 'your result' : 'output') + ' here.</span></div>' +
        ((IS_SQL ? lesson.solution : (lesson.tests && lesson.tests.length)) && lesson.type !== 'explore' ? '<div class="output-section-head">CHECKS</div><div class="test-results" id="testResults"><span class="empty" style="font-size:13px;">Run your code to check it.</span></div>' : '') +
        '<div id="expectedHost"></div><div id="resultBanner" style="padding:0 14px 12px;"></div></div>' +
      (lesson.solution ? '<div class="solution-box"><button class="solution-toggle" id="solutionToggle">Show solution</button><pre class="solution-code" id="solutionCode">' + escapeHtml(lesson.solution) + '</pre></div>' : '');
  }
  html += '<div class="lesson-nav"><button class="nav-btn" id="prevLessonBtn"' + (idx===0?' disabled':'') + '>&larr; Previous</button><button class="nav-btn" id="nextLessonBtn"' + (idx===LESSONS.length-1?' disabled':'') + '>Next &rarr;</button></div></div>';
  scroll.innerHTML = html; scroll.scrollTop = 0;
  document.getElementById('prevLessonBtn').onclick = () => { if (idx>0) openLesson(LESSONS[idx-1].id); };
  document.getElementById('nextLessonBtn').onclick = () => { if (idx<LESSONS.length-1) openLesson(LESSONS[idx+1].id); };
  if (lesson.type === 'predict') renderPredict(lesson);
  else {
    initEditor(lesson);
    document.getElementById('runBtn').onclick = () => runExercise(lesson);
    document.getElementById('resetBtn').onclick = () => { state.cm.setValue(lesson.starter); saveDraft(lesson.id, lesson.starter); };
    const sb = document.getElementById('solutionToggle');
    if (sb) sb.onclick = () => { const b = document.getElementById('solutionCode'); b.classList.toggle('show'); sb.textContent = b.classList.contains('show') ? 'Hide solution' : 'Show solution'; };
  }
}
function initEditor(lesson){
  const host = document.getElementById('cmHost');
  const start = (state.drafts[lesson.id] !== undefined) ? state.drafts[lesson.id] : lesson.starter;
  state.cm = CodeMirror(host, { value:start, mode:CM_MODE, theme:'default', lineNumbers:true, matchBrackets:true, autoCloseBrackets:!IS_TOUCH, tabSize:2, indentUnit:2, viewportMargin:20, lineWrapping:IS_TOUCH });
  let deb; state.cm.on('change', () => { clearTimeout(deb); deb = setTimeout(() => saveDraft(lesson.id, state.cm.getValue()), 400); });
}
function markDone(lesson){
  if (state.completed.has(lesson.id)) return;
  state.completed.add(lesson.id); saveProgress(state.completed); renderSidebar(); updateStatusBar();
  const nb = document.getElementById('nextLessonBtn'); if (nb && !nb.disabled) nb.classList.add('next-ready');
}
function renderTests(host, tests){
  host.innerHTML = tests.map(r => '<div class="test-row ' + (r.pass ? 'pass' : 'fail') + '"><span class="mark">' + (r.pass ? '✓' : '✗') + '</span><span>' + escapeHtml(r.desc) + ((r.detail || r.error) && !r.pass ? '<span class="detail">' + escapeHtml(r.detail || r.error) + '</span>' : '') + '</span></div>').join('');
}
function runExercise(lesson){
  const code = state.cm.getValue();
  const log = document.getElementById('outputLog'), tr = document.getElementById('testResults'), banner = document.getElementById('resultBanner'), exp = document.getElementById('expectedHost');
  log.innerHTML = '<span class="empty">Running...</span>'; if (tr) tr.innerHTML = ''; banner.innerHTML = ''; exp.innerHTML = '';
  if (IS_SQL) return runSqlExercise(lesson, code, log, tr, banner, exp);
  const testsCode = lesson.tests && lesson.tests.length ? buildTestsCode(lesson.tests) : '';
  runJs(code, testsCode, (res) => {
    if (res.timedOut){ log.innerHTML = ''; banner.innerHTML = '<div class="timeout-banner">Still running after a few seconds — this usually means an infinite loop (or an algorithm that is far too slow for the input). The sandbox was stopped; check your loop or approach and try again.</div>'; return; }
    log.innerHTML = res.logs.length ? res.logs.map(l => '<div>' + escapeHtml(l) + '</div>').join('') : '<span class="empty">No console.log output.</span>';
    if (res.error) log.innerHTML += '<div class="err">Uncaught Error: ' + escapeHtml(res.error) + '</div>';
    if (tr && lesson.tests && lesson.tests.length){
      renderTests(tr, res.results);
      if (res.results.length > 0 && res.results.every(r => r.pass)){ banner.innerHTML = '<div class="success-banner">✓ All checks passed — lesson complete.</div>'; markDone(lesson); }
    } else if (!res.error) markDone(lesson);
  });
}
function runSqlExercise(lesson, code, log, tr, banner, exp){
  const mode = (lesson.type === 'explore' || !lesson.solution) ? 'explore' : 'check';
  const job = { setup: sqlSetupFor(lesson), user: code, solution: lesson.solution, verify: lesson.verify, ordered: !!lesson.ordered, columns: !!lesson.columns, rules: lesson.rules || [], mode };
  runSql(job, (res) => {
    if (res.timedOut){ log.innerHTML = ''; banner.innerHTML = '<div class="timeout-banner">The query ran for too long and was stopped (possibly an endless recursive CTE or a huge cross join). Check your query and try again.</div>'; return; }
    if (!res.ok){ log.innerHTML = '<div class="err">' + escapeHtml(res.error || 'Unknown error') + '</div>'; return; }
    const out = res.out;
    if (out.error) log.innerHTML = '<div class="err">SQL error: ' + escapeHtml(out.error) + '</div>';
    else {
      const sets = lesson.verify ? (out.shown ? [out.shown] : []) : out.sets;
      const label = lesson.verify ? '<div class="result-note">Table state after your SQL (checked with: ' + escapeHtml(lesson.verify.trim()) + ')</div>' : '';
      log.innerHTML = '<div class="result-wrap" style="padding:0">' + label + (sets.length ? sets.map(s => renderTable(s)).join('<div style="height:8px"></div>') : '<span class="empty">Statement ran OK — it returned no rows. (Use a SELECT to look at data.)</span>') + '</div>';
    }
    if (mode === 'check'){
      if (tr) renderTests(tr, out.tests);
      if (out.expected){
        exp.innerHTML = '<details class="dataset" style="margin:0 14px 12px;"' + (out.allPass ? '' : ' open') + '><summary>Expected result' + (out.allPass ? '' : ' (what your query should produce)') + '</summary><div class="result-wrap">' + renderTable(out.expected, 15) + '</div></details>';
      }
      if (out.allPass){ banner.innerHTML = '<div class="success-banner">✓ All checks passed — lesson complete.</div>'; markDone(lesson); }
    } else if (!out.error) markDone(lesson);
  });
}

/* ---------- Predict ---------- */
function renderPredict(lesson){
  const host = document.getElementById('predictHost'), p = lesson.predict;
  host.innerHTML = '<div class="predict-snippet"><div id="predictCmHost"></div></div><div class="predict-question">' + p.question + '</div><div class="predict-options" id="predictOptions"></div><div class="predict-explain" id="predictExplain">' + p.afterExplain + '</div><button class="run-verify-btn" id="runVerifyBtn">▶ Run it to see the real ' + (IS_SQL ? 'result' : 'output') + '</button><div class="output-panel" style="display:none;" id="predictOutputPanel"><div class="output-section-head">' + (IS_SQL ? 'RESULT' : 'OUTPUT') + '</div><div class="output-log" id="predictOutputLog"></div></div>';
  CodeMirror(document.getElementById('predictCmHost'), { value:p.snippet, mode:CM_MODE, theme:'default', lineNumbers:true, readOnly:true, viewportMargin:Infinity, lineWrapping:IS_TOUCH });
  const wrap = document.getElementById('predictOptions');
  p.options.forEach((opt, i) => {
    const btn = document.createElement('button'); btn.className = 'predict-opt'; btn.textContent = opt;
    btn.onclick = () => {
      wrap.querySelectorAll('.predict-opt').forEach((b, bi) => { b.disabled = true; if (bi === p.correctIndex) b.classList.add('correct'); else if (bi === i) b.classList.add('wrong'); });
      document.getElementById('predictExplain').classList.add('show'); markDone(lesson);
    };
    wrap.appendChild(btn);
  });
  document.getElementById('runVerifyBtn').onclick = () => {
    const panel = document.getElementById('predictOutputPanel'), log = document.getElementById('predictOutputLog');
    panel.style.display = 'block'; log.innerHTML = '<span class="empty">Running...</span>';
    if (IS_SQL){
      runSql({ setup: sqlSetupFor(lesson), user: p.snippet, mode:'explore', rules:[] }, (res) => {
        if (res.timedOut){ log.innerHTML = '<span class="err">Timed out.</span>'; return; }
        if (!res.ok){ log.innerHTML = '<div class="err">' + escapeHtml(res.error) + '</div>'; return; }
        if (res.out.error) log.innerHTML = '<div class="err">SQL error: ' + escapeHtml(res.out.error) + '</div>';
        else log.innerHTML = '<div class="result-wrap" style="padding:0">' + (res.out.sets.length ? res.out.sets.map(s => renderTable(s)).join('') : '<span class="empty">No rows returned.</span>') + '</div>';
      });
    } else {
      runJs(p.snippet, '', (res) => {
        if (res.timedOut){ log.innerHTML = '<span class="err">Timed out — possible infinite loop.</span>'; return; }
        log.innerHTML = res.logs.map(l => '<div>' + escapeHtml(l) + '</div>').join('');
        if (res.error) log.innerHTML += '<div class="err">Uncaught Error: ' + escapeHtml(res.error) + '</div>';
      });
    }
  };
}

/* ---------- Status / mobile / init ---------- */
function updateStatusBar(){
  const crumb = document.getElementById('statusBreadcrumb'), prog = document.getElementById('statusProgress');
  if (state.activeId){ const l = LESSONS.find(x => x.id === state.activeId); crumb.textContent = COURSE.shortName + ' › ' + MODULES[l.module].title + ' › ' + l.title; }
  else crumb.textContent = 'Welcome';
  prog.textContent = state.completed.size + ' / ' + LESSONS.length + ' complete';
}
function openSidebarMobile(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarOverlay').classList.add('open'); }
function closeSidebarMobile(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('open'); }
document.getElementById('hamburgerBtn').onclick = () => { document.getElementById('sidebar').classList.contains('open') ? closeSidebarMobile() : openSidebarMobile(); };
document.getElementById('sidebarOverlay').onclick = closeSidebarMobile;
document.getElementById('navHome').onclick = () => { state.activeId = null; closeSidebarMobile(); renderWelcome(); renderTabs(); renderSidebar(); };
document.getElementById('navExplorer').onclick = () => { if (window.innerWidth <= 860) openSidebarMobile(); };

renderSidebar(); renderTabs(); renderWelcome();
</script>
