<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#007ACC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Data Structures & Algorithms — Interactive Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
:root{
  --bg:#FFFFFF; --bg-sidebar:#F3F3F3; --bg-panel:#F8F8F8; --border:#E1E1E1;
  --text:#1E1E1E; --text-dim:#6E6E6E;
  --blue:#007ACC; --blue-bright:#0098FF; --blue-wash:rgba(0,122,204,.08);
  --green:#1E874B; --green-wash:rgba(30,135,75,.1);
  --red:#CD3131; --red-wash:rgba(205,49,49,.08);
  --amber:#BF8803;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%;}
body{
  background:var(--bg); color:var(--text); font-family:'Inter', system-ui, sans-serif;
  -webkit-font-smoothing:antialiased; display:flex; flex-direction:column;
  height:100vh; height:100dvh; overflow:hidden; -webkit-text-size-adjust:100%;
}
button{font-family:'Inter', system-ui, sans-serif;}
code{font-family:'JetBrains Mono', monospace; background:var(--blue-wash); color:var(--blue); padding:1px 5px; border-radius:3px; font-size:.92em;}

.titlebar{
  height:36px; flex:0 0 36px; background:#EDEDED; border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 10px; gap:10px; font-size:12.5px; color:var(--text-dim);
  padding-top:env(safe-area-inset-top); box-sizing:content-box;
}
.titlebar-dots{display:flex; gap:6px;}
.titlebar-dots i{width:11px; height:11px; border-radius:50%; display:inline-block;}
.titlebar-dots i:nth-child(1){background:#FF5F57;} .titlebar-dots i:nth-child(2){background:#FEBC2E;} .titlebar-dots i:nth-child(3){background:#28C840;}
.titlebar-title{flex:1; text-align:center; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.hamburger{display:none; background:none; border:none; font-size:22px; cursor:pointer; color:var(--text); width:44px; height:44px; margin-left:-8px;}

.app{flex:1; display:flex; min-height:0; position:relative;}
.activitybar{width:46px; flex:0 0 46px; background:var(--bg-sidebar); border-right:1px solid var(--border); display:flex; flex-direction:column; align-items:center; padding-top:10px; gap:6px;}
.activity-icon{width:34px; height:34px; border:none; background:none; border-radius:5px; cursor:pointer; font-size:17px; color:var(--text-dim); display:flex; align-items:center; justify-content:center;}
.activity-icon:hover{color:var(--text); background:rgba(0,0,0,.05);}
.activity-icon.active{color:var(--blue); border-left:2px solid var(--blue); border-radius:0;}

.sidebar{width:290px; flex:0 0 290px; background:var(--bg-sidebar); border-right:1px solid var(--border); overflow-y:auto; padding:14px 0; -webkit-overflow-scrolling:touch;}
.sidebar-header{font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--text-dim); padding:0 16px 10px;}
.sidebar-tree{padding:0 6px;}
.folder{margin-bottom:2px;}
.folder-head{display:flex; align-items:center; gap:6px; padding:8px 8px; font-size:12.5px; font-weight:600; cursor:pointer; border-radius:4px; user-select:none;}
.folder-head:hover{background:rgba(0,0,0,.04);}
.folder-chevron{font-size:10px; color:var(--text-dim); width:10px; transition:transform .12s;}
.folder.collapsed .folder-chevron{transform:rotate(-90deg);}
.folder-files{padding-left:18px;}
.folder.collapsed .folder-files{display:none;}
.file-item{display:flex; align-items:center; gap:7px; padding:7px 8px; font-size:12.5px; color:var(--text-dim); cursor:pointer; border-radius:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.file-item:hover{background:rgba(0,0,0,.04); color:var(--text);}
.file-item.active{background:var(--blue-wash); color:var(--blue); font-weight:600;}
.file-dot{width:7px; height:7px; border-radius:50%; flex:0 0 7px; border:1.5px solid var(--text-dim);}
.file-item.done .file-dot{background:var(--green); border-color:var(--green);}
.file-item.active .file-dot{border-color:var(--blue);}
.file-icon{font-size:12px; flex:0 0 16px; color:var(--amber); font-family:'JetBrains Mono',monospace;}
.sidebar-overlay{display:none;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.tabbar{height:38px; flex:0 0 38px; background:var(--bg-panel); border-bottom:1px solid var(--border); display:flex; align-items:stretch; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;}
.tab{display:flex; align-items:center; gap:8px; padding:0 12px; font-size:12.5px; color:var(--text-dim); border-right:1px solid var(--border); cursor:pointer; white-space:nowrap; background:var(--bg-panel); flex:0 0 auto;}
.tab.active{background:var(--bg); color:var(--text); border-top:2px solid var(--blue); padding-top:2px;}
.tab .tab-close{opacity:.5; font-size:14px; padding:6px 4px;}
.tab .tab-close:hover{opacity:1; color:var(--red);}
.tab-empty{display:flex; align-items:center; padding:0 12px; font-size:12.5px; color:var(--text-dim);}
.editor-scroll{flex:1; overflow-y:auto; padding:30px 34px 60px; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;}

.welcome{max-width:720px; margin:0 auto;}
.welcome-badge{display:inline-block; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--blue); border:1px solid var(--blue); background:var(--blue-wash); padding:4px 10px; border-radius:3px;}
.welcome h1{font-size:32px; font-weight:700; margin:16px 0 10px; letter-spacing:-.01em;}
.welcome p.lede{font-size:15.5px; line-height:1.65; color:var(--text-dim); max-width:60ch;}
.welcome-steps{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:28px 0;}
.welcome-step{border:1px solid var(--border); border-radius:5px; padding:14px; background:var(--bg-panel);}
.welcome-step b{display:block; font-family:'JetBrains Mono',monospace; color:var(--blue); font-size:12px; margin-bottom:6px;}
.welcome-step span{font-size:13px; color:var(--text-dim); line-height:1.5;}
.welcome-progress{margin:26px 0;}
.welcome-progress .row{display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-dim); margin-bottom:6px;}
.bar-track{height:7px; background:#E8E8E8; border-radius:4px; overflow:hidden;}
.bar-fill{height:100%; background:var(--blue); border-radius:4px; transition:width .4s;}
.btn-primary{background:var(--blue); color:#fff; border:none; font-weight:600; font-size:15px; padding:13px 24px; min-height:46px; border-radius:5px; cursor:pointer; margin-top:4px;}
.btn-primary:hover{background:var(--blue-bright);}
.btn-ghost{background:none; border:none; color:var(--text-dim); font-size:12.5px; text-decoration:underline; cursor:pointer; padding:12px 0; margin-left:14px;}
.course-map-note{margin-top:14px; font-size:12.5px; color:var(--text-dim); max-width:60ch; line-height:1.6;}

.lesson{max-width:800px; margin:0 auto;}
.lesson-eyebrow{font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--amber); line-height:1.5;}
.lesson h2{font-size:27px; font-weight:700; margin:10px 0 18px; letter-spacing:-.01em; line-height:1.25;}
.concept{font-size:15px; line-height:1.68; color:#333; margin-bottom:16px;}
.concept p{margin:0 0 10px;}
.concept ul,.concept ol{margin:0 0 12px; padding-left:22px;}
.concept li{margin-bottom:5px;}
.concept pre{background:#1E1E1E; color:#D4D4D4; font-family:'JetBrains Mono',monospace; font-size:12.8px; padding:12px 15px; border-radius:5px; overflow-x:auto; line-height:1.6; margin:10px 0 14px; -webkit-overflow-scrolling:touch;}
.concept pre code{background:none; color:inherit; padding:0; font-size:1em;}
.concept .callout{border-left:3px solid var(--amber); background:rgba(191,136,3,.07); padding:9px 13px; margin:10px 0 14px; font-size:14px; border-radius:0 4px 4px 0;}
.concept .callout b{color:var(--amber);}
.concept table.mini{border-collapse:collapse; font-size:13px; margin:8px 0 14px; display:block; overflow-x:auto;}
.concept table.mini th,.concept table.mini td{border:1px solid var(--border); padding:5px 10px; text-align:left; white-space:nowrap;}
.concept table.mini th{background:var(--bg-panel);}
.task{background:var(--blue-wash); border:1px solid rgba(0,122,204,.25); border-radius:5px; padding:12px 16px; font-size:14px; line-height:1.6; color:#1a1a1a; margin-bottom:20px;}
.task strong{color:var(--blue);}

details.dataset{margin:0 0 16px; border:1px solid var(--border); border-radius:5px; background:var(--bg-panel);}
details.dataset summary{cursor:pointer; padding:10px 14px; font-size:13px; font-weight:600; color:var(--text-dim); min-height:40px; display:flex; align-items:center;}
details.dataset pre{margin:0; padding:2px 14px 12px; font-family:'JetBrains Mono',monospace; font-size:12px; line-height:1.6; overflow-x:auto; color:#333;}

.editor-toolbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; position:sticky; top:-30px; z-index:5; background:var(--bg); padding:2px 0 0;}
.toolbar-btn{background:var(--bg); border:1px solid var(--border); color:var(--text); font-size:13.5px; font-weight:500; padding:9px 16px; min-height:40px; border-radius:4px 4px 0 0; cursor:pointer; display:flex; align-items:center; gap:6px;}
.toolbar-btn.run{background:var(--blue); color:#fff; border-color:var(--blue);}
.toolbar-btn.run:hover{background:var(--blue-bright);}
.toolbar-spacer{flex:1;}

.CodeMirror{border:1px solid var(--border); font-family:'JetBrains Mono',monospace; font-size:13.5px; height:300px;}
.CodeMirror-gutters{background:var(--bg-panel); border-right:1px solid var(--border);}
.cm-s-default .cm-keyword{color:#0000FF;} .cm-s-default .cm-string{color:#A31515;} .cm-s-default .cm-comment{color:#008000; font-style:italic;}
.cm-s-default .cm-number{color:#098658;} .cm-s-default .cm-def{color:#795E26;} .cm-s-default .cm-variable{color:#001080;}
.cm-s-default .cm-property{color:#001080;} .cm-s-default .cm-atom{color:#0000FF;} .cm-s-default .cm-builtin{color:#795E26;}

.output-panel{border:1px solid var(--border); border-top:none; background:var(--bg-panel); border-radius:0 0 4px 4px; overflow:hidden;}
.output-section-head{font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); padding:8px 14px 4px;}
.output-log{font-family:'JetBrains Mono',monospace; font-size:13px; padding:4px 14px 12px; color:#333; min-height:20px; white-space:pre-wrap; word-break:break-word;}
.output-log .empty,.empty{color:var(--text-dim); font-style:italic;}
.output-log .err{color:var(--red);}
.result-wrap{padding:2px 14px 12px; overflow-x:auto; -webkit-overflow-scrolling:touch;}
.result-note{font-size:11.5px; color:var(--text-dim); margin:0 0 5px; font-family:'JetBrains Mono',monospace;}
table.result{border-collapse:collapse; font-family:'JetBrains Mono',monospace; font-size:12.5px; background:#fff;}
table.result th{background:#EEF3F8; text-align:left; padding:5px 10px; border:1px solid var(--border); white-space:nowrap; font-weight:600;}
table.result td{padding:5px 10px; border:1px solid var(--border); white-space:nowrap;}
table.result td.null{color:var(--text-dim); font-style:italic;}
table.result td.num{text-align:right;}
.test-results{padding:2px 14px 12px; display:flex; flex-direction:column; gap:6px;}
.test-row{display:flex; align-items:flex-start; gap:8px; font-size:13px; line-height:1.5;}
.test-row .mark{flex:0 0 16px; font-weight:700;}
.test-row.pass .mark{color:var(--green);} .test-row.fail .mark{color:var(--red);}
.test-row.fail .detail{color:var(--text-dim); font-size:12px; display:block;}
.success-banner{margin-top:10px; background:var(--green-wash); border:1px solid rgba(30,135,75,.3); color:var(--green); padding:10px 14px; border-radius:4px; font-size:13.5px; font-weight:600;}
.timeout-banner{margin-top:10px; background:var(--red-wash); border:1px solid rgba(205,49,49,.3); color:var(--red); padding:10px 14px; border-radius:4px; font-size:13.5px;}
.solution-box{margin-top:14px;}
.solution-toggle{background:none; border:1px dashed var(--border); color:var(--text-dim); font-size:12.5px; padding:10px 14px; min-height:40px; border-radius:4px; cursor:pointer;}
.solution-code{display:none; margin-top:10px; background:#1E1E1E; color:#D4D4D4; font-family:'JetBrains Mono',monospace; font-size:13px; padding:14px 16px; border-radius:4px; white-space:pre-wrap; word-break:break-word; line-height:1.6;}
.solution-code.show{display:block;}

.predict-snippet .CodeMirror{height:auto; min-height:60px;}
.predict-question{font-size:15px; font-weight:600; margin:18px 0 12px; line-height:1.5;}
.predict-options{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
.predict-opt{text-align:left; background:var(--bg-panel); border:1px solid var(--border); border-radius:5px; padding:12px 14px; min-height:46px; font-family:'JetBrains Mono',monospace; font-size:13.5px; cursor:pointer; color:var(--text); word-break:break-word;}
.predict-opt:hover{border-color:var(--blue);}
.predict-opt.correct{background:var(--green-wash); border-color:var(--green); color:var(--green); font-weight:600;}
.predict-opt.wrong{background:var(--red-wash); border-color:var(--red); color:var(--red);}
.predict-explain{display:none; background:var(--blue-wash); border:1px solid rgba(0,122,204,.25); border-radius:5px; padding:13px 16px; font-size:14px; line-height:1.6; margin-bottom:14px;}
.predict-explain.show{display:block;}
.run-verify-btn{background:var(--bg); border:1px solid var(--border); font-size:13.5px; padding:10px 14px; min-height:42px; border-radius:4px; cursor:pointer; margin-bottom:14px;}
.run-verify-btn:hover{border-color:var(--blue); color:var(--blue);}

.lesson-nav{display:flex; justify-content:space-between; gap:10px; margin-top:36px; padding-top:18px; border-top:1px solid var(--border);}
.nav-btn{background:var(--bg); border:1px solid var(--border); color:var(--text); font-size:14px; padding:11px 18px; min-height:44px; border-radius:5px; cursor:pointer;}
.nav-btn:hover{border-color:var(--blue); color:var(--blue);}
.nav-btn:disabled{opacity:.35; cursor:not-allowed;}
.nav-btn.next-ready{background:var(--blue); color:#fff; border-color:var(--blue);}

.statusbar{height:26px; flex:0 0 26px; background:var(--blue); color:#fff; display:flex; align-items:center; padding:0 14px; font-size:11.5px; font-family:'JetBrains Mono',monospace; justify-content:space-between; gap:12px; padding-bottom:env(safe-area-inset-bottom); box-sizing:content-box;}
.statusbar span:first-child{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
.statusbar span:last-child{white-space:nowrap;}
::-webkit-scrollbar{width:9px; height:9px;} ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18); border-radius:99px;}

@media (max-width:860px){
  .hamburger{display:inline-block;}
  .titlebar-dots{display:none;}
  .activitybar{display:none;}
  .sidebar{position:fixed; top:calc(36px + env(safe-area-inset-top)); left:0; bottom:calc(26px + env(safe-area-inset-bottom)); width:min(320px, 86vw); z-index:40; transform:translateX(-100%); transition:transform .18s; box-shadow:2px 0 14px rgba(0,0,0,.15);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay.open{display:block; position:fixed; top:calc(36px + env(safe-area-inset-top)); left:0; right:0; bottom:calc(26px + env(safe-area-inset-bottom)); background:rgba(0,0,0,.28); z-index:39;}
  .file-item{padding:11px 8px; font-size:13px;}
  .folder-head{padding:12px 8px; font-size:13px;}
}
@media (max-width:700px){
  .editor-scroll{padding:16px 14px 48px;}
  .editor-toolbar{top:-16px;}
  .welcome h1{font-size:26px;}
  .welcome-steps{grid-template-columns:1fr 1fr;}
  .lesson h2{font-size:22px;}
  .concept{font-size:15.5px;}
  .CodeMirror{height:230px; font-size:16px;}
  .predict-snippet .CodeMirror{height:auto;}
  .output-log,.test-row{font-size:14px;}
  .lesson-nav .nav-btn{flex:1;}
  .btn-ghost{margin-left:0; display:block;}
}
</style>
</head>
<body>

<div class="titlebar">
  <button class="hamburger" id="hamburgerBtn" aria-label="Open lesson list">☰</button>
  <span class="titlebar-dots"><i></i><i></i><i></i></span>
  <div class="titlebar-title" id="titleText"></div>
  <div style="width:44px;" class="spacer-r"></div>
</div>

<div class="app">
  <div class="activitybar">
    <button class="activity-icon active" id="navExplorer" title="Explorer">🗀</button>
    <button class="activity-icon" id="navHome" title="Home">⌂</button>
  </div>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">EXPLORER</div>
    <div class="sidebar-tree" id="sidebarTree"></div>
  </div>
  <div class="main">
    <div class="tabbar" id="tabbar"></div>
    <div class="editor-scroll" id="editorScroll"></div>
  </div>
</div>

<div class="statusbar">
  <span id="statusBreadcrumb">Welcome</span>
  <span id="statusProgress"></span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>

<script>
const DATASETS = {};
const COURSE = {
  title: 'Data Structures & Algorithms',
  shortName: 'DSA',
  runner: 'js',
  storageKey: 'dsaJsProgress_v1',
  timeoutMs: 5000,
  lede: 'The interview-grade DSA course, in JavaScript, built to be learned on your phone. Every lesson explains the pattern properly (the mental model, a traced example, the complexity and the interview trap), then you write the function yourself and a real JavaScript engine runs it against edge cases and large inputs. No AI crutch: you build the muscle of writing code from a blank function body. From Big-O and hash maps through trees, graphs and dynamic programming, finishing with mixed-pattern mock rounds.',
  steps: [
    ['READ', 'Each lesson teaches one pattern: why it exists, how it works, a traced example, complexity, and the classic trap.'],
    ['WRITE', 'You write the function from a stub. Think first, then type — in the editor, in plain JavaScript.'],
    ['RUN', 'Tap Run. Your code runs in a real sandboxed JS engine against normal, edge and large inputs.'],
    ['CHECK', 'Each test shows pass or fail by name, so you can see exactly which case you broke. Too-slow solutions time out.']
  ],
  mapNote: 'Big-O thinking → Arrays &amp; strings → Hash maps &amp; sets → Two pointers &amp; sliding window → Stacks &amp; queues → Linked lists → Recursion &amp; backtracking → Sorting &amp; binary search → Trees &amp; BSTs → Graphs → Heaps, tries &amp; greedy → Dynamic programming → Mixed-pattern capstone.'
};
const MODULES = [
  { title: 'Big-O & Problem-Solving Method' },
  { title: 'Arrays & Strings' },
  { title: 'Hash Maps & Sets' },
  { title: 'Two Pointers & Sliding Window' },
  { title: 'Stacks & Queues' },
  { title: 'Linked Lists' },
  { title: 'Recursion & Backtracking' },
  { title: 'Sorting & Binary Search' },
  { title: 'Trees & Binary Search Trees' },
  { title: 'Heaps, Tries & Greedy' },
  { title: 'Graphs' },
  { title: 'Dynamic Programming' },
  { title: 'Interview Patterns & Capstone' }
];
const LESSONS = [];

// Module 1: Big-O & Problem-Solving Method
LESSONS.push(

{ id:'m1-l1', module:0, file:'01-counting-steps.js', type:'explore', title:'What an Algorithm Is: Counting Steps, Not Seconds',
  concept:`<p>An <strong>algorithm</strong> is just a precise recipe: a finite list of steps that turns an input into an output. Two recipes can give the same answer and still differ wildly in how much work they do. "Efficiency" is the word for that difference, and the first thing to learn is how to <em>measure</em> it without a stopwatch.</p>
<p>Why not a stopwatch? Because seconds depend on the machine. Your phone, an interview laptop and a cloud server all give different timings for the same code, and the timing for 10 items tells you nothing about 10 million items. So we count <strong>basic steps</strong> (a comparison, an addition, an array read) as a function of the input size <code>n</code>. That count is what survives when the hardware changes.</p>
<p>Take "add the numbers 1 to n". Method A loops and adds each number: n additions. Method B uses the formula <code>n*(n+1)/2</code>: 3 operations, whatever n is. For n = 10 the difference is invisible. For n = 1,000,000,000, A does a billion steps and B still does 3. That gap is the entire subject of this module.</p>
<pre>// counting steps for "sum 1..n"
n = 5, loop method:
  t=0
  i=1 -> t=1   (step 1)
  i=2 -> t=3   (step 2)
  i=3 -> t=6   (step 3)
  i=4 -> t=10  (step 4)
  i=5 -> t=15  (step 5)   => 5 steps = n steps
formula method: 5*6/2 = 15  => constant steps</pre>
<p>In the editor you will find a tiny "step counter" harness. Run it, then change <code>N</code> and the algorithms and watch how the counts react. Notice which counts double when N doubles, which quadruple, and which do not move at all.</p>
<div class="callout"><b>Interview trap:</b> never answer "how fast is it?" with seconds. Say how the work <em>grows</em> as the input grows. "It is linear: double the input, double the work" is the sentence interviewers want to hear.</div>
<p><strong>Pattern to remember:</strong> when asked about efficiency, count the work as a function of <code>n</code>, then ask what happens when n gets ten times bigger.</p>`,
  starter:`// Step-counter playground. Run it, then change N and the algorithms.
const N = 1000;

function sumLoop(n) {
  let steps = 0, total = 0;
  for (let i = 1; i <= n; i++) { total += i; steps++; }
  return { total, steps };
}

function sumFormula(n) {
  return { total: (n * (n + 1)) / 2, steps: 1 };
}

function allPairs(n) {
  let steps = 0;
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) steps++;
  }
  return steps;
}

console.log("loop:", sumLoop(N));
console.log("formula:", sumFormula(N));
console.log("pairs:", allPairs(N));
console.log("pairs when N doubles:", allPairs(N * 2));
// Try: write sumHalf(n) that only loops to n/2 and see its steps.
`
},

{ id:'m1-l2', module:0, file:'02-search-steps.js', type:'exercise', title:'Big-O in Numbers: Linear vs Binary Search Step Counts',
  concept:`<p>Big-O notation describes how the number of steps <em>grows</em> as the input size n grows, ignoring constants and small terms. The table below is worth memorising, because it shows why interviewers care. It lists approximate step counts for n = 1,000 and n = 1,000,000:</p>
<table class="mini"><tr><th>Class</th><th>n=1,000</th><th>n=1,000,000</th></tr>
<tr><td>O(1)</td><td>1</td><td>1</td></tr>
<tr><td>O(log n)</td><td>10</td><td>20</td></tr>
<tr><td>O(n)</td><td>1,000</td><td>1,000,000</td></tr>
<tr><td>O(n log n)</td><td>10,000</td><td>20,000,000</td></tr>
<tr><td>O(n&sup2;)</td><td>1,000,000</td><td>10<sup>12</sup> (days)</td></tr>
<tr><td>O(2<sup>n</sup>)</td><td>10<sup>301</sup></td><td>never</td></tr></table>
<p>The cleanest way to <em>feel</em> O(n) versus O(log n) is searching. <strong>Linear search</strong> looks at items one by one: for a million items you may need a million looks. <strong>Binary search</strong> works on a <em>sorted</em> array: look at the middle; if the target is bigger discard the left half, otherwise discard the right half. Each look halves what remains, so a million items need at most 20 looks.</p>
<p>It also illustrates <strong>best, average and worst case</strong>: linear search finds the first item in 1 step (best), about n/2 steps on average, and n steps when the target is missing (worst). Big-O normally quotes the worst case, because that is the guarantee.</p>
<pre>// binary search on [5,8,12,20,31,40,52], target 5
lo=0 hi=6 mid=3 (20)  step 1  20 &gt; 5 -> hi=2
lo=0 hi=2 mid=1 (8)   step 2  8 &gt; 5  -> hi=0
lo=0 hi=0 mid=0 (5)   step 3  found
function binarySteps(a, t) {
  let lo = 0, hi = a.length - 1, steps = 0;
  while (lo &lt;= hi) {
    const mid = Math.floor((lo + hi) / 2);
    steps++;
    if (a[mid] === t) return steps;
    if (a[mid] &lt; t) lo = mid + 1; else hi = mid - 1;
  }
  return steps;
}</pre>
<p><strong>Complexity:</strong> linear search is O(n) time, O(1) space; binary search is O(log n) time, O(1) space, but needs sorted input. Sorting costs O(n log n) once, so binary search pays off when you search many times.</p>
<div class="callout"><b>Interview trap:</b> <code>(lo + hi) / 2</code> without <code>Math.floor</code> gives fractional indexes in JavaScript, and forgetting <code>lo &lt;= hi</code> (using <code>&lt;</code>) skips the last remaining candidate. Both are classic off-by-one bugs.</div>
<p><strong>Pattern to remember:</strong> when you can throw away half the remaining input each step, think O(log n).</p>`,
  task:`Write two functions that return how many array elements get <em>examined</em> (a "step" = one element read and compared).<br><br><code>linearSteps(arr, target)</code>: scan from index 0; return the number of elements examined until the target is found (found at index i means i+1 steps). If the target is missing return <code>arr.length</code>.<br><br><code>binarySteps(sorted, target)</code>: classic binary search with <code>lo = 0</code>, <code>hi = n-1</code>, <code>mid = Math.floor((lo+hi)/2)</code>. Count one step each time you examine <code>sorted[mid]</code>. Stop when found (that step counts) or when the range is empty. Return the step count.`,
  starter:`function linearSteps(arr, target) {
  // count elements looked at until you find target
  return -1;
}

function binarySteps(sorted, target) {
  // lo/hi/mid loop; count each time you look at sorted[mid]
  return -1;
}
`,
  solution:`function linearSteps(arr, target) {
  let steps = 0;
  for (let i = 0; i < arr.length; i++) {
    steps++;
    if (arr[i] === target) return steps;
  }
  return steps;
}

function binarySteps(sorted, target) {
  let lo = 0, hi = sorted.length - 1, steps = 0;
  while (lo <= hi) {
    const mid = Math.floor((lo + hi) / 2);
    steps++;
    if (sorted[mid] === target) return steps;
    if (sorted[mid] < target) lo = mid + 1; else hi = mid - 1;
  }
  return steps;
}`,
  tests:[
    { desc:`linearSteps([5,8,12,20], 5) is 1 (best case: first element)`, check:`linearSteps([5,8,12,20], 5) === 1` },
    { desc:`linearSteps([5,8,12,20], 20) is 4 (found at last index 3)`, check:`linearSteps([5,8,12,20], 20) === 4` },
    { desc:`linearSteps([5,8,12,20], 99) is 4 (worst case: missing = n steps)`, check:`linearSteps([5,8,12,20], 99) === 4` },
    { desc:`linearSteps([], 1) is 0 for an empty array`, check:`linearSteps([], 1) === 0` },
    { desc:`binarySteps on [5,8,12,20,31,40,52]: target 20 is 1 step (middle), target 5 is 3 steps`, check:`binarySteps([5,8,12,20,31,40,52], 20) === 1 && binarySteps([5,8,12,20,31,40,52], 5) === 3` },
    { desc:`binarySteps missing targets: 100 takes 3 steps, 1 takes 3 steps, [] takes 0`, check:`binarySteps([5,8,12,20,31,40,52], 100) === 3 && binarySteps([5,8,12,20,31,40,52], 1) === 3 && binarySteps([], 4) === 0` },
    { desc:`linearSteps over 100,000 items with a missing target is 100000`, check:`(function(){ var a = []; for (var i = 0; i < 100000; i++) a.push(i); return linearSteps(a, -1) === 100000; })()` },
    { desc:`binarySteps over 1,000,000 sorted items needs at most 20 steps for any target (found or missing)`, check:`(function(){ var a = []; for (var i = 0; i < 1000000; i++) a.push(i * 2); var worst = 0, t = [0, 999998, 1999998, 1, 777777, -5, 3000000, 1000000]; for (var k = 0; k < t.length; k++) { var s = binarySteps(a, t[k]); if (s < 1 || s > 20) return false; if (s > worst) worst = s; } return worst >= 15; })()` }
  ]
},

{ id:'m1-l3', module:0, file:'03-predict-loops.js', type:'predict', title:'Predict: Reading Loops to Find Complexity',
  concept:`<p>Deriving Big-O from code is a mechanical skill, and it starts by counting how many times the innermost statement runs. Two shapes cover most interview code. A loop that moves one step at a time (<code>i++</code>) does n iterations. A loop that <em>halves or doubles</em> its variable each time does about log<sub>2</sub>(n) iterations. Nesting multiplies; sequential loops add (and then you keep only the biggest term).</p>
<p>The nested-loop count is the one people get wrong, because the inner loop does not always start at 0. When the inner loop starts at <code>i</code> (or <code>i+1</code>), the counts form a staircase such as 5+4+3+2+1, which sums to n(n+1)/2. That is still O(n&sup2;) &mdash; the &frac12; is a constant &mdash; but the exact count matters when you dry-run by hand. Dry-running means writing each variable down and stepping through the code on paper; it is the fastest way to find bugs in an interview.</p>
<p>Work out both counters in the snippet below on paper first. For the second loop, write the value of <code>k</code> on each pass until it reaches the exit condition.</p>`,
  predict:{
    snippet:`let count = 0;
for (let i = 0; i < 5; i++) {
  for (let j = i; j < 5; j++) {
    count++;
  }
}
console.log(count);

let h = 0;
for (let k = 100; k >= 1; k = Math.floor(k / 2)) h++;
console.log(h);`,
    question:'What do the two console.log lines print?',
    options:['25 / 7','10 / 7','15 / 7','15 / 6'],
    correctIndex:2,
    afterExplain:`The outer loop runs i = 0..4. When i = 0 the inner loop runs 5 times (j = 0..4), then 4, 3, 2, 1: 5+4+3+2+1 = <strong>15</strong>. That is n(n+1)/2 for n = 5, which is O(n&sup2;). (25 would be a full n&times;n grid; 10 would be j starting at i+1.) For the halving loop, k takes the values 100, 50, 25, 12, 6, 3, 1 &mdash; <strong>7</strong> iterations &mdash; and then floor(1/2) = 0 ends it. That is about log<sub>2</sub>(100) &asymp; 6.6, rounded up, so O(log n). <strong>Interview takeaway:</strong> when you say a complexity, justify it by counting: "the inner loop shrinks each time, so it is n(n+1)/2, which is O(n&sup2;)".`
  }
},

{ id:'m1-l4', module:0, file:'04-duplicates.js', type:'exercise', title:'From O(n²) to O(n): The Duplicate Check',
  concept:`<p>"Does this array contain a duplicate?" is the cleanest example of a rewrite that every interviewer expects you to make. The natural first answer compares every element with every other element using two nested loops. With 200,000 numbers that is roughly 20 <em>billion</em> comparisons &mdash; far more than a phone can do in the five-second limit.</p>
<p>The insight is that nested loops are doing <em>searching</em>: for each item, "have I seen this before?" is answered by scanning. A <code>Set</code> answers that same question in O(1) on average, because it hashes the value and jumps straight to where it would be stored. So replace the inner scan with a lookup, and the whole function becomes one pass.</p>
<pre>// brute force, O(n^2) time, O(1) space
function hasDupSlow(a) {
  for (let i = 0; i &lt; a.length; i++)
    for (let j = i + 1; j &lt; a.length; j++)
      if (a[i] === a[j]) return true;
  return false;
}
// trace of the fast version on [4, 9, 4]
// i=0 x=4 seen={}      -&gt; add -&gt; {4}
// i=1 x=9 seen={4}     -&gt; add -&gt; {4,9}
// i=2 x=4 seen={4,9}   -&gt; 4 is in seen -&gt; return true
function hasDuplicate(a) {
  const seen = new Set();
  for (const x of a) {
    if (seen.has(x)) return true;
    seen.add(x);
  }
  return false;
}</pre>
<p><strong>Complexity:</strong> the fast version is O(n) time (one pass, O(1) average per lookup) and O(n) extra space for the set. The slow version is O(n&sup2;) time and O(1) space. This is the <em>time-space trade-off</em> in its simplest form: you spent memory to buy speed. A third option, sort first and compare neighbours, is O(n log n) time with O(1) extra space if you may sort in place &mdash; mention it, it shows range.</p>
<div class="callout"><b>Interview trap:</b> a correct brute force is not the end of the interview; it is the starting point. Interviewers wait for "this inner loop is just a search, so a hash set can replace it". Also ask whether you may modify the input &mdash; the sorting approach mutates the array unless you copy it.</div>
<p><strong>Pattern to remember:</strong> when an inner loop only asks "does value X exist / have I seen X", replace it with a Set or Map lookup.</p>`,
  task:`Write <code>hasDuplicate(nums)</code> that returns <code>true</code> if any value appears at least twice in <code>nums</code>, otherwise <code>false</code>. Do not modify the input array. It must be linear time: the large tests use 200,000 numbers.`,
  starter:`function hasDuplicate(nums) {
  // idea: remember what you have seen; stop the moment you see it again
  return null;
}
`,
  solution:`function hasDuplicate(nums) {
  const seen = new Set();
  for (const x of nums) {
    if (seen.has(x)) return true;
    seen.add(x);
  }
  return false;
}`,
  tests:[
    { desc:`hasDuplicate([1,2,3,1]) is true`, check:`hasDuplicate([1,2,3,1]) === true` },
    { desc:`hasDuplicate([1,2,3,4]) is false`, check:`hasDuplicate([1,2,3,4]) === false` },
    { desc:`empty array has no duplicate`, check:`hasDuplicate([]) === false` },
    { desc:`single element has no duplicate`, check:`hasDuplicate([7]) === false` },
    { desc:`adjacent equal values count: [5,5] is true`, check:`hasDuplicate([5,5]) === true` },
    { desc:`negatives and zero: [-1,0,-1] is true, [-1,0,1] is false`, check:`hasDuplicate([-1,0,-1]) === true && hasDuplicate([-1,0,1]) === false` },
    { desc:`does not modify the input array`, check:`(function(){ var a = [3,1,2,1]; var c = JSON.parse(JSON.stringify(a)); hasDuplicate(a); return __eq(a, c); })()` },
    { desc:`200,000 distinct numbers: false (O(n^2) would time out)`, check:`(function(){ var a = []; for (var i = 0; i < 200000; i++) a.push((i * 7919) % 200003); return hasDuplicate(a) === false; })()` },
    { desc:`200,000 numbers with the only duplicate at the very end: true`, check:`(function(){ var a = []; for (var i = 0; i < 200000; i++) a.push(i); a.push(0); return hasDuplicate(a) === true; })()` }
  ]
},

{ id:'m1-l5', module:0, file:'05-predict-hidden-cost.js', type:'predict', title:'Predict: The Hidden Loop Inside includes',
  concept:`<p>One of the most common reasons good-looking code is slow is a <strong>hidden loop</strong>: a built-in method that scans the whole array for you. <code>arr.includes(x)</code>, <code>arr.indexOf(x)</code>, <code>arr.slice()</code>, <code>arr.shift()</code>, <code>arr.splice()</code>, <code>str.concat</code> inside a loop, and spreading <code>[...a, x]</code> are each O(n), even though they are one short line. Put one inside a loop over n items and you have written an O(n&sup2;) algorithm without a single nested <code>for</code>.</p>
<p>The real-world version: a screen that, for every job in a list of 50,000, calls <code>otherJobs.includes(job.id)</code>. It feels instant on a test data set of 20 rows and freezes on the real one. This is why interviewers ask "what is the complexity of that line?" about methods you did not write.</p>
<p>In the snippet, <code>includes</code> is written out by hand with an <code>ops</code> counter so you can see the hidden work. Predict how many element reads happen in total across the loop. Remember <code>includes</code> stops as soon as it finds the value, so searching for an element at index i costs i+1 reads.</p>`,
  predict:{
    snippet:`let ops = 0;
function includes(a, x) {
  for (const v of a) {
    ops++;
    if (v === x) return true;
  }
  return false;
}
const arr = [1, 2, 3, 4, 5, 6, 7, 8];
let found = 0;
for (const x of arr) if (includes(arr, x)) found++;
console.log(found);
console.log(ops);`,
    question:'What do the two console.log lines print?',
    options:['8 / 8','8 / 64','8 / 36','8 / 16'],
    correctIndex:2,
    afterExplain:`Every element is found, so <code>found</code> is 8. The reads: looking for 1 costs 1 read, for 2 costs 2, ... for 8 costs 8, so the total is 1+2+...+8 = <strong>36</strong>, which is n(n+1)/2. It is not 64 because each search stops early, and it is certainly not 8 &mdash; the loop <em>looks</em> linear but each iteration hides a linear scan. For n = 8 nobody cares; for n = 100,000 the same pattern is about 5 billion reads. Note that the &frac12; does not rescue you: n&sup2;/2 is still O(n&sup2;). <strong>Interview takeaway:</strong> before submitting, point at each line inside a loop and ask "what does this cost?" &mdash; and fix it with a Set or Map.`
  }
},

{ id:'m1-l6', module:0, file:'06-time-space-tradeoff.js', type:'exercise', title:'Space vs Time: Precompute Once, Answer Instantly',
  concept:`<p>Space complexity measures the <em>extra</em> memory your algorithm needs as n grows (not counting the input itself). The two resources trade against each other so often that "can I spend memory to save time?" should be your reflex question. A <code>Set</code> or <code>Map</code> costs O(n) memory and turns an O(n) search into O(1). A precomputed table costs O(n) memory and turns repeated work into a lookup.</p>
<p>Consider a screen that must answer "how many times does value X occur in this list?" thousands of times. The direct approach scans the whole list for each question: with 100,000 items and 100,000 questions that is 10 billion reads. The better design splits the work into two phases: a <strong>build</strong> phase that pays O(n) once to count everything into a Map, and a <strong>query</strong> phase that costs O(1) per question. Total: O(n + q) instead of O(n &times; q).</p>
<p>That "preprocess, then answer fast" shape is one of the most reusable ideas in the course: prefix sums, sorted arrays for binary search, indexes in a database, and lookup tables are all the same move. It works well when the number of queries is large; if you will only ask one question, building the table is wasted effort.</p>
<pre>// build phase O(n), query phase O(1)
arr = [3, 1, 3, 2, 3]
counts after build: {3 -&gt; 3, 1 -&gt; 1, 2 -&gt; 1}
count(3) -&gt; 3     count(9) -&gt; 0
function makeCounter(arr) {
  const counts = new Map();
  for (const x of arr) counts.set(x, (counts.get(x) || 0) + 1);
  return function count(x) { return counts.get(x) || 0; };
}</pre>
<p><strong>Complexity:</strong> build O(n) time and O(k) space where k is the number of distinct values (worst case O(n)); each query O(1) average time, O(1) space. Notice that the function you return keeps the Map alive &mdash; that is a <em>closure</em>.</p>
<div class="callout"><b>Interview trap:</b> always state the memory cost of a speed-up out loud ("O(n) extra space for the map"). Interviewers often follow with "what if memory is tight?", and the honest answer names the trade-off: sort + binary search gives O(log n) queries with O(1) extra space.</div>
<p><strong>Pattern to remember:</strong> when the same data is queried many times, pay once up front to build a lookup structure.</p>`,
  task:`Write <code>makeCounter(arr)</code> that returns a function <code>count(x)</code>. <code>count(x)</code> returns how many times <code>x</code> occurs in <code>arr</code> (0 if never). Compare with <code>===</code> semantics, so <code>1</code> and <code>"1"</code> are different. Do not modify <code>arr</code>. Building must be O(n) and each query O(1): the big test asks 100,000 questions about 100,000 items.`,
  starter:`function makeCounter(arr) {
  // build phase: count everything once
  // then return a function count(x) that answers from your table
  return function count(x) {
    return -1;
  };
}
`,
  solution:`function makeCounter(arr) {
  const counts = new Map();
  for (const x of arr) counts.set(x, (counts.get(x) || 0) + 1);
  return function count(x) {
    return counts.get(x) || 0;
  };
}`,
  tests:[
    { desc:`makeCounter([3,1,3,2,3]): count(3) is 3, count(1) is 1, count(9) is 0`, check:`(function(){ var c = makeCounter([3,1,3,2,3]); return c(3) === 3 && c(1) === 1 && c(9) === 0; })()` },
    { desc:`empty array: every query returns 0`, check:`(function(){ var c = makeCounter([]); return c(0) === 0 && c('a') === 0; })()` },
    { desc:`strings are counted: makeCounter(["a","b","a"]) count("a") is 2`, check:`makeCounter(['a','b','a'])('a') === 2` },
    { desc:`1 and "1" are different values`, check:`(function(){ var c = makeCounter([1,1,'1']); return c(1) === 2 && c('1') === 1; })()` },
    { desc:`the same counter can be asked repeatedly with stable answers`, check:`(function(){ var c = makeCounter([5,5,5]); return c(5) === 3 && c(5) === 3 && c(6) === 0; })()` },
    { desc:`negative numbers and zero are counted correctly`, check:`(function(){ var c = makeCounter([0,-1,-1,0,0]); return c(0) === 3 && c(-1) === 2; })()` },
    { desc:`does not modify the input array`, check:`(function(){ var a = [2,1,2]; var k = JSON.parse(JSON.stringify(a)); makeCounter(a)(2); return __eq(a, k); })()` },
    { desc:`100,000 items, 100,000 queries (each value appears 100 times) finishes in time`, check:`(function(){ var a = []; for (var i = 0; i < 100000; i++) a.push(i % 1000); var c = makeCounter(a); var ok = true; for (var q = 0; q < 100000; q++) { if (c(q % 1500) !== (q % 1500 < 1000 ? 100 : 0)) ok = false; } return ok; })()` }
  ]
},

{ id:'m1-l7', module:0, file:'07-amortised-dynamic-array.js', type:'exercise', title:'Amortised O(1): Build a Dynamic Array',
  concept:`<p><code>arr.push(x)</code> is described as O(1), yet an array in memory is a fixed-size block. What happens when the block is full? The runtime allocates a bigger block, copies every element across, and carries on. That single push costs O(n). So is push O(1) or O(n)? Both are true in different senses, and the word that reconciles them is <strong>amortised</strong>: the average cost per operation over a long sequence of operations.</p>
<p>The trick is <em>doubling</em>. If the capacity doubles every time it fills (1, 2, 4, 8, ...), the expensive copies get rarer exactly as fast as they get bigger. Pushing n items copies 1 + 2 + 4 + ... + n/2 elements in total, which is less than n. Add the n cheap writes and the total is under 3n steps &mdash; roughly 3 per push, a constant. If instead it grew by a fixed +10 slots each time, the copies would be 10, 20, 30, ...: quadratic in total. Growth must be <em>multiplicative</em>.</p>
<pre>// capacity starts at 1, doubles when full, count copies
push A: size 0, cap 1 -&gt; write.            copies 0
push B: size 1 == cap 1 -&gt; grow to 2, copy 1.  copies 1
push C: size 2 == cap 2 -&gt; grow to 4, copy 2.  copies 3
push D: size 3, cap 4 -&gt; write.            copies 3
push E: size 4 == cap 4 -&gt; grow to 8, copy 4.  copies 7
push(v):
  if (this.length === this.capacity) {
    const bigger = new Array(this.capacity * 2);
    for (let i = 0; i &lt; this.length; i++)
      bigger[i] = this.data[i];
    this.copies += this.length;
    this.data = bigger;
    this.capacity *= 2;
  }
  this.data[this.length++] = v;</pre>
<p><strong>Complexity:</strong> push is O(n) in the worst single call but <strong>amortised O(1)</strong>; get(i) is O(1) worst case. Space is O(n), with at most half the block wasted.</p>
<div class="callout"><b>Interview trap:</b> when asked "what is the complexity of push?", say "amortised O(1); an individual push can be O(n) when it triggers a resize, but the average over many pushes is constant". Saying only "O(1)" invites the follow-up you cannot answer; saying "O(n)" is simply wrong for the whole sequence. The same reasoning applies to a hash table's resize.</div>
<p><strong>Pattern to remember:</strong> rare expensive steps that get rarer as they grow average out; double, do not add.</p>`,
  task:`Complete the class <code>DynArray</code>. The constructor is given: capacity starts at 1, <code>data</code> is a fixed-size block (<code>new Array(capacity)</code>), <code>length</code> is how many items are stored, and <code>copies</code> counts the total elements copied during resizes.<br><br><code>push(v)</code>: if <code>length === capacity</code>, allocate a new block of <em>double</em> the capacity, copy the existing items into it (adding <code>length</code> to <code>copies</code>), then store <code>v</code>. Do not use the built-in array's own growth: <code>data.length</code> must always equal <code>capacity</code>. <code>get(i)</code> returns the item at index i, or <code>undefined</code> if i is out of range (negative or &gt;= length).`,
  starter:`class DynArray {
  constructor() {
    this.capacity = 1;
    this.data = new Array(1);
    this.length = 0;
    this.copies = 0;
  }
  push(v) {
    // grow (double + copy) when full, then store v
  }
  get(i) {
    // return the item, or undefined if i is out of range
  }
}
`,
  solution:`class DynArray {
  constructor() {
    this.capacity = 1;
    this.data = new Array(1);
    this.length = 0;
    this.copies = 0;
  }
  push(v) {
    if (this.length === this.capacity) {
      const bigger = new Array(this.capacity * 2);
      for (let i = 0; i < this.length; i++) bigger[i] = this.data[i];
      this.copies += this.length;
      this.data = bigger;
      this.capacity *= 2;
    }
    this.data[this.length++] = v;
  }
  get(i) {
    if (i < 0 || i >= this.length) return undefined;
    return this.data[i];
  }
}`,
  tests:[
    { desc:`new DynArray starts with length 0, capacity 1, copies 0`, check:`(function(){ var d = new DynArray(); return d.length === 0 && d.capacity === 1 && d.copies === 0; })()` },

{ id:'m1-l8', module:0, file:'08-brute-force-stage.js', type:'exercise', title:'The 5-Step Method, Part 1: Clarify, Examples, Brute Force',
  concept:`<p>The reason you freeze on a blank function body is rarely the code &mdash; it is that you jump straight to typing. Interviewers (and your own future self at work) are much happier with a repeatable method. Use these five steps, in order, every single time:</p>
<ul><li><strong>1. Clarify.</strong> Restate the problem; ask about input size, duplicates, negatives, empty input, and what to return in odd cases.</li>
<li><strong>2. Examples.</strong> Write 2&ndash;3 small examples including one edge case, and work out the answers by hand.</li>
<li><strong>3. Brute force.</strong> Say the simplest correct approach and its complexity. Code it if time allows; it is your reference answer.</li>
<li><strong>4. Optimise.</strong> Find the wasted work in the brute force and remove it (next lesson).</li>
<li><strong>5. Test.</strong> Dry-run your code on the examples and on the edge cases.</li></ul>
<p>Here is the practice problem, "best time to buy and sell a stock": given daily <code>prices</code>, you may buy on one day and sell on a <em>later</em> day. Return the maximum profit, or 0 if no profit is possible.</p>
<p><strong>Step 1 questions:</strong> can I sell the same day I buy (no &mdash; later day)? What if the array is empty or has one day (profit 0)? Are prices non-negative? <strong>Step 2 examples:</strong> <code>[7,1,5,3,6,4]</code> &rarr; buy at 1, sell at 6, profit 5. <code>[5,4,3]</code> &rarr; 0. <strong>Step 3:</strong> try every pair (buy day i, sell day j &gt; i) and keep the best difference.</p>
<pre>prices = [7, 1, 5, 3, 6, 4]
i=0 (7): sells at 1,5,3,6,4  -&gt; best diff -3  -&gt; best=0
i=1 (1): sells at 5,3,6,4    -&gt; diffs 4,2,5,3 -&gt; best=5
i=2 (5): sells at 3,6,4      -&gt; diffs -2,1,-1 -&gt; best=5
...
answer 5
function maxProfitBrute(prices) {
  let best = 0;
  for (let i = 0; i &lt; prices.length; i++)
    for (let j = i + 1; j &lt; prices.length; j++)
      best = Math.max(best, prices[j] - prices[i]);
  return best;
}</pre>
<p><strong>Complexity:</strong> O(n&sup2;) time, O(1) space. State that sentence out loud &mdash; it tells the interviewer you know the brute force is not the destination, and it tells you exactly which part to attack in step 4.</p>
<div class="callout"><b>Interview trap:</b> starting <code>best</code> at <code>-Infinity</code> or at the first difference. If every price falls, the correct answer is 0 (you simply do not trade), not a negative number. Settling edge-case behaviour in step 1 prevents this.</div>
<p><strong>Pattern to remember:</strong> a correct brute force first, with its complexity stated, is a strong answer &mdash; it is also your test oracle for the faster version.</p>`,
  task:`Write <code>maxProfitBrute(prices)</code> using the pair-checking approach: for every buy day i and later sell day j, consider <code>prices[j] - prices[i]</code>. Return the maximum profit, or <code>0</code> if no profitable trade exists (including for an empty array or a single day). Do not modify the input. Tests use small inputs only: correctness first.`,
  starter:`function maxProfitBrute(prices) {
  // Stage 1 Clarify: sell must be on a LATER day; no profit -> 0
  // Stage 2 Examples: [7,1,5,3,6,4] -> 5   [5,4,3] -> 0   [] -> 0
  // Stage 3 Brute force: try every (buy i, sell j > i) pair
  return -1;
}
`,
  solution:`function maxProfitBrute(prices) {
  let best = 0;
  for (let i = 0; i < prices.length; i++) {
    for (let j = i + 1; j < prices.length; j++) {
      best = Math.max(best, prices[j] - prices[i]);
    }
  }
  return best;
}`,
  tests:[
    { desc:`[7,1,5,3,6,4] returns 5 (buy at 1, sell at 6)`, check:`maxProfitBrute([7,1,5,3,6,4]) === 5` },
    { desc:`[5,4,3,2] returns 0 (prices only fall: do not trade)`, check:`maxProfitBrute([5,4,3,2]) === 0` },
    { desc:`[] returns 0`, check:`maxProfitBrute([]) === 0` },
    { desc:`[9] returns 0 (single day, cannot sell later)`, check:`maxProfitBrute([9]) === 0` },
    { desc:`[1,2,3,4,5] returns 4 (rising prices)`, check:`maxProfitBrute([1,2,3,4,5]) === 4` },
    { desc:`[3,3,3] returns 0 (flat prices)`, check:`maxProfitBrute([3,3,3]) === 0` },
    { desc:`the best sell cannot come before the buy: [9,1,2] returns 1, not 8`, check:`maxProfitBrute([9,1,2]) === 1` },
    { desc:`does not modify the input`, check:`(function(){ var a = [4,1,6]; maxProfitBrute(a); return __eq(a, [4,1,6]); })()` }
  ]
},

{ id:'m1-l9', module:0, file:'09-optimise-stage.js', type:'exercise', title:'The 5-Step Method, Part 2: Optimise to One Pass',
  concept:`<p>Step 4 of the method is <strong>optimise</strong>, and the way to do it is not to "think of something clever" but to ask a precise question of the brute force: <em>what work is repeated or wasted?</em> In last lesson's pair loop, for each sell day j the code re-examines every earlier buy day i to find the cheapest one. But the cheapest earlier price does not need to be re-found from scratch each time &mdash; you can carry it along.</p>
<p>So walk the days once, and keep a single variable: <code>minSoFar</code>, the lowest price seen up to the current day. On each day, the best you could do selling <em>today</em> is <code>price - minSoFar</code>. Track the maximum of that. The inner loop has been replaced by one remembered number. This "carry a running summary instead of rescanning" move is the engine behind prefix sums, Kadane's algorithm and sliding windows.</p>
<pre>prices = [7, 1, 5, 3, 6, 4]
day price  minSoFar  profit-today  best
 0    7       7           0          0
 1    1       1           0          0
 2    5       1           4          4
 3    3       1           2          4
 4    6       1           5          5
 5    4       1           3          5   -&gt; answer 5
function maxProfit(prices) {
  let min = Infinity, best = 0;
  for (const p of prices) {
    if (p &lt; min) min = p;
    else if (p - min &gt; best) best = p - min;
  }
  return best;
}</pre>
<p><strong>Complexity:</strong> O(n) time (one pass), O(1) space &mdash; a strict improvement over O(n&sup2;) with no extra memory at all. Not every optimisation costs space; here the saved state is two numbers.</p>
<div class="callout"><b>Interview trap:</b> after optimising, you must still do step 5 and compare against the brute force. The most common slip is updating <code>min</code> <em>before</em> computing today's profit in a way that lets you "sell on the same day you buy" (harmless here, but the same ordering mistake breaks problems where it matters). Run your fast version on the examples from step 2 by hand.</div>
<p><strong>Pattern to remember:</strong> "best pair where order matters" &rarr; sweep once, carrying the best earlier candidate.</p>`,
  task:`Write <code>maxProfit(prices)</code> with the same rules as before (buy on one day, sell on a strictly later day; return <code>0</code> if no profit is possible, also for empty or single-day input), but in <strong>one pass</strong>. The large tests use 300,000 prices, which an O(n&sup2;) solution cannot finish. Do not modify the input.`,
  starter:`function maxProfit(prices) {
  // carry the cheapest price seen so far while sweeping once
  return -1;
}
`,
  solution:`function maxProfit(prices) {
  let min = Infinity, best = 0;
  for (const p of prices) {
    if (p < min) min = p;
    else if (p - min > best) best = p - min;
  }
  return best;
}`,
  tests:[
    { desc:`[7,1,5,3,6,4] returns 5`, check:`maxProfit([7,1,5,3,6,4]) === 5` },
    { desc:`[7,6,4,3,1] returns 0 (always falling)`, check:`maxProfit([7,6,4,3,1]) === 0` },
    { desc:`empty array returns 0 and single day returns 0`, check:`maxProfit([]) === 0 && maxProfit([5]) === 0` },
    { desc:`low point is after the high point: [10,2,3,1] returns 1`, check:`maxProfit([10,2,3,1]) === 1` },
    { desc:`the best trade does not start at the global minimum: [2,10,1,5] returns 8`, check:`maxProfit([2,10,1,5]) === 8` },
    { desc:`flat prices return 0`, check:`maxProfit([4,4,4,4]) === 0` },
    { desc:`does not modify the input`, check:`(function(){ var a = [3,1,4,1,5]; maxProfit(a); return __eq(a, [3,1,4,1,5]); })()` },
    { desc:`300,000 strictly rising prices: profit is last - first`, check:`(function(){ var a = []; for (var i = 0; i < 300000; i++) a.push(100 + i); return maxProfit(a) === 299999; })()` },
    { desc:`300,000 pseudo-random prices match a reference sweep`, check:`(function(){ var a = [], x = 12345; for (var i = 0; i < 300000; i++) { x = (x * 1103515245 + 12345) % 2147483648; a.push(x % 100000); } var m = Infinity, b = 0; for (var k = 0; k < a.length; k++) { if (a[k] < m) m = a[k]; if (a[k] - m > b) b = a[k] - m; } return maxProfit(a) === b; })()` }
  ]
},

{ id:'m1-l10', module:0, file:'10-test-stage.js', type:'exercise', title:'The 5-Step Method, Part 3: Test — Write Inputs That Catch Bugs',
  concept:`<p>Step 5 is where most candidates lose marks: they say "I think that works" and stop. A test is not "run the example from the prompt"; it is a deliberate attempt to <em>break</em> your own code. Do this by hand in an interview (a <strong>dry run</strong>: write each variable in a column and step through line by line), and with real inputs at work.</p>
<p>A good test set is small and chosen, not random. Work through a checklist: the <strong>empty</strong> input; a <strong>single</strong> element; <strong>all equal</strong> values; <strong>sorted ascending</strong> and <strong>descending</strong>; <strong>negatives and zero</strong>; the <strong>answer at the start</strong> and <strong>at the end</strong> (off-by-one bugs live at the boundaries); and the case where the <strong>obvious greedy shortcut</strong> is wrong. Each input should be able to fail a specific bug &mdash; if two inputs would catch the same bug, one is redundant.</p>
<p>Dry-running a loop looks like this, using the stock sweep on <code>[5, 1, 6]</code>:</p>
<pre>line         min    best   p
start        Inf     0     -
p=5 (&lt; min)    5     0     5
p=1 (&lt; min)    1     0     1
p=6 (6-1&gt;0)    1     5     6   -&gt; return 5
// bug idea: compares everything to prices[0]=5
//   p=1: 1-5=-4, p=6: 6-5=1  -&gt; returns 1, expected 5
//   input [5,1,6] catches it.</pre>
<p>In this exercise the starter holds a correct reference <code>refProfit</code> and four buggy versions of the stock function, each with a different classic mistake. Your job is to write <code>killers()</code>, returning an array of price arrays that, taken together, make <em>each</em> buggy version disagree with the reference at least once, and that includes the standard edge cases. Read the buggy code, predict which input exposes each, and verify by running.</p>
<p><strong>Complexity:</strong> testing is about coverage, not speed: a handful of inputs that hit every boundary beats thousands of random ones.</p>
<div class="callout"><b>Interview trap:</b> the example in the problem statement almost always passes buggy code. Say "now let me test edge cases: empty, single element, all decreasing" without being asked. That one sentence is often what separates a hire from a near-miss.</div>
<p><strong>Pattern to remember:</strong> a test earns its place by being able to fail a specific bug; for every input ask "which mistake would this catch?"</p>`,
  task:`Write <code>killers()</code>, returning an array of price arrays (each an array of numbers). Requirements: (1) each of <code>buggyA</code>, <code>buggyB</code>, <code>buggyC</code>, <code>buggyD</code> must return a different result from <code>refProfit</code> on at least one of your arrays (or throw); (2) include the empty array <code>[]</code>; (3) include at least one array with exactly one element; (4) give at least 4 arrays. Do not edit the helper functions above the marker line.`,
  starter:`// ---- helpers (do not edit) ----

}

function buggyA(p) {
  let min = p[0], best = -Infinity;

  return best;
}

function buggyB(p) { return Math.max(0, Math.max(...p) - Math.min(...p)); }
// Bug C: off-by-one, never looks at the last day

  let min = Infinity, best = 0;

  return [];
}
`,

{ id:'m2-l1', module:1, file:'01-predict-aliasing.js', type:'predict', title:'Predict: Aliases, Copies and In-Place Methods',
  concept:`<p>An array variable does not hold the array; it holds a <strong>reference</strong> to it. So <code>const b = a</code> does not copy anything &mdash; two names now point at one array, and a change through either name is visible through both. A real copy needs <code>[...a]</code>, <code>a.slice()</code> or <code>Array.from(a)</code>, and each of those costs O(n) time and O(n) space. Remember that these copies are <em>shallow</em>: nested arrays or objects inside are still shared.</p>
<p>The second source of surprise is that some methods mutate the array they are called on while others return a fresh one. <code>push</code>, <code>pop</code>, <code>shift</code>, <code>unshift</code>, <code>splice</code>, <code>sort</code> and <code>reverse</code> change the original (in place). <code>slice</code>, <code>map</code>, <code>filter</code>, <code>concat</code> and <code>[...a]</code> do not. And <code>sort</code> and <code>reverse</code> are the tricky ones, because they <em>also</em> return the array, which tempts people into thinking the result is a copy. In an interview this decides whether "return the sorted array" accidentally wrecks the caller's data.</p>
<p>Trace the snippet by writing down what each name points at after every line. Which names refer to the same array?</p>`,
  predict:{
    snippet:`const a = [3, 1, 2];
const b = a;
const c = [...a];
b.push(9);
const s = a.sort();
console.log(a.length, c.length);
console.log(s === a);
console.log(c.slice().reverse().join(""));`,
    question:'What do the three console.log lines print?',
    options:['3 3 / false / 213','4 3 / false / 213','4 3 / true / 213','4 4 / true / 312'],
    correctIndex:2,
    afterExplain:`<code>b</code> is an alias of <code>a</code>, so <code>b.push(9)</code> makes <code>a</code> length 4. <code>c</code> was copied before the push, so it stays at length 3 &mdash; hence <strong>4 3</strong>. <code>a.sort()</code> sorts <code>a</code> itself and returns that very same array, so <code>s === a</code> is <strong>true</strong>, not a new copy. Finally <code>c.slice()</code> copies <code>[3,1,2]</code> and <code>reverse()</code> flips the copy to <code>[2,1,3]</code>, giving <strong>213</strong>, while <code>c</code> stays untouched. <strong>Interview takeaway:</strong> ask "may I mutate the input?" and, if not, copy first (<code>[...nums].sort(...)</code>). Also note the default <code>sort()</code> compares as strings: <code>[10, 9, 1].sort()</code> gives <code>[1, 10, 9]</code>; always pass <code>(a, b) =&gt; a - b</code> for numbers.`
  }
},

{ id:'m2-l2', module:1, file:'02-predict-string-basics.js', type:'predict', title:'Predict: Immutable Strings, Char Codes and Comparison',
  concept:`<p>JavaScript strings are <strong>immutable</strong>: you can read <code>s[0]</code>, but you can never change a character in place. Writing <code>s[0] = "J"</code> is silently ignored in normal (non-strict) code, which makes it a nasty bug. To "change" a string you build a new one. That has a cost: concatenating inside a loop (<code>result += ch</code>) conceptually copies the growing string each time, which is O(n&sup2;) in the worst case. Modern engines optimise simple <code>+=</code> chains, but the safe, portable habit is to push pieces into an array and call <code>join("")</code> once at the end &mdash; O(n) overall.</p>
<p>Characters are stored as numeric <strong>UTF-16 code units</strong>. <code>"a".charCodeAt(0)</code> is 97, <code>"A"</code> is 65, <code>"0"</code> is 48. Because letters are consecutive, <code>code - 97</code> maps <code>a..z</code> to <code>0..25</code>, which is how you build a fixed 26-slot frequency array. <code>String.fromCharCode(n)</code> goes the other way. Comparison with <code>&lt;</code> and <code>&gt;</code> on strings is by these codes, <em>character by character</em>, not by numeric value.</p>
<p>Predict each of the four output lines. For the last line remember that the strings <code>"10"</code> and <code>"9"</code> are compared first character against first character.</p>`,
  predict:{
    snippet:`let s = "hello";
s[0] = "J";
console.log(s);
console.log("a".charCodeAt(0) + 1);
console.log(String.fromCharCode("a".charCodeAt(0) + 2));
console.log("b" > "B", "10" < "9");`,
    question:'What do the four console.log lines print?',
    options:['Jello / 98 / c / true true','hello / 98 / c / true true','hello / 98 / c / true false','hello / 97 / c / false true'],
    correctIndex:1,
    afterExplain:`The assignment <code>s[0] = "J"</code> does nothing &mdash; strings are immutable &mdash; so <code>s</code> is still <strong>hello</strong>. <code>"a".charCodeAt(0)</code> is 97, plus 1 gives <strong>98</strong>. Adding 2 gives 99, and <code>String.fromCharCode(99)</code> is <strong>c</strong>. Lowercase <code>"b"</code> (98) is greater than uppercase <code>"B"</code> (66), so the first comparison is true; and <code>"10" &lt; "9"</code> is also true because <code>"1"</code> (49) is less than <code>"9"</code> (57) &mdash; strings compare character by character, not as numbers. <strong>Interview takeaway:</strong> when a problem says "lowercase letters only", reach for <code>charCodeAt(i) - 97</code> and a 26-length array instead of a Map; and build output with an array and <code>join</code>, not repeated concatenation.`
  }
},

{ id:'m2-l3', module:1, file:'03-palindrome.js', type:'exercise', title:'Two Pointers on a String: Valid Palindrome',
  concept:`<p>A palindrome reads the same forwards and backwards. The first idea most people have is "reverse the string and compare", and that is fine &mdash; it is O(n) time. But it allocates a whole second string, and it does not deal with the twist that interviews add: ignore spaces, punctuation and letter case. The technique worth learning is the one that generalises: two <strong>pointers</strong> that start at both ends and walk towards each other, comparing as they go.</p>
<p>Set <code>i = 0</code> and <code>j = s.length - 1</code>. While <code>i &lt; j</code>: if the character at <code>i</code> is not a letter or digit, skip it (<code>i++</code>); if the character at <code>j</code> is not, skip it (<code>j--</code>); otherwise compare them case-insensitively and either return <code>false</code> at the first mismatch or move both pointers inwards. If the pointers meet or cross, everything matched. No extra string is built, so space is O(1).</p>
<pre>s = "A man, a plan!"   (skip non-alphanumerics)
i=0 'A'  j=13 '!'  -&gt; j-- (skip)
i=0 'A'  j=12 'n'  -&gt; 'a' vs 'n' mismatch -&gt; false

s = "Aba"
i=0 'A' j=2 'a' -&gt; equal (ignore case)
i=1 j=1 -&gt; stop -&gt; true
function isPalindrome(s) {
  let i = 0, j = s.length - 1;

<p><strong>Complexity:</strong> each pointer only moves inwards, so total steps are at most n: O(n) time, O(1) extra space. The filter-and-reverse version is O(n) time but O(n) space.</p>

<p><strong>Pattern to remember:</strong> a symmetric condition, or "compare from both ends", means two pointers moving inwards.</p>`,

}

  solution:`function isPalindrome(s) {

{ id:'m2-l4', module:1, file:'04-anagram-sorting.js', type:'exercise', title:'Anagrams by Sorting: Canonical Forms',
  concept:`<p>Two words are <strong>anagrams</strong> if one is a rearrangement of the other: "listen" and "silent". The question "do these two strings contain the same characters with the same counts?" shows up in dozens of variants, and the first technique to master is the <strong>canonical form</strong>: transform each string into a standard shape such that equivalent inputs become identical. For anagrams the canonical form is simply the characters in sorted order. "listen" and "silent" both sort to "eilnst", so they match.</p>
<p>The reasoning is mechanical. A rearrangement does not change which characters are present or how often, and sorting throws away the order and keeps only that information. Two strings are anagrams exactly when their sorted forms are equal. Any quick pre-check helps: if the lengths differ they cannot be anagrams, so return <code>false</code> immediately.</p>
<pre>a = "listen"  -&gt; split: ['l','i','s','t','e','n']
                 sort : ['e','i','l','n','s','t']
                 join : "eilnst"
b = "silent"  -&gt; ... -&gt; "eilnst"      equal -&gt; true

a = "rat", b = "car" -&gt; "art" vs "acr" -&gt; false
function isAnagram(a, b) {
  if (a.length !== b.length) return false;
  const key = (s) =&gt; s.split("").sort().join("");
  return key(a) === key(b);
}</pre>
<p><strong>Complexity:</strong> sorting dominates: O(n log n) time and O(n) space for the character arrays. There is a faster O(n) approach &mdash; count characters instead of sorting &mdash; and you will build it in the hash map module; for a fixed alphabet like <code>a-z</code> you can already do it with a 26-slot array. Knowing both, and being able to say why, is the interview-ready answer.</p>
<div class="callout"><b>Interview trap:</b> clarify what counts. Is the comparison case-sensitive? Do spaces and punctuation count as characters? Here they all count and case matters (<code>"Ab"</code> is not an anagram of <code>"ab"</code>). And remember that <code>sort()</code> with no comparator sorts by UTF-16 code, which is exactly what you want for characters &mdash; it is only wrong for numbers.</div>
<p><strong>Pattern to remember:</strong> "same contents regardless of order" &rarr; compare a canonical form (sorted string, or a count table).</p>`,
  task:`Write <code>isAnagram(a, b)</code> returning <code>true</code> if <code>b</code> is a rearrangement of <code>a</code>: the same characters with the same multiplicities. Comparison is case-sensitive and every character counts (spaces and punctuation too). Two empty strings are anagrams. The inputs are strings; do not mutate anything.`,
  starter:`function isAnagram(a, b) {
  // quick check: different lengths can never be anagrams
  // canonical form: sort the characters, then compare
  return null;
}
`,
  solution:`function isAnagram(a, b) {
  if (a.length !== b.length) return false;
  const key = (s) => s.split('').sort().join('');
  return key(a) === key(b);
}`,
  tests:[
    { desc:`isAnagram("listen", "silent") is true`, check:`isAnagram('listen', 'silent') === true` },
    { desc:`isAnagram("rat", "car") is false (different letters)`, check:`isAnagram('rat', 'car') === false` },
    { desc:`different lengths are never anagrams: ("ab", "abb")`, check:`isAnagram('ab', 'abb') === false` },
    { desc:`counts must match: ("aacc", "ccac") is false`, check:`isAnagram('aacc', 'ccac') === false` },
    { desc:`two empty strings are anagrams`, check:`isAnagram('', '') === true` },
    { desc:`case-sensitive: ("Ab", "ab") is false`, check:`isAnagram('Ab', 'ab') === false` },
    { desc:`spaces count as characters: ("a b", "ab ") true, ("a b", "ab") false`, check:`isAnagram('a b', 'ab ') === true && isAnagram('a b', 'ab') === false` },
    { desc:`identical strings are anagrams of themselves`, check:`isAnagram('same', 'same') === true` },
    { desc:`100,000-character rearrangement is true, one swapped letter makes it false`, check:`(function(){ var a = [], i; for (i = 0; i < 100000; i++) a.push(String.fromCharCode(97 + (i * 13) % 26)); var s = a.join(''); var r = a.slice().reverse().join(''); var t = a.slice(); t[500] = t[500] === 'z' ? 'y' : 'z'; return isAnagram(s, r) === true && isAnagram(s, t.join('')) === false; })()` }
  ]
},

{ id:'m2-l5', module:1, file:'05-move-zeroes.js', type:'exercise', title:'In-Place Rewriting: Move Zeroes',
  concept:`<p>"Move all zeroes to the end, keeping the other numbers in the same order, without making a new array." This is the entry-level version of the most useful in-place array technique: the <strong>read/write pointer</strong> (also called slow/fast). You scan with a read index <code>r</code> that visits every element, and you keep a second index <code>w</code> that marks where the next "keeper" belongs. Everything before <code>w</code> is already the finished, compacted part of the answer.</p>
<p>Why not the obvious approach, calling <code>splice(i, 1)</code> on every zero and <code>push(0)</code>? Because <code>splice</code> shifts every later element one slot to the left, which is O(n) per call. With many zeroes that is O(n&sup2;) in total. The pointer approach touches each element once.</p>
<pre>nums = [0, 1, 0, 3, 12]    w = 0
r=0 (0)  skip
r=1 (1)  nums[w=0]=1, w=1     [1,1,0,3,12]
r=2 (0)  skip
r=3 (3)  nums[w=1]=3, w=2     [1,3,0,3,12]
r=4 (12) nums[w=2]=12, w=3    [1,3,12,3,12]
fill nums[3..4] with 0        [1,3,12,0,0]
function moveZeroes(nums) {
  let w = 0;
  for (let r = 0; r &lt; nums.length; r++) {
    if (nums[r] !== 0) nums[w++] = nums[r];
  }
  while (w &lt; nums.length) nums[w++] = 0;
}</pre>
<p><strong>Complexity:</strong> two passes at most, so O(n) time, O(1) extra space. The order of the non-zero values is preserved (a <em>stable</em> compaction), which is why the written values never overtake the reader.</p>
<div class="callout"><b>Interview trap:</b> "in place" means you mutate the array you were given and return nothing; allocating a second array and copying back is usually rejected. Also decide how to treat <code>-0</code>, <code>false</code> and <code>null</code> &mdash; here only the number <code>0</code> counts, tested with <code>!== 0</code>, and the interviewer will appreciate that you asked.</div>
<p><strong>Pattern to remember:</strong> "filter or compact an array in place" &rarr; reader index scans, writer index marks the next free slot.</p>`,
  task:`Write <code>moveZeroes(nums)</code> that moves every <code>0</code> to the end of <code>nums</code> <strong>in place</strong>, keeping the relative order of the non-zero elements. Modify the given array; the return value is ignored. Only the number <code>0</code> counts as zero. It must be linear: the large test uses 300,000 elements.`,
  starter:`function moveZeroes(nums) {
  // w = where the next non-zero value should be written
  // scan with r; copy non-zeros forward; fill the rest with 0
}
`,
  solution:`function moveZeroes(nums) {
  let w = 0;
  for (let r = 0; r < nums.length; r++) {
    if (nums[r] !== 0) nums[w++] = nums[r];
  }
  while (w < nums.length) nums[w++] = 0;
}`,
  tests:[
    { desc:`[0,1,0,3,12] becomes [1,3,12,0,0]`, check:`(function(){ var a = [0,1,0,3,12]; moveZeroes(a); return __eq(a, [1,3,12,0,0]); })()` },
    { desc:`no zeroes: array unchanged`, check:`(function(){ var a = [4,5,6]; moveZeroes(a); return __eq(a, [4,5,6]); })()` },
    { desc:`all zeroes: array unchanged`, check:`(function(){ var a = [0,0,0]; moveZeroes(a); return __eq(a, [0,0,0]); })()` },
    { desc:`empty array stays empty`, check:`(function(){ var a = []; moveZeroes(a); return __eq(a, []); })()` },
    { desc:`single [0] and single [7] unchanged`, check:`(function(){ var a = [0], b = [7]; moveZeroes(a); moveZeroes(b); return __eq(a, [0]) && __eq(b, [7]); })()` },
    { desc:`order of non-zeros is preserved, negatives kept: [-2,0,5,0,-1] becomes [-2,5,-1,0,0]`, check:`(function(){ var a = [-2,0,5,0,-1]; moveZeroes(a); return __eq(a, [-2,5,-1,0,0]); })()` },
    { desc:`trailing zeroes already in place: [1,2,0,0] unchanged`, check:`(function(){ var a = [1,2,0,0]; moveZeroes(a); return __eq(a, [1,2,0,0]); })()` },
    { desc:`modifies the SAME array object (in place), not a copy`, check:`(function(){ var a = [0,2,0,4]; var ref = a; moveZeroes(a); return a === ref && ref[0] === 2 && ref[1] === 4 && ref.length === 4; })()` },
    { desc:`300,000 elements, half of them zero, finishes in time and keeps order`, check:`(function(){ var a = [], i; for (i = 0; i < 300000; i++) a.push(i % 2 === 0 ? 0 : i); moveZeroes(a); for (i = 0; i < 150000; i++) if (a[i] !== 2 * i + 1) return false; for (i = 150000; i < 300000; i++) if (a[i] !== 0) return false; return a.length === 300000; })()` }
  ]
},

{ id:'m2-l6', module:1, file:'06-dedupe-sorted.js', type:'exercise', title:'Remove Duplicates from a Sorted Array, In Place',
  concept:`<p>When an array is <strong>sorted</strong>, equal values sit next to each other. That one fact changes a "have I seen this?" problem from needing a Set (O(n) extra space) into one that needs only neighbour comparisons (O(1) extra space). This is the standard sorted-array pattern, and it reuses the read/write pointer from the previous lesson.</p>
<p>The task: remove duplicates so each value appears once, <em>in place</em>, and return the new length <code>k</code>. The first <code>k</code> slots of the array must hold the unique values in order; whatever sits after index <code>k-1</code> does not matter. The reader <code>r</code> scans every element. The writer <code>w</code> points at the next slot to fill, and slot <code>w-1</code> always holds the last unique value written. A new element is a fresh value exactly when it differs from <code>nums[w-1]</code>; then it is written and <code>w</code> advances.</p>
<pre>nums = [1, 1, 2, 2, 2, 3]       first value 1 is kept: w=1
r=1 (1)  == nums[0]=1  -&gt; skip
r=2 (2)  != nums[0]    -&gt; nums[1]=2, w=2   [1,2,2,2,2,3]
r=3 (2)  == nums[1]=2  -&gt; skip
r=4 (2)  == nums[1]    -&gt; skip
r=5 (3)  != nums[1]    -&gt; nums[2]=3, w=3   [1,2,3,2,2,3]
return 3                                   first 3 = [1,2,3]
function removeDuplicates(nums) {
  if (nums.length === 0) return 0;
  let w = 1;
  for (let r = 1; r &lt; nums.length; r++) {
    if (nums[r] !== nums[w - 1]) nums[w++] = nums[r];
  }
  return w;
}</pre>
<p><strong>Complexity:</strong> O(n) time (one pass), O(1) extra space. Calling <code>splice</code> on each duplicate would be O(n&sup2;) because every splice shifts the tail left.</p>
<div class="callout"><b>Interview trap:</b> the empty array. <code>nums[0]</code> does not exist, so a solution that starts <code>w = 1</code> must guard <code>length === 0</code> and return 0. And compare with <code>nums[w - 1]</code> (the last <em>kept</em> value), not <code>nums[r - 1]</code> &mdash; after overwriting, the neighbour has changed. Also confirm the array really is sorted; if it is not, adjacent comparison silently gives wrong answers and you need a Set.</div>
<p><strong>Pattern to remember:</strong> sorted input plus "unique / dedupe / count distinct" &rarr; compare with the last kept element, no extra memory.</p>`,
  task:`Write <code>removeDuplicates(nums)</code> for a <strong>sorted</strong> (non-decreasing) array of numbers. Modify <code>nums</code> in place so its first <code>k</code> elements are the distinct values in their original order, and return <code>k</code>. The contents after index <code>k-1</code> are not checked. The large test has 600,000 elements.`,
  starter:`function removeDuplicates(nums) {
  // w = next write position; nums[w-1] is the last kept value
  // return how many unique values remain at the front
  return -1;
}
`,
  solution:`function removeDuplicates(nums) {
  if (nums.length === 0) return 0;
  let w = 1;
  for (let r = 1; r < nums.length; r++) {
    if (nums[r] !== nums[w - 1]) nums[w++] = nums[r];
  }
  return w;
}`,
  tests:[
    { desc:`[1,1,2] returns 2 and starts with [1,2]`, check:`(function(){ var a = [1,1,2]; var k = removeDuplicates(a); return k === 2 && __eq(a.slice(0,k), [1,2]); })()` },
    { desc:`[0,0,1,1,1,2,2,3,3,4] returns 5 with prefix [0,1,2,3,4]`, check:`(function(){ var a = [0,0,1,1,1,2,2,3,3,4]; var k = removeDuplicates(a); return k === 5 && __eq(a.slice(0,k), [0,1,2,3,4]); })()` },
    { desc:`empty array returns 0`, check:`(function(){ var a = []; return removeDuplicates(a) === 0; })()` },
    { desc:`single element returns 1`, check:`(function(){ var a = [9]; return removeDuplicates(a) === 1 && a[0] === 9; })()` },
    { desc:`all equal [5,5,5,5] returns 1 with prefix [5]`, check:`(function(){ var a = [5,5,5,5]; var k = removeDuplicates(a); return k === 1 && a[0] === 5; })()` },
    { desc:`already unique [1,2,3] returns 3 and is unchanged`, check:`(function(){ var a = [1,2,3]; var k = removeDuplicates(a); return k === 3 && __eq(a.slice(0,k), [1,2,3]); })()` },
    { desc:`negatives: [-3,-3,-1,0,0] returns 3 with prefix [-3,-1,0]`, check:`(function(){ var a = [-3,-3,-1,0,0]; var k = removeDuplicates(a); return k === 3 && __eq(a.slice(0,k), [-3,-1,0]); })()` },
    { desc:`works on the same array object (in place)`, check:`(function(){ var a = [1,1,1,2,2,3]; var ref = a; var k = removeDuplicates(a); return k === 3 && ref[0] === 1 && ref[1] === 2 && ref[2] === 3; })()` },
    { desc:`600,000 elements (each value repeated 3 times): returns 200,000 distinct values`, check:`(function(){ var a = [], i; for (i = 0; i < 600000; i++) a.push(Math.floor(i / 3) * 2); var k = removeDuplicates(a); if (k !== 200000) return false; for (i = 0; i < k; i += 999) if (a[i] !== i * 2) return false; return a[k - 1] === 399998; })()` }
  ]
