{ id:'m3-l11', module:2, file:'11-lru-cache.js', type:'exercise', title:'Interview Classic: Design an LRU Cache',
  concept:`<p>A cache stores the results of slow work (a database read, a rendered thumbnail, an API call) so repeat requests are instant. But memory is limited, so when the cache is full something must be evicted. <strong>LRU</strong> (least recently used) evicts the entry that has gone unused the longest, on the theory that what you used recently you will probably use again. It is one of the most asked design questions, because it forces you to combine data structures under a strict requirement: <code>get</code> and <code>put</code> must both be <strong>O(1)</strong>.</p>
<p>Reason about what each operation needs. Finding a key quickly means a hash map. Knowing which key is oldest, and moving a key to "newest" whenever it is touched, needs an ordered list. The textbook answer is a hash map pointing into a <em>doubly linked list</em> (O(1) unlink and append given a node). In JavaScript you can get the same behaviour from a single <code>Map</code>, because a Map remembers insertion order: the <strong>first</strong> key in iteration order is the oldest, and re-inserting a key (delete then set) moves it to the end, making it the newest.</p>
<pre>capacity 2        Map (oldest -&gt; newest)
put(1,"a")        [1]
put(2,"b")        [1, 2]
get(1)  -&gt; "a"    delete+set 1 -&gt; [2, 1]
put(3,"c")        size 3 &gt; 2 -&gt; evict 2 -&gt; [1, 3]
get(2)  -&gt; -1     (it was evicted)
get(key):
  if missing return -1
  v = map.get(key); map.delete(key); map.set(key, v); return v
put(key, v):
  if present, delete it first (refresh position)
  map.set(key, v)
  if map.size &gt; capacity: delete map.keys().next().value</pre>
<p><strong>Complexity:</strong> Map operations are O(1) average, and <code>map.keys().next()</code> returns the first key in O(1), so both <code>get</code> and <code>put</code> are O(1). Space is O(capacity).</p>
<div class="callout"><b>Interview trap:</b> three details are graded. (1) A <code>get</code> counts as a use &mdash; it must refresh recency, not just read. (2) <code>put</code> on an <em>existing</em> key updates the value and refreshes it, and must not trigger an eviction. (3) A stored value of <code>0</code> or empty string is falsy: write <code>if (!map.has(key))</code>, not <code>if (!map.get(key))</code>. If asked to avoid relying on Map ordering, explain the hash map + doubly linked list design.</div>
<p><strong>Pattern to remember:</strong> "fast lookup <em>and</em> fast order maintenance" &rarr; hash map plus an ordered structure (here, the Map's own insertion order).</p>`,
  task:`Complete <code>class LRUCache</code>. <code>new LRUCache(capacity)</code> (capacity &gt;= 1). <code>get(key)</code> returns the stored value, or <code>-1</code> if the key is absent; a successful get makes that key the most recently used. <code>put(key, value)</code> inserts or updates the key and makes it the most recently used; if the number of keys then exceeds the capacity, evict the least recently used key. Both operations must be O(1): the large test performs 50,000 puts and 100,000 gets with capacity 1,000.`,
  starter:`class LRUCache {
  constructor(capacity) {
    this.capacity = capacity;
    this.map = new Map(); // insertion order = recency order
  }
  get(key) {
    // missing -> -1; present -> move to newest, return value
    return -1;
  }
  put(key, value) {
    // refresh/insert as newest; evict the oldest if over capacity
  }
}
`,
  solution:`class LRUCache {
  constructor(capacity) {
    this.capacity = capacity;
    this.map = new Map();
  }
  get(key) {
    if (!this.map.has(key)) return -1;
    const v = this.map.get(key);
    this.map.delete(key);
    this.map.set(key, v);
    return v;
  }
  put(key, value) {
    if (this.map.has(key)) this.map.delete(key);
    this.map.set(key, value);
    if (this.map.size > this.capacity) {
      this.map.delete(this.map.keys().next().value);
    }
  }
}`,
  tests:[
    { desc:`standard sequence (cap 2): put 1,2; get 1; put 3 evicts key 2; get 2 is -1; put 4 evicts 1; get 3 and 4 work`, check:`(function(){ var c = new LRUCache(2); c.put(1,1); c.put(2,2); if (c.get(1) !== 1) return false; c.put(3,3); if (c.get(2) !== -1) return false; c.put(4,4); return c.get(1) === -1 && c.get(3) === 3 && c.get(4) === 4; })()` },
    { desc:`get on an empty cache returns -1`, check:`new LRUCache(3).get('x') === -1` },
    { desc:`put on an existing key updates the value and does not evict: cap 2, put 1,2, put(1,10), get(2) still works`, check:`(function(){ var c = new LRUCache(2); c.put(1,1); c.put(2,2); c.put(1,10); return c.get(1) === 10 && c.get(2) === 2; })()` },
    { desc:`updating a key refreshes it: cap 2, put 1,2, put(1,10), put 3 evicts key 2 (not 1)`, check:`(function(){ var c = new LRUCache(2); c.put(1,1); c.put(2,2); c.put(1,10); c.put(3,3); return c.get(2) === -1 && c.get(1) === 10 && c.get(3) === 3; })()` },
    { desc:`a get counts as a use: cap 2, put a,b, get a, put c evicts b`, check:`(function(){ var c = new LRUCache(2); c.put('a',1); c.put('b',2); c.get('a'); c.put('c',3); return c.get('b') === -1 && c.get('a') === 1 && c.get('c') === 3; })()` },
    { desc:`capacity 1 keeps only the latest key`, check:`(function(){ var c = new LRUCache(1); c.put(1,1); c.put(2,2); return c.get(1) === -1 && c.get(2) === 2; })()` },
    { desc:`a stored value of 0 is returned as 0, not -1`, check:`(function(){ var c = new LRUCache(2); c.put('z', 0); return c.get('z') === 0; })()` },
    { desc:`a missed get does not change recency: cap 2, put 1,2, get(99), put 3 evicts key 1`, check:`(function(){ var c = new LRUCache(2); c.put(1,1); c.put(2,2); c.get(99); c.put(3,3); return c.get(1) === -1 && c.get(2) === 2 && c.get(3) === 3; })()` },
    { desc:`50,000 puts with capacity 1,000: only the newest 1,000 keys remain, then 100,000 gets all hit`, check:`(function(){ var c = new LRUCache(1000), i; for (i = 0; i < 50000; i++) c.put(i, i * 2); if (c.get(48999) !== -1 || c.get(49000) !== 98000 || c.get(49999) !== 99998) return false; for (i = 0; i < 100000; i++) { if (c.get(49000 + (i % 1000)) !== (49000 + (i % 1000)) * 2) return false; } return true; })()` }
  ]
}

);

{ id:'m4-l1', module:3, file:'01-pair-sum-sorted.js', type:'exercise', title:'Two Pointers: Pair Sum in a Sorted Array',
  concept:`<p>You already know the hash-map answer to "find two numbers that add up to a target": O(n) time, O(n) memory. But when the array is <strong>already sorted</strong>, you can throw the map away and use <em>two pointers</em> instead, with O(1) extra memory. Sortedness is information, and interviewers hand it to you on purpose: when a problem says "sorted", ask yourself what you can do with that order.</p>
<p>The idea: put one pointer <code>left</code> at the smallest value and one pointer <code>right</code> at the largest. Add them up. If the sum is <strong>too small</strong>, the only way to grow it is to move <code>left</code> right (to a bigger number). If it is <strong>too big</strong>, the only way to shrink it is to move <code>right</code> left. If it equals the target, you are done. Each step discards one element that can <em>never</em> be part of an answer, so after at most n steps the pointers meet.</p>
<pre>// nums = [1, 3, 4, 6, 8, 11], target = 10
// L=0 R=5  1+11=12 &gt; 10  -&gt; R-- (11 is too big for anyone)
// L=0 R=4  1+8 = 9  &lt; 10  -&gt; L++ (1 is too small)
// L=1 R=4  3+8 = 11 &gt; 10  -&gt; R--
// L=1 R=3  3+6 = 9  &lt; 10  -&gt; L++
// L=2 R=3  4+6 = 10 FOUND [2, 3]

let left = 0, right = nums.length - 1;
while (left &lt; right) {
  const sum = nums[left] + nums[right];
  if (sum === target) return [left, right];
  if (sum &lt; target) left++; else right--;
}
return null;</pre>
<p>Why is it safe to discard? Suppose <code>sum &gt; target</code>. The value at <code>right</code> paired with <em>any</em> remaining left partner is at least <code>nums[left]</code> + <code>nums[right]</code>, which is already too big, so <code>nums[right]</code> cannot be in any answer. The symmetric argument holds for <code>left</code>.</p>
<p><strong>Complexity:</strong> time O(n), because every iteration moves a pointer inward and they can only travel n steps in total. Space O(1). The brute force is O(n&sup2;): for 200,000 numbers that is twenty billion pair checks.</p>
<div class="callout"><b>Interview trap:</b> the loop condition is <code>left &lt; right</code>, not <code>&lt;=</code>; with <code>&lt;=</code> a single element gets paired with itself. And do not sort an unsorted array just to use this &mdash; sorting costs O(n log n) and destroys the original indices, so for an unsorted "return the indices" problem the hash map is the right tool. Always ask: "is the input sorted?"</div>
<p><strong>Pattern to remember:</strong> when you see a <em>sorted</em> array and a condition on a pair, think <em>one pointer at each end, move the one that fixes the sum</em>.</p>`,
  task:`Write <code>pairSumSorted(nums, target)</code>. <code>nums</code> is sorted in ascending order (duplicates and negatives allowed). Return <code>[i, j]</code> with <code>i &lt; j</code> such that <code>nums[i] + nums[j] === target</code>, or <code>null</code> if there is no such pair. If several pairs work, <strong>any</strong> valid pair is accepted. Use O(1) extra space; the last tests use 200,000 numbers.`,
  starter:`function pairSumSorted(nums, target) {
  // left starts at the smallest, right at the largest
  // sum too small -> move left; too big -> move right

}
`,
  solution:`function pairSumSorted(nums, target) {
  let left = 0, right = nums.length - 1;
  while (left < right) {
    const sum = nums[left] + nums[right];
    if (sum === target) return [left, right];
    if (sum < target) left++; else right--;
  }
  return null;
}`,
  tests:[
    { desc:'pairSumSorted([1,3,4,6,8,11], 10) returns a valid index pair (4+6)', check:`(function(){ ${OKPAIR} var a=[1,3,4,6,8,11]; return ok(a,10,pairSumSorted(a,10)); })()` },
    { desc:'two elements: pairSumSorted([2,5], 7) returns [0,1]', check:`__eq(pairSumSorted([2,5],7),[0,1])` },
    { desc:'duplicates: pairSumSorted([2,2,2,2], 4) returns indices of two different elements', check:`(function(){ ${OKPAIR} var a=[2,2,2,2]; return ok(a,4,pairSumSorted(a,4)); })()` },
    { desc:'negatives and zero: pairSumSorted([-7,-3,0,2,9], -1) is the pair -3 + 2', check:`(function(){ ${OKPAIR} var a=[-7,-3,0,2,9]; return ok(a,-1,pairSumSorted(a,-1)); })()` },
    { desc:'no pair: pairSumSorted([1,2,4,8], 100) returns null', check:`pairSumSorted([1,2,4,8],100) === null` },
    { desc:'a single element is not paired with itself: pairSumSorted([5], 10) returns null', check:`pairSumSorted([5],10) === null` },
    { desc:'empty array returns null', check:`pairSumSorted([],0) === null` },
    { desc:'does not mutate the input array', check:`(function(){ var a=[1,3,4,6,8,11], c=JSON.stringify(a); pairSumSorted(a,10); return JSON.stringify(a)===c; })()` },
    { desc:'large input (200,000 evens): finds a valid pair for target 399998', check:`(function(){ ${OKPAIR} var a=[]; for(var i=0;i<200000;i++) a.push(i*2); return ok(a,399998,pairSumSorted(a,399998)); })()` },
    { desc:'large input, odd target on all-even numbers: must return null quickly (O(n), not O(n^2))', check:`(function(){ var a=[]; for(var i=0;i<200000;i++) a.push(i*2); return pairSumSorted(a,300001)===null; })()` }
  ]
},

{ id:'m4-l2', module:3, file:'02-remove-duplicates-in-place.js', type:'exercise', title:'Read and Write Pointers: Remove Duplicates In Place',
  concept:`<p>A second flavour of two pointers: both start at the <em>left</em> and travel the same direction at different jobs. One pointer <strong>reads</strong> every element; the other marks where the next <strong>kept</strong> element should be written. It is how you filter an array <em>in place</em> without allocating a second one &mdash; the technique behind compacting buffers, de-duplicating sorted log lines, and "move zeroes to the end".</p>
<p>The naive way to delete duplicates from a sorted array is <code>splice</code> each repeat. Every <code>splice</code> shifts everything after it, so removing k duplicates from n elements costs O(n&times;k) &mdash; around 10<sup>10</sup> moves for 200,000 elements with many repeats. The read/write approach touches each element exactly once.</p>
<pre>// nums = [0, 0, 1, 1, 1, 2, 3, 3]
// write = 1 (nums[0] is always kept)
// read=1  0 == nums[write-1]=0  skip
// read=2  1 != 0  -&gt; nums[1]=1, write=2
// read=3  1 == 1  skip      read=4  1 == 1  skip
// read=5  2 != 1  -&gt; nums[2]=2, write=3
// read=6  3 != 2  -&gt; nums[3]=3, write=4
// read=7  3 == 3  skip
// result: first 4 slots are [0,1,2,3], return 4

let write = 1;
for (let read = 1; read &lt; nums.length; read++) {
  if (nums[read] !== nums[write - 1]) {
    nums[write] = nums[read];
    write++;
  }
}
return write;</pre>
<p>Because the array is sorted, equal values are neighbours, so comparing with the <em>last kept</em> value (<code>nums[write-1]</code>) is enough. The invariant to hold in your head: <strong>everything before <code>write</code> is the cleaned answer so far; everything from <code>read</code> onward is unprocessed</strong>. Slots between them are garbage you are allowed to overwrite.</p>
<p><strong>Complexity:</strong> time O(n), space O(1) &mdash; you mutate the array you were given, which is why this style is called "in place".</p>
<div class="callout"><b>Interview trap:</b> an empty array. If you start with <code>write = 1</code> and return it, you report one element for an empty input. Guard <code>if (nums.length === 0) return 0</code>. Also, confirm what the interviewer expects: here you return the new length <em>and</em> leave the first <code>k</code> slots correct; nobody cares what is beyond <code>k</code>.</div>
<p><strong>Pattern to remember:</strong> "modify the array in place / remove without extra space" means <em>a fast reader and a slow writer</em>.</p>`,
  task:`Write <code>removeDuplicates(nums)</code> for a <strong>sorted</strong> array. Modify <code>nums</code> in place so its first <code>k</code> elements are the distinct values in their original order, and <strong>return k</strong>. What sits after index <code>k-1</code> does not matter. Do not create a second array of the data; the last test has 200,000 elements and heavy repetition (so repeated <code>splice</code> will time out).`,
  starter:`function removeDuplicates(nums) {
  // read pointer scans everything; write pointer marks the next free slot
  // compare nums[read] with the last kept value, nums[write - 1]

}
`,
  solution:`function removeDuplicates(nums) {
  if (nums.length === 0) return 0;
  let write = 1;
  for (let read = 1; read < nums.length; read++) {
    if (nums[read] !== nums[write - 1]) {
      nums[write] = nums[read];
      write++;
    }
  }
  return write;
}`,
  tests:[
    { desc:'[0,0,1,1,1,2,3,3] returns 4 and the first 4 slots are [0,1,2,3]', check:`(function(){ var a=[0,0,1,1,1,2,3,3]; var k=removeDuplicates(a); return k===4 && __eq(a.slice(0,k),[0,1,2,3]); })()` },
    { desc:'empty array returns 0', check:`removeDuplicates([])===0` },
    { desc:'single element [7] returns 1', check:`(function(){ var a=[7]; var k=removeDuplicates(a); return k===1 && a[0]===7; })()` },
    { desc:'all equal [4,4,4,4,4] returns 1 and a[0] is 4', check:`(function(){ var a=[4,4,4,4,4]; var k=removeDuplicates(a); return k===1 && a[0]===4; })()` },
    { desc:'already unique [1,2,3] returns 3 and is unchanged', check:`(function(){ var a=[1,2,3]; var k=removeDuplicates(a); return k===3 && __eq(a,[1,2,3]); })()` },
    { desc:'negatives: [-3,-3,-1,0,0,0,5] gives [-3,-1,0,5]', check:`(function(){ var a=[-3,-3,-1,0,0,0,5]; var k=removeDuplicates(a); return k===4 && __eq(a.slice(0,k),[-3,-1,0,5]); })()` },
    { desc:'it edits the SAME array (in place), not a copy it returns', check:`(function(){ var a=[1,1,2]; var ref=a; removeDuplicates(a); return a===ref && a[0]===1 && a[1]===2; })()` },
    { desc:'large input (200,000 elements, each value repeated 4x) returns 50000 distinct values in order', check:`(function(){ var a=[]; for(var i=0;i<200000;i++) a.push(Math.floor(i/4)); var k=removeDuplicates(a); if(k!==50000) return false; for(var j=0;j<k;j+=997) if(a[j]!==j) return false; return a[k-1]===49999; })()` }
  ]
},

{ id:'m4-l3', module:3, file:'03-valid-palindrome.js', type:'exercise', title:'Valid Palindrome: Converging Pointers with Filtering',
  concept:`<p>A palindrome reads the same forwards and backwards. The "obvious" solution &mdash; build a cleaned, reversed copy and compare &mdash; works, but allocates O(n) extra memory and walks the string several times. The two-pointer solution inspects each character once and uses O(1) space, and it generalises to every "compare from both ends" problem: checking a mirrored layout, almost-palindromes, comparing a string with its reverse alphabetically.</p>
<p>Put <code>left</code> at the start and <code>right</code> at the end. If the characters at both pointers match, step both inward; if they differ, the string is not a palindrome. The twist in the interview version: <strong>ignore everything that is not a letter or digit, and ignore case</strong>. "A man, a plan, a canal: Panama" is a palindrome. Rather than building a filtered copy, <em>skip</em> junk characters with inner loops, advancing a pointer past them.</p>
<pre>// s = "a,b!A"   (cleaned: "abA" -&gt; case-insensitive "aba")
// L=0 'a'  R=4 'A'   match (case-insensitive)  -&gt; L=1 R=3
// L=1 ','  skip junk -&gt; L=2   R=3 '!' skip junk -&gt; R=2
// L=2 R=2  pointers met -&gt; palindrome

function isAlnum(ch) {
  return /[a-z0-9]/i.test(ch);
}
let left = 0, right = s.length - 1;
while (left &lt; right) {
  while (left &lt; right &amp;&amp; !isAlnum(s[left])) left++;
  while (left &lt; right &amp;&amp; !isAlnum(s[right])) right--;
  const a = s[left].toLowerCase();
  const b = s[right].toLowerCase();
  if (a !== b) return false;
  left++; right--;
}
return true;</pre>
<p><strong>Complexity:</strong> time O(n) &mdash; each pointer only moves inward, and the skip loops are part of that same movement, not extra passes. Space O(1) (the helper regex test allocates nothing that grows with n).</p>
<div class="callout"><b>Interview trap:</b> the inner skip loops must also check <code>left &lt; right</code>. For an input like <code>".,"</code> with no alphanumerics at all, an unguarded loop runs <code>left</code> past <code>right</code> and past the end of the string, then reads <code>undefined.toLowerCase()</code>. An all-junk or empty string should return <code>true</code> (an empty cleaned string reads the same both ways) &mdash; state that assumption to the interviewer.</div>
<p><strong>Pattern to remember:</strong> "check from both ends toward the middle" is two converging pointers; "ignore some characters" means <em>skip loops with the same bounds check</em>.</p>`,
  task:`Write <code>isPalindrome(s)</code> returning <code>true</code> if, after ignoring every character that is not a letter (a-z, A-Z) or digit (0-9) and ignoring letter case, the string reads the same forwards and backwards. An empty string, or a string with no letters/digits, counts as a palindrome. Aim for O(1) extra space; one test uses a 300,000-character string.`,
  starter:`function isPalindrome(s) {
  // left from the start, right from the end
  // skip non letters/digits on both sides (keep left < right!)
  // compare lowercase versions

}
`,
  solution:`function isPalindrome(s) {
  const isAlnum = ch => /[a-z0-9]/i.test(ch);
  let left = 0, right = s.length - 1;
  while (left < right) {
    while (left < right && !isAlnum(s[left])) left++;
    while (left < right && !isAlnum(s[right])) right--;
    const a = s[left].toLowerCase();
  const b = s[right].toLowerCase();
  if (a !== b) return false;
    left++; right--;
  }
  return true;
}`,
  tests:[
    { desc:'"A man, a plan, a canal: Panama" is a palindrome', check:`isPalindrome("A man, a plan, a canal: Panama")===true` },
    { desc:'"race a car" is not a palindrome', check:`isPalindrome("race a car")===false` },
    { desc:'empty string is a palindrome', check:`isPalindrome("")===true` },
    { desc:'only punctuation ".,!?" is a palindrome (nothing left after filtering)', check:`isPalindrome(".,!? ")===true` },
    { desc:'digits count: "0P" is NOT a palindrome (0 vs p)', check:`isPalindrome("0P")===false` },
    { desc:'case is ignored: "Aa" is a palindrome', check:`isPalindrome("Aa")===true` },
    { desc:'single char "x" and "  x " are palindromes', check:`isPalindrome("x")===true && isPalindrome("  x ")===true` },
    { desc:'junk in the middle only: "ab@@@ba" true, "ab@@@bb" false', check:`isPalindrome("ab@@@ba")===true && isPalindrome("ab@@@bb")===false` },
    { desc:'large input: 300,000-char palindrome with punctuation is true; one flipped middle letter makes it false', check:`(function(){ var half=''; for(var i=0;i<100000;i++) half+= String.fromCharCode(97+(i%26)) + ','; var rev=half.split('').reverse().join(''); var good=half+'x'+rev; var bad=half+'xy'+rev; return isPalindrome(good)===true && isPalindrome(bad)===false; })()` }
  ]
},

{ id:'m4-l4', module:3, file:'04-container-most-water.js', type:'exercise', title:'Container With Most Water: Why Moving the Shorter Side Is Safe',
  concept:`<p>You are given bar heights standing on a line. Choose two bars; together with the x-axis they form a container whose area is <code>min(height[i], height[j]) * (j - i)</code> &mdash; the shorter wall decides how high the water can go, the distance decides the width. Find the maximum area. Brute force tries all pairs: O(n&sup2;), about five billion pairs for 100,000 bars.</p>
<p>Start with the <em>widest</em> container: pointers at both ends. Now the width can only shrink as pointers move in, so the only way to beat the current area is to find a <strong>taller limiting wall</strong>. The limiting wall is the shorter one. Moving the <em>taller</em> pointer inward can never help: the width shrinks and the height is still capped by the same short wall. Moving the <strong>shorter</strong> pointer is the only move that has any chance of a better area. That argument &mdash; "this move cannot possibly improve things, so discard it" &mdash; is what makes the greedy pointer movement correct, and it is exactly what an interviewer wants you to say out loud.</p>
<pre>// h = [1, 8, 6, 2, 5, 4, 8, 3, 7]
// L=0 R=8  min(1,7)*8 = 8    best=8   h[L] shorter -&gt; L++
// L=1 R=8  min(8,7)*7 = 49   best=49  h[R] shorter -&gt; R--
// L=1 R=7  min(8,3)*6 = 18            R--
// L=1 R=6  min(8,8)*5 = 40            tie: move either
// ... best stays 49

let best = 0, left = 0, right = h.length - 1;
while (left &lt; right) {
  const area = Math.min(h[left], h[right]) * (right - left);
  best = Math.max(best, area);
  if (h[left] &lt; h[right]) left++; else right--;
}
return best;</pre>
<p><strong>Complexity:</strong> time O(n) &mdash; n&minus;1 pointer moves total. Space O(1).</p>
<div class="callout"><b>Interview trap:</b> do not move the pointer at the <em>larger</em> wall "to look for something taller": it feels natural and passes simple examples, but fails the proof above (it throws away a wall that might still limit a better pair) and gives wrong answers on tricky inputs. Also remember that with fewer than 2 bars the area is 0. When heights tie, moving either pointer is fine.</div>
<p><strong>Pattern to remember:</strong> maximise a function of two endpoints where width shrinks as you converge &mdash; <em>start wide, and always give up the weaker endpoint</em>.</p>`,
  task:`Write <code>maxArea(heights)</code>, taking an array of non-negative integers, and return the largest value of <code>min(heights[i], heights[j]) * (j - i)</code> over all pairs <code>i &lt; j</code>. Return <code>0</code> if there are fewer than two bars. It must be O(n): one test has 100,000 bars.`,
  starter:`function maxArea(heights) {
  // start with the widest container (both ends)
  // area = min(h[left], h[right]) * (right - left)
  // move the pointer at the SHORTER wall

}
`,
  solution:`function maxArea(heights) {
  let best = 0, left = 0, right = heights.length - 1;
  while (left < right) {
    const area = Math.min(heights[left], heights[right]) * (right - left);
    if (area > best) best = area;
    if (heights[left] < heights[right]) left++; else right--;
  }
  return best;
}`,
  tests:[
    { desc:'[1,8,6,2,5,4,8,3,7] returns 49', check:`maxArea([1,8,6,2,5,4,8,3,7])===49` },
    { desc:'[1,1] returns 1', check:`maxArea([1,1])===1` },
    { desc:'[2,3,10,5,7,8,9] returns 36 (bars 10 and 9, distance 4)', check:`maxArea([2,3,10,5,7,8,9])===36` },
    { desc:'fewer than two bars: [] and [5] return 0', check:`maxArea([])===0 && maxArea([5])===0` },
    { desc:'zeros: [0,0,0] returns 0; [0,5,0,5] returns 10', check:`maxArea([0,0,0])===0 && maxArea([0,5,0,5])===10` },
    { desc:'tall bars at the far ends win: [9,1,1,1,9] returns 36', check:`maxArea([9,1,1,1,9])===36` },
    { desc:'strictly decreasing [5,4,3,2,1] returns 6 (e.g. bars 5 and 3 at distance 2)', check:`maxArea([5,4,3,2,1])===6` },
    { desc:'does not mutate the input', check:`(function(){ var a=[1,8,6,2,5,4,8,3,7], c=JSON.stringify(a); maxArea(a); return JSON.stringify(a)===c; })()` },
    { desc:'large input: 100,000 equal bars of height 7 returns 7*99999', check:`(function(){ var a=[]; for(var i=0;i<100000;i++) a.push(7); return maxArea(a)===7*99999; })()` },
    { desc:'large input: heights 1..100000 ascending returns 2500000000 (needs O(n))', check:`(function(){ var a=[]; for(var i=1;i<=100000;i++) a.push(i); return maxArea(a)===2500000000; })()` }
  ]
},

{ id:'m4-l5', module:3, file:'05-three-sum.js', type:'exercise', title:'3Sum: Sort, Fix One, Two-Pointer the Rest (and Skip Duplicates)',
  concept:`<p>"Find all unique triplets in the array that sum to zero." It is a step up from pair-sum, and a staple of interviews because it tests three skills at once: reducing a new problem to one you know, controlling duplicates, and keeping the complexity honest. Brute force tries all triples: O(n&sup3;) &mdash; 3,000 numbers means about 4.5 billion triples. We can do O(n&sup2;).</p>
<p>The reduction: <strong>sort the array</strong>, then fix the first number <code>a = nums[i]</code>. You now need two numbers to the right of <code>i</code> that add up to <code>-a</code> &mdash; that is exactly the sorted pair-sum from lesson 1, run on the subarray <code>i+1 .. n-1</code>. Sorting costs O(n log n); the n pair-sum scans cost O(n) each, giving O(n&sup2;) total.</p>
<p>Duplicates are the hard part. If the array is <code>[-1, -1, 0, 1, 2]</code> there is one triplet <code>[-1, 0, 1]</code>, not two. The rule: <strong>after sorting, never use the same value twice in the same role</strong>. Skip an <code>i</code> whose value equals <code>nums[i-1]</code>; and after recording a triplet, advance <code>left</code> and <code>right</code> past any repeats of their values.</p>
<pre>// sorted: [-2, -2, 0, 0, 2, 2]
// need nums[l] + nums[r] = -nums[i]
// i=0 (-2): l=1 r=5: -2+2=0  &lt; 2 -&gt; l++
//           l=2 r=5:  0+2=2  hit -&gt; record [-2,0,2]
//           skip repeated 0 (l) and 2 (r): pointers cross
// i=1 (-2): equals nums[0] -&gt; SKIP (would repeat [-2,0,2])
// i=2 ( 0): 0+0+2 &gt; 0 -&gt; r--, ... no more triples

nums.sort((x, y) =&gt; x - y);
for (let i = 0; i &lt; nums.length - 2; i++) {
  if (i &gt; 0 &amp;&amp; nums[i] === nums[i - 1]) continue;
  let l = i + 1, r = nums.length - 1;
  while (l &lt; r) {
    const s = nums[i] + nums[l] + nums[r];
    if (s &lt; 0) l++; else if (s &gt; 0) r--;
    else {
      out.push([nums[i], nums[l], nums[r]]);
      l++; r--;
      while (l &lt; r &amp;&amp; nums[l] === nums[l - 1]) l++;
      while (l &lt; r &amp;&amp; nums[r] === nums[r + 1]) r--;
    }
  }
}</pre>
<p><strong>Complexity:</strong> time O(n&sup2;) (sort is dominated), space O(1) beyond the output and the sort. The default <code>Array.prototype.sort()</code> compares as <em>strings</em> &mdash; always pass <code>(a, b) =&gt; a - b</code> for numbers.</p>
<div class="callout"><b>Interview trap:</b> deduplicating with a Set of JSON strings "works" but is the answer interviewers hope you will not give &mdash; it hides the real lesson and uses extra memory. The skip-the-repeat logic is the expected solution. Also copy the array before sorting if the caller should not see it reordered.</div>
<p><strong>Pattern to remember:</strong> k-sum on an array: <em>sort, fix k&minus;2 numbers with loops, finish with two pointers</em>, and skip equal neighbours at every level.</p>`,
  task:`Write <code>threeSum(nums)</code> returning every <strong>unique</strong> triplet <code>[a, b, c]</code> of values taken from different positions that sum to 0. Each triplet must be in ascending order (<code>a &lt;= b &lt;= c</code>); the order of triplets in the result does not matter; no two triplets may be identical. Do not mutate the input array. Input up to 3,000 elements.`,
  starter:`function threeSum(nums) {
  // 1. copy + sort numerically: [...nums].sort((a, b) => a - b)
  // 2. fix nums[i] (skip repeats), two pointers on the rest
  // 3. after a hit, move both pointers and skip duplicate values
  const out = [];

  return out;
}
`,
  solution:`function threeSum(nums) {
  const a = [...nums].sort((x, y) => x - y);
  const out = [];
  for (let i = 0; i < a.length - 2; i++) {
    if (i > 0 && a[i] === a[i - 1]) continue;
    let l = i + 1, r = a.length - 1;
    while (l < r) {
      const s = a[i] + a[l] + a[r];
      if (s < 0) l++;
      else if (s > 0) r--;
      else {
        out.push([a[i], a[l], a[r]]);
        l++; r--;
        while (l < r && a[l] === a[l - 1]) l++;
        while (l < r && a[r] === a[r + 1]) r--;
      }
    }
  }
  return out;
}`,
  tests:[
    { desc:'[-1,0,1,2,-1,-4] gives {[-1,-1,2],[-1,0,1]} (any order of triplets)', check:`(function(){ var r=threeSum([-1,0,1,2,-1,-4]).map(function(t){return JSON.stringify(t);}).sort(); return __eq(r,[JSON.stringify([-1,-1,2]),JSON.stringify([-1,0,1])].sort()); })()` },
    { desc:'[0,0,0,0] gives exactly one triplet [0,0,0]', check:`__eq(threeSum([0,0,0,0]),[[0,0,0]])` },
    { desc:'fewer than 3 numbers or no solution gives []', check:`__eq(threeSum([]),[]) && __eq(threeSum([0,0]),[]) && __eq(threeSum([1,2,3]),[])` },
    { desc:'duplicates must not repeat triplets: [-2,0,0,2,2] gives [[-2,0,2]]', check:`__eq(threeSum([-2,0,0,2,2]),[[-2,0,2]])` },
    { desc:'every triplet is ascending, sums to 0, and is unique (mixed input)', check:`(function(){ var r=threeSum([3,-2,1,0,-1,2,-3,0,1,-1,2]); var seen={}; for(var i=0;i<r.length;i++){ var t=r[i]; if(t.length!==3||t[0]>t[1]||t[1]>t[2]||t[0]+t[1]+t[2]!==0) return false; var k=t.join(','); if(seen[k]) return false; seen[k]=1; } return r.length>=5; })()` },
    { desc:'does not mutate (reorder) the input array', check:`(function(){ var a=[3,-1,-2,0,2,1], c=JSON.stringify(a); threeSum(a); return JSON.stringify(a)===c; })()` },
    { desc:'the input may contain only positives or only negatives: returns []', check:`__eq(threeSum([4,5,6,7]),[]) && __eq(threeSum([-4,-5,-6]),[])` },
    { desc:'large input: 3,000 zeros gives exactly [[0,0,0]] (duplicate skipping must be efficient)', check:`(function(){ var a=[]; for(var i=0;i<3000;i++) a.push(0); return __eq(threeSum(a),[[0,0,0]]); })()` },
    { desc:'large input: -1500..1500 (all distinct) has exactly 1,125,000 triplets, each valid; needs O(n^2)', check:`(function(){ var a=[]; for(var i=-1500;i<=1500;i++) a.push(i); var r=threeSum(a); if(r.length!==1125000) return false; for(var j=0;j<r.length;j+=5000){ var t=r[j]; if(t[0]>=t[1]||t[1]>=t[2]||t[0]+t[1]+t[2]!==0) return false; } return true; })()` }
  ]
},

{ id:'m4-l6', module:3, file:'06-cycle-in-sequence.js', type:'exercise', title:'Fast and Slow Pointers: Detecting a Cycle in a Sequence',
  concept:`<p>Imagine a "next-step" array: <code>next[i]</code> tells you which index to jump to from position <code>i</code>, and <code>-1</code> means "the journey ends here". Starting at index 0, will you ever finish, or do you loop forever? Think of redirects between web pages, a chain of "reports to" records that accidentally points back to its start, or a job that triggers a job that triggers the first one. A program that follows such a chain blindly hangs.</p>
<p>The obvious fix is to remember every index you have visited (a <code>Set</code>) and stop if you see one twice: O(n) time but O(n) memory. <strong>Floyd's tortoise and hare</strong> does it in O(1) memory with two pointers moving at different speeds: <code>slow</code> advances one step, <code>fast</code> advances two. If the path ends, <code>fast</code> hits the end first and you answer "no cycle". If there is a cycle, both end up circling inside it, and because <code>fast</code> gains exactly one step per round it must eventually land on the same position as <code>slow</code> &mdash; like a faster runner lapping a slower one on a track. They can never leap over each other, because the gap shrinks by exactly 1 each round.</p>
<pre>// next = [1, 2, 3, 1]     0 -&gt; 1 -&gt; 2 -&gt; 3 -&gt; 1 -&gt; 2 ...
// slow=0 fast=0
// round1: slow=1, fast=2
// round2: slow=2, fast=1   (2 -&gt; 3 -&gt; 1)
// round3: slow=3, fast=3   MEET -&gt; cycle!
//
// next = [1, 2, -1]       0 -&gt; 1 -&gt; 2 -&gt; end
// fast reaches -1 -&gt; no cycle

let slow = 0, fast = 0;
while (true) {
  slow = next[slow];
  fast = next[fast];
  if (fast === -1) return false;
  fast = next[fast];
  if (fast === -1) return false;
  if (slow === fast) return true;
}</pre>
<p><strong>Complexity:</strong> time O(n) &mdash; the hare either escapes within n steps or meets the tortoise within about n more. Space O(1). This exact idea powers cycle detection in linked lists (module 6) and finding the repeated number in an array (a famous interview question).</p>
<div class="callout"><b>Interview trap:</b> advance <code>fast</code> in <em>two separate steps and test for the end after each one</em>. Writing <code>next[next[fast]]</code> reads <code>next[-1]</code> (which is <code>undefined</code>) when the first hop already ended the path. Also handle the empty array first: with nothing to follow there is no cycle.</div>
<p><strong>Pattern to remember:</strong> "does this chain loop?" or "find the middle without knowing the length" &mdash; <em>one pointer at double speed</em>.</p>`,
  task:`Write <code>hasCycle(next)</code>. <code>next</code> is an array where <code>next[i]</code> is the index you move to from <code>i</code>, or <code>-1</code> if the path ends at <code>i</code>. Start at index 0. Return <code>true</code> if following the pointers from 0 ever revisits an index (the path never ends), otherwise <code>false</code>. An empty array returns <code>false</code>. Use O(1) extra memory (a Set also passes the tests, but the goal is the two-pointer solution). Input can have 300,000 entries.`,
  starter:`function hasCycle(next) {
  // slow moves 1 step, fast moves 2 steps
  // if either reaches -1 the path ends -> false
  // if they land on the same index -> true

}
`,
  solution:`function hasCycle(next) {
  if (next.length === 0) return false;
  let slow = 0, fast = 0;
  while (true) {
    slow = next[slow];
    fast = next[fast];
    if (fast === -1) return false;
    fast = next[fast];
    if (fast === -1) return false;
    if (slow === fast) return true;
  }
}`,
  tests:[
    { desc:'[1,2,3,1] loops 1->2->3->1: true', check:`hasCycle([1,2,3,1])===true` },
    { desc:'[1,2,-1] ends at index 2: false', check:`hasCycle([1,2,-1])===false` },
    { desc:'[-1] ends immediately: false', check:`hasCycle([-1])===false` },
    { desc:'[0] points to itself: true', check:`hasCycle([0])===true` },
    { desc:'empty array: false', check:`hasCycle([])===false` },
    { desc:'[1,0] ping-pong between 0 and 1: true', check:`hasCycle([1,0])===true` },
    { desc:'[1,-1] two nodes, ends at 1: false (fast hits the end after one hop)', check:`hasCycle([1,-1])===false` },
    { desc:'cycle that does not include index 0: [1,2,3,4,2] is true', check:`hasCycle([1,2,3,4,2])===true` },
    { desc:'unreached garbage is ignored: [1,-1,2,1] (index 2 unreachable) is false', check:`hasCycle([1,-1,2,1])===false` },
    { desc:'large chain of 300,000 ends: false; same chain whose last entry points to 150000: true', check:`(function(){ var n=300000, a=[]; for(var i=0;i<n-1;i++) a.push(i+1); a.push(-1); var r1=hasCycle(a); a[n-1]=150000; var r2=hasCycle(a); return r1===false && r2===true; })()` }
  ]
},

{ id:'m4-l7', module:3, file:'07-fixed-window.js', type:'exercise', title:'Fixed-Size Sliding Window: Maximum Sum of k Consecutive Items',
  concept:`<p>A <strong>window</strong> is a contiguous slice of an array. A <strong>sliding window</strong> moves that slice one step at a time and, crucially, <em>updates its answer incrementally</em> instead of recomputing from scratch. Real use: a 7-day moving average of daily orders, the busiest 60-second stretch in a request log, the best 3-month revenue run. All are "some measure over every run of k consecutive items".</p>
<p>The wasteful way: for each starting position, add up k numbers. That is O(n&times;k) &mdash; with 300,000 readings and k = 100,000 you do thirty <em>billion</em> additions. The sliding insight: moving the window one step to the right changes exactly two things. One element <strong>enters</strong> on the right, one element <strong>leaves</strong> on the left. So <code>newSum = oldSum + entering - leaving</code>: one addition and one subtraction, O(1) per step. A moving <em>average</em> is the same thing divided by k.</p>
<pre>// nums = [2, 1, 5, 1, 3, 2], k = 3
// first window [2,1,5] sum = 8
// slide: +1 (index 3) -2 (index 0) -&gt; 7   window [1,5,1]
// slide: +3 (index 4) -1 (index 1) -&gt; 9   [5,1,3] best
// slide: +2 (index 5) -5 (index 2) -&gt; 6   window [1,3,2]
// answer 9

let sum = 0;
for (let i = 0; i &lt; k; i++) sum += nums[i];  // 1st window
let best = sum;
for (let i = k; i &lt; nums.length; i++) {
  sum += nums[i] - nums[i - k];   // enter - leave
  if (sum &gt; best) best = sum;
}
return best;</pre>
<p><strong>Complexity:</strong> time O(n) (k for the first window, n&minus;k slides), space O(1). The element leaving when index <code>i</code> enters is <code>nums[i - k]</code> &mdash; memorise that relation; it is where most off-by-one errors live.</p>
<div class="callout"><b>Interview trap:</b> the first window must be built <em>before</em> the slide loop, and the slide loop starts at <code>i = k</code>, not 0. Ask about edge cases: what if <code>k</code> is larger than the array (no window exists &mdash; here return <code>null</code>), or <code>k</code> is 0? Initialising <code>best = 0</code> is also a bug when all numbers are negative; seed it with the first window's sum.</div>
<p><strong>Pattern to remember:</strong> "every contiguous run of exactly k" means <em>sliding window: add the new element, subtract the old one</em>.</p>`,
  task:`Write <code>maxSumOfK(nums, k)</code> returning the largest sum over all windows of exactly <code>k</code> consecutive elements. Numbers may be negative. If <code>k &lt;= 0</code> or <code>k &gt; nums.length</code>, return <code>null</code>. It must run in O(n); one test uses 300,000 numbers and k = 100,000.`,
  starter:`function maxSumOfK(nums, k) {
  // guard: no window possible -> null
  // sum the first k numbers, then slide:
  //   sum += nums[i] - nums[i - k]

}
`,
  solution:`function maxSumOfK(nums, k) {
  if (k <= 0 || k > nums.length) return null;
  let sum = 0;
  for (let i = 0; i < k; i++) sum += nums[i];
  let best = sum;
  for (let i = k; i < nums.length; i++) {
    sum += nums[i] - nums[i - k];
    if (sum > best) best = sum;
  }
  return best;
}`,
  tests:[
    { desc:'[2,1,5,1,3,2] k=3 returns 9', check:`maxSumOfK([2,1,5,1,3,2],3)===9` },
    { desc:'k equals length: [4,-1,2] k=3 returns 5', check:`maxSumOfK([4,-1,2],3)===5` },
    { desc:'k = 1 is just the maximum: [3,9,-2,4] returns 9', check:`maxSumOfK([3,9,-2,4],1)===9` },
    { desc:'all negatives: [-5,-2,-8,-1] k=2 returns -7 (best must not start at 0)', check:`maxSumOfK([-5,-2,-8,-1],2)===-7` },
    { desc:'k larger than the array returns null', check:`maxSumOfK([1,2],5)===null` },
    { desc:'empty array or k=0 returns null', check:`maxSumOfK([],1)===null && maxSumOfK([1,2],0)===null` },
    { desc:'best window is the first one: [9,8,1,1,1] k=2 returns 17', check:`maxSumOfK([9,8,1,1,1],2)===17` },
    { desc:'best window is the last one: [1,1,1,8,9] k=2 returns 17', check:`maxSumOfK([1,1,1,8,9],2)===17` },
    { desc:'does not mutate the input', check:`(function(){ var a=[2,1,5,1,3,2], c=JSON.stringify(a); maxSumOfK(a,3); return JSON.stringify(a)===c; })()` },
    { desc:'large input: nums = 0..299999, k = 100000 returns 24999950000 (O(n*k) would take far too long)', check:`(function(){ var a=[]; for(var i=0;i<300000;i++) a.push(i); return maxSumOfK(a,100000)===24999950000; })()` }
  ]
},

{ id:'m4-l8', module:3, file:'08-why-linear-predict.js', type:'predict', title:'Predict: Two Loops, Still O(n)?',
  concept:`<p>Look at a variable-size sliding window and you will see a <code>for</code> loop with a <code>while</code> loop <em>inside</em>. Every instinct trained on nested loops says O(n&sup2;). It is not, and being able to explain why is one of the most common follow-up questions in interviews.</p>
<p>The argument is <strong>amortised analysis</strong>: stop counting per outer iteration and count the <em>total work over the whole run</em>. The <code>right</code> pointer moves forward exactly n times. The <code>left</code> pointer also only ever moves forward, and it can never pass <code>right</code>, so it moves at most n times <em>in total</em>, however the moves are distributed between outer iterations. One outer iteration may do a lot of shrinking, but then the next ones have little left to do. Total: at most n + n = 2n steps. Here is a minimum-length-subarray style loop that counts how many times each loop body runs. Trace it by hand first, tracking <code>sum</code> and <code>left</code>.</p>`,
  predict:{
    snippet:`const a = [4, 1, 1, 1, 2, 3, 5];
const target = 5;
let left = 0, sum = 0, outer = 0, inner = 0;
for (let right = 0; right < a.length; right++) {
  outer++;
  sum += a[right];
  while (sum >= target) {
    inner++;
    sum -= a[left];
    left++;
  }
}
console.log(outer);
console.log(inner);`,
    question:'What do the two console.log lines print (outer count, then inner count)?',
    options:['7 / 7','7 / 49','7 / 3','7 / 12'],
    correctIndex:0,
    afterExplain:`The outer loop runs 7 times (once per element). The inner loop body ran 7 times in total: once at <code>right=1</code>, once at <code>right=4</code>, three times at <code>right=5</code>, and twice at <code>right=6</code>. Each inner step advanced <code>left</code> by one, and <code>left</code> ended at 7 &mdash; it can advance at most <code>a.length</code> times in total, which is why the work is bounded by <strong>2n</strong>, not n&sup2;. <strong>How to say it in an interview:</strong> "Each element is added to the window once and removed at most once, so the total work is O(n) even though there are two loops." <strong>Recognising the pattern:</strong> reach for a window when the problem asks about a <em>contiguous</em> subarray or substring, the data being windowed is monotone in a sense (adding items only increases the sum / distinct count; removing only decreases it), and a brute force would re-scan overlapping ranges. Careful: if values can be negative, "shrink when too big" is no longer monotone and a plain window breaks.`
  }
},

{ id:'m4-l9', module:3, file:'09-longest-unique-substring.js', type:'exercise', title:'Variable Window: Longest Substring Without Repeating Characters',
  concept:`<p>Here the window's size is not fixed &mdash; it <strong>grows while it is valid and shrinks when it breaks a rule</strong>. The rule here: no character may appear twice inside the window. The question: how long can a valid window get? Think of the longest run of distinct characters in a typed password, or the longest streak of unique products viewed in a session.</p>
<p>Brute force picks every start, extends until the first repeat, and records the length. For a 100,000-character string with many distinct characters that is billions of steps. Instead keep two pointers, <code>left</code> and <code>right</code>, and always keep the window <code>s[left..right]</code> valid. Move <code>right</code> forward one character at a time. If the new character is already inside the window, <strong>jump</strong> <code>left</code> to just past that character's previous position. A <code>Map</code> of character &rarr; last index makes the jump O(1). After each step the window is valid, so its length is a candidate answer.</p>
<pre>// s = "abcabcbb"   last = {}  left = 0
// r=0 a  new            window "a"    best=1
// r=1 b  new            window "ab"   best=2
// r=2 c  new            window "abc"  best=3
// r=3 a  last[a]=0 &gt;= left -&gt; left=1   window "bca"
// r=4 b  last[b]=1 &gt;= left -&gt; left=2   window "cab"
// r=5 c  last[c]=2 &gt;= left -&gt; left=3   window "abc"
// r=6 b  last[b]=4 &gt;= left -&gt; left=5   window "cb"
// r=7 b  last[b]=6 &gt;= left -&gt; left=7   window "b"
// best = 3

const last = new Map();
let left = 0, best = 0;
for (let right = 0; right &lt; s.length; right++) {
  const ch = s[right];
  const prev = last.get(ch);
  if (prev !== undefined &amp;&amp; prev &gt;= left) left = prev + 1;
  last.set(ch, right);
  best = Math.max(best, right - left + 1);
}
return best;</pre>
<p><strong>Complexity:</strong> time O(n) &mdash; <code>right</code> visits each index once and <code>left</code> never moves backward. Space O(min(n, alphabet size)) for the map.</p>
<div class="callout"><b>Interview trap:</b> the check <code>last.get(ch) &gt;= left</code> is essential. A character seen earlier but now <em>outside</em> the window (to the left of <code>left</code>) is not a conflict; without the check, <code>left</code> jumps <em>backwards</em> on input like <code>"abba"</code> and you overcount (answer 3 instead of 2). Window length is <code>right - left + 1</code> &mdash; the +1 is the classic off-by-one.</div>
<p><strong>Pattern to remember:</strong> "longest/shortest contiguous stretch that satisfies a property" and "no repeats" &mdash; <em>expand right, fix the violation by moving left, record the best after each step</em>.</p>`,
  task:`Write <code>lengthOfLongestSubstring(s)</code> returning the length of the longest <strong>contiguous</strong> substring of <code>s</code> in which no character appears more than once. Empty string returns 0. Characters can be any Unicode code units (the tests use letters, digits, symbols and a very large alphabet). One test is 100,000 characters.`,
  starter:`function lengthOfLongestSubstring(s) {
  // Map: char -> last index it was seen
  // for each right: if the char is already inside the window,
  // move left to lastIndex + 1; then record right - left + 1

}
`,
  solution:`function lengthOfLongestSubstring(s) {
  const last = new Map();
  let left = 0, best = 0;
  for (let right = 0; right < s.length; right++) {
    const ch = s[right];
    if (last.has(ch) && last.get(ch) >= left) left = last.get(ch) + 1;
    last.set(ch, right);
    if (right - left + 1 > best) best = right - left + 1;
  }
  return best;
}`,
  tests:[
    { desc:'"abcabcbb" returns 3', check:`lengthOfLongestSubstring("abcabcbb")===3` },
    { desc:'"bbbbb" returns 1', check:`lengthOfLongestSubstring("bbbbb")===1` },
    { desc:'"pwwkew" returns 3 (the substring "wke", not the subsequence "pwke")', check:`lengthOfLongestSubstring("pwwkew")===3` },
    { desc:'empty string returns 0; single char returns 1', check:`lengthOfLongestSubstring("")===0 && lengthOfLongestSubstring("z")===1` },
    { desc:'"abba" returns 2 (left must never move backwards)', check:`lengthOfLongestSubstring("abba")===2` },
    { desc:'"tmmzuxt" returns 5 ("mzuxt": a repeat of t that lies outside the window is fine)', check:`lengthOfLongestSubstring("tmmzuxt")===5` },
    { desc:'all distinct "abcdef" returns 6; spaces and symbols count: "a b!a b" returns 4', check:`lengthOfLongestSubstring("abcdef")===6 && lengthOfLongestSubstring("a b!a b")===4` },
    { desc:'large input: 100,000 chars cycling through 20,000 distinct characters returns 20000', check:`(function(){ var s=''; var parts=[]; for(var i=0;i<100000;i++) parts.push(String.fromCharCode(0x4E00+(i%20000))); s=parts.join(''); return lengthOfLongestSubstring(s)===20000; })()` },
    { desc:'large input: 300,000 chars of one letter returns 1', check:`(function(){ return lengthOfLongestSubstring('a'.repeat(300000))===1; })()` }

{ id:'m4-l10', module:3, file:'10-min-size-subarray-sum.js', type:'exercise', title:'Shrinking Window: Minimum Size Subarray Sum',
  concept:`<p>A new flavour of variable window: instead of "longest valid", you want the <strong>shortest</strong> window that reaches a goal. Given positive integers and a target, find the shortest contiguous run whose sum is at least the target. Think: "smallest batch of consecutive orders that covers a 10,000 shipping minimum" or "shortest stretch of days that sells at least N units".</p>
<p>Brute force sums from every starting index until the target is reached: with 300,000 ones and a target of 100,000 that is about 30 billion additions. The window version uses the fact that all numbers are <strong>positive</strong>: adding an element only increases the sum, removing one only decreases it. That monotonicity is what makes shrinking safe. Grow <code>right</code> and add to the running sum. The moment <code>sum &gt;= target</code>, the window is valid &mdash; record its length, then <strong>shrink from the left as far as it stays valid</strong>, recording each time, since a shorter valid window is what we want.</p>
<pre>// target = 7, nums = [2, 3, 1, 2, 4, 3]
// r=0 sum=2        r=1 sum=5        r=2 sum=6
// r=3 sum=8 &gt;=7: len 4; shrink -2 -&gt; 6 stop (left=1)
// r=4 sum=10 &gt;=7: len 4; shrink -3 -&gt; 7 &gt;=7 len 3 [1,2,4];
//                 shrink -1 -&gt; 6 stop (left=3)
// r=5 sum=9 &gt;=7: len 3; shrink -2 -&gt; 7 len 2 [4,3] best!
//                 shrink -4 -&gt; 3 stop
// answer 2

let left = 0, sum = 0, best = Infinity;
for (let right = 0; right &lt; nums.length; right++) {
  sum += nums[right];
  while (sum &gt;= target) {
    best = Math.min(best, right - left + 1);
    sum -= nums[left++];
  }
}
return best === Infinity ? 0 : best;</pre>
<p><strong>Complexity:</strong> time O(n) &mdash; the amortised argument from the last lesson: each index is added once and removed once. Space O(1).</p>
<div class="callout"><b>Interview trap:</b> the inner loop is a <code>while</code>, not an <code>if</code>: after one shrink the window may <em>still</em> be valid and you must keep shrinking and recording. The "no answer" case must return 0 (not <code>Infinity</code>). And say out loud why positivity matters: with negative numbers shrinking can increase the sum, the window logic breaks, and you would need prefix sums plus a monotonic deque.</div>
<p><strong>Pattern to remember:</strong> "shortest subarray with sum/count at least X" over non-negative data &mdash; <em>expand until valid, then shrink while still valid, recording each time</em>.</p>`,
  task:`Write <code>minSubArrayLen(target, nums)</code>. <code>nums</code> contains positive integers. Return the length of the shortest contiguous subarray whose sum is <strong>greater than or equal to</strong> <code>target</code>, or <code>0</code> if no such subarray exists. Must run in O(n): one test has 300,000 numbers.`,
  starter:`function minSubArrayLen(target, nums) {
  // grow right, add to sum
  // while sum >= target: record length, then shrink from left
  // no valid window anywhere -> return 0

}
`,
  solution:`function minSubArrayLen(target, nums) {
  let left = 0, sum = 0, best = Infinity;
  for (let right = 0; right < nums.length; right++) {
    sum += nums[right];
    while (sum >= target) {
      if (right - left + 1 < best) best = right - left + 1;
      sum -= nums[left++];
    }
  }
  return best === Infinity ? 0 : best;
}`,
  tests:[
    { desc:'target 7, [2,3,1,2,4,3] returns 2 (the window [4,3])', check:`minSubArrayLen(7,[2,3,1,2,4,3])===2` },
    { desc:'target 4, [1,4,4] returns 1 (a single element is enough)', check:`minSubArrayLen(4,[1,4,4])===1` },
    { desc:'target 11, [1,1,1,1,1,1,1,1] returns 0 (total only 8)', check:`minSubArrayLen(11,[1,1,1,1,1,1,1,1])===0` },
    { desc:'whole array needed: target 15, [1,2,3,4,5] returns 5', check:`minSubArrayLen(15,[1,2,3,4,5])===5` },
    { desc:'empty array returns 0', check:`minSubArrayLen(3,[])===0` },
    { desc:'must keep shrinking: target 10, [1,1,1,1,10,1] returns 1', check:`minSubArrayLen(10,[1,1,1,1,10,1])===1` },
    { desc:'sum equal to target counts: target 6, [3,3] returns 2', check:`minSubArrayLen(6,[3,3])===2` },
    { desc:'does not mutate the input', check:`(function(){ var a=[2,3,1,2,4,3], c=JSON.stringify(a); minSubArrayLen(7,a); return JSON.stringify(a)===c; })()` },
    { desc:'large input: 300,000 ones, target 100,000 returns 100000 (O(n*L) brute force is far too slow)', check:`(function(){ var a=[]; for(var i=0;i<300000;i++) a.push(1); return minSubArrayLen(100000,a)===100000; })()` },
    { desc:'large input: target larger than the total sum returns 0', check:`(function(){ var a=[]; for(var i=0;i<300000;i++) a.push(1); return minSubArrayLen(300001,a)===0; })()` }
  ]
},

{ id:'m4-l11', module:3, file:'11-at-most-k-distinct.js', type:'exercise', title:'Window with a Frequency Map: At Most K Distinct Characters',
  concept:`<p>So far the "is this window valid?" question was answered by a single number (a sum) or a "last seen" position. Many interview problems need a richer summary of the window: <em>how many of each thing is inside right now</em>. That is a <strong>frequency map</strong> kept in sync as the window slides: when a character enters, increment its count; when it leaves, decrement it (and delete it at zero so the map's size means "distinct count").</p>
<p>The problem: find the length of the longest substring that contains <strong>at most k distinct characters</strong>. Think "longest stretch of a session spent on at most 2 product categories" or "longest text window using only k different symbols". Brute force checks every substring &mdash; O(n&sup2;) windows at least. With a window and a map: expand <code>right</code>, adding the new character; while the map has more than k keys the window is invalid, so shrink from the left (decrementing, deleting zeros) until valid again; then record <code>right - left + 1</code>.</p>
<pre>// s = "eceba", k = 2
// r=0 'e'  {e:1}            ok  len 1
// r=1 'c'  {e:1,c:1}        ok  len 2
// r=2 'e'  {e:2,c:1}        ok  len 3   best=3 "ece"
// r=3 'b'  {e:2,c:1,b:1}    3 keys &gt; 2 -&gt; shrink:
//          drop s[0]='e' -&gt; {e:1,c:1,b:1} still 3
//          drop 'c' -&gt; hits 0, delete -&gt; {e:1,b:1} ok
//          left=2 len 2
// r=4 'a'  {e:1,b:1,a:1}  shrink: drop e -&gt; {b:1,a:1} len 2
// answer 3

const cnt = new Map();
let left = 0, best = 0;
for (let right = 0; right &lt; s.length; right++) {
  cnt.set(s[right], (cnt.get(s[right]) || 0) + 1);
  while (cnt.size &gt; k) {
    const c = s[left++];
    cnt.set(c, cnt.get(c) - 1);
    if (cnt.get(c) === 0) cnt.delete(c);
  }
  best = Math.max(best, right - left + 1);
}
return best;</pre>
<p><strong>Complexity:</strong> time O(n) (each index enters and leaves once; map operations are O(1) on average), space O(k) &mdash; the map never holds more than k + 1 keys.</p>
<div class="callout"><b>Interview trap:</b> if you forget to <code>delete</code> a key when its count reaches 0, <code>cnt.size</code> never goes down, the shrink loop never ends validly, and the answer is wrong. Also guard <code>k = 0</code>: no characters allowed means the answer is 0 (your loop will handle it if the shrink runs until <code>left</code> passes <code>right</code>, but check it).</div>
<p><strong>Pattern to remember:</strong> "at most / exactly k distinct", "contains all of these" &mdash; <em>window + frequency map; shrink while the map breaks the rule</em>.</p>`,
  task:`Write <code>longestKDistinct(s, k)</code> returning the length of the longest contiguous substring of <code>s</code> that contains <strong>at most</strong> <code>k</code> distinct characters. If <code>k</code> is 0 or <code>s</code> is empty, return 0. Must be O(n); one test is 300,000 characters long with k = 2.`,
  starter:`function longestKDistinct(s, k) {
  // Map of char -> count inside the window
  // add s[right]; while map.size > k, remove s[left] (delete at 0)

}
`,
  solution:`function longestKDistinct(s, k) {
  const cnt = new Map();
  let left = 0, best = 0;
  for (let right = 0; right < s.length; right++) {
    cnt.set(s[right], (cnt.get(s[right]) || 0) + 1);
    while (cnt.size > k) {
      const c = s[left++];
      cnt.set(c, cnt.get(c) - 1);
      if (cnt.get(c) === 0) cnt.delete(c);
    }
    if (right - left + 1 > best) best = right - left + 1;
  }
  return best;
}`,
  tests:[
    { desc:'"eceba", k=2 returns 3 ("ece")', check:`longestKDistinct("eceba",2)===3` },
    { desc:'"aa", k=1 returns 2', check:`longestKDistinct("aa",1)===2` },
    { desc:'k = 0 returns 0; empty string returns 0', check:`longestKDistinct("abc",0)===0 && longestKDistinct("",3)===0` },
    { desc:'k larger than distinct count returns the whole length: "abcde", k=10 returns 5', check:`longestKDistinct("abcde",10)===5` },
    { desc:'"abaccc", k=2 returns 4 ("accc")', check:`longestKDistinct("abaccc",2)===4` },
    { desc:'"abcadcacacaca", k=3 returns 11 (window must shrink correctly past removed letters)', check:`longestKDistinct("abcadcacacaca",3)===11` },
    { desc:'k = 1 equals the longest run of one letter: "aabbbbcc" returns 4', check:`longestKDistinct("aabbbbcc",1)===4` },
    { desc:'large input: 300,000 chars alternating "ab", k=2 returns 300000', check:`(function(){ return longestKDistinct('ab'.repeat(150000),2)===300000; })()` },
    { desc:'large input: "abc" repeated, k=2 returns 2 (never three distinct)', check:`(function(){ return longestKDistinct('abc'.repeat(100000),2)===2; })()` }
  ]
},

{ id:'m4-l12', module:3, file:'12-find-all-anagrams.js', type:'exercise', title:'Interview: Find All Anagrams of p in s',
  concept:`<p>Classic: given a long string <code>s</code> and a short pattern <code>p</code>, list every start index where a substring of <code>s</code> is an <strong>anagram</strong> of <code>p</code> (the same letters with the same counts, any order). Search-as-you-type fuzzy matching, plagiarism detection and "is this permutation present" checks all lean on this idea. The related interview question "permutation in string" is the same problem where you only need to know whether <em>one</em> such window exists.</p>
<p>Brute force sorts or counts every window of length <code>m = p.length</code>: O(n&times;m), which for n = 200,000 and m = 5,000 is a billion character visits. Since every anagram window has the <strong>same fixed size m</strong>, this is a fixed sliding window combined with frequency counting. Count the letters of <code>p</code> once. Maintain the letter counts of the current window. Better still, keep a single number, <code>need</code> &mdash; how many letters are <em>still missing</em> &mdash; so each slide is O(1) with no map comparison: when a character enters and was still needed, <code>need</code> drops; when a character leaves and had been satisfied, <code>need</code> rises. A window is an anagram when <code>need === 0</code>.</p>
<pre>// s = "cbaebabacd", p = "abc"  (m=3)
// counts of p: a:1 b:1 c:1   need = 3
// enter c -&gt; need 2, enter b -&gt; need 1, enter a -&gt; need 0
//   window [0..2] "cba" need==0 -&gt; record 0
// slide: enter e (not in p, count -1); leave c -&gt; need 1
// slide: enter 'b'(count -1) leave 'b' ... and so on
// answer [0, 6]

const count = new Map();
for (const ch of p) count.set(ch, (count.get(ch) || 0) + 1);
let need = p.length;
for (let r = 0; r &lt; s.length; r++) {
  if ((count.get(s[r]) || 0) &gt; 0) need--;  // useful letter
  count.set(s[r], (count.get(s[r]) || 0) - 1);
  if (r &gt;= m) {                  // drop s[r - m]
    const out = s[r - m];
    count.set(out, count.get(out) + 1);
    if (count.get(out) &gt; 0) need++;
  }
  if (need === 0) result.push(r - m + 1);
}</pre>
<p><strong>Complexity:</strong> time O(n + m); space O(alphabet) &mdash; at most 26 or 128 keys for plain text.</p>
<div class="callout"><b>Interview trap:</b> handle <code>p.length &gt; s.length</code> up front (no windows exist), and be precise about the leaving index: when <code>r</code> is the index entering, the character leaving is <code>s[r - m]</code> and the window start is <code>r - m + 1</code>. The "need" counter trick breaks if you let counts of absent letters stay at 0 instead of going negative &mdash; negative counts are how extra letters are remembered.</div>
<p><strong>Pattern to remember:</strong> "substring that is a permutation / anagram of p" &mdash; <em>fixed window of size |p| plus a frequency counter, updated on enter and leave</em>.</p>`,
  task:`Write <code>findAnagrams(s, p)</code> returning an <strong>array of start indices in ascending order</strong> of every substring of <code>s</code> that is an anagram of <code>p</code> (overlapping matches count). Lowercase letters only. Return <code>[]</code> if there are none, or if <code>p</code> is longer than <code>s</code>, or if <code>p</code> is empty. Must run in O(n): one test has a 200,000-character <code>s</code> and a 5,000-character <code>p</code>.`,
  starter:`function findAnagrams(s, p) {
  // m = p.length; count letters of p
  // slide a window of size m over s, tracking how many letters are still needed
  const result = [];

  return result;
}
`,
  solution:`function findAnagrams(s, p) {
  const m = p.length, result = [];
  if (m === 0 || m > s.length) return result;
  const count = new Map();
  for (const ch of p) count.set(ch, (count.get(ch) || 0) + 1);
  let need = m;
  for (let r = 0; r < s.length; r++) {
    if ((count.get(s[r]) || 0) > 0) need--;
    count.set(s[r], (count.get(s[r]) || 0) - 1);
    if (r >= m) {
      const out = s[r - m];
      count.set(out, count.get(out) + 1);
      if (count.get(out) > 0) need++;
    }
    if (need === 0) result.push(r - m + 1);
  }
  return result;
}`,
  tests:[
    { desc:'findAnagrams("cbaebabacd","abc") returns [0,6]', check:`__eq(findAnagrams("cbaebabacd","abc"),[0,6])` },
    { desc:'overlapping matches: findAnagrams("abab","ab") returns [0,1,2]', check:`__eq(findAnagrams("abab","ab"),[0,1,2])` },
    { desc:'repeated letters matter: findAnagrams("aabaa","aab") returns [0,1,2]', check:`__eq(findAnagrams("aabaa","aab"),[0,1,2])` },
    { desc:'counts must match exactly: findAnagrams("aaab","aab") returns [1]', check:`__eq(findAnagrams("aaab","aab"),[1])` },
    { desc:'p longer than s returns []', check:`__eq(findAnagrams("ab","abc"),[])` },
    { desc:'empty p returns []; empty s returns []', check:`__eq(findAnagrams("abc",""),[]) && __eq(findAnagrams("","a"),[])` },
    { desc:'no anagram anywhere: findAnagrams("abcdefg","hij") returns []', check:`__eq(findAnagrams("abcdefg","hij"),[])` },
    { desc:'p equals s (a single window): findAnagrams("listen","silent") returns [0]', check:`__eq(findAnagrams("listen","silent"),[0])` },
    { desc:'large input: s = 200,000 "a", p = 5,000 "a" returns 195001 indices from 0 to 195000', check:`(function(){ var r=findAnagrams('a'.repeat(200000),'a'.repeat(5000)); return r.length===195001 && r[0]===0 && r[195000]===195000 && r[100000]===100000; })()` },

{ id:'m5-l1', module:4, file:'01-lifo-fifo-predict.js', type:'predict', title:'Predict: Stack (LIFO) vs Queue (FIFO)',
  concept:`<p>Two data structures, defined entirely by <strong>which end you take from</strong>. A <strong>stack</strong> is last-in, first-out (LIFO): think of a pile of plates &mdash; you add to the top and you take from the top. A <strong>queue</strong> is first-in, first-out (FIFO): think of a ticket line &mdash; people join at the back and are served from the front. Nothing else is promised, and that restriction is the whole point: because you cannot reach into the middle, both can be made very fast (O(1) per operation), and the restriction itself <em>encodes a rule</em> about ordering that your algorithm relies on.</p>
<p>You meet stacks everywhere: the <strong>undo</strong> history in an editor (the last edit is the first thing undone), the browser <strong>back button</strong>, and the <strong>call stack</strong> that runs your functions. Queues run <strong>job processing</strong> (a print queue, a background-task queue, "next order to cut" in a workshop), breadth-first search, and message buses where fairness means oldest first. In JavaScript an array gives you both: <code>push</code>/<code>pop</code> work on the right end (a stack), and <code>push</code>/<code>shift</code> take from the left end (a queue, with a performance catch we fix two lessons from now). Trace this snippet carefully, writing the array after every line.</p>`,

    snippet:`const a = [];
a.push(1);
a.push(2);
a.push(3);
console.log(a.pop());
a.push(4);
console.log(a.shift());
console.log(a.pop());
console.log(a.join(","));`,
    question:'What do the four console.log lines print?',
    options:['3 / 1 / 4 / 2','3 / 3 / 4 / 2','1 / 1 / 4 / 2','3 / 4 / 4 / 2'],

{ id:'m5-l2', module:4, file:'02-build-a-stack.js', type:'exercise', title:'Build a Stack Class',
  concept:`<p>Before using a stack to solve problems, build one &mdash; it takes five minutes and it is a common warm-up ("implement a stack without using a library class"). A stack exposes a tiny interface: <code>push(x)</code> adds on top, <code>pop()</code> removes and returns the top, <code>peek()</code> looks at the top without removing, plus <code>size()</code> and <code>isEmpty()</code>. Hiding the storage behind that interface is the idea of an <strong>abstract data type</strong>: callers care about the behaviour (LIFO), not whether it is an array or linked nodes inside.</p>
<p>A JavaScript array is already an excellent stack backing store, because <code>push</code> and <code>pop</code> on the <em>end</em> are amortised O(1) &mdash; the array occasionally resizes, but averaged over many pushes each costs a constant. The top of the stack is simply <code>items[items.length - 1]</code>.</p>
<pre>class Stack {
  constructor() { this.items = []; }
  push(x) { this.items.push(x); }
  pop() { return this.items.pop(); }       // undefined if empty
  peek() { return this.items[this.items.length - 1]; }
  size() { return this.items.length; }
  isEmpty() { return this.items.length === 0; }
}

// s.push(1); s.push(2); s.push(3);
//   items: [1, 2, 3]   top = 3
// s.pop()  -&gt; 3        items: [1, 2]
// s.peek() -&gt; 2        items unchanged</pre>
<p><strong>Complexity:</strong> every operation is O(1) (amortised for <code>push</code>); space O(n) for n stored items. Compare with the wrong end: <code>unshift</code>/<code>shift</code> at the front of an array are O(n) because every other element must move.</p>
<div class="callout"><b>Interview trap:</b> decide and state what happens on an empty stack. Options: return <code>undefined</code>, return <code>null</code>, or throw. Here we use <code>undefined</code> (what <code>Array.pop</code> already does) &mdash; never let <code>peek()</code> on an empty stack crash with a bad index, and never let <code>pop()</code> make the size negative by tracking a separate counter badly. Also: <code>peek</code> must not remove anything.</div>
<p><strong>Pattern to remember:</strong> a stack is <em>an array where you only touch the end</em>; its power comes from the discipline, not the data.</p>`,

{ id:'m5-l3', module:4, file:'03-build-a-queue.js', type:'exercise', title:'Build a Queue (and Why array.shift() Is a Trap)',
  concept:`<p>A queue serves in the order of arrival. The interface: <code>enqueue(x)</code> at the back, <code>dequeue()</code> from the front, <code>peek()</code> the front, <code>size()</code>, <code>isEmpty()</code>. The tempting JavaScript implementation is an array with <code>push</code> and <code>shift</code>. It is correct and it is a classic performance trap: <code>shift()</code> removes element 0, and every remaining element must slide one slot left &mdash; <strong>O(n) per dequeue</strong>. Draining a queue of 300,000 items this way does on the order of 45 billion element moves; on a typical machine it takes many seconds. (Small arrays hide the problem because the engine has tricks for them; do not rely on that in an interview.)</p>
<p>The fix is to stop moving the data and move a <em>pointer</em> instead. Keep a <code>head</code> index that says where the front currently is. Enqueue appends at the end; dequeue returns <code>items[head]</code> and just increments <code>head</code> &mdash; no shifting at all. Size is <code>items.length - head</code>.</p>
<pre>// enqueue a, b, c -&gt; items [a,b,c]  head=0
// dequeue -&gt; items[0]='a', head=1     size = 3-1 = 2
// dequeue -&gt; items[1]='b', head=2     size = 1
// enqueue d -&gt; items [a,b,c,d] head=2 size = 2 (front is 'c')

class Queue {
  constructor() { this.items = []; this.head = 0; }
  enqueue(x) { this.items.push(x); }
  dequeue() {
    if (this.head &gt;= this.items.length) return undefined;
    const x = this.items[this.head];
    this.items[this.head] = undefined;   // let the GC reclaim it
    this.head++;
    return x;
  }
  peek() { return this.items[this.head]; }
  size() { return this.items.length - this.head; }
  isEmpty() { return this.size() === 0; }
}</pre>
<p><strong>Complexity:</strong> all operations O(1) amortised. Space: the consumed prefix of the array stays allocated; a production version occasionally compacts (<code>slice(head)</code> when <code>head</code> is over half the array) or uses a linked list or circular buffer &mdash; mention that as a follow-up and you sound senior.</p>
<div class="callout"><b>Interview trap:</b> <code>isEmpty()</code> must be computed from <code>size()</code>, not from <code>items.length === 0</code>: after dequeuing everything, the array is still full of dead slots. Also when <code>head</code> reaches the end, <code>dequeue()</code> must return <code>undefined</code> instead of walking off the array and corrupting <code>head</code>.</div>
<p><strong>Pattern to remember:</strong> "remove from the front repeatedly" &mdash; <em>never <code>shift</code>; advance a head index</em>.</p>`,
  task:`Complete the <code>Queue</code> class with <code>enqueue(x)</code>, <code>dequeue()</code> (removes and returns the front item, or <code>undefined</code> if empty), <code>peek()</code> (front item or <code>undefined</code>), <code>size()</code> and <code>isEmpty()</code>. Dequeue must be O(1): the large test enqueues 300,000 items and dequeues them all (a <code>shift()</code> implementation times out).`,

    // hint: an items array AND a head index
  }
  enqueue(x) {

  }
  dequeue() {

  }
  peek() {

  }
  size() {

  isEmpty() {

}
`,
  solution:`class Queue {
  constructor() { this.items = []; this.head = 0; }
  enqueue(x) { this.items.push(x); }
  dequeue() {
    if (this.head >= this.items.length) return undefined;
    const x = this.items[this.head];
    this.items[this.head] = undefined;
    this.head++;
    return x;
  }
  peek() { return this.items[this.head]; }
  size() { return this.items.length - this.head; }
  isEmpty() { return this.size() === 0; }
}`,
  tests:[
    { desc:'enqueue 1,2,3 then dequeue returns 1, 2, 3 (FIFO order)', check:`(function(){ var q=new Queue(); q.enqueue(1); q.enqueue(2); q.enqueue(3); return q.dequeue()===1 && q.dequeue()===2 && q.dequeue()===3; })()` },
    { desc:'new queue: size 0 and isEmpty true; dequeue/peek give undefined', check:`(function(){ var q=new Queue(); return q.size()===0 && q.isEmpty() && q.dequeue()===undefined && q.peek()===undefined; })()` },
    { desc:'peek shows the front without removing it', check:`(function(){ var q=new Queue(); q.enqueue("x"); q.enqueue("y"); return q.peek()==="x" && q.size()===2 && q.dequeue()==="x" && q.peek()==="y"; })()` },
    { desc:'interleaved: enqueue a,b; dequeue a; enqueue c; dequeue b, c', check:`(function(){ var q=new Queue(); q.enqueue("a"); q.enqueue("b"); var r=[q.dequeue()]; q.enqueue("c"); r.push(q.dequeue(), q.dequeue()); return __eq(r,["a","b","c"]); })()` },
    { desc:'isEmpty is true again after everything was dequeued (dead slots do not count)', check:`(function(){ var q=new Queue(); q.enqueue(1); q.enqueue(2); q.dequeue(); q.dequeue(); return q.isEmpty() && q.size()===0; })()` },
    { desc:'dequeue on an emptied queue returns undefined and the queue still works afterwards', check:`(function(){ var q=new Queue(); q.enqueue(1); q.dequeue(); var u=q.dequeue(); q.enqueue(9); return u===undefined && q.size()===1 && q.peek()===9 && q.dequeue()===9; })()` },
    { desc:'stores falsy values 0, "" and null as real items', check:`(function(){ var q=new Queue(); q.enqueue(0); q.enqueue(""); q.enqueue(null); return q.size()===3 && q.dequeue()===0 && q.dequeue()==="" && q.dequeue()===null && q.isEmpty(); })()` },
    { desc:'large input: 300,000 enqueues then 300,000 dequeues in order (shift() is far too slow)', check:`(function(){ var q=new Queue(); for(var i=0;i<300000;i++) q.enqueue(i); for(var j=0;j<300000;j++){ if(q.dequeue()!==j) return false; } return q.isEmpty(); })()` },
    { desc:'large input: steady state, 150,000 rounds of enqueue+dequeue on a queue holding 100,000 items', check:`(function(){ var q=new Queue(); for(var i=0;i<100000;i++) q.enqueue(i); for(var j=0;j<150000;j++){ q.enqueue(100000+j); if(q.dequeue()!==j) return false; } return q.size()===100000 && q.peek()===150000; })()` }

{ id:'m5-l4', module:4, file:'04-valid-parentheses.js', type:'exercise', title:'Valid Parentheses: The Stack Matching Pattern',
  concept:`<p>Is <code>"{[()]}"</code> well-formed? What about <code>"([)]"</code>? Code editors that highlight a matching bracket, JSON and HTML parsers, and compilers all answer this question. The rule: every opener must be closed by the <em>right kind</em> of closer, and closers must come in the reverse order of the openers &mdash; the most recently opened bracket must be the first one closed. "Most recent first" is the signature of a <strong>stack</strong>.</p>
<p>Scan left to right. When you see an <strong>opener</strong>, push it. When you see a <strong>closer</strong>, the top of the stack must be its matching opener: pop it; if the stack is empty or the top is a different kind, the string is invalid. At the end the stack must be empty, otherwise some openers were never closed. A lookup object from each closer to its opener keeps the code short.</p>
<pre>// s = "{[()]}"
// '{' push        stack: {
// '[' push        stack: { [
// '(' push        stack: { [ (
// ')' top '(' ok  pop    stack: { [
// ']' top '[' ok  pop    stack: {
// '}' top '{' ok  pop    stack: (empty) -&gt; valid
//
// s = "([)]":  '(' '[' then ')' sees top '[' -&gt; mismatch -&gt; invalid

const pair = { ')': '(', ']': '[', '}': '{' };
const stack = [];
for (const ch of s) {
  if (ch === '(' || ch === '[' || ch === '{') stack.push(ch);
  else if (stack.pop() !== pair[ch]) return false;
}
return stack.length === 0;</pre>
<p><strong>Complexity:</strong> time O(n) &mdash; each character is pushed and popped at most once. Space O(n) in the worst case (<code>"((((("</code> pushes everything).</p>
<div class="callout"><b>Interview trap:</b> two classic misses. (1) A closer arriving when the stack is empty: <code>pop()</code> returns <code>undefined</code>, which never equals a real opener, so the code above is safe &mdash; but if you peek at <code>stack[stack.length-1]</code> without checking, you may crash or silently accept. (2) Forgetting the final <code>stack.length === 0</code> check, which makes <code>"(("</code> look valid. A counter instead of a stack works for one bracket type only; the moment there are two kinds (<code>"([)]"</code>), you need the stack.</div>
<p><strong>Pattern to remember:</strong> "matching / nested / balanced / most recent unmatched" &mdash; <em>push openers, pop on closers, stack empty at the end</em>.</p>`,
  task:`Write <code>isValid(s)</code>. The string consists only of the characters <code>( ) [ ] { }</code>. Return <code>true</code> if every bracket is closed by the same type of bracket in the correct order, otherwise <code>false</code>. The empty string is valid. It must be O(n); the large tests have up to 300,000 characters.`,
  starter:`function isValid(s) {
  // push openers; on a closer, the popped top must be its partner
  // at the end the stack must be empty

}
`,
  solution:`function isValid(s) {
  const pair = { ')': '(', ']': '[', '}': '{' };
  const stack = [];
  for (const ch of s) {
    if (ch === '(' || ch === '[' || ch === '{') stack.push(ch);
    else if (stack.pop() !== pair[ch]) return false;
  }
  return stack.length === 0;
}`,
  tests:[
    { desc:'"()" , "()[]{}" and "{[()]}" are valid', check:`isValid("()")===true && isValid("()[]{}")===true && isValid("{[()]}")===true` },
    { desc:'"(]" is invalid (wrong type of closer)', check:`isValid("(]")===false` },
    { desc:'"([)]" is invalid (closers in the wrong order)', check:`isValid("([)]")===false` },
    { desc:'empty string is valid', check:`isValid("")===true` },
    { desc:'unclosed opener: "(" and "((()" are invalid', check:`isValid("(")===false && isValid("((()")===false` },
    { desc:'closer with nothing open: ")" and "())(" are invalid', check:`isValid(")")===false && isValid("())(")===false` },
    { desc:'sequence of valid groups next to nested ones: "([]){}[{()}]" is valid', check:`isValid("([]){}[{()}]")===true` },
    { desc:'correct counts but wrong nesting: "(}{)" is invalid', check:`isValid("(}{)")===false` },
    { desc:'large input: 150,000 "(" followed by 150,000 ")" is valid (deep nesting)', check:`isValid('('.repeat(150000)+')'.repeat(150000))===true` },
    { desc:'large input: that same string with a single "]" swapped in the middle is invalid', check:`(function(){ var s='('.repeat(150000)+')'.repeat(149999)+']'; return isValid(s)===false; })()` }
  ]
},
