{ id:'m5-l1', module:4, file:'01-why-tables-are-split.sql', type:'explore', title:'Why Data Lives in Many Tables: Keys and Relationships',
  dataset:'shop', openDataset:true,
  concept:`<p>Imagine the jewellery shop kept everything in <em>one</em> giant spreadsheet: every order line would repeat the customer's name, email, city and tier, plus the product's name, SKU and price. When Priya moves from Bengaluru to Pune, you must fix hundreds of rows, and miss one, and now the same customer has two cities. When a price changes, old invoices silently change too. Splitting data so that <strong>each fact is stored exactly once</strong> is called <strong>normalisation</strong>, and it is the reason relational databases have joins.</p>
<p>In this database each table is about one kind of thing: <code>customers</code> (who), <code>products</code> (what we sell), <code>orders</code> (one row per purchase: who bought, when, which channel) and <code>order_items</code> (one row per product inside an order). They are linked by keys:</p>
<ul>
<li>A <strong>primary key</strong> (PK) uniquely identifies a row: <code>customers.id</code>, <code>orders.id</code>. It is never NULL and never repeats.</li>
<li>A <strong>foreign key</strong> (FK) is a column holding another table's PK, a pointer: <code>orders.customer_id</code> points at <code>customers.id</code>; <code>order_items.order_id</code> points at <code>orders.id</code>; <code>order_items.product_id</code> points at <code>products.id</code>.</li>
</ul>
<pre>customers 1 ---- * orders 1 ---- * order_items * ---- 1 products</pre>
<p>Read each line as a <strong>one-to-many</strong> relationship: one customer has many orders, one order has many items, one product appears in many items. (Many-to-many, such as orders and products, is modelled with a middle "junction" table, here <code>order_items</code>.) A <strong>join</strong> is simply the operation that follows these pointers to put the facts back together in a result.</p>
<div class="callout"><b>Dialect note:</b> a foreign key is also a <em>constraint</em>: it can stop you inserting an order for a customer that does not exist. SQLite only enforces it after <code>PRAGMA foreign_keys = ON</code>; PostgreSQL and MySQL (InnoDB) enforce it always. Interview trap: a FK does not automatically create an index on the child column in PostgreSQL (MySQL InnoDB does), and unindexed FK columns make joins and deletes slow on big tables. We return to that in the performance module.</div>
<p>Use the editor to poke around. Try the starter queries: look at the raw ids on both sides, and spot which customer ids never appear in <code>orders.customer_id</code>. Nothing here is graded; run anything you like.</p>`,
  starter:`-- the pointer: customer_id in orders
SELECT id, customer_id, order_date, status
FROM orders
LIMIT 8;

-- the thing it points at
-- SELECT id, name, city FROM customers LIMIT 8;

-- which customer ids appear in orders? (try it)
-- SELECT DISTINCT customer_id FROM orders ORDER BY 1;

-- one order, its lines (order_items.order_id = 4)
-- SELECT * FROM order_items WHERE order_id = 4;`
},

{ id:'m5-l2', module:4, file:'02-inner-join.sql', type:'exercise', title:'INNER JOIN: Matching Rows on a Key',
  dataset:'shop',
  concept:`<p>The <code>orders</code> table says <em>customer 12 placed this order</em>, but a human wants a name and a city. <code>INNER JOIN</code> combines two tables by pairing rows that satisfy a condition, almost always "the foreign key equals the primary key". The condition goes in the <code>ON</code> clause.</p>
<pre>SELECT o.id, o.order_date, c.name, c.city
FROM orders AS o
JOIN customers AS c
  ON c.id = o.customer_id;</pre>
<p>Conceptually the database considers every orders row against every customers row and keeps the pairs where <code>ON</code> is true (in practice it uses indexes and hash/merge strategies, but the result is the same). <code>JOIN</code> on its own means <code>INNER JOIN</code>. "Inner" means: <strong>only rows that find a partner survive</strong>. An order whose customer does not exist, or a customer with no orders, simply vanishes from the result. That is exactly right when you only care about matched data, and exactly wrong when you want to see the unmatched (next lesson).</p>
<p><strong>Aliases</strong> (<code>orders AS o</code>) shorten the query, and they are mandatory when the same column name exists in both tables: both tables have <code>id</code>, so a bare <code>id</code> raises an "ambiguous column name" error. Get in the habit of qualifying every column with its table alias, even when not strictly needed; it makes a multi-join query readable.</p>
<div class="callout"><b>Common mistake:</b> forgetting or mistyping the <code>ON</code> condition. With a wrong condition (for example <code>ON c.id = o.id</code>) the query still runs, silently pairing unrelated rows, and gives plausible garbage. Forgetting it entirely in the old comma style (<code>FROM a, b</code>) produces a cartesian product: 24 customers times 40 orders is 960 rows. Prefer explicit <code>JOIN ... ON</code>, which every style guide requires. Dialect note: <code>USING (col)</code> is a shorthand when both sides have the same column name; and MySQL/PostgreSQL support it, but because our keys have different names (<code>id</code> vs <code>customer_id</code>) we use <code>ON</code>.</div>
<p>Real-world use: nearly every report joins a "fact" table (orders, events) to a "dimension" table (customers, products) to turn ids into readable labels.</p>`,
  task:`List all <strong>pending</strong> orders together with the customer who placed them. Return columns <code>order_id</code>, <code>order_date</code>, <code>customer</code> (the customer's name) and <code>city</code>. Sort by <code>order_id</code>.`,
  starter:`-- join orders to customers, keep only pending ones
SELECT o.id AS order_id
FROM orders AS o
WHERE o.status = 'pending';`,
  solution:`SELECT o.id         AS order_id,
       o.order_date AS order_date,
       c.name       AS customer,
       c.city       AS city
FROM orders AS o
JOIN customers AS c
  ON c.id = o.customer_id
WHERE o.status = 'pending'
ORDER BY o.id;`,
  columns:true, ordered:true,
  rules:[ { desc:'Uses JOIN ... ON', re:'\\bJOIN\\b[\\s\\S]*\\bON\\b', flags:'i' } ]
},

{ id:'m5-l3', module:4, file:'03-left-join-find-missing.sql', type:'exercise', title:'LEFT JOIN: Keeping Unmatched Rows and Finding the Missing',
  dataset:'shop',
  concept:`<p>"Which customers have never ordered?" is one of the most valuable questions in business: they are your re-engagement list. An <code>INNER JOIN</code> cannot answer it, because customers without orders disappear. A <strong><code>LEFT JOIN</code></strong> keeps <em>every</em> row from the left table, and where there is no match on the right it fills the right-hand columns with <strong>NULL</strong>.</p>
<pre>SELECT c.name, o.id AS order_id
FROM customers c
LEFT JOIN orders o
  ON o.customer_id = c.id;</pre>
<table class="mini"><tr><th>name</th><th>order_id</th></tr><tr><td>Emma Clarke</td><td>4</td></tr><tr><td>Emma Clarke</td><td>5</td></tr><tr><td>Tanvi Rao</td><td>NULL</td></tr></table>
<p>Emma appears once per order (one-to-many repeats the left row), and Tanvi appears once with NULL because she has no orders. Now the trick, called an <strong>anti-join</strong>: add <code>WHERE o.id IS NULL</code>, which keeps only the left rows that found <em>no</em> partner. Test a column that can never be NULL in real matches (the right table's primary key, <code>o.id</code>), so that a NULL can only mean "no match".</p>
<pre>SELECT c.id, c.name
FROM customers c
LEFT JOIN orders o ON o.customer_id = c.id
WHERE o.id IS NULL;</pre>
<div class="callout"><b>Interview trap:</b> there are three ways to write "rows with no match": <code>LEFT JOIN ... WHERE right.pk IS NULL</code>, <code>NOT EXISTS (subquery)</code> and <code>NOT IN (subquery)</code>. The first two are safe; <code>NOT IN</code> returns nothing at all if the subquery produces a single NULL (recall the earlier lesson). Performance is usually equivalent in PostgreSQL and MySQL 8, since the planner recognises the anti-join; <code>NOT EXISTS</code> is often preferred for clarity. Also remember <code>RIGHT JOIN</code> is just a LEFT JOIN with the tables swapped, and most teams write only LEFT JOINs for consistency.</div>
<p>Real-world use: customers who signed up but never bought, products never sold (dead stock), employees without a manager, orders missing a shipment record: every "orphan" or "gap" report in practice is this pattern.</p>`,
  task:`Find the customers who have <strong>never placed an order</strong>, using a <code>LEFT JOIN</code> and an <code>IS NULL</code> test. Return columns <code>id</code>, <code>name</code> and <code>city</code> of the customer, sorted by <code>id</code>.`,
  starter:`-- LEFT JOIN customers to orders, then keep the unmatched
SELECT c.id, c.name, c.city
FROM customers AS c
ORDER BY c.id;`,
  solution:`SELECT c.id, c.name, c.city
FROM customers AS c
LEFT JOIN orders AS o
  ON o.customer_id = c.id
WHERE o.id IS NULL
ORDER BY c.id;`,
  columns:true, ordered:true,
  rules:[ { desc:'Uses LEFT JOIN', re:'\\bLEFT\\s+(OUTER\\s+)?JOIN\\b', flags:'i' }, { desc:'Tests IS NULL', re:'\\bIS\\s+NULL\\b', flags:'i' } ]
},

{ id:'m5-l4', module:4, file:'04-join-and-aggregate.sql', type:'exercise', title:'Join + Aggregate: Revenue per Customer',
  dataset:'shop',
  concept:`<p>Joins and <code>GROUP BY</code> are best friends: join first to bring related facts side by side, then group to summarise them. "Revenue per customer" needs three tables, because the customer lives in <code>customers</code>, the order status in <code>orders</code>, and the money, quantity times unit price, in <code>order_items</code>.</p>
<pre>SELECT c.name,
       COUNT(DISTINCT o.id)       AS orders,
       SUM(oi.qty * oi.unit_price) AS revenue
FROM customers c
JOIN orders o       ON o.customer_id = c.id
JOIN order_items oi ON oi.order_id   = o.id
GROUP BY c.id, c.name;</pre>
<p>Think of the intermediate result: after the joins, there is one row per <em>order line</em>, each carrying the customer's name. <code>GROUP BY</code> then folds those lines into one row per customer, and <code>SUM</code> adds up <code>qty * unit_price</code>. Two details matter. First, we use <code>order_items.unit_price</code>, the price <em>at the time of sale</em>, not <code>products.price</code>, today's price; a historical report must use the stored line price (about a dozen lines in this database were sold at a discount). Second, because each order has several lines, a plain <code>COUNT(*)</code> would count lines, not orders; <code>COUNT(DISTINCT o.id)</code> counts each order once.</p>
<p>Group by the customer's <strong>id</strong> as well as the name: two different customers can share a name, and grouping by name alone would silently merge them. (In PostgreSQL, grouping by the primary key alone is enough to select the other columns of that table; SQLite and MySQL are looser still.)</p>
<div class="callout"><b>Common mistake:</b> filtering with <code>WHERE o.status &lt;&gt; 'cancelled'</code> is right here because we want to <em>remove cancelled orders from the revenue</em> before summing. Do not confuse it with <code>HAVING</code>, which filters finished groups. Interview trap: sort ties. Several customers could share the same revenue, so a deterministic report adds a tiebreaker such as <code>c.name</code>.</div>
<p>Real-world use: sales leaderboards, customer lifetime value, top products, revenue by month or channel: all are "join the dimensions, group, sum".</p>`,
  task:`Report revenue per customer, <strong>excluding cancelled orders</strong>. Return <code>name</code> (customer name), <code>orders</code> (number of distinct non-cancelled orders), and <code>revenue</code> (sum of <code>qty * unit_price</code> from <code>order_items</code>). Customers without qualifying orders are not needed. Sort by <code>revenue</code> descending, then <code>name</code> ascending.`,
  starter:`-- customers -> orders -> order_items
SELECT c.name
FROM customers AS c
JOIN orders AS o ON o.customer_id = c.id
GROUP BY c.id, c.name;`,
  solution:`SELECT c.name,
       COUNT(DISTINCT o.id)        AS orders,
       SUM(oi.qty * oi.unit_price) AS revenue
FROM customers AS c
JOIN orders AS o       ON o.customer_id = c.id
JOIN order_items AS oi ON oi.order_id   = o.id
WHERE o.status <> 'cancelled'
GROUP BY c.id, c.name
ORDER BY revenue DESC, c.name;`,
  columns:true, ordered:true,
  rules:[ { desc:'Joins order_items', re:'\\border_items\\b', flags:'i' }, { desc:'Uses GROUP BY', re:'\\bGROUP\\s+BY\\b', flags:'i' } ]
},

{ id:'m5-l5', module:4, file:'05-fan-out-trap-predict.sql', type:'predict', title:'The Fan-Out Trap: Summing After a One-to-Many Join',
  dataset:'shop',
  setupExtra:`ALTER TABLE orders ADD COLUMN shipping_fee INTEGER;
UPDATE orders SET shipping_fee = CASE channel WHEN 'web' THEN 500 WHEN 'wholesale' THEN 2000 ELSE 0 END;`,
  concept:`<p>This is the bug that has quietly overstated revenue in real companies. A join repeats each left row once per matching right row. If you then <code>SUM</code> a column that belongs to the <em>left</em> (the "one") side, every value is added as many times as it has matches. This is called <strong>fan-out</strong> (or the "chasm trap").</p>
<p>For this lesson we added a column <code>shipping_fee</code> to <code>orders</code>: one fee <em>per order</em> (2000 for wholesale, 500 for web, 0 for store). There are 9 wholesale orders, and between them they contain many <code>order_items</code> lines. The query joins orders to their lines and sums the fee. Think about what the intermediate join result looks like before you answer.</p>`,
  predict:{
    snippet:`SELECT SUM(o.shipping_fee) AS fees
FROM orders AS o
JOIN order_items AS oi
  ON oi.order_id = o.id
WHERE o.channel = 'wholesale';`,
    question:`What value does this return?`,
    options:['18000','34000','2000','9'],
    correctIndex:1,
    afterExplain:`<p>The 9 wholesale orders hold <strong>17 order lines</strong> between them. The join produces one row per line, so each order's 2000 fee appears once per line it has: 17 rows &times; 2000 = <strong>34000</strong>, not the true total of 9 &times; 2000 = <strong>18000</strong>. The fee was "fanned out" by the number of items.</p>
<p>How to avoid it, in order of preference:</p>
<ul>
<li><strong>Aggregate each side before joining.</strong> Sum the fees from <code>orders</code> alone, and the item revenue from <code>order_items</code> grouped by <code>order_id</code> in a subquery/CTE; then join those two one-row-per-order results.</li>
<li>Sum only the many-side's own columns after the join (like <code>qty * unit_price</code>), and fetch one-side numbers in a separate query.</li>
<li>As a sanity check, compare against a trusted total: <code>SELECT SUM(shipping_fee) FROM orders</code> must equal your joined result. If it does not, you have fan-out.</li>
</ul>
<div class="callout"><b>Interview trap:</b> <code>SUM(DISTINCT o.shipping_fee)</code> looks like a fix but is wrong: it would count the value 2000 only once, however many orders have a 2000 fee. <code>COUNT(DISTINCT o.id)</code> is a legitimate fix for <em>counting</em> orders, but there is no equally safe trick for sums. Fan-out also happens with joins that go to two different many-sides at once (orders to items <em>and</em> to payments), multiplying rows. The rule: <strong>before summing, know the grain</strong> (what one row of your joined result represents).</div>`
  }
},

{ id:'m5-l6', module:4, file:'06-multi-table-joins.sql', type:'exercise', title:'Chaining Four Tables: Customers, Orders, Items, Products',
  dataset:'shop',
  concept:`<p>Real questions rarely stay inside two tables. "How much gold jewellery did each country take?" needs the customer's country (<code>customers</code>), the order's status (<code>orders</code>), the quantity and sale price (<code>order_items</code>) and the metal (<code>products</code>). You simply chain joins; each <code>JOIN ... ON</code> hooks the next table to one already in the query.</p>
<pre>FROM customers c
JOIN orders o       ON o.customer_id = c.id
JOIN order_items oi ON oi.order_id   = o.id
JOIN products p     ON p.id          = oi.product_id</pre>
<p>Read it as a path through the diagram from the first lesson: customer &rarr; their orders &rarr; the lines of each order &rarr; the product on each line. At the end you have one row per order line, now carrying columns from all four tables, and you can filter and group on any of them.</p>
<p>A few habits keep long joins sane. <strong>Draw the path first</strong> and write the joins in that order. <strong>Alias every table</strong> with a short, consistent letter and qualify every column. <strong>Put row filters in WHERE</strong> (<code>o.status = 'delivered'</code>, <code>p.metal = 'gold'</code>), because with inner joins it makes no difference whether a condition sits in <code>ON</code> or <code>WHERE</code>; readers expect join keys in <code>ON</code> and business filters in <code>WHERE</code>. And <strong>watch the grain</strong>: here one row = one order line, so <code>SUM(oi.qty)</code> is units sold.</p>
<div class="callout"><b>Common mistake:</b> joining tables in the wrong direction or skipping the middle table. <code>customers</code> to <code>order_items</code> has no direct key; you must go through <code>orders</code>. Another: adding a join "just to be safe" that is one-to-many and multiplies rows (see the fan-out lesson). Each join should earn its place. Performance note: the optimiser reorders inner joins freely, so the order you write them in is for readers, not speed; what matters is that join columns are indexed (foreign keys on the child side).</div>
<p>Real-world use: this exact four-table join is the backbone of a retail data warehouse's sales report, and "join three or four tables and aggregate" is the standard live-coding SQL interview question.</p>`,
  task:`For <strong>delivered</strong> orders only, and only for products made of <strong>gold</strong> (<code>products.metal = 'gold'</code>), report per customer <code>country</code>: <code>country</code>, <code>units</code> (sum of <code>qty</code>) and <code>revenue</code> (sum of <code>qty * unit_price</code>). Sort by <code>revenue</code> descending, then <code>country</code>.`,
  starter:`-- customers -> orders -> order_items -> products
SELECT c.country
FROM customers AS c
GROUP BY c.country;`,
  solution:`SELECT c.country,
       SUM(oi.qty)                 AS units,
       SUM(oi.qty * oi.unit_price) AS revenue
FROM customers AS c
JOIN orders AS o       ON o.customer_id = c.id
JOIN order_items AS oi ON oi.order_id   = o.id
JOIN products AS p     ON p.id          = oi.product_id
WHERE o.status = 'delivered'
  AND p.metal  = 'gold'
GROUP BY c.country
ORDER BY revenue DESC, c.country;`,
  columns:true, ordered:true,
  rules:[ { desc:'Joins all four tables', re:'\\bproducts\\b[\\s\\S]*\\border_items\\b|\\border_items\\b[\\s\\S]*\\bproducts\\b', flags:'i' } ]
},

{ id:'m5-l7', module:4, file:'07-self-join.sql', type:'exercise', title:'Self-Join: Employees and Their Managers',
  dataset:'staff', openDataset:true,
  concept:`<p>Sometimes a table points at <em>itself</em>. In <code>staff</code>, the column <code>manager_id</code> holds the <code>id</code> of another row in the same table: Rakesh's manager is Imran, Imran's is Suresh, Suresh's is Anita, the founder, whose <code>manager_id</code> is NULL. To show "employee and manager" side by side you join the table to itself, treating it as <strong>two separate copies with different aliases</strong>: one plays the employee, the other plays the manager.</p>
<pre>SELECT e.name AS employee,
       m.name AS manager
FROM staff AS e
LEFT JOIN staff AS m
  ON m.id = e.manager_id;</pre>
<p>Aliases are not optional here; without them the database cannot tell which copy a column belongs to. The join condition reads naturally: "the manager row <code>m</code> is the one whose id equals the employee's manager_id". We use <code>LEFT JOIN</code> because the CEO has no manager: an <code>INNER JOIN</code> would silently drop the very top of the hierarchy, a classic bug in org-chart reports. For her, <code>m.name</code> comes back NULL, which you can display nicely with <code>COALESCE(m.name, 'none')</code>.</p>
<p>The same pattern answers "who has nobody reporting to them?" (LEFT JOIN a second copy on <code>r.manager_id = s.id</code> and test <code>r.id IS NULL</code>), "who earns more than their manager?" (compare <code>e.salary &gt; m.salary</code>), and category trees, comment threads (a reply points at its parent comment) and bill-of-materials tables.</p>
<div class="callout"><b>Interview trap:</b> a self-join gives you exactly <em>one level</em> of hierarchy. "List the whole chain up to the CEO" or "all direct and indirect reports" needs a <strong>recursive CTE</strong> (<code>WITH RECURSIVE</code>), which works in SQLite, PostgreSQL, MySQL 8 and SQL Server; Oracle also has <code>CONNECT BY</code>. You will write one in the CTE module.</div>`,
  task:`List every staff member with their manager, including the founder who has none. Return columns <code>employee</code> (the person's name) and <code>manager</code> (their manager's name, or the text <code>'none'</code> when there is no manager). Sort by the employee's <code>id</code> ascending.`,
  starter:`-- the same table twice: e = employee, m = manager
SELECT e.name AS employee
FROM staff AS e
ORDER BY e.id;`,
  solution:`SELECT e.name AS employee,
       COALESCE(m.name, 'none') AS manager
FROM staff AS e
LEFT JOIN staff AS m
  ON m.id = e.manager_id
ORDER BY e.id;`,
  columns:true, ordered:true,
  rules:[ { desc:'Joins staff to itself', re:'\\bJOIN\\s+staff\\b', flags:'i' }, { desc:'Uses LEFT JOIN', re:'\\bLEFT\\s+(OUTER\\s+)?JOIN\\b', flags:'i' } ]
},

{ id:'m5-l8', module:4, file:'08-cross-right-full-join.sql', type:'exercise', title:'CROSS JOIN, and RIGHT / FULL JOIN in SQLite',
  dataset:'shop',
  concept:`<p>A <code>CROSS JOIN</code> has no <code>ON</code>: it returns <strong>every combination</strong> of rows from both sides (the cartesian product). With 5 categories and 3 metals you get 15 rows. Usually a cartesian product is an accident (the forgotten <code>ON</code>) and a disaster on big tables, but used deliberately it is a classic reporting tool: build the <strong>full grid</strong> of things that <em>should</em> be shown, then <code>LEFT JOIN</code> the real data onto it. Combinations that never occurred stay in the report with a zero, instead of silently missing, like a size chart that must list every size even if none sold.</p>
<pre>SELECT c.category, m.metal, COUNT(p.id) AS n
FROM (SELECT DISTINCT category FROM products) AS c
CROSS JOIN (SELECT DISTINCT metal FROM products
            WHERE metal IS NOT NULL) AS m
LEFT JOIN products p
  ON p.category = c.category AND p.metal = m.metal
GROUP BY c.category, m.metal;</pre>
<p>Note <code>COUNT(p.id)</code>, not <code>COUNT(*)</code>: for a grid cell with no product the LEFT JOIN yields one row whose <code>p.id</code> is NULL, so <code>COUNT(p.id)</code> gives 0 while <code>COUNT(*)</code> would wrongly give 1. The same trick generates calendars (every day crossed with every shop) and test data.</p>
<p><strong>RIGHT and FULL joins.</strong> A <code>RIGHT JOIN</code> keeps all rows of the right table; a <code>FULL OUTER JOIN</code> keeps all rows of both sides, filling NULLs on whichever side lacks a match. SQLite only gained both in <strong>version 3.39</strong> (2022); older SQLite, and anything that embeds it on an older version, will say "RIGHT and FULL OUTER JOINs are not currently supported". Our in-browser SQLite is 3.45, so they work here. MySQL has <code>RIGHT JOIN</code> but still has <strong>no <code>FULL JOIN</code></strong>; the workaround is a <code>LEFT JOIN</code> <code>UNION</code> a <code>RIGHT JOIN</code>. PostgreSQL and SQL Server support both.</p>
<div class="callout"><b>Practical advice:</b> <code>FULL JOIN</code> is the right tool for reconciliation ("what is in system A but not B, and vice versa?"), such as comparing a warehouse stock list with the shop's inventory. <code>RIGHT JOIN</code> is rare: almost every team rewrites it as a LEFT JOIN by swapping the table order, which reads left to right more naturally.</div>`,
  task:`Produce a grid of every <strong>category</strong> against every <strong>metal</strong> (gold, silver, platinum; ignore NULL metal) with the number of products in each combination, including combinations with zero products. Return columns <code>category</code>, <code>metal</code> and <code>products</code>, sorted by <code>category</code> then <code>metal</code>. Use a <code>CROSS JOIN</code> to build the grid. (The two derived tables are given in the starter.)`,
  starter:`SELECT c.category, m.metal, COUNT(p.id) AS products
FROM (SELECT DISTINCT category FROM products) AS c
CROSS JOIN (SELECT DISTINCT metal FROM products
            WHERE metal IS NOT NULL) AS m
-- LEFT JOIN products p on both category and metal
GROUP BY c.category, m.metal
ORDER BY c.category, m.metal;`,
  solution:`SELECT c.category, m.metal, COUNT(p.id) AS products
FROM (SELECT DISTINCT category FROM products) AS c
CROSS JOIN (SELECT DISTINCT metal FROM products
            WHERE metal IS NOT NULL) AS m
LEFT JOIN products AS p
  ON p.category = c.category
 AND p.metal    = m.metal
GROUP BY c.category, m.metal
ORDER BY c.category, m.metal;`,
  columns:true, ordered:true,
  rules:[ { desc:'Uses CROSS JOIN', re:'\\bCROSS\\s+JOIN\\b', flags:'i' }, { desc:'Uses LEFT JOIN', re:'\\bLEFT\\s+(OUTER\\s+)?JOIN\\b', flags:'i' } ]
},

{ id:'m5-l9', module:4, file:'09-on-vs-where-predict.sql', type:'predict', title:'ON vs WHERE in a LEFT JOIN: Predict the Rows',
  dataset:'shop',
  concept:`<p>With an inner join it makes no difference whether a condition lives in <code>ON</code> or <code>WHERE</code>. With a <strong>LEFT JOIN</strong> it makes all the difference, and it is one of the most reliable interview questions.</p>
<p>The rule: <code>ON</code> decides <em>which right-side rows may match</em> a left row; left rows with no match are kept anyway (with NULLs). <code>WHERE</code> runs <em>afterwards</em> on the joined result and deletes whole rows. So a condition on the right table placed in <code>WHERE</code> will also delete the NULL-filled "no match" rows, because <code>NULL = 'cancelled'</code> is not true. The LEFT JOIN is silently turned into an INNER JOIN.</p>
<p>The question below: how many <em>cancelled</em> orders does each Mumbai customer have (including customers with none)? Customers 1 (Aarav), 16 (Neha) and 20 (Zara) live in Mumbai; Aarav and Zara each have one cancelled order, Neha has none, and between them they have 3, 2 and 5 orders in total. Trace the join carefully.</p>`,
  predict:{
    snippet:`SELECT c.name, COUNT(o.id) AS n
FROM customers AS c
LEFT JOIN orders AS o
  ON o.customer_id = c.id
 AND o.status = 'cancelled'
WHERE c.city = 'Mumbai'
GROUP BY c.id
ORDER BY c.id;`,
    question:`What rows come back (name, n)?`,
    options:[
      'Aarav Mehta, 3; Neha Gupta, 2; Zara Khan, 5',
      'Aarav Mehta, 1; Zara Khan, 1',
      'Aarav Mehta, 1; Neha Gupta, 0; Zara Khan, 1',
      'Aarav Mehta, 0; Neha Gupta, 0; Zara Khan, 0'
    ],
    correctIndex:2,
    afterExplain:`<p>The status test is in <code>ON</code>, so it only controls which orders attach to a customer. Neha has no cancelled order, so she gets no match, but a LEFT JOIN keeps her, with <code>o.id</code> NULL, and <code>COUNT(o.id)</code> counts that as 0. The <code>WHERE c.city = 'Mumbai'</code> condition is on the <em>left</em> table, which is safe in <code>WHERE</code>.</p>
<p>If you moved <code>o.status = 'cancelled'</code> to the <code>WHERE</code> clause, Neha's row (status NULL) would be removed and the result would be the second option: <code>Aarav Mehta, 1; Zara Khan, 1</code>. Same tables, same words, different answer, and the shorter result hides a customer, which is exactly the kind of bug that makes a dashboard under-report.</p>
<div class="callout"><b>Rules to remember:</b> (1) For a LEFT JOIN, conditions that describe <em>the right table</em> belong in <code>ON</code>; conditions on <em>the left table</em> belong in <code>WHERE</code>. (2) If you do put a right-table condition in <code>WHERE</code>, it should be <code>o.id IS NULL</code> (the anti-join) or you have turned the join into an inner join. (3) For an INNER JOIN the two placements are equivalent, so teams choose by readability. This behaves identically in PostgreSQL, MySQL, SQL Server and Oracle.</div>`
  }
}

);
