<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#007ACC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>SQL & Databases — Interactive Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
:root{
  --bg:#FFFFFF; --bg-sidebar:#F3F3F3; --bg-panel:#F8F8F8; --border:#E1E1E1;
  --text:#1E1E1E; --text-dim:#6E6E6E;
  --blue:#007ACC; --blue-bright:#0098FF; --blue-wash:rgba(0,122,204,.08);
  --green:#1E874B; --green-wash:rgba(30,135,75,.1);
  --red:#CD3131; --red-wash:rgba(205,49,49,.08);
  --amber:#BF8803;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%;}
body{
  background:var(--bg); color:var(--text); font-family:'Inter', system-ui, sans-serif;
  -webkit-font-smoothing:antialiased; display:flex; flex-direction:column;
  height:100vh; height:100dvh; overflow:hidden; -webkit-text-size-adjust:100%;
}
button{font-family:'Inter', system-ui, sans-serif;}
code{font-family:'JetBrains Mono', monospace; background:var(--blue-wash); color:var(--blue); padding:1px 5px; border-radius:3px; font-size:.92em;}

.titlebar{
  height:36px; flex:0 0 36px; background:#EDEDED; border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 10px; gap:10px; font-size:12.5px; color:var(--text-dim);
  padding-top:env(safe-area-inset-top); box-sizing:content-box;
}
.titlebar-dots{display:flex; gap:6px;}
.titlebar-dots i{width:11px; height:11px; border-radius:50%; display:inline-block;}
.titlebar-dots i:nth-child(1){background:#FF5F57;} .titlebar-dots i:nth-child(2){background:#FEBC2E;} .titlebar-dots i:nth-child(3){background:#28C840;}
.titlebar-title{flex:1; text-align:center; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.hamburger{display:none; background:none; border:none; font-size:22px; cursor:pointer; color:var(--text); width:44px; height:44px; margin-left:-8px;}

.app{flex:1; display:flex; min-height:0; position:relative;}
.activitybar{width:46px; flex:0 0 46px; background:var(--bg-sidebar); border-right:1px solid var(--border); display:flex; flex-direction:column; align-items:center; padding-top:10px; gap:6px;}
.activity-icon{width:34px; height:34px; border:none; background:none; border-radius:5px; cursor:pointer; font-size:17px; color:var(--text-dim); display:flex; align-items:center; justify-content:center;}
.activity-icon:hover{color:var(--text); background:rgba(0,0,0,.05);}
.activity-icon.active{color:var(--blue); border-left:2px solid var(--blue); border-radius:0;}

.sidebar{width:290px; flex:0 0 290px; background:var(--bg-sidebar); border-right:1px solid var(--border); overflow-y:auto; padding:14px 0; -webkit-overflow-scrolling:touch;}
.sidebar-header{font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--text-dim); padding:0 16px 10px;}
.sidebar-tree{padding:0 6px;}
.folder{margin-bottom:2px;}
.folder-head{display:flex; align-items:center; gap:6px; padding:8px 8px; font-size:12.5px; font-weight:600; cursor:pointer; border-radius:4px; user-select:none;}
.folder-head:hover{background:rgba(0,0,0,.04);}
.folder-chevron{font-size:10px; color:var(--text-dim); width:10px; transition:transform .12s;}
.folder.collapsed .folder-chevron{transform:rotate(-90deg);}
.folder-files{padding-left:18px;}
.folder.collapsed .folder-files{display:none;}
.file-item{display:flex; align-items:center; gap:7px; padding:7px 8px; font-size:12.5px; color:var(--text-dim); cursor:pointer; border-radius:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.file-item:hover{background:rgba(0,0,0,.04); color:var(--text);}
.file-item.active{background:var(--blue-wash); color:var(--blue); font-weight:600;}
.file-dot{width:7px; height:7px; border-radius:50%; flex:0 0 7px; border:1.5px solid var(--text-dim);}
.file-item.done .file-dot{background:var(--green); border-color:var(--green);}
.file-item.active .file-dot{border-color:var(--blue);}
.file-icon{font-size:12px; flex:0 0 16px; color:var(--amber); font-family:'JetBrains Mono',monospace;}
.sidebar-overlay{display:none;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.tabbar{height:38px; flex:0 0 38px; background:var(--bg-panel); border-bottom:1px solid var(--border); display:flex; align-items:stretch; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;}
.tab{display:flex; align-items:center; gap:8px; padding:0 12px; font-size:12.5px; color:var(--text-dim); border-right:1px solid var(--border); cursor:pointer; white-space:nowrap; background:var(--bg-panel); flex:0 0 auto;}
.tab.active{background:var(--bg); color:var(--text); border-top:2px solid var(--blue); padding-top:2px;}
.tab .tab-close{opacity:.5; font-size:14px; padding:6px 4px;}
.tab .tab-close:hover{opacity:1; color:var(--red);}
.tab-empty{display:flex; align-items:center; padding:0 12px; font-size:12.5px; color:var(--text-dim);}
.editor-scroll{flex:1; overflow-y:auto; padding:30px 34px 60px; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;}

.welcome{max-width:720px; margin:0 auto;}
.welcome-badge{display:inline-block; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--blue); border:1px solid var(--blue); background:var(--blue-wash); padding:4px 10px; border-radius:3px;}
.welcome h1{font-size:32px; font-weight:700; margin:16px 0 10px; letter-spacing:-.01em;}
.welcome p.lede{font-size:15.5px; line-height:1.65; color:var(--text-dim); max-width:60ch;}
.welcome-steps{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:28px 0;}
.welcome-step{border:1px solid var(--border); border-radius:5px; padding:14px; background:var(--bg-panel);}
.welcome-step b{display:block; font-family:'JetBrains Mono',monospace; color:var(--blue); font-size:12px; margin-bottom:6px;}
.welcome-step span{font-size:13px; color:var(--text-dim); line-height:1.5;}
.welcome-progress{margin:26px 0;}
.welcome-progress .row{display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-dim); margin-bottom:6px;}
.bar-track{height:7px; background:#E8E8E8; border-radius:4px; overflow:hidden;}
.bar-fill{height:100%; background:var(--blue); border-radius:4px; transition:width .4s;}
.btn-primary{background:var(--blue); color:#fff; border:none; font-weight:600; font-size:15px; padding:13px 24px; min-height:46px; border-radius:5px; cursor:pointer; margin-top:4px;}
.btn-primary:hover{background:var(--blue-bright);}
.btn-ghost{background:none; border:none; color:var(--text-dim); font-size:12.5px; text-decoration:underline; cursor:pointer; padding:12px 0; margin-left:14px;}
.course-map-note{margin-top:14px; font-size:12.5px; color:var(--text-dim); max-width:60ch; line-height:1.6;}

.lesson{max-width:800px; margin:0 auto;}
.lesson-eyebrow{font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--amber); line-height:1.5;}
.lesson h2{font-size:27px; font-weight:700; margin:10px 0 18px; letter-spacing:-.01em; line-height:1.25;}
.concept{font-size:15px; line-height:1.68; color:#333; margin-bottom:16px;}
.concept p{margin:0 0 10px;}
.concept ul,.concept ol{margin:0 0 12px; padding-left:22px;}
.concept li{margin-bottom:5px;}
.concept pre{background:#1E1E1E; color:#D4D4D4; font-family:'JetBrains Mono',monospace; font-size:12.8px; padding:12px 15px; border-radius:5px; overflow-x:auto; line-height:1.6; margin:10px 0 14px; -webkit-overflow-scrolling:touch;}
.concept pre code{background:none; color:inherit; padding:0; font-size:1em;}
.concept .callout{border-left:3px solid var(--amber); background:rgba(191,136,3,.07); padding:9px 13px; margin:10px 0 14px; font-size:14px; border-radius:0 4px 4px 0;}
.concept .callout b{color:var(--amber);}
.concept table.mini{border-collapse:collapse; font-size:13px; margin:8px 0 14px; display:block; overflow-x:auto;}
.concept table.mini th,.concept table.mini td{border:1px solid var(--border); padding:5px 10px; text-align:left; white-space:nowrap;}
.concept table.mini th{background:var(--bg-panel);}
.task{background:var(--blue-wash); border:1px solid rgba(0,122,204,.25); border-radius:5px; padding:12px 16px; font-size:14px; line-height:1.6; color:#1a1a1a; margin-bottom:20px;}
.task strong{color:var(--blue);}

details.dataset{margin:0 0 16px; border:1px solid var(--border); border-radius:5px; background:var(--bg-panel);}
details.dataset summary{cursor:pointer; padding:10px 14px; font-size:13px; font-weight:600; color:var(--text-dim); min-height:40px; display:flex; align-items:center;}
details.dataset pre{margin:0; padding:2px 14px 12px; font-family:'JetBrains Mono',monospace; font-size:12px; line-height:1.6; overflow-x:auto; color:#333;}

.editor-toolbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; position:sticky; top:-30px; z-index:5; background:var(--bg); padding:2px 0 0;}
.toolbar-btn{background:var(--bg); border:1px solid var(--border); color:var(--text); font-size:13.5px; font-weight:500; padding:9px 16px; min-height:40px; border-radius:4px 4px 0 0; cursor:pointer; display:flex; align-items:center; gap:6px;}
.toolbar-btn.run{background:var(--blue); color:#fff; border-color:var(--blue);}
.toolbar-btn.run:hover{background:var(--blue-bright);}
.toolbar-spacer{flex:1;}

.CodeMirror{border:1px solid var(--border); font-family:'JetBrains Mono',monospace; font-size:13.5px; height:300px;}
.CodeMirror-gutters{background:var(--bg-panel); border-right:1px solid var(--border);}
.cm-s-default .cm-keyword{color:#0000FF;} .cm-s-default .cm-string{color:#A31515;} .cm-s-default .cm-comment{color:#008000; font-style:italic;}
.cm-s-default .cm-number{color:#098658;} .cm-s-default .cm-def{color:#795E26;} .cm-s-default .cm-variable{color:#001080;}
.cm-s-default .cm-property{color:#001080;} .cm-s-default .cm-atom{color:#0000FF;} .cm-s-default .cm-builtin{color:#795E26;}

.output-panel{border:1px solid var(--border); border-top:none; background:var(--bg-panel); border-radius:0 0 4px 4px; overflow:hidden;}
.output-section-head{font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); padding:8px 14px 4px;}
.output-log{font-family:'JetBrains Mono',monospace; font-size:13px; padding:4px 14px 12px; color:#333; min-height:20px; white-space:pre-wrap; word-break:break-word;}
.output-log .empty,.empty{color:var(--text-dim); font-style:italic;}
.output-log .err{color:var(--red);}
.result-wrap{padding:2px 14px 12px; overflow-x:auto; -webkit-overflow-scrolling:touch;}
.result-note{font-size:11.5px; color:var(--text-dim); margin:0 0 5px; font-family:'JetBrains Mono',monospace;}
table.result{border-collapse:collapse; font-family:'JetBrains Mono',monospace; font-size:12.5px; background:#fff;}
table.result th{background:#EEF3F8; text-align:left; padding:5px 10px; border:1px solid var(--border); white-space:nowrap; font-weight:600;}
table.result td{padding:5px 10px; border:1px solid var(--border); white-space:nowrap;}
table.result td.null{color:var(--text-dim); font-style:italic;}
table.result td.num{text-align:right;}
.test-results{padding:2px 14px 12px; display:flex; flex-direction:column; gap:6px;}
.test-row{display:flex; align-items:flex-start; gap:8px; font-size:13px; line-height:1.5;}
.test-row .mark{flex:0 0 16px; font-weight:700;}
.test-row.pass .mark{color:var(--green);} .test-row.fail .mark{color:var(--red);}
.test-row.fail .detail{color:var(--text-dim); font-size:12px; display:block;}
.success-banner{margin-top:10px; background:var(--green-wash); border:1px solid rgba(30,135,75,.3); color:var(--green); padding:10px 14px; border-radius:4px; font-size:13.5px; font-weight:600;}
.timeout-banner{margin-top:10px; background:var(--red-wash); border:1px solid rgba(205,49,49,.3); color:var(--red); padding:10px 14px; border-radius:4px; font-size:13.5px;}
.solution-box{margin-top:14px;}
.solution-toggle{background:none; border:1px dashed var(--border); color:var(--text-dim); font-size:12.5px; padding:10px 14px; min-height:40px; border-radius:4px; cursor:pointer;}
.solution-code{display:none; margin-top:10px; background:#1E1E1E; color:#D4D4D4; font-family:'JetBrains Mono',monospace; font-size:13px; padding:14px 16px; border-radius:4px; white-space:pre-wrap; word-break:break-word; line-height:1.6;}
.solution-code.show{display:block;}

.predict-snippet .CodeMirror{height:auto; min-height:60px;}
.predict-question{font-size:15px; font-weight:600; margin:18px 0 12px; line-height:1.5;}
.predict-options{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
.predict-opt{text-align:left; background:var(--bg-panel); border:1px solid var(--border); border-radius:5px; padding:12px 14px; min-height:46px; font-family:'JetBrains Mono',monospace; font-size:13.5px; cursor:pointer; color:var(--text); word-break:break-word;}
.predict-opt:hover{border-color:var(--blue);}
.predict-opt.correct{background:var(--green-wash); border-color:var(--green); color:var(--green); font-weight:600;}
.predict-opt.wrong{background:var(--red-wash); border-color:var(--red); color:var(--red);}
.predict-explain{display:none; background:var(--blue-wash); border:1px solid rgba(0,122,204,.25); border-radius:5px; padding:13px 16px; font-size:14px; line-height:1.6; margin-bottom:14px;}
.predict-explain.show{display:block;}
.run-verify-btn{background:var(--bg); border:1px solid var(--border); font-size:13.5px; padding:10px 14px; min-height:42px; border-radius:4px; cursor:pointer; margin-bottom:14px;}
.run-verify-btn:hover{border-color:var(--blue); color:var(--blue);}

.lesson-nav{display:flex; justify-content:space-between; gap:10px; margin-top:36px; padding-top:18px; border-top:1px solid var(--border);}
.nav-btn{background:var(--bg); border:1px solid var(--border); color:var(--text); font-size:14px; padding:11px 18px; min-height:44px; border-radius:5px; cursor:pointer;}
.nav-btn:hover{border-color:var(--blue); color:var(--blue);}
.nav-btn:disabled{opacity:.35; cursor:not-allowed;}
.nav-btn.next-ready{background:var(--blue); color:#fff; border-color:var(--blue);}

.statusbar{height:26px; flex:0 0 26px; background:var(--blue); color:#fff; display:flex; align-items:center; padding:0 14px; font-size:11.5px; font-family:'JetBrains Mono',monospace; justify-content:space-between; gap:12px; padding-bottom:env(safe-area-inset-bottom); box-sizing:content-box;}
.statusbar span:first-child{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
.statusbar span:last-child{white-space:nowrap;}
::-webkit-scrollbar{width:9px; height:9px;} ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18); border-radius:99px;}

@media (max-width:860px){
  .hamburger{display:inline-block;}
  .titlebar-dots{display:none;}
  .activitybar{display:none;}
  .sidebar{position:fixed; top:calc(36px + env(safe-area-inset-top)); left:0; bottom:calc(26px + env(safe-area-inset-bottom)); width:min(320px, 86vw); z-index:40; transform:translateX(-100%); transition:transform .18s; box-shadow:2px 0 14px rgba(0,0,0,.15);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay.open{display:block; position:fixed; top:calc(36px + env(safe-area-inset-top)); left:0; right:0; bottom:calc(26px + env(safe-area-inset-bottom)); background:rgba(0,0,0,.28); z-index:39;}
  .file-item{padding:11px 8px; font-size:13px;}
  .folder-head{padding:12px 8px; font-size:13px;}
}
@media (max-width:700px){
  .editor-scroll{padding:16px 14px 48px;}
  .editor-toolbar{top:-16px;}
  .welcome h1{font-size:26px;}
  .welcome-steps{grid-template-columns:1fr 1fr;}
  .lesson h2{font-size:22px;}
  .concept{font-size:15.5px;}
  .CodeMirror{height:230px; font-size:16px;}
  .predict-snippet .CodeMirror{height:auto;}
  .output-log,.test-row{font-size:14px;}
  .lesson-nav .nav-btn{flex:1;}
  .btn-ghost{margin-left:0; display:block;}
}
</style>
</head>
<body>

<div class="titlebar">
  <button class="hamburger" id="hamburgerBtn" aria-label="Open lesson list">☰</button>
  <span class="titlebar-dots"><i></i><i></i><i></i></span>
  <div class="titlebar-title" id="titleText"></div>
  <div style="width:44px;" class="spacer-r"></div>
</div>

<div class="app">
  <div class="activitybar">
    <button class="activity-icon active" id="navExplorer" title="Explorer">🗀</button>
    <button class="activity-icon" id="navHome" title="Home">⌂</button>
  </div>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">EXPLORER</div>
    <div class="sidebar-tree" id="sidebarTree"></div>
  </div>
  <div class="main">
    <div class="tabbar" id="tabbar"></div>
    <div class="editor-scroll" id="editorScroll"></div>
  </div>
</div>

<div class="statusbar">
  <span id="statusBreadcrumb">Welcome</span>
  <span id="statusProgress"></span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>

<script>
const DATASETS = {

{ id:'m1-l1', module:0, file:'01-meet-the-database.sql', type:'explore', title:'Meet the Database: Tables, Rows and Columns',
  dataset:'shop', openDataset:true,
  concept:`<p>A <strong>relational database</strong> stores information in <strong>tables</strong>. A table is like a spreadsheet tab with strict rules: every <strong>column</strong> has a name and a type (text, integer, real number), and every <strong>row</strong> is one record: one customer, one product, one order. Unlike a spreadsheet, the database enforces the shape. You cannot put the word "pending" into a numeric price column, and you can declare that a column may never be empty (<code>NOT NULL</code>).</p>
<p>Our practice shop has four tables. <code>customers</code> and <code>products</code> describe things. <code>orders</code> says who bought and when. <code>order_items</code> says which products were on each order and how many. The tables are linked by <em>id</em> columns: <code>orders.customer_id</code> holds the <code>id</code> of a row in <code>customers</code>. You will join them in a later module. For now, one table at a time.</p>
<p>Before you query an unfamiliar database, always <em>read its schema</em>. In SQLite the schema lives in a hidden table called <code>sqlite_master</code>. In PostgreSQL you would use <code>\\d products</code> in psql or query <code>information_schema.columns</code>; in MySQL, <code>DESCRIBE products</code>. Reading the schema tells you column names, types, which columns are <code>NOT NULL</code>, and which is the <strong>primary key</strong>, the column (<code>id</code> here) that uniquely identifies each row.</p>
<pre>SELECT name, sql
FROM sqlite_master
WHERE type = 'table';</pre>
<div class="callout"><b>Real-world habit:</b> new job, new codebase, new database: the first ten minutes go to reading the schema and running <code>SELECT * FROM some_table LIMIT 5</code> on each important table to see real data. NULLs, odd status values and half-filled columns are only visible in real rows, never in the schema alone. Notice below that <code>customers.email</code> and <code>products.metal</code> allow NULL (no <code>NOT NULL</code> in their definition), and that dates are stored as plain text like <code>'2024-02-11'</code>.</div>
<p>Run the starter, then poke around: peek at 5 rows from each table, and check which columns look empty. There is no pass/fail here; running a query without an error completes the lesson.</p>`,
  starter:`-- 1) The schema: run this first.
SELECT name, sql FROM sqlite_master WHERE type = 'table';

-- 2) Replace the query above (or add one) and peek at data:
-- SELECT * FROM customers LIMIT 5;
-- SELECT * FROM products LIMIT 5;
-- SELECT * FROM orders LIMIT 5;
-- SELECT * FROM order_items LIMIT 5;`
},

{ id:'m1-l2', module:0, file:'02-select-from.sql', type:'exercise', title:'SELECT and FROM: Choosing Columns',
  dataset:'shop',
  concept:`<p>Every read query answers two questions: <em>where does the data come from</em> (<code>FROM</code>) and <em>which columns do I want</em> (<code>SELECT</code>). The result of a <code>SELECT</code> is itself a table: rows and columns that you can look at, export or feed to your application.</p>
<pre>SELECT name, city
FROM customers;</pre>
<p>Columns appear in the result in the order <strong>you list them</strong>, not the order they are stored in the table. <code>SELECT city, name</code> flips them. A statement ends with a semicolon (optional in many tools, but a good habit because it lets you run several statements in one script).</p>
<p>You will see <code>SELECT *</code>, which means "every column". It is fine in a console while exploring, but reviewers flag it in application code for three reasons. First, if someone adds a column to the table, your code silently starts receiving it (and, in the worst case, leaks something like a password hash into an API response). Second, you transfer data you never use, which costs network and memory. Third, it defeats <em>covering indexes</em> (a performance topic you will meet later), where the database can answer from the index alone only if you ask for just a few columns.</p>
<div class="callout"><b>Common mistake:</b> assuming rows come back in a meaningful order. Without an <code>ORDER BY</code>, the database may return rows in any order it likes. It often looks like insertion order on small tables, which tempts people to rely on it. It stops being true after an update, a different index, or a switch of database engine. If order matters, say so with <code>ORDER BY</code> (next module).</div>
<p>Dialect note: SQL keywords and function names are case-insensitive (<code>select</code> = <code>SELECT</code>), and in SQLite so are column names. Table and column names in PostgreSQL are folded to lower case unless double-quoted. Most teams write keywords in upper case and identifiers in lower <code>snake_case</code>, so the structure of a long query is visible at a glance.</p>`,
  task:`From <code>customers</code>, return exactly three columns in this order: <code>name</code>, <code>city</code>, <code>tier</code>. Return every customer (all 24 rows). Do not use <code>*</code>.`,
  starter:`-- name, city, tier of every customer
SELECT *
FROM customers;`,
  solution:`SELECT name, city, tier\nFROM customers;`,
  rules:[ { desc:'Does not use SELECT *', re:'SELECT\\s+\\*', flags:'i', not:true } ]
},

{ id:'m1-l3', module:0, file:'03-aliases.sql', type:'exercise', title:'Aliases with AS: Naming Your Output',
  dataset:'shop',
  concept:`<p>The column names in a result come from the table, which are often terse (<code>sku</code>, <code>qty</code>) or, once you start computing things, ugly: a calculation like <code>price * 2</code> gets a header that is literally the expression text. An <strong>alias</strong> renames a column in the <em>output</em> only. The table is untouched.</p>
<pre>SELECT sku   AS code,
       name  AS product,
       price AS "Price INR"
FROM products;</pre>
<p>If the alias contains spaces, or you want exact capitalisation, wrap it in <strong>double quotes</strong>. A plain alias is simpler and safer: <code>price_inr</code>. Single quotes <code>'...'</code> are for string <em>values</em>, double quotes for <em>identifiers</em>. SQLite is forgiving and lets you use single quotes for an alias, but PostgreSQL does not, so build the right habit now. The word <code>AS</code> is optional in most dialects (<code>price p</code>), but writing it makes the intent obvious and prevents a classic bug: forgetting a comma between two columns turns <code>SELECT name price FROM products</code> into "give me <code>name</code> under the alias <code>price</code>", and the query happily runs with the wrong data.</p>
<p>Why aliases matter in practice: application code reads columns <em>by name</em> (<code>row["product"]</code>), so the aliases are a contract between your query and your code. Reports and CSV exports show them as headers. And when you later join two tables that both have a <code>name</code> column, aliases are how you tell them apart. Table aliases (<code>FROM products AS p</code>) arrive with joins.</p>
<div class="callout"><b>Interview trap:</b> "Can I use a column alias in the WHERE clause?" In standard SQL, PostgreSQL and SQL Server, no, because <code>WHERE</code> is evaluated <em>before</em> <code>SELECT</code> creates the alias. SQLite is lenient here (and MySQL allows it in a few other places, such as <code>GROUP BY</code>), which makes code that works on a laptop fail in production on a stricter engine. You can use an alias in <code>ORDER BY</code>, which runs after <code>SELECT</code>.</div>`,
  task:`From <code>products</code>, return three columns with these exact output names, in this order: <code>sku</code> as <code>code</code>, <code>name</code> as <code>product</code>, and <code>price</code> as <code>price_inr</code>. All 20 products.`,
  starter:`-- rename the columns using AS
SELECT sku, name, price
FROM products;`,
  solution:`SELECT sku   AS code,\n       name  AS product,\n       price AS price_inr\nFROM products;`,
  columns:true,
  rules:[ { desc:'Uses AS', re:'\\bAS\\b', flags:'i' } ]
},

{ id:'m1-l4', module:0, file:'04-distinct.sql', type:'exercise', title:'DISTINCT: Removing Duplicate Rows',
  dataset:'shop',
  concept:`<p>The <code>customers</code> table has 24 rows but far fewer cities. If a marketing person asks "which cities do our customers live in?", <code>SELECT city FROM customers</code> returns Mumbai three times, Dubai three times, and so on. <code>SELECT DISTINCT</code> collapses identical result rows into one.</p>
<pre>SELECT DISTINCT city
FROM customers;</pre>
<p>The crucial detail: <strong>DISTINCT applies to the whole row of selected columns, not to the first column.</strong> <code>SELECT DISTINCT country, city</code> returns each unique <em>pair</em>. There is no such thing as "distinct on just city while also showing the name". If you add <code>name</code> to the list, every row becomes unique again and DISTINCT does nothing. (PostgreSQL has a non-standard <code>DISTINCT ON (col)</code> for exactly that need; MySQL and SQLite do not.)</p>
<p>How does the database find duplicates? It sorts or hashes the result, which costs time on big tables. So <code>DISTINCT</code> is not free decoration. A very common code smell is slapping <code>DISTINCT</code> onto a query to hide duplicate rows produced by a wrong join. The duplicates are a symptom; the join is the disease. When you see <code>SELECT DISTINCT</code> in a pull request, ask "why are there duplicates in the first place?"</p>
<div class="callout"><b>NULL note:</b> for the purposes of DISTINCT (and GROUP BY), NULLs count as <em>equal to each other</em>, so a column with five NULLs yields one NULL row. This is an exception: in a <code>WHERE</code> comparison NULL is never equal to NULL. You will meet this properly in the NULL module.</div>
<p>Real-world use: filling a dropdown of available filters (all categories, all countries), checking what values a messy column really contains before you write a <code>CASE</code> over it, or spotting typos such as <code>'Mumbai'</code> versus <code>'mumbai '</code>.</p>`,
  task:`Return the unique <code>country</code> and <code>city</code> combinations found in <code>customers</code>: two columns, <code>country</code> first, then <code>city</code>, with each combination appearing only once.`,
  starter:`-- one row per unique (country, city) pair
SELECT country, city
FROM customers;`,
  solution:`SELECT DISTINCT country, city\nFROM customers;`,
  rules:[ { desc:'Uses DISTINCT', re:'\\bDISTINCT\\b', flags:'i' } ]
},

{ id:'m1-l5', module:0, file:'05-limit-offset.sql', type:'exercise', title:'LIMIT and OFFSET: Taking a Slice',
  dataset:'shop',
  concept:`<p>Result sets can be enormous. An admin screen does not show a million orders; it shows 20 and a "next page" button. <code>LIMIT n</code> returns at most <em>n</em> rows; <code>OFFSET m</code> skips the first <em>m</em> rows before counting. Together they implement paging:</p>
<pre>-- page size 5
-- page 1: LIMIT 5 OFFSET 0
-- page 2: LIMIT 5 OFFSET 5
-- page 3: LIMIT 5 OFFSET 10
SELECT id, name
FROM customers
ORDER BY id
LIMIT 5 OFFSET 10;</pre>
<p>The formula is <code>OFFSET = (page - 1) * page_size</code>. People get this off by one all the time; write the three pages out by hand once and it sticks. Shorthand: SQLite and MySQL also accept <code>LIMIT 10, 5</code> (offset first, then count, a famous source of confusion), so prefer the explicit <code>LIMIT 5 OFFSET 10</code>.</p>
<p>Notice the <code>ORDER BY id</code>. <strong>LIMIT without ORDER BY is meaningless</strong>: the database returns "some" 5 rows, and page 2 may overlap with page 1 or skip rows, because there is no promise about order between executions. Always pair paging with a total, deterministic order. The next module goes deep on ties and on why large OFFSETs are slow.</p>
<div class="callout"><b>Dialect note:</b> <code>LIMIT</code> is used by SQLite, PostgreSQL and MySQL. SQL Server uses <code>SELECT TOP 5 ...</code> or <code>OFFSET 10 ROWS FETCH NEXT 5 ROWS ONLY</code>, which is also the official SQL standard syntax and works in PostgreSQL and Oracle 12c+. Oracle before 12c used <code>ROWNUM</code>. Interviewers like asking "how do you get the first 10 rows" to see whether you know that this varies.</div>`,
  task:`Pagination: the customers list is shown 5 per page, ordered by <code>id</code> ascending. Return page <strong>3</strong> (rows 11 to 15) with columns <code>id</code>, <code>name</code>, <code>city</code>.`,
  starter:`-- page 3, page size 5, ordered by id
SELECT id, name, city
FROM customers
ORDER BY id;`,
  solution:`SELECT id, name, city\nFROM customers\nORDER BY id\nLIMIT 5 OFFSET 10;`,
  ordered:true,
  rules:[ { desc:'Uses LIMIT', re:'\\bLIMIT\\b', flags:'i' }, { desc:'Uses OFFSET (or LIMIT a, b)', re:'\\bOFFSET\\b|LIMIT\\s+\\d+\\s*,\\s*\\d+', flags:'i' } ]
},

{ id:'m1-l6', module:0, file:'06-declarative-order.sql', type:'exercise', title:'Declarative SQL, Logical Order, Comments and Style',
  dataset:'shop',
  concept:`<p>SQL is <strong>declarative</strong>: you describe <em>what</em> result you want, not <em>how</em> to compute it. In JavaScript you write a loop, an <code>if</code>, a push into an array. In SQL you say "customers from Surat, newest first" and the database's <em>query planner</em> chooses scanning, indexes and algorithms. That is why the same query can run in milliseconds or minutes depending on indexes, with identical text.</p>
<p>Though you write <code>SELECT</code> first, the database <em>logically</em> evaluates a query in a different order. This mental model explains most "why doesn't this work?" moments:</p>
<ol><li><code>FROM</code>: pick the table(s)</li><li><code>WHERE</code>: filter rows</li><li><code>GROUP BY</code> / <code>HAVING</code>: group and filter groups</li><li><code>SELECT</code>: compute output columns and aliases</li><li><code>DISTINCT</code>: remove duplicate output rows</li><li><code>ORDER BY</code>: sort</li><li><code>LIMIT / OFFSET</code>: cut the slice</li></ol>
<p>So <code>WHERE</code> cannot see an alias made in <code>SELECT</code> (it hasn't run yet), while <code>ORDER BY</code> can. And <code>LIMIT</code> is applied <em>last</em>: "the first 3 distinct, sorted categories" is first distinct, then sorted, then cut. (The real engine may reorder physical work for speed, but the result must be as if this order were followed.)</p>
<pre>-- Top 3 categories alphabetically.
SELECT DISTINCT category   -- unique values
FROM products
ORDER BY category          -- sort the unique values
LIMIT 3;                   -- then cut</pre>
<p><strong>Comments and formatting.</strong> <code>-- text</code> comments to the end of the line; <code>/* ... */</code> can span lines. Use comments for the <em>why</em> ("excludes cancelled orders per finance"), not a restatement of the code. Format so structure is visible: one clause per line, keywords upper case, one column per line once the list gets long, indent continuation lines. Short lines also mean no sideways scrolling on a phone, and diffs in code review stay readable.</p>
<div class="callout"><b>Style tip:</b> put commas at the end of lines (or consistently at the start) and keep one convention across the project. Teams that run a formatter such as <code>sqlfluff</code> in CI never argue about it again.</div>`,
  task:`Return the three alphabetically first <strong>distinct</strong> values of <code>products.category</code> as a single column named <code>category</code>. Your query must contain at least one comment (<code>--</code> or <code>/* */</code>) explaining what it does.`,
  starter:`-- write your comment, then the query
SELECT category
FROM products;`,
  solution:`-- three alphabetically first distinct categories\nSELECT DISTINCT category\nFROM products\nORDER BY category\nLIMIT 3;`,
  ordered:true, columns:true,
  rules:[ { desc:'Contains a comment', re:'--|/\\*', flags:'' }, { desc:'Uses DISTINCT', re:'\\bDISTINCT\\b', flags:'i' }, { desc:'Uses LIMIT', re:'\\bLIMIT\\b', flags:'i' } ]
},

{ id:'m1-l7', module:0, file:'07-logical-order-predict.sql', type:'predict', title:'DISTINCT, ORDER BY, LIMIT: Predict the Result',
  dataset:'shop',
  concept:`<p>You just saw that <code>LIMIT</code> is applied after <code>DISTINCT</code> and <code>ORDER BY</code>. Now a twist: the <code>metal</code> column of <code>products</code> is NULL for loose stones (a ruby has no "metal"). Where does NULL land when you sort text? That decision is made by each database engine, and it differs between them. Work out the logical steps in order before you answer: collect metals, remove duplicates, sort ascending, keep two.</p><p>A common wrong instinct is to apply <code>LIMIT 2</code> to the raw table first (two arbitrary rows), then dedupe. That is not what happens: <code>LIMIT</code> is the very last step, so it can only ever see the sorted, de-duplicated list. Write that list out on paper (every distinct metal in sorted order, with NULL placed where SQLite puts it) and the answer is simply its first two lines. This kind of paper simulation is exactly what interviewers ask you to do on a whiteboard.</p>`,
  predict:{
    snippet:`SELECT DISTINCT metal\nFROM products\nORDER BY metal\nLIMIT 2;`,
    question:'Which rows (in order) does this return?',
    options:['gold; platinum','NULL; gold','gold; gold','gold; silver'],
    correctIndex:1,
    afterExplain:`<p>Step by step: distinct metals are gold, platinum, silver and NULL (three loose stones collapse into one NULL row, because DISTINCT treats NULLs as equal). In <strong>SQLite, NULL is considered smaller than every other value</strong>, so an ascending sort puts NULL first, giving <code>NULL; gold</code>.</p><p>Dialect trap: PostgreSQL and Oracle do the opposite and sort NULLs <em>last</em> in ascending order. MySQL and SQL Server put them first, like SQLite. PostgreSQL lets you be explicit with <code>ORDER BY metal NULLS FIRST</code>; SQLite supports that syntax too since 3.30. If your result order must not depend on the engine, handle NULLs explicitly, as you will in the next module.</p>`
  }
}

);

{ id:'m2-l1', module:1, file:'01-where-comparisons.sql', type:'exercise', title:'WHERE: Keeping Only the Rows You Want',
  dataset:'shop',
  concept:`<p>Without <code>WHERE</code>, a query returns every row. In real systems that is almost never what you want: the support team needs <em>this customer's</em> orders, finance needs <em>last month's</em> invoices, the warehouse needs products <em>below reorder level</em>. <code>WHERE</code> takes a condition and keeps only the rows for which the condition is <strong>true</strong>.</p>
<p>The comparison operators are <code>=</code>, <code>&lt;&gt;</code> (also written <code>!=</code>), <code>&lt;</code>, <code>&lt;=</code>, <code>&gt;</code>, <code>&gt;=</code>. Note that equality is a <em>single</em> <code>=</code>, not <code>==</code> as in JavaScript. Text values go in single quotes and are compared exactly (in SQLite, <code>'Gold'</code> and <code>'gold'</code> are <em>not</em> equal with <code>=</code>; MySQL's default collation would treat them as equal, a notorious difference). Dates stored as <code>'YYYY-MM-DD'</code> text compare correctly with <code>&lt;</code> and <code>&gt;</code> because that format sorts alphabetically in chronological order, which is the main reason to always store dates in ISO format.</p>
<pre>SELECT id, order_date, status
FROM orders
WHERE status = 'pending'
  AND order_date &lt; '2025-01-01';</pre>
<p>Think of <code>WHERE</code> as a bouncer evaluating each row independently. It runs <em>before</em> <code>SELECT</code> in the logical order, so it can only refer to columns of the table, not to aliases. Because it filters early, a good <code>WHERE</code> is also the single biggest performance lever: an index on <code>status</code> lets the database jump straight to the pending rows instead of reading the whole table.</p>
<div class="callout"><b>Common mistake:</b> comparing with the wrong quote style. <code>WHERE status = "pending"</code> may appear to work in SQLite (it falls back to treating the double-quoted word as a string if no such column exists) but fails or means something else in PostgreSQL, where double quotes are identifiers. Use single quotes for values, always. And the other classic: comparing a number-like text with a number, which you will see in the type lesson.</div>
<p>Real-world use: every API endpoint with a filter parameter ends up as a <code>WHERE</code>. When you build one dynamically, use <strong>bound parameters</strong> (<code>WHERE status = ?</code>) instead of pasting user input into the string. That is the whole defence against SQL injection.</p>`,
  task:`From <code>orders</code>, return <code>id</code>, <code>order_date</code>, <code>status</code> for orders that are <strong>not</strong> delivered (<code>status</code> different from <code>'delivered'</code>) <strong>and</strong> were placed on or after <code>2025-01-01</code>.`,
  starter:`-- not delivered, placed on/after 2025-01-01
SELECT id, order_date, status
FROM orders;`,
  solution:`SELECT id, order_date, status\nFROM orders\nWHERE status <> 'delivered'\n  AND order_date >= '2025-01-01';`,
  rules:[ { desc:'Uses WHERE', re:'\\bWHERE\\b', flags:'i' } ]
},

{ id:'m2-l2', module:1, file:'02-and-or-not-precedence.sql', type:'exercise', title:'AND, OR, NOT and the Precedence Trap',
  dataset:'shop',
  concept:`<p>Conditions combine with <code>AND</code> (both must be true), <code>OR</code> (at least one), and <code>NOT</code> (flip it). The danger is in <strong>precedence</strong>: just like multiplication binds tighter than addition in arithmetic, <strong><code>AND</code> binds tighter than <code>OR</code></strong>. SQL reads <code>a OR b AND c</code> as <code>a OR (b AND c)</code>, which is rarely what a human meant.</p>
<p>The shop owner says: "show me gold rings and gold necklaces under 100,000". You write what you said out loud:</p>
<pre>-- BUGGY
WHERE category = 'ring'
   OR category = 'necklace'
  AND metal = 'gold'
  AND price &lt; 100000</pre>
<p>SQL groups it as <code>category = 'ring' OR (category = 'necklace' AND metal = 'gold' AND price &lt; 100000)</code>. Now <em>every</em> ring qualifies: the 112,000 platinum Halo Ring and the 3,200 silver ring both sneak in. No error, no warning, just wrong data in a report that somebody trusts. The fix is parentheses, which you should use whenever <code>AND</code> and <code>OR</code> are mixed, even where you know the precedence:</p>
<pre>WHERE (category = 'ring' OR category = 'necklace')
  AND metal = 'gold'
  AND price &lt; 100000</pre>
<p><code>NOT</code> negates the condition after it: <code>NOT (a AND b)</code> equals <code>(NOT a) OR (NOT b)</code>, which is <strong>De Morgan's law</strong> and is genuinely useful for simplifying a hairy filter or reasoning about why a query returns too much. <code>NOT</code> binds tighter than <code>AND</code>, so <code>NOT a AND b</code> means <code>(NOT a) AND b</code>.</p>
<div class="callout"><b>Interview trap:</b> "Write a query for X or Y in category Z" tests exactly this. Also remember that <code>NOT (tier = 'gold')</code> will <em>not</em> return rows where tier is NULL: unknown stays unknown after negation. You will confirm that in the next lesson-pair on NULLs. A senior reviewer's rule of thumb: if a <code>WHERE</code> mixes <code>AND</code> and <code>OR</code> without parentheses, it is a bug until proven otherwise.</div>`,
  task:`From <code>products</code>, return <code>name</code>, <code>category</code>, <code>price</code> for <strong>gold</strong> products (<code>metal = 'gold'</code>) that are in category <code>ring</code> <em>or</em> <code>necklace</code>, and cost <strong>less than 100000</strong>. Use parentheses so that the metal and price conditions apply to both categories.`,
  starter:`-- gold rings or necklaces, price < 100000
SELECT name, category, price
FROM products
WHERE category = 'ring' OR category = 'necklace';`,
  solution:`SELECT name, category, price\nFROM products\nWHERE (category = 'ring' OR category = 'necklace')\n  AND metal = 'gold'\n  AND price < 100000;`,
  rules:[ { desc:'Uses parentheses', re:'\\(', flags:'' } ]
},

{ id:'m2-l3', module:1, file:'03-in-between-like.sql', type:'exercise', title:'IN, BETWEEN and LIKE in Depth',
  dataset:'shop',
  concept:`<p>Three operators turn clumsy conditions into readable ones, and each has a precise meaning worth knowing.</p>
<p><strong><code>IN (list)</code></strong> is shorthand for a chain of <code>OR</code>s on the same column: <code>city IN ('Mumbai', 'Surat')</code>. It is easier to read, harder to mess up with precedence, and the list may also be a subquery (module 6). <code>NOT IN</code> is the negation, and it hides a NULL trap that gets its own lesson.</p>
<p><strong><code>BETWEEN a AND b</code></strong> means <code>x &gt;= a AND x &lt;= b</code>: <em>both ends included</em>. Order matters: <code>BETWEEN 10 AND 5</code> is always empty, there is no auto-swap. For dates stored as plain <code>'YYYY-MM-DD'</code> it is perfect for whole-day ranges. If a column also stores times (<code>'2024-01-31 14:30:00'</code>), then <code>BETWEEN '2024-01-01' AND '2024-01-31'</code> silently drops everything after midnight on the 31st. The robust pattern for timestamps is a half-open range: <code>&gt;= '2024-01-01' AND &lt; '2024-02-01'</code>.</p>
<p><strong><code>LIKE</code></strong> matches text with two wildcards: <code>%</code> is "any run of characters, including none" and <code>_</code> is "exactly one character".</p>
<table class="mini"><tr><th>Pattern</th><th>Matches</th></tr><tr><td><code>'Gold%'</code></td><td>starts with Gold</td></tr><tr><td><code>'%Ring'</code></td><td>ends with Ring</td></tr><tr><td><code>'%an%'</code></td><td>contains "an"</td></tr><tr><td><code>'RG-00_'</code></td><td>RG-00 plus exactly one char</td></tr></table>
<pre>SELECT name FROM customers
WHERE name LIKE 'A%'
  AND city IN ('Surat', 'Mumbai');</pre>
<div class="callout"><b>Dialect note:</b> SQLite's <code>LIKE</code> ignores case for ASCII letters, MySQL's depends on collation (usually case-insensitive), and PostgreSQL's is case-sensitive (use <code>ILIKE</code> for the insensitive version). To search for a literal <code>%</code> you need <code>LIKE '50\\%%' ESCAPE '\\'</code>. Performance: a pattern with a <em>leading</em> wildcard (<code>'%an%'</code>) cannot use an ordinary B-tree index and forces a full scan; <code>'An%'</code> can. For serious "contains" search on large tables, real systems use full-text search (FTS5 in SQLite, <code>tsvector</code> in PostgreSQL, trigram indexes).</div>`,
  task:`From <code>customers</code>, return <code>name</code>, <code>city</code>, <code>joined_date</code> for customers who live in <code>Mumbai</code>, <code>Delhi</code> or <code>Surat</code> (use <code>IN</code>), joined during calendar year 2023 (use <code>BETWEEN</code>, inclusive), and whose name contains the letters <code>an</code> (use <code>LIKE</code>).`,
  starter:`-- cities Mumbai/Delhi/Surat, joined in 2023, name contains "an"
SELECT name, city, joined_date
FROM customers
WHERE 1 = 1;`,
  solution:`SELECT name, city, joined_date\nFROM customers\nWHERE city IN ('Mumbai', 'Delhi', 'Surat')\n  AND joined_date BETWEEN '2023-01-01' AND '2023-12-31'\n  AND name LIKE '%an%';`,
  rules:[ { desc:'Uses IN', re:'\\bIN\\s*\\(', flags:'i' }, { desc:'Uses BETWEEN', re:'\\bBETWEEN\\b', flags:'i' }, { desc:'Uses LIKE', re:'\\bLIKE\\b', flags:'i' } ]
},

{ id:'m2-l4', module:1, file:'04-not-equal-null-predict.sql', type:'predict', title:'Why "Not Gold" Misses Some Customers: Predict',
  dataset:'shop',
  concept:`<p>The <code>customers.tier</code> column holds <code>gold</code>, <code>silver</code>, <code>bronze</code>, or NULL for customers who were never classified. The marketing manager asks: "how many customers are <em>not</em> gold?" You write <code>tier &lt;&gt; 'gold'</code>. Which customers should that include? Most people say: everyone who is not gold, which includes the unclassified ones.</p>
<p>Count it by hand before you choose. The table has 24 customers; six of them are gold (ids 1, 3, 5, 10, 12, 19); three have a NULL tier (ids 9, 17, 23). Now think about what <code>NULL &lt;&gt; 'gold'</code> evaluates to. NULL means "unknown value", so asking whether an unknown value differs from 'gold' has the answer "unknown", not "true". And <code>WHERE</code> keeps only rows whose condition is true.</p>`,
  predict:{
    snippet:`SELECT COUNT(*) AS n\nFROM customers\nWHERE tier <> 'gold';`,
    question:'What does n show?',
    options:['18','15','9','6'],
    correctIndex:1,
    afterExplain:`<p>Answer: <strong>15</strong>. 24 customers minus 6 gold minus 3 NULL-tier customers. The NULL rows are not equal to 'gold', but they are not provably <em>different</em> either: the comparison yields UNKNOWN, and <code>WHERE</code> discards UNKNOWN exactly like FALSE. This is SQL's <strong>three-valued logic</strong> (true, false, unknown). It makes <code>NOT (tier = 'gold')</code> behave the same way (still 15).</p><p>If you really mean "everything that is not gold, unclassified included", say so explicitly: <code>WHERE tier &lt;&gt; 'gold' OR tier IS NULL</code>, which gives 18. MySQL has a NULL-safe equality operator <code>&lt;=&gt;</code>; PostgreSQL has <code>IS DISTINCT FROM</code>, which SQLite also supports (<code>tier IS NOT 'gold'</code> in SQLite). In interviews this is the standard "find the bug in this report" question: a count that quietly leaves out NULL rows.</p>`
  }
},

{ id:'m2-l5', module:1, file:'05-order-by.sql', type:'exercise', title:'ORDER BY: Multi-Column Sorting and Tiebreakers',
  dataset:'shop',
  concept:`<p>A relational table is an unordered <em>set</em> of rows. The only way to get a guaranteed order is <code>ORDER BY</code>, and it is the last real step before <code>LIMIT</code>. Each sort key can be followed by <code>ASC</code> (the default) or <code>DESC</code>, and you can list several: rows are sorted by the first key, and the second key only breaks <em>ties</em> in the first, and so on.</p>
<pre>SELECT name, tier, joined_date
FROM customers
ORDER BY tier DESC, joined_date ASC;</pre>
<p>Here the sort is by tier (z to a), and inside each tier by oldest membership first. You can sort by columns you do not display, by aliases (ORDER BY runs after SELECT), or by position (<code>ORDER BY 2</code>), which works but is brittle: reorder the select list and the sort silently changes.</p>
<p><strong>Deterministic ordering.</strong> If two rows tie on every sort key, the database is free to return them in either order, and may change its mind between runs, versions or after adding an index. That is harmless for a report nobody diffs, but a disaster for pagination (rows duplicated or lost between pages) and for tests that compare output. The cure is a final tiebreaker that is unique, almost always the primary key: <code>ORDER BY tier DESC, joined_date, id</code>.</p>
<p><strong>NULLs.</strong> SQLite and MySQL treat NULL as the smallest value, so it sorts first in ASC and last in DESC. PostgreSQL and Oracle treat NULL as the largest: last in ASC, first in DESC. Standard SQL lets you decide with <code>NULLS FIRST</code> / <code>NULLS LAST</code> (SQLite 3.30+, PostgreSQL, Oracle; not MySQL, where you write <code>ORDER BY col IS NULL, col</code>).</p>
<div class="callout"><b>Interview trap:</b> text sorts <em>alphabetically</em>, not numerically, so IDs stored as text sort as '10' before '9'. Also remember the sort is by the byte/collation order: in SQLite 'Zara' sorts before 'adam' (uppercase before lowercase) unless you use <code>COLLATE NOCASE</code>. And sorting a big result without an index is expensive: it is an O(n log n) operation, one reason to <code>LIMIT</code> early.</div>`,
  task:`Return <code>id</code>, <code>name</code>, <code>tier</code> for all customers ordered by <code>tier</code> descending, then <code>joined_date</code> ascending, then <code>id</code> ascending as the final tiebreaker. (Two customers share a tier <em>and</em> a join date, so the tiebreaker matters.)`,
  starter:`-- tier DESC, then joined_date ASC, then id ASC
SELECT id, name, tier
FROM customers;`,
  solution:`SELECT id, name, tier\nFROM customers\nORDER BY tier DESC, joined_date ASC, id ASC;`,
  ordered:true,
  rules:[ { desc:'Uses ORDER BY', re:'\\bORDER\\s+BY\\b', flags:'i' } ]
},

{ id:'m2-l6', module:1, file:'06-null-ordering-predict.sql', type:'predict', title:'Descending Sort with NULLs: Predict',
  dataset:'shop',
  concept:`<p>The <code>carat</code> column of <code>products</code> is only filled in for stones and diamond pieces; plenty of plain gold items have NULL. A buyer wants "the three products with the highest carat weight" and you write <code>ORDER BY carat DESC LIMIT 3</code>.</p><p>The question is where NULL goes. You learned the rule for ascending order in the last exercise; derive the descending case yourself. If NULL is the smallest value in SQLite, then a descending sort starts with the biggest real numbers and leaves the NULLs for the end. In PostgreSQL the same query would behave very differently: it would show NULL rows <em>first</em>, and your "top 3" would be three products with no carat at all. Think about which engine you are in, then pick.</p>`,
  predict:{
    snippet:`SELECT name\nFROM products\nORDER BY carat DESC\nLIMIT 3;`,
    question:'Which rows does SQLite return, in order?',
    options:['Plain Band; Silver Stackable Ring; Pearl Strand','Sapphire Cocktail Ring; Tennis Bracelet; Loose Emerald 1.5ct','Tennis Bracelet; Sapphire Cocktail Ring; Loose Emerald 1.5ct','Tennis Bracelet; Halo Ring; Choker Set'],
    correctIndex:2,
    afterExplain:`<p>Carats: Tennis Bracelet 2, Sapphire Cocktail Ring 1.8, Loose Emerald 1.5. SQLite sorts NULL as smallest, so in <code>DESC</code> the NULL rows land after every real value, and the top three are real weights.</p><p>On PostgreSQL or Oracle the same text returns NULL-carat rows first, which is a classic production bug when a query is ported. Write it so it means the same everywhere: <code>WHERE carat IS NOT NULL ORDER BY carat DESC</code> if you do not want the NULLs at all, or <code>ORDER BY carat DESC NULLS LAST</code> where supported (PostgreSQL, SQLite 3.30+). In MySQL, which lacks <code>NULLS LAST</code>, use <code>ORDER BY carat IS NULL, carat DESC</code>: the boolean <code>carat IS NULL</code> is 0 for real values and 1 for NULLs, so real values come first. Notice also that this query has no tiebreaker; it is only safe because the top three carats are distinct.</p>`
  }
},

{ id:'m2-l7', module:1, file:'07-top-n-limit.sql', type:'exercise', title:'Top-N Queries: ORDER BY + LIMIT',
  dataset:'shop',
  concept:`<p>"Top 5 customers", "latest 10 orders", "three cheapest products in stock": the <strong>top-N pattern</strong> is <code>WHERE</code> (optional) then <code>ORDER BY</code> on the measure, then <code>LIMIT N</code>. The sort direction decides whether you get the largest (<code>DESC</code>) or smallest (<code>ASC</code>) N.</p>
<pre>-- the 3 cheapest silver items
SELECT name, price
FROM products
WHERE metal = 'silver'
ORDER BY price ASC
LIMIT 3;</pre>
<p>Think about the logical order: filter first (only silver), sort what is left, then cut. If you accidentally sort and limit in a subquery and filter outside, you get the top 3 of <em>everything</em>, then filter those, and might end up with zero rows. The order of the steps matters.</p>
<p><strong>Ties at the boundary.</strong> Suppose the 3rd and 4th products have the same price. <code>LIMIT 3</code> returns exactly 3 rows and silently picks one of the tied rows, arbitrarily, unless you add a tiebreaker. Business questions are usually not that arbitrary: "top 3 sellers" might need to include everybody tied for third place. Standard SQL has <code>FETCH FIRST 3 ROWS WITH TIES</code> (PostgreSQL 13+, Oracle 12c+) and window functions like <code>RANK()</code> (a later module) handle it in every modern database. Plain <code>LIMIT</code> is a "give me exactly N rows" tool.</p>
<div class="callout"><b>Performance note:</b> <code>ORDER BY x LIMIT n</code> can be extremely fast if <code>x</code> is indexed: the database walks the index in order and stops after n rows. Without an index it must sort the whole filtered table first. That is why top-N dashboards on million-row tables depend on having the right index. Also never ask for "the max" with <code>ORDER BY ... LIMIT 1</code> if you could use <code>MAX()</code> (next module); but when you need the <em>whole row</em> of the max, ORDER BY + LIMIT 1 is the idiomatic way.</div>`,
  task:`From <code>products</code>, return <code>name</code> and <code>price</code> of the <strong>3 most expensive gold products</strong> (<code>metal = 'gold'</code>), most expensive first.`,
  starter:`-- top 3 gold products by price
SELECT name, price
FROM products;`,
  solution:`SELECT name, price\nFROM products\nWHERE metal = 'gold'\nORDER BY price DESC\nLIMIT 3;`,
  ordered:true,
  rules:[ { desc:'Uses ORDER BY ... DESC', re:'\\bORDER\\s+BY\\b[^;]*\\bDESC\\b', flags:'i' }, { desc:'Uses LIMIT', re:'\\bLIMIT\\b', flags:'i' } ]
},

{ id:'m2-l8', module:1, file:'08-pagination-keyset.sql', type:'exercise', title:'Pagination Pitfalls: OFFSET Cost and Keyset Paging',
  dataset:'shop',
  concept:`<p><code>LIMIT 20 OFFSET 100000</code> looks innocent, but the database cannot jump to row 100,001: it must produce and <em>throw away</em> the first 100,000 rows in the sort order, every single time. Page 1 is instant, page 5,000 is painfully slow, and the cost grows linearly with depth. The second problem is <strong>instability</strong>: if a new row is inserted at the top while a user is reading page 2, everything shifts by one and the last row of page 1 appears again as the first row of page 2 (or a row is skipped after a delete).</p>
<p><strong>Keyset pagination</strong> (a.k.a. seek method or cursor pagination) fixes both. Instead of saying "skip N rows", the client says "give me the rows <em>after</em> the last one I saw". The query remembers the sort key of the last row and filters on it:</p>
<pre>-- sorted by (joined_date, id); last seen:
--   joined_date = '2022-11-17', id = 7
SELECT id, name, joined_date
FROM customers
WHERE joined_date &gt; '2022-11-17'
   OR (joined_date = '2022-11-17' AND id &gt; 7)
ORDER BY joined_date, id
LIMIT 5;</pre>
<p>Because the condition matches the sort order, an index on <code>(joined_date, id)</code> lets the database seek straight to the position and read 5 rows, whatever the page depth. The sort key must be <strong>unique and total</strong>, hence <code>id</code> as a tiebreaker. In the data, two customers (ids 7 and 24) joined on the same day; with the compound condition, the one not yet seen is correctly included. If you wrote just <code>joined_date &gt; '2022-11-17'</code> you would silently skip customer 24, a nasty bug that tests with unique data never catch.</p>
<div class="callout"><b>Trade-offs:</b> keyset paging gives "next" and "previous" but not "jump to page 47", which is why infinite-scroll feeds and APIs (GitHub, Stripe, Slack cursors) use it, while admin tables with page numbers often accept OFFSET. PostgreSQL and recent MySQL/SQLite also support row values, <code>WHERE (joined_date, id) &gt; ('2022-11-17', 7)</code>, a tidier way to write the same condition. Interview answer in one line: "OFFSET is O(offset), keyset is O(page)".</div>`,
  task:`The client sorts customers by <code>joined_date</code>, then <code>id</code> (both ascending). The last row on the previous page was customer <code>id = 7</code> with <code>joined_date = '2022-11-17'</code>. Using keyset pagination (<strong>no OFFSET</strong>), return the next 5 rows with columns <code>id</code>, <code>name</code>, <code>joined_date</code>, in that same sort order.`,
  starter:`-- next page after (joined_date '2022-11-17', id 7), size 5
SELECT id, name, joined_date
FROM customers
ORDER BY joined_date, id
LIMIT 5;`,
  solution:`SELECT id, name, joined_date\nFROM customers\nWHERE joined_date > '2022-11-17'\n   OR (joined_date = '2022-11-17' AND id > 7)\nORDER BY joined_date, id\nLIMIT 5;`,
  ordered:true,
  rules:[ { desc:'Does not use OFFSET', re:'\\bOFFSET\\b', flags:'i', not:true }, { desc:'Has a WHERE condition', re:'\\bWHERE\\b', flags:'i' } ]
}

);
