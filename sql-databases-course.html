{ id:'m3-l1', module:2, file:'01-arithmetic-numeric.sql', type:'exercise', title:'Arithmetic and Numeric Functions',
  dataset:'shop',
  concept:`<p>A <code>SELECT</code> list is not limited to stored columns. Any <strong>expression</strong> works there, evaluated once per row: <code>price * stock</code> gives the money tied up in each product's inventory, without storing that number anywhere. This is a core database habit: store the facts (price, stock), <em>derive</em> everything else at query time, so derived values can never go stale.</p>
<p>Operators: <code>+ - * /</code> and <code>%</code> (remainder), with the usual precedence and parentheses. The famous trap is <strong>integer division</strong>. When both operands are integers, SQLite (and PostgreSQL, SQL Server) truncate: <code>7 / 2</code> is <code>3</code>, not 3.5. MySQL's <code>/</code> returns a decimal instead and has <code>DIV</code> for integer division, so the same line behaves differently across engines. If you want a fraction, make one side a real number: <code>7 * 1.0 / 2</code> or <code>7 / 2.0</code>. A GST (tax) calculation like <code>price * 18 / 100</code> on integer prices silently drops paise, while <code>price * 0.18</code> keeps them.</p>
<pre>SELECT name,
       price * stock          AS stock_value,
       ROUND(price * 0.18, 2) AS gst,
       ABS(price - 50000)     AS gap_from_50k
FROM products;</pre>
<p>Useful functions: <code>ROUND(x, digits)</code> rounds (SQLite rounds halves away from zero: <code>ROUND(2.5)</code> is 3), <code>ABS(x)</code> removes the sign (handy for "distance from a target"), and <code>MIN(a, b)</code> / <code>MAX(a, b)</code> with <em>two or more arguments</em> pick the smaller/larger value of a row's columns, whereas the one-argument aggregate forms (module 4) work across rows. PostgreSQL's equivalents are <code>LEAST</code> and <code>GREATEST</code>.</p>
<div class="callout"><b>Money warning:</b> never store currency as floating point in a real system. <code>0.1 + 0.2</code> is not exactly <code>0.3</code> in binary floating point, and rounding errors accumulate across millions of rows. Use integers (paise/cents), or <code>NUMERIC/DECIMAL</code> in PostgreSQL and MySQL. SQLite has no true decimal type, which is why this shop stores whole-rupee integers. Also remember: <code>ROUND(2.675, 2)</code> gives 2.67, not 2.68, for exactly that floating point reason.</div>
<p>Real-world use: line totals, margins, tax, percentages (<code>100.0 * part / total</code>), unit conversions, and "days since" calculations all live in the SELECT list.</p>`,
  task:`From <code>products</code>, for category <code>earring</code> only, return <code>name</code>, <code>price * stock</code> as <code>stock_value</code>, <code>ROUND(price * 0.18, 2)</code> as <code>gst</code>, and <code>ABS(price - 50000)</code> as <code>gap_from_50k</code>. Order by <code>stock_value</code> descending.`,
  starter:`-- earrings only: stock_value, gst (18%), gap_from_50k
SELECT name
FROM products;`,
  solution:`SELECT name,\n       price * stock          AS stock_value,\n       ROUND(price * 0.18, 2) AS gst,\n       ABS(price - 50000)     AS gap_from_50k\nFROM products\nWHERE category = 'earring'\nORDER BY stock_value DESC;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses ROUND', re:'\\bROUND\\s*\\(', flags:'i' }, { desc:'Uses ABS', re:'\\bABS\\s*\\(', flags:'i' } ]
},

{ id:'m3-l2', module:2, file:'02-case-expressions.sql', type:'exercise', title:'CASE: if/else Inside SQL',
  dataset:'shop',
  concept:`<p><code>CASE</code> is SQL's conditional expression: it evaluates conditions top to bottom and returns the value of the <strong>first one that is true</strong>. It is an expression, not a statement, so it goes anywhere a value goes: in <code>SELECT</code>, <code>ORDER BY</code>, <code>WHERE</code>, and (module 4) inside aggregates for pivot-style reports.</p>
<pre>SELECT name, price,
  CASE
    WHEN price &gt;= 100000 THEN 'premium'
    WHEN price &gt;= 20000  THEN 'standard'
    ELSE 'entry'
  END AS band
FROM products;</pre>
<p>Because the first match wins, the order of the <code>WHEN</code> branches is part of the logic. Here a 150,000 ring satisfies both of the first two conditions but gets 'premium' because that branch comes first; that is why the second test can be a simple <code>&gt;= 20000</code> without an upper bound. If no branch matches and there is no <code>ELSE</code>, the result is <strong>NULL</strong>, a quiet source of bugs: always write an <code>ELSE</code>, even if it is <code>ELSE 'unknown'</code>, so that bad data is visible.</p>
<p>There is a second, shorter form for equality on one expression: <code>CASE metal WHEN 'gold' THEN 22 WHEN 'silver' THEN 0 ELSE 0 END</code>. It cannot test NULL (since <code>metal = NULL</code> is never true) or use ranges; use the searched form above for those.</p>
<div class="callout"><b>Interview trap:</b> all branches of a CASE should return the same type. Mixing <code>THEN 1</code> and <code>THEN 'none'</code> works in SQLite but fails in PostgreSQL ("CASE types integer and text cannot be matched"). Another favourite: using CASE in <code>ORDER BY</code> for a custom sort ("gold first, then silver, then others"): <code>ORDER BY CASE tier WHEN 'gold' THEN 1 WHEN 'silver' THEN 2 ELSE 3 END</code>. This is how you sort by a business rule rather than alphabetically.</div>
<p>Real-world use: bucketing (price bands, age groups), turning codes into labels, flagging rows ("low stock"), and avoiding divide-by-zero. Application code that does <code>if/else</code> over result rows can often move into the query and shrink the data transferred.</p>`,
  task:`From <code>products</code>, return <code>name</code>, <code>price</code> and a column <code>band</code>: <code>'premium'</code> when price is at least 100000, <code>'standard'</code> when at least 20000 (and below 100000), otherwise <code>'entry'</code>. All 20 products, ordered by <code>price</code> descending, then <code>id</code> ascending.`,
  starter:`-- add a CASE column called band
SELECT name, price
FROM products
ORDER BY price DESC, id;`,
  solution:`SELECT name, price,\n       CASE\n         WHEN price >= 100000 THEN 'premium'\n         WHEN price >= 20000  THEN 'standard'\n         ELSE 'entry'\n       END AS band\nFROM products\nORDER BY price DESC, id;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses CASE ... END', re:'\\bCASE\\b[\\s\\S]*\\bEND\\b', flags:'i' } ]
},

{ id:'m3-l3', module:2, file:'03-string-functions.sql', type:'exercise', title:'String Functions: substr, lower, upper, length, replace, ||',
  dataset:'shop',
  concept:`<p>Real data is messy and display formats are picky, so you spend a surprising amount of time reshaping text. SQLite's core string toolbox (and the near-identical ones in PostgreSQL and MySQL) is small:</p>
<ul><li><code>LENGTH(s)</code>: number of characters</li><li><code>UPPER(s)</code>, <code>LOWER(s)</code>: change case</li><li><code>SUBSTR(s, start, len)</code>: slice, <strong>1-based</strong> (the first character is position 1, not 0). Omit <code>len</code> to go to the end. PostgreSQL and MySQL also offer <code>SUBSTRING</code>.</li><li><code>REPLACE(s, from, to)</code>: replace every occurrence</li><li><code>TRIM(s)</code>, <code>LTRIM</code>, <code>RTRIM</code>: strip spaces (or given characters) from the ends</li><li><code>INSTR(s, part)</code>: position of the first match, 0 if absent</li><li><code>a || b</code>: concatenation</li></ul>
<pre>SELECT sku,
       SUBSTR(sku, 1, 2)  AS prefix,    -- 'NK'
       SUBSTR(sku, 4)     AS serial,    -- '001'
       REPLACE(LOWER(name), ' ', '-') AS slug
FROM products
WHERE category = 'necklace';</pre>
<p>Functions nest: the inner one runs first, so <code>REPLACE(LOWER(name), ' ', '-')</code> lowercases, then swaps spaces for dashes. That one line turns "Temple Necklace" into a URL slug, which is exactly what e-commerce code does.</p>
<p>The <code>||</code> operator glues strings: <code>name || ' (' || metal || ')'</code> gives "Pearl Strand (gold)". Mind the dialect gap: MySQL treats <code>||</code> as logical OR by default (use <code>CONCAT(a, b)</code> there), and SQL Server uses <code>+</code> or <code>CONCAT</code>. PostgreSQL's <code>CONCAT()</code> ignores NULLs while <code>||</code> returns NULL; the next lesson predicts exactly that behaviour.</p>
<div class="callout"><b>Common mistakes:</b> (1) treating <code>SUBSTR</code> as 0-based, which is off by one in every language port. (2) Wrapping an indexed column in a function in <code>WHERE</code>: <code>WHERE LOWER(email) = 'x'</code> cannot use a plain index on <code>email</code> (the fix is an expression index in PostgreSQL/SQLite or a case-insensitive collation). (3) Cleaning data on every read instead of fixing it at write time; but when you inherit a messy database, <code>TRIM</code> and <code>LOWER</code> become your best friends for matching.</div>`,
  task:`From <code>products</code>, category <code>necklace</code> only, return five columns in this order: <code>sku</code>; <code>prefix</code> (first two characters of sku); <code>label</code> (the name, then a space and the metal in parentheses, like <code>Pearl Strand (gold)</code>); <code>name_len</code> (number of characters in name); <code>slug</code> (name in lower case with spaces replaced by dashes). Order by <code>id</code>.`,
  starter:`-- necklaces: sku, prefix, label, name_len, slug
SELECT sku
FROM products
WHERE category = 'necklace'
ORDER BY id;`,
  solution:`SELECT sku,\n       SUBSTR(sku, 1, 2)              AS prefix,\n       name || ' (' || metal || ')'   AS label,\n       LENGTH(name)                   AS name_len,\n       REPLACE(LOWER(name), ' ', '-') AS slug\nFROM products\nWHERE category = 'necklace'\nORDER BY id;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses SUBSTR/SUBSTRING', re:'\\bSUBSTR(ING)?\\s*\\(', flags:'i' }, { desc:'Uses REPLACE', re:'\\bREPLACE\\s*\\(', flags:'i' }, { desc:'Uses ||', re:'\\|\\|', flags:'' } ]
},

{ id:'m3-l4', module:2, file:'04-concat-null-predict.sql', type:'predict', title:'Concatenation with NULL: Predict',
  dataset:'shop',
  concept:`<p>Building a display label for a product page: <code>'Metal: ' || metal</code>. Product 16, "Loose Diamond 0.5ct", is a loose stone, and loose stones have no metal, so its <code>metal</code> column is NULL (you saw this in the schema). What does the label look like for that row?</p><p>Three tempting answers: the prefix survives and the missing part is just blank; the database writes the word NULL into the text; or the whole expression becomes NULL. To decide, use the one rule that governs NULL in almost every expression: <strong>NULL means "unknown", and any operation on an unknown value has an unknown result</strong>. Is "Metal: " followed by an unknown string a known string? Think it through before you pick.</p>`,
  predict:{
    snippet:`SELECT 'Metal: ' || metal\nFROM products\nWHERE id = 16;`,
    question:'What is the single value returned?',
    options:['Metal: ','Metal: NULL','NULL','An error'],
    correctIndex:2,
    afterExplain:`<p>The result is <strong>NULL</strong>, not "Metal: ". Concatenation with NULL yields NULL in SQLite, PostgreSQL and standard SQL. The fix is to supply a default for the missing piece: <code>'Metal: ' || COALESCE(metal, 'n/a')</code>.</p><p>Dialect differences worth knowing for interviews: Oracle treats the empty string as NULL, so its <code>||</code> ignores NULLs; PostgreSQL's <code>CONCAT('Metal: ', metal)</code> and <code>CONCAT_WS</code> skip NULLs and return 'Metal: '; MySQL's <code>CONCAT()</code> returns NULL if any argument is NULL, but <code>CONCAT_WS</code> skips them. This is a famous source of mailing-list bugs where addresses vanish because one name part (the middle name) is NULL: <code>first || ' ' || middle || ' ' || last</code> returns NULL for everyone without a middle name. Rule of thumb: every nullable column in a string expression needs a <code>COALESCE</code>.</p>`
  }
},

{ id:'m3-l5', module:2, file:'05-date-functions.sql', type:'exercise', title:'Date Functions: date, strftime, julianday',
  dataset:'shop',
  concept:`<p>SQLite has no real <code>DATE</code> type. Dates are stored as text in <code>'YYYY-MM-DD'</code> (or <code>'YYYY-MM-DD HH:MM:SS'</code>) form, and a family of functions interprets them. That ISO format is the one that sorts and compares correctly as text, and all of the functions below accept it. (PostgreSQL has genuine <code>DATE</code>/<code>TIMESTAMP</code> types and <code>EXTRACT</code>, <code>date_trunc</code>, and <code>date1 - date2</code> returning a number of days; MySQL has <code>DATEDIFF</code> and <code>DATE_FORMAT</code>. The ideas carry over, the spelling does not.)</p>
<ul><li><code>date(x, modifiers...)</code>: normalises to a date and can shift it: <code>date('2025-01-31', '+14 days')</code>, <code>date(d, '+1 month')</code>, <code>date(d, 'start of month')</code></li><li><code>strftime(format, x)</code>: formats parts: <code>'%Y-%m'</code> gives the year-month, <code>'%Y'</code> the year, <code>'%w'</code> weekday number (0 = Sunday)</li><li><code>julianday(x)</code>: the date as a continuous day number, so subtraction gives days between two dates</li></ul>
<pre>SELECT order_date,
  strftime('%Y-%m', order_date) AS month,
  date(order_date, '+14 days')  AS due_date,
  julianday('2025-07-01')
    - julianday(order_date)     AS days_open
FROM orders;</pre>
<p>Grouping orders by month (<code>strftime('%Y-%m', order_date)</code>) is the backbone of every sales-by-month report, as you will do in the aggregation module. <code>julianday()</code> returns a fraction (it can include time of day); wrap it in <code>CAST(... AS INTEGER)</code> for whole days. There is no DATEDIFF in SQLite.</p>
<div class="callout"><b>Course rule and real-world rule:</b> in this course we use literal dates like <code>'2025-07-01'</code> as "today", because <code>date('now')</code> would make results change from day to day. In production, "now" is the key trap in tests and caching: a query with <code>date('now')</code> is non-deterministic. Prefer passing the reference date in as a parameter. Another trap: time zones. A timestamp stored in UTC and grouped by day gives different days than the shop's local (IST) calendar, so decide and document which one a report uses.</div>`,
  task:`For <code>orders</code> with status <code>pending</code>, return <code>id</code>; <code>month</code> = the order date formatted as <code>YYYY-MM</code>; <code>due_date</code> = the order date plus 14 days; and <code>days_waiting</code> = whole days from the order date to the literal date <code>'2025-07-01'</code> (as an integer, via <code>CAST(... AS INTEGER)</code>). Order by <code>days_waiting</code> descending, then <code>id</code>.`,
  starter:`-- pending orders: id, month, due_date, days_waiting
SELECT id
FROM orders
WHERE status = 'pending';`,
  solution:`SELECT id,\n       strftime('%Y-%m', order_date) AS month,\n       date(order_date, '+14 days')  AS due_date,\n       CAST(julianday('2025-07-01')\n          - julianday(order_date) AS INTEGER) AS days_waiting\nFROM orders\nWHERE status = 'pending'\nORDER BY days_waiting DESC, id;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses strftime', re:'\\bstrftime\\s*\\(', flags:'i' }, { desc:'Uses julianday', re:'\\bjulianday\\s*\\(', flags:'i' } ]
},

{ id:'m3-l6', module:2, file:'06-null-is-null-coalesce.sql', type:'exercise', title:'NULL: IS NULL, IS NOT NULL and COALESCE',
  dataset:'shop',
  concept:`<p><strong>NULL is not a value; it is the absence of one.</strong> It means "unknown" or "not applicable" (the loose ruby has no metal; the customer who never gave an email has no email). Because the real value is unknown, SQL cannot say whether it equals anything, including another NULL. That gives <strong>three-valued logic</strong>: a condition can be TRUE, FALSE or UNKNOWN.</p>
<table class="mini"><tr><th>Expression</th><th>Result</th></tr><tr><td><code>NULL = NULL</code></td><td>UNKNOWN</td></tr><tr><td><code>NULL &lt;&gt; 5</code></td><td>UNKNOWN</td></tr><tr><td><code>NULL AND FALSE</code></td><td>FALSE</td></tr><tr><td><code>NULL OR TRUE</code></td><td>TRUE</td></tr><tr><td><code>NOT UNKNOWN</code></td><td>UNKNOWN</td></tr></table>
<p><code>WHERE</code> keeps only TRUE rows, so UNKNOWN behaves like FALSE. The consequence: <code>WHERE email = NULL</code> returns <em>nothing, ever</em>. The correct tests are <code>IS NULL</code> and <code>IS NOT NULL</code>, which always give TRUE or FALSE, never UNKNOWN.</p>
<p><code>COALESCE(a, b, c, ...)</code> returns the first argument that is not NULL, perfect for defaults on display or in arithmetic: <code>COALESCE(tier, 'unrated')</code>. It works in every major database (SQLite's two-argument <code>IFNULL</code>, MySQL's <code>IFNULL</code>, SQL Server's <code>ISNULL</code> and Oracle's <code>NVL</code> are vendor versions; use <code>COALESCE</code> and stay portable).</p>
<pre>SELECT name,
       COALESCE(email, '(no email)') AS email_shown
FROM customers
WHERE email IS NULL OR tier IS NULL;</pre>
<div class="callout"><b>Common mistakes:</b> (1) <code>= NULL</code> instead of <code>IS NULL</code> (the single most common NULL bug). (2) Forgetting that <code>WHERE tier &lt;&gt; 'gold'</code> drops NULL-tier rows. (3) Using COALESCE to hide NULLs in data that should have been <code>NOT NULL</code>: if a value is genuinely required, enforce it with a constraint (schema module) instead of papering over it in every query. (4) Putting COALESCE in a <code>WHERE</code> on an indexed column, which can stop the index being used.</div>
<p>Real-world use: reports that must show "n/a" instead of blanks, safe totals (<code>COALESCE(discount, 0)</code>), and finding data-quality gaps ("how many customers have no email?") before a mailing campaign.</p>`,
  task:`From <code>customers</code>, find customers whose <code>email</code> <em>or</em> <code>tier</code> is NULL. Return <code>id</code>, <code>name</code>, <code>email_shown</code> (the email, or <code>'(no email)'</code> when NULL) and <code>tier_shown</code> (the tier, or <code>'unrated'</code> when NULL). Order by <code>id</code>.`,
  starter:`-- customers missing an email or a tier, with defaults shown
SELECT id, name
FROM customers
ORDER BY id;`,
  solution:`SELECT id, name,\n       COALESCE(email, '(no email)') AS email_shown,\n       COALESCE(tier, 'unrated')     AS tier_shown\nFROM customers\nWHERE email IS NULL OR tier IS NULL\nORDER BY id;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses IS NULL', re:'\\bIS\\s+NULL\\b', flags:'i' }, { desc:'Uses COALESCE', re:'\\bCOALESCE\\s*\\(', flags:'i' } ]
},

{ id:'m3-l7', module:2, file:'07-not-in-subquery-predict.sql', type:'predict', title:'NOT IN with a NULL-Containing Subquery: Predict',
  dataset:'shop',
  concept:`<p>A buyer asks: "which products have a metal that no loose stone has?" Loose stones are the only category with a NULL metal, so a natural attempt uses a subquery: take the list of metals found on loose stones, and keep products whose metal is not in that list. The subquery <code>SELECT metal FROM products WHERE category = 'loose stone'</code> produces a list of values (a column from three rows). Anything that is not in that list ought to match.</p><p>Before choosing, write out what that subquery returns (look at the loose stone rows in the schema lesson's data), and then expand <code>x NOT IN (list)</code> into a chain of <code>&lt;&gt;</code> comparisons joined by <code>AND</code>. Evaluate one product, say the gold Solitaire Ring, against that chain, using three-valued logic from the last lesson. Is the result TRUE, FALSE, or UNKNOWN?</p>`,
  predict:{
    snippet:`SELECT COUNT(*) AS n\nFROM products\nWHERE metal NOT IN (\n  SELECT metal FROM products\n  WHERE category = 'loose stone'\n);`,
    question:'What is n?',
    options:['17','20','3','0'],
    correctIndex:3,
    afterExplain:`<p>The answer is <strong>0</strong>. The three loose stones all have <code>metal = NULL</code>, so the subquery returns a list of NULLs. For the Solitaire Ring, <code>'gold' NOT IN (NULL, NULL, NULL)</code> expands to <code>'gold' &lt;&gt; NULL AND 'gold' &lt;&gt; NULL AND 'gold' &lt;&gt; NULL</code>, which is UNKNOWN, not TRUE, so <code>WHERE</code> drops it. The same happens to every row, and the count is 0 rather than 17.</p><p>This is the legendary <strong>NOT IN + NULL trap</strong>, and it bites in production when a column that is "never NULL in practice" finally gets a NULL and a report suddenly returns nothing. Three robust fixes: filter the NULLs out (<code>WHERE metal IS NOT NULL</code> inside the subquery), use <code>NOT EXISTS</code> (no NULL trap, and usually the better plan too), or use an anti-join (<code>LEFT JOIN ... WHERE right.id IS NULL</code>). Note that positive <code>IN</code> does not have the problem: <code>1 IN (2, NULL)</code> is UNKNOWN, which is simply "not a match". Many seniors ban <code>NOT IN (subquery)</code> from code review for this reason.</p>`
  }
},

{ id:'m3-l8', module:2, file:'08-nullif-null-arithmetic.sql', type:'exercise', title:'NULLIF, NULL in Arithmetic, and Sorting NULLs',
  dataset:'blank',
  setupExtra:`CREATE TABLE lots (id INTEGER PRIMARY KEY, supplier TEXT, weight_g REAL, cost INTEGER, note TEXT);
INSERT INTO lots VALUES
 (1, 'Surat Gold Co',  10.0,  62000, 'ok'),
 (2, 'Jaipur Gems',     0,    15000, ''),
 (3, 'Mumbai Bullion', 25.5, 150000, NULL),
 (4, 'Surat Gold Co',   0,        0, 'weight missing'),
 (5, 'Jaipur Gems',     8.0,   NULL, 'invoice pending');`,
  openDataset:true,
  concept:`<p>Welcome to a small purchasing table, <code>lots</code>: each row is a batch of gold bought from a supplier, with its weight in grams, cost in rupees and a free-text note. Real purchasing data is exactly this ragged: a weight of 0 where nobody weighed it, an empty-string note, and a missing cost.</p>
<p><strong>NULL poisons arithmetic.</strong> <code>cost + 500</code> is NULL when cost is NULL; <code>cost / weight_g</code> is NULL when either is NULL. The unknown propagates through any expression, which is correct (you really do not know the result) but surprising when a report total goes blank. <code>COALESCE(cost, 0)</code> chooses a default when zero is a sensible assumption, but think first: treating "unknown cost" as 0 makes averages and margins lie.</p>
<p><strong><code>NULLIF(a, b)</code></strong> is COALESCE's mirror: it returns NULL when <code>a = b</code>, otherwise <code>a</code>. Its two classic uses are turning placeholder values back into real NULLs (<code>NULLIF(note, '')</code> makes the empty string NULL, so later <code>COALESCE</code> and <code>IS NULL</code> logic works) and <strong>guarding division</strong>: <code>cost / NULLIF(weight_g, 0)</code> turns a zero divisor into NULL, so you get NULL instead of a crash. In PostgreSQL, MySQL (strict mode) and SQL Server, dividing by zero raises an error and aborts the whole query; SQLite quietly returns NULL, so a query that works on your machine can fail on the production database unless you write the NULLIF guard.</p>
<pre>SELECT id,
       ROUND(cost / NULLIF(weight_g, 0), 2) AS cost_per_g
FROM lots
ORDER BY cost_per_g IS NULL, cost_per_g, id;</pre>
<p>That last line is the portable way to sort NULLs last: <code>cost_per_g IS NULL</code> is 0 for real values and 1 for NULLs (booleans are 0/1 in SQLite and MySQL; in PostgreSQL false sorts before true too), so real values come first, then ascending by value, with <code>id</code> as the tiebreaker among the NULL rows.</p>
<div class="callout"><b>Interview trap:</b> "What is the average of 10, 20 and NULL?" It is 15, not 10, because aggregates ignore NULLs (module 4), but <code>(10 + 20 + NULL) / 3</code> is NULL. Know whether you are in an aggregate or an expression. Also <code>COUNT(*)</code> counts rows, while <code>COUNT(col)</code> counts non-NULL values.</div>`,
  task:`From <code>lots</code>, return <code>id</code>; <code>cost_per_g</code> = cost divided by weight, rounded to 2 decimals, using <code>NULLIF</code> so a zero weight gives NULL; and <code>note_clean</code> = the note with empty strings turned into NULL (also with <code>NULLIF</code>). Sort lots with a known cost_per_g first, cheapest per gram first, and the NULL ones last in <code>id</code> order.`,
  starter:`-- cost_per_g (guard zero weight), note_clean, NULLs sorted last
SELECT id
FROM lots
ORDER BY id;`,
  solution:`SELECT id,\n       ROUND(cost / NULLIF(weight_g, 0), 2) AS cost_per_g,\n       NULLIF(note, '')                     AS note_clean\nFROM lots\nORDER BY cost_per_g IS NULL, cost_per_g, id;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses NULLIF', re:'\\bNULLIF\\s*\\(', flags:'i' } ]
},

{ id:'m3-l9', module:2, file:'09-cast-type-affinity.sql', type:'exercise', title:'Type Affinity and CAST',
  dataset:'blank',
  setupExtra:`CREATE TABLE shipments (id INTEGER PRIMARY KEY, ref TEXT, qty_text TEXT, rate_text TEXT);
INSERT INTO shipments VALUES
 (1, 'SH-01', '9',   '1200.50'),
 (2, 'SH-02', '10',  '999'),
 (3, 'SH-03', '100', '15.25'),
 (4, 'SH-04', '25',  '410'),
 (5, 'SH-05', 'abc', '100');`,
  openDataset:true,
  concept:`<p>Most databases are strictly typed: a column declared <code>INTEGER</code> rejects the text 'abc'. <strong>SQLite is different</strong>: it has <em>dynamic typing</em>. A value carries its own type (NULL, INTEGER, REAL, TEXT, BLOB), and a column only has a <em>type affinity</em>, a preference. An <code>INTEGER</code> column will convert '42' to the number 42 when it can, but happily stores 'hello' if it cannot. Check any value with <code>typeof(x)</code>. This flexibility is a source of data-quality bugs that PostgreSQL or MySQL strict mode would have rejected on insert, and it is one reason SQLite tables benefit from <code>STRICT</code> mode (3.37+) and <code>CHECK</code> constraints.</p>
<p>The <code>shipments</code> table shows the real-life version: quantities and rates arrived from a spreadsheet import as <strong>text</strong> columns. Text sorts alphabetically, so <code>ORDER BY qty_text</code> puts '10' before '9' (the character '1' comes before '9') and '100' before '25'. Arithmetic on text is risky too. Use <code>CAST(expr AS type)</code> to convert explicitly: <code>CAST('42' AS INTEGER)</code>, <code>CAST('1200.50' AS REAL)</code>, <code>CAST(price AS TEXT)</code>.</p>
<pre>SELECT ref,
       CAST(qty_text AS INTEGER) AS qty
FROM shipments
ORDER BY qty DESC;</pre>
<p>Casting rules to remember in SQLite: it reads the leading numeric part and ignores the rest, so <code>CAST('12abc' AS INTEGER)</code> is 12 and <code>CAST('abc' AS INTEGER)</code> is <strong>0, silently, with no error</strong>. A bad row therefore quietly becomes a zero in your totals. PostgreSQL would raise "invalid input syntax for type integer" instead, which is annoying but safer. <code>CAST(3.9 AS INTEGER)</code> truncates to 3 (it does not round). Division also depends on type: <code>CAST(a AS REAL) / b</code> forces a fractional result.</p>
<div class="callout"><b>Interview trap:</b> comparison across types. In SQLite, with no column affinity involved, any INTEGER or REAL is considered smaller than any TEXT, so <code>12 &lt; '9'</code> is true. MySQL would convert the text to a number and say false. Always compare like with like; cast one side explicitly, and fix the column type at the source, since a query that works around a wrong column type pays for it on every run (and cannot use an index on the column once you wrap it in <code>CAST</code>).</div>`,
  task:`From <code>shipments</code>, return <code>ref</code>; <code>qty</code> = <code>qty_text</code> cast to an integer; and <code>value</code> = that integer quantity times <code>rate_text</code> cast to a real number. Order by <code>qty</code> descending (numerically). Keep the 'abc' row; it will show a quantity of 0.`,
  starter:`-- ref, qty (int), value (qty * rate) ordered by qty DESC
SELECT ref
FROM shipments;`,
  solution:`SELECT ref,\n       CAST(qty_text AS INTEGER) AS qty,\n       CAST(qty_text AS INTEGER) * CAST(rate_text AS REAL) AS value\nFROM shipments\nORDER BY qty DESC;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses CAST', re:'\\bCAST\\s*\\(', flags:'i' } ]
},

{ id:'m3-l10', module:2, file:'10-mixed-type-compare-predict.sql', type:'predict', title:'Comparing Text and Numbers: Predict',
  dataset:'shop',
  concept:`<p>You have just seen that SQLite stores types per value, not per column, so the comparison operators have to define what happens when the two sides have different types. The documented rule is a fixed ranking of storage classes: NULL is smallest, then INTEGER and REAL (compared numerically with each other), then TEXT, then BLOB. When the two sides are of different classes and no column affinity applies, the ranking alone decides the answer; no conversion is attempted.</p><p>The query below compares two literals. Literals carry no column affinity, so the ranking rule is what you need. The second column does the comparison after an explicit <code>CAST</code>, so both sides really are numbers. Decide each column separately and read the answer as a pair, written <code>first, second</code>, where 1 means true and 0 means false. Remember: a very natural guess is "text '9' gets turned into 9 first". Is that what the rule above says?</p>`,
  predict:{
    snippet:`SELECT 12 < '9'                  AS a,\n       12 < CAST('9' AS INTEGER) AS b;`,
    question:'What do columns a and b show?',
    options:['0, 0','1, 0','0, 1','1, 1'],
    correctIndex:1,
    afterExplain:`<p>Column <strong>a is 1</strong>: INTEGER ranks below TEXT, so 12 is "less than" '9' no matter what the text says; no conversion happens. Column <strong>b is 0</strong> because after the CAST both sides are numbers and 12 is not less than 9. Many people expect 0, 0 (convert, then compare), which is what MySQL and some other engines would give for the first column.</p><p>Where does the conversion rule apply in SQLite? Only when one side is a <em>column</em> with a numeric affinity: <code>WHERE integer_column = '42'</code> converts the text to a number, so that works, while comparing two bare literals does not. The practical lesson for interviews and code review is to never rely on implicit conversion: cast explicitly, keep column types honest, and be suspicious of any query that compares values of different types. In PostgreSQL the untyped literal <code>'9'</code> is coerced to an integer, so the first expression would give false, and comparing an integer <em>column</em> with a text <em>column</em> raises an error, which is the more helpful behaviour.</p>`
  }
}

);

LESSONS.push(

{ id:'m4-l1', module:3, file:'01-count-variants.sql', type:'exercise', title:'COUNT(*), COUNT(col) and COUNT(DISTINCT col)',
  dataset:'shop',
  concept:`<p>So far every query returned <em>rows</em>. An <strong>aggregate function</strong> squeezes many rows into one value: how many, how much, the biggest, the average. Every dashboard number you have ever seen ("orders today", "customers per city", "revenue this month") is an aggregate. The first one to master is <code>COUNT</code>, because it comes in three flavours that give <em>different answers</em> on the same table, and mixing them up is one of the most common reporting bugs.</p>
<ul>
<li><code>COUNT(*)</code> counts <strong>rows</strong>. It does not look at any column, so NULLs cannot affect it.</li>
<li><code>COUNT(col)</code> counts rows where <code>col</code> is <strong>not NULL</strong>. It silently skips missing values.</li>
<li><code>COUNT(DISTINCT col)</code> counts the <strong>different non-NULL values</strong> of <code>col</code>, ignoring repeats.</li>
</ul>
<p>Think of a jewellery shop's customer list. <code>COUNT(*)</code> answers "how many customers do we have?". <code>COUNT(email)</code> answers "how many can we actually email?" (some customers never gave an address). <code>COUNT(DISTINCT city)</code> answers "how many different cities do we sell to?". Three different business questions, three different functions.</p>
<pre>SELECT COUNT(*)             AS rows_total,
       COUNT(email)         AS can_email,
       COUNT(DISTINCT city) AS cities
FROM customers;</pre>
<p>An aggregate query without <code>GROUP BY</code> always returns <strong>exactly one row</strong>, even if the table is empty (then <code>COUNT(*)</code> is 0). Also remember that <code>WHERE</code> runs <em>before</em> aggregation, so <code>WHERE country = 'India'</code> shrinks the rows first and the count then describes only those rows.</p>
<div class="callout"><b>Interview trap:</b> "What is the difference between <code>COUNT(*)</code> and <code>COUNT(1)</code>?" None, in practice: both count rows, and modern optimisers treat them identically. Another favourite: <code>COUNT(DISTINCT a, b)</code> is legal in MySQL but <em>not</em> in SQLite or PostgreSQL; there you count distinct pairs with a subquery or <code>COUNT(DISTINCT a || '-' || b)</code>. Also note <code>COUNT(DISTINCT ...)</code> is slower than plain <code>COUNT</code> on big tables because the database must de-duplicate, so do not sprinkle it everywhere "just in case".</div>
<p>Real-world use: data-quality checks ("how many rows are missing an email?") are just <code>COUNT(*) - COUNT(col)</code>. Analysts run that on every new table before trusting it.</p>`,
  task:`In one query over <code>customers</code>, return a single row with these five columns, using exactly these aliases: <code>total_customers</code> (all rows), <code>with_email</code> (rows with a non-NULL email), <code>with_tier</code> (rows with a non-NULL tier), <code>cities</code> (number of distinct cities) and <code>tiers</code> (number of distinct non-NULL tiers).`,
  starter:`-- one row, five aliased counts
SELECT COUNT(*) AS total_customers
FROM customers;`,
  solution:`SELECT COUNT(*)             AS total_customers,
       COUNT(email)         AS with_email,
       COUNT(tier)          AS with_tier,
       COUNT(DISTINCT city) AS cities,
       COUNT(DISTINCT tier) AS tiers
FROM customers;`,
  columns:true,
  rules:[ { desc:'Uses COUNT(DISTINCT ...)', re:'COUNT\\s*\\(\\s*DISTINCT\\b', flags:'i' } ]
},

{ id:'m4-l2', module:3, file:'02-null-in-aggregates-predict.sql', type:'predict', title:'SUM and AVG Skip NULL: Predict the Average',
  dataset:'shop',
  concept:`<p>Besides <code>COUNT</code> you will use four workhorses: <code>SUM</code>, <code>AVG</code>, <code>MIN</code> and <code>MAX</code>. They share one rule that surprises almost everybody the first time: <strong>they ignore NULL values</strong>. A NULL is not treated as zero, it is treated as "this row has nothing to say", and it is dropped from the calculation.</p>
<p>That is harmless for <code>SUM</code> (adding nothing is the same as adding zero) but it changes <code>AVG</code> a lot, because <code>AVG(x)</code> is really <code>SUM(x) / COUNT(x)</code>, and <code>COUNT(x)</code> shrinks when NULLs are skipped. In the <code>products</code> table, <code>carat</code> is only filled in for stones and diamond jewellery; a plain silver chain has NULL. The snippet below computes the average two ways. Work out the numbers before you pick.</p>`,
  predict:{
    snippet:`SELECT ROUND(AVG(carat), 2)          AS a,
       ROUND(SUM(carat) / COUNT(*), 2) AS b
FROM products;`,
    question:`The table has 20 products; 11 of them have a carat value and those carats add up to 10.55. What does the query return (a, b)?`,
    options:['0.53, 0.53','0.96, 0.96','0.53, 0.96','0.96, 0.53'],
    correctIndex:3,
    afterExplain:`<p><code>AVG(carat)</code> divides 10.55 by the <strong>11</strong> non-NULL rows, giving 0.96: the average carat <em>of the pieces that have a carat at all</em>. The second expression divides the same sum by <code>COUNT(*)</code>, all <strong>20</strong> rows, giving 0.53: the average if every missing carat were counted as zero. Neither is "wrong"; they answer different questions, and you must decide which one the business wants. If a missing value really means zero, say so explicitly with <code>AVG(COALESCE(carat, 0))</code>.</p>
<div class="callout"><b>More NULL rules to remember:</b> <code>SUM</code>, <code>AVG</code>, <code>MIN</code> and <code>MAX</code> over an <em>empty set or an all-NULL column return NULL</em>, not 0 (so wrap with <code>COALESCE(SUM(x), 0)</code> in reports). <code>COUNT</code> is the one aggregate that returns 0 in that case. <code>MIN</code>/<code>MAX</code> also work on text and dates (alphabetical / chronological order), which is how you find "first and last order date". Dialect note: in PostgreSQL and MySQL, <code>AVG</code> of an integer column returns a decimal, but in SQL Server it does <em>integer</em> division and truncates; cast first (<code>AVG(CAST(x AS FLOAT))</code>).</div>`
  }
},

{ id:'m4-l3', module:3, file:'03-group-by.sql', type:'exercise', title:'GROUP BY: One Result Row per Group',
  dataset:'shop',
  concept:`<p>A bare aggregate gives you one number for the whole table. Real questions are almost always "<em>per</em> something": orders per channel, revenue per city, stock per category. <code>GROUP BY</code> splits the rows into buckets by the value(s) you name, then runs the aggregate once per bucket, returning <strong>one row per group</strong>.</p>
<p>The mental model: the database first sorts the rows into piles, one pile for each distinct combination of the <code>GROUP BY</code> columns. Then every aggregate in your <code>SELECT</code> is computed over each pile separately. A column in the <code>SELECT</code> list must either appear in <code>GROUP BY</code> or be wrapped in an aggregate, because for any other column a pile contains many different values and SQL would not know which one to show.</p>
<pre>SELECT metal, category, COUNT(*) AS n
FROM products
GROUP BY metal, category
ORDER BY metal, category;</pre>
<p><strong>Multiple columns</strong> make groups of <em>combinations</em>: gold rings and gold necklaces are separate groups. <strong>Expressions</strong> work too: you can group by any expression, such as <code>strftime('%Y', order_date)</code> to bucket by year or <code>UPPER(city)</code> to merge case variants. In SQLite and MySQL you can write the alias or the position (<code>GROUP BY 1, 2</code>) instead of repeating the expression; PostgreSQL also allows both. SQL Server does not allow aliases in <code>GROUP BY</code>, so there you repeat the expression.</p>
<div class="callout"><b>Common mistake:</b> <code>NULL</code> is not skipped by <code>GROUP BY</code>. All NULLs land together in <em>one</em> group (so customers with no tier appear as a row whose tier is NULL). That is usually what you want, but label it with <code>COALESCE(tier, 'none')</code> so the report does not show a blank. Also, grouping by a high-cardinality column such as <code>id</code> gives one group per row and is almost always a sign that the query is wrong.</div>
<p>Real-world use: a monthly sales report is <code>GROUP BY strftime('%Y-%m', order_date)</code>; a channel mix chart is <code>GROUP BY channel</code>. Combine with <code>ORDER BY</code> (which runs <em>after</em> grouping, so it can sort by the aggregate) to rank the groups.</p>`,
  task:`From <code>orders</code>, count orders per <strong>year and channel</strong>. Return three columns with exactly these aliases: <code>order_year</code> (the 4-character year of <code>order_date</code> as text, e.g. <code>'2024'</code>), <code>channel</code>, and <code>orders</code> (the number of orders). Sort by <code>order_year</code>, then <code>channel</code>, both ascending.`,
  starter:`-- hint: strftime('%Y', order_date) gives the year as text
SELECT channel, COUNT(*) AS orders
FROM orders
GROUP BY channel;`,
  solution:`SELECT strftime('%Y', order_date) AS order_year,
       channel,
       COUNT(*) AS orders
FROM orders
GROUP BY order_year, channel
ORDER BY order_year, channel;`,
  columns:true, ordered:true,
  rules:[ { desc:'Uses GROUP BY', re:'\\bGROUP\\s+BY\\b', flags:'i' } ]
},

{ id:'m4-l4', module:3, file:'04-where-vs-having-predict.sql', type:'predict', title:'WHERE vs HAVING: Predict the Counts',
  dataset:'shop',
  concept:`<p>Both <code>WHERE</code> and <code>HAVING</code> filter, so why two keywords? Because they filter at <strong>different moments</strong>. <code>WHERE</code> removes individual <em>rows</em> before any grouping happens. <code>HAVING</code> removes whole <em>groups</em> after the aggregates have been computed. That is also why <code>HAVING</code> can say <code>COUNT(*) &gt;= 2</code> or <code>AVG(price) &gt; 60000</code> but <code>WHERE</code> cannot: at the time <code>WHERE</code> runs, no group, and therefore no aggregate, exists yet.</p>
<p>The logical order is <code>FROM</code> &rarr; <code>WHERE</code> &rarr; <code>GROUP BY</code> &rarr; <code>HAVING</code> &rarr; <code>SELECT</code> &rarr; <code>ORDER BY</code> &rarr; <code>LIMIT</code>. Trace this query step by step, in that order, before you answer. Pay attention to <em>which rows are counted</em>.</p>`,
  predict:{
    snippet:`SELECT category, COUNT(*) AS n
FROM products
WHERE price > 50000
GROUP BY category
HAVING COUNT(*) >= 2
ORDER BY category;`,
    question:`Which rows come back (category, n)?`,
    options:[
      'bracelet, 3; earring, 4; loose stone, 3; necklace, 5; ring, 5',
      'bracelet, 2; earring, 1; loose stone, 2; necklace, 3; ring, 3',
      'bracelet, 2; loose stone, 2; necklace, 3; ring, 3',
      'necklace, 3; ring, 3'
    ],
    correctIndex:2,
    afterExplain:`<p>Step 1, <code>WHERE price &gt; 50000</code> throws away the cheap products <em>first</em>. Of the 20 products only some survive: 3 necklaces, 3 rings, 2 bracelets, 2 loose stones and just 1 earring (the Platinum Drops). Step 2 groups the survivors. Step 3, <code>HAVING COUNT(*) &gt;= 2</code>, drops the earring group because its count is 1. The counts shown are counts of the <em>filtered</em> rows, which is why bracelet shows 2, not 3. The first option is what you would get with no <code>WHERE</code> (counting everything); the second is what you would get if <code>HAVING</code> did nothing.</p>
<div class="callout"><b>Rule of thumb (and interview answer):</b> if a condition can be tested on a single row, put it in <code>WHERE</code>; only conditions on aggregates belong in <code>HAVING</code>. Moving row-level filters into <code>WHERE</code> is faster, because fewer rows are grouped, and lets the database use indexes. Writing <code>HAVING category = 'ring'</code> works in most databases but is a code-review red flag. Dialect note: standard SQL (and PostgreSQL, SQL Server) forbid using a SELECT alias inside <code>HAVING</code>; SQLite and MySQL allow it. Write the aggregate out to stay portable.</div>`
  }
},

{ id:'m4-l5', module:3, file:'05-having.sql', type:'exercise', title:'Filtering Groups with HAVING',
  dataset:'shop',
  concept:`<p>You now know <em>when</em> <code>HAVING</code> runs. Let us use it the way it appears in real reports: "show me only the groups that matter". A merchandiser does not want a table with every category if some have a single product; a finance analyst wants customers with at least three orders; a data cleaner wants duplicates, which is the classic <code>GROUP BY email HAVING COUNT(*) &gt; 1</code>.</p>
<p>The pattern is always the same three-layer sandwich. <code>WHERE</code> picks the rows that are allowed into the calculation, <code>GROUP BY</code> forms buckets, <code>HAVING</code> keeps only the buckets whose aggregate passes a test:</p>
<pre>SELECT metal, COUNT(*) AS n, SUM(stock) AS units
FROM products
WHERE price &gt; 5000            -- rows
GROUP BY metal
HAVING SUM(stock) &gt; 100;      -- groups</pre>
<p>You can combine several aggregate conditions with <code>AND</code>/<code>OR</code> inside <code>HAVING</code>, and you can aggregate something different from what you show: <code>HAVING MAX(price) &gt; 100000</code> keeps categories that contain at least one premium piece, even though the output only displays a count. This is also the standard way to ask "do <em>all</em> rows in the group satisfy X?": <code>HAVING MIN(price) &gt; 10000</code> means every product in the group costs more than 10000.</p>
<div class="callout"><b>Common mistake:</b> using <code>HAVING</code> without <code>GROUP BY</code>. Some databases allow it (the whole table is one group), but it is nearly always a sign you wanted <code>WHERE</code>. Another: forgetting that <code>ROUND(AVG(x))</code> in the SELECT does not change what <code>HAVING AVG(x)</code> sees; the comparison uses the unrounded value. In MySQL's older modes and in SQLite you may also see <code>HAVING n &gt;= 2</code> using the alias, which works there but will fail in PostgreSQL.</div>
<p>Real-world use: "customers with 3+ orders" (loyalty), "products sold in fewer than 2 orders" (dead stock candidates), "days with revenue above target" are all one <code>HAVING</code> away.</p>`,
  task:`Considering only <strong>gold</strong> products (<code>metal = 'gold'</code>), report each category that has <strong>at least 2</strong> gold products. Return columns <code>category</code>, <code>products</code> (the count) and <code>avg_price</code> (the average price rounded to a whole number with <code>ROUND(AVG(price))</code>), sorted by <code>category</code>.`,
  starter:`-- filter rows with WHERE, groups with HAVING
SELECT category,
       COUNT(*) AS products
FROM products
GROUP BY category;`,
  solution:`SELECT category,
       COUNT(*) AS products,
       ROUND(AVG(price)) AS avg_price
FROM products
WHERE metal = 'gold'
GROUP BY category
HAVING COUNT(*) >= 2
ORDER BY category;`,
  columns:true, ordered:true,
  rules:[ { desc:'Uses HAVING', re:'\\bHAVING\\b', flags:'i' }, { desc:'Uses WHERE for the row filter', re:'\\bWHERE\\b', flags:'i' } ]
},

{ id:'m4-l6', module:3, file:'06-conditional-aggregation.sql', type:'exercise', title:'Conditional Aggregation: Pivoting with CASE',
  dataset:'shop',
  concept:`<p>Sometimes a manager wants a <strong>cross-tab</strong>: one row per category, and a <em>column</em> for each metal. A plain <code>GROUP BY category, metal</code> gives a tall list (one row per combination), not a wide grid. The technique that turns tall into wide is <strong>conditional aggregation</strong>: put a <code>CASE</code> expression <em>inside</em> the aggregate, so each aggregate only "sees" the rows you want.</p>
<pre>SELECT category,
  SUM(CASE WHEN metal = 'gold'
           THEN stock ELSE 0 END) AS gold_units,
  SUM(CASE WHEN metal = 'silver'
           THEN stock ELSE 0 END) AS silver_units
FROM products
GROUP BY category;</pre>
<p>For each row, the <code>CASE</code> returns the stock if the row is gold, otherwise 0; then <code>SUM</code> adds those up per category. Each output column is a separate "filtered" sum computed in a single pass over the table, which is far better than running one query per metal. To count instead of sum, return 1 or NULL: <code>COUNT(CASE WHEN status = 'delivered' THEN 1 END)</code> (no <code>ELSE</code> means NULL, and <code>COUNT</code> skips NULLs). Without conditional logic, orders per status would need five queries; with it, one query yields a whole dashboard row: total, delivered, pending, cancelled and a cancellation rate.</p>
<div class="callout"><b>Dialect note and trap:</b> PostgreSQL (and SQLite 3.30+) offer the neater <code>COUNT(*) FILTER (WHERE status = 'delivered')</code>; MySQL and SQL Server do not, so <code>CASE</code> is the portable way. Don't forget the <code>ELSE 0</code> in a <code>SUM</code>: without it, a group with no matching rows sums only NULLs and returns NULL instead of 0, which looks like a bug in the report. And write NULL tests as <code>WHEN metal IS NULL</code>: <code>metal = NULL</code> is never true.</div>
<p>Real-world use: monthly revenue by channel as columns, pass/fail counts, "new vs returning" splits, and the classic interview task "pivot this table without a PIVOT keyword" (only SQL Server and Oracle have <code>PIVOT</code>).</p>`,
  task:`Build a stock cross-tab with one row per product <code>category</code> and the total <code>stock</code> units split by metal. Columns, with exactly these aliases: <code>category</code>, <code>gold</code>, <code>silver</code>, <code>platinum</code>, and <code>no_metal</code> (products whose <code>metal</code> is NULL). Every metal column must show 0, not NULL, when a category has none. Sort by <code>category</code>.`,
  starter:`-- one SUM(CASE ...) per column
SELECT category,
       SUM(CASE WHEN metal = 'gold' THEN stock ELSE 0 END) AS gold
FROM products
GROUP BY category
ORDER BY category;`,
  solution:`SELECT category,
  SUM(CASE WHEN metal = 'gold'     THEN stock ELSE 0 END) AS gold,
  SUM(CASE WHEN metal = 'silver'   THEN stock ELSE 0 END) AS silver,
  SUM(CASE WHEN metal = 'platinum' THEN stock ELSE 0 END) AS platinum,
  SUM(CASE WHEN metal IS NULL      THEN stock ELSE 0 END) AS no_metal
FROM products
GROUP BY category
ORDER BY category;`,
  columns:true, ordered:true,
  rules:[ { desc:'Uses CASE inside an aggregate', re:'\\bCASE\\b', flags:'i' } ]
},

{ id:'m4-l7', module:3, file:'07-group-concat.sql', type:'exercise', title:'group_concat: Many Rows into One Text Cell',
  dataset:'shop',
  concept:`<p>Aggregates do not have to produce numbers. A very practical one glues text from many rows into a single string: "for each category, give me a comma-separated list of its products". In SQLite and MySQL it is <code>group_concat</code> (MySQL spells it <code>GROUP_CONCAT</code>); in PostgreSQL and SQL Server (2017+) the standard-style name is <code>string_agg(expr, separator)</code>; Oracle uses <code>LISTAGG</code>. Same idea, different names, a classic "know your dialect" interview point.</p>
<pre>SELECT category,
       group_concat(name, ', ') AS items
FROM products
GROUP BY category;</pre>
<p>The second argument is the separator (default is a comma without a space). Like other aggregates, it skips NULLs. <code>group_concat(DISTINCT metal)</code> removes duplicates, but with <code>DISTINCT</code> SQLite only allows the default separator.</p>
<p>The subtle part is <strong>order</strong>. Rows inside a group have no guaranteed order, so the list may come back as "Gold Kada, Tennis Bracelet" today and a different order after an index changes. Since SQLite 3.44 you can control it inside the call: <code>group_concat(name, ', ' ORDER BY name)</code>. PostgreSQL's <code>string_agg(name, ', ' ORDER BY name)</code> and MySQL's <code>GROUP_CONCAT(name ORDER BY name SEPARATOR ', ')</code> have the same feature. On older SQLite you sort a subquery first and hope; do not rely on that in production.</p>
<div class="callout"><b>Trap and limits:</b> MySQL silently truncates <code>GROUP_CONCAT</code> output at <code>group_concat_max_len</code> (1024 bytes by default), so a long list can be cut with no error. Also, packing lists into a cell is great for display, exports and CSV-style reports, but it is a poor way to <em>store</em> data: a comma-separated column breaks normalisation (you meet this properly in the schema design module) and you can no longer filter or join on its elements.</div>
<p>Real-world use: an order summary email line ("Halo Ring, Plain Band"), a dashboard cell listing which channels a customer used, or showing the tags of an article next to its title.</p>`,
  task:`For each product <code>category</code> return: <code>category</code>, <code>n</code> (number of products) and <code>products</code> (all product names in that category joined with <code>', '</code> (comma and space), <strong>sorted alphabetically</strong> by name). Sort the result by <code>category</code>.`,
  starter:`-- remember the ORDER BY goes inside group_concat(...)
SELECT category,
       COUNT(*) AS n
FROM products
GROUP BY category
ORDER BY category;`,
  solution:`SELECT category,
       COUNT(*) AS n,
       group_concat(name, ', ' ORDER BY name) AS products
FROM products
GROUP BY category
ORDER BY category;`,
  columns:true, ordered:true,
  rules:[ { desc:'Uses group_concat', re:'group_concat\\s*\\(', flags:'i' } ]
},

{ id:'m4-l8', module:3, file:'08-bare-column-trap-predict.sql', type:'predict', title:'The Non-Aggregated Column Trap (and Execution Order)',
  dataset:'shop',
  concept:`<p>Earlier we said every selected column must be in <code>GROUP BY</code> or inside an aggregate. PostgreSQL, SQL Server, Oracle and modern MySQL enforce that with an error ("column must appear in the GROUP BY clause or be used in an aggregate function"; in MySQL it is the <code>ONLY_FULL_GROUP_BY</code> mode). <strong>SQLite does not enforce it.</strong> It lets you select a "bare" column next to an aggregate and then picks a value from some row in the group. Occasionally that is useful, but it is a trap when you port the query or misunderstand what you get.</p>
<p>SQLite has one documented special case: when the query contains a single <code>MIN()</code> or <code>MAX()</code>, the bare columns are taken from the row that holds that min/max. Everything else is arbitrary. Predict what comes back here, then read the explanation.</p>`,
  predict:{
    snippet:`SELECT name, MAX(price) AS top
FROM products
WHERE category = 'ring';`,
    question:`What does it return (name, top)?`,
    options:[
      'Solitaire Ring, 112000',
      'Halo Ring, 112000',
      'Silver Stackable Ring, 112000',
      'It raises an error'
    ],
    correctIndex:1,
    afterExplain:`<p>SQLite's bare-column rule gives the name from the row with the highest price: the Halo Ring at 112000. It "works", but only by this SQLite-specific special case. In PostgreSQL the same query fails with an error; in older MySQL it returns an arbitrary row's name, which is silently wrong. The portable way to ask "which product is the most expensive in each category" is to find the max in a subquery (or a window function, later in the course) and join back; you will write exactly that in the next modules.</p>
<p><b>Execution-order recap</b> (it explains almost every aggregation error you will ever see). The database <em>reads</em> your query top-down, but <em>runs</em> it in this logical order: <code>FROM</code>/<code>JOIN</code> (build the rows) &rarr; <code>WHERE</code> (filter rows) &rarr; <code>GROUP BY</code> (make groups) &rarr; aggregates computed &rarr; <code>HAVING</code> (filter groups) &rarr; <code>SELECT</code> (compute output columns and aliases) &rarr; <code>DISTINCT</code> &rarr; <code>ORDER BY</code> &rarr; <code>LIMIT</code>. Consequences: <code>WHERE</code> cannot use aggregates or SELECT aliases (they do not exist yet); <code>ORDER BY</code> can use aliases (it runs after <code>SELECT</code>); and a bare column is ambiguous because after <code>GROUP BY</code> there is only one row per group.</p>
<div class="callout"><b>Interview trap:</b> "Why does <code>SELECT category, name, COUNT(*) FROM products GROUP BY category</code> error in PostgreSQL but run in SQLite?" Answer: SQLite permits bare columns and returns an arbitrary row's value; strict engines refuse because the result would be non-deterministic. Senior reviewers flag it in PRs even when it happens to run.</div>`
  }
}

);
