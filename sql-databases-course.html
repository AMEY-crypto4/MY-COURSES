{ id:'m11-l1', module:10, file:'01-monthly-revenue-mom.sql', type:'exercise', title:'Monthly Revenue and Month-over-Month Growth',
  dataset:'shop', openDataset:true,
  concept:`<p>The first question every owner asks is "are we growing?". Answering it needs three ideas you already have, used together: <strong>bucket</strong> dates into months, <strong>aggregate</strong> money per bucket, and compare each bucket with the <strong>previous one</strong>. The last step is exactly what the window function <code>LAG()</code> was invented for.</p>
<p>Start by deciding what "revenue" means, because every number you ever publish depends on it. In this shop, an order's value is its lines: <code>SUM(qty * unit_price)</code> (use the price on the line, not today's catalogue price, because prices change). And cancelled orders are not revenue. A junior analyst who forgets the status filter overstates sales; a senior one writes the definition once, in a CTE, and reuses it.</p>
<pre>WITH monthly AS (
  SELECT strftime('%Y-%m', o.order_date) AS month,
         SUM(oi.qty * oi.unit_price) AS revenue
  FROM orders o
  JOIN order_items oi ON oi.order_id = o.id
  WHERE o.status &lt;&gt; 'cancelled'
  GROUP BY month
)
SELECT month, revenue,
       LAG(revenue) OVER (ORDER BY month) AS prev
FROM monthly;</pre>
<p>Growth percentage is <code>(this - previous) / previous * 100</code>. Multiply by <code>100.0</code> (a decimal), not <code>100</code>, otherwise integer division truncates the result. The first month has no predecessor, so <code>LAG</code> returns NULL and the growth is NULL too: that is the honest answer, do not replace it with 0.</p>
<div class="callout"><b>Interview trap (gap months):</b> <code>LAG</code> looks at the previous <em>row</em>, not the previous <em>calendar month</em>. This shop had no sales at all in March 2024, so there is no March row, and April's "previous" is February. On a real dashboard you would generate a calendar table (recursive CTE) and <code>LEFT JOIN</code> to it so empty months appear as 0. Here we state the rule explicitly: compare with the previous month <em>that has sales</em>. Dialect note: <code>strftime</code> is SQLite; PostgreSQL uses <code>date_trunc('month', d)</code> or <code>to_char(d,'YYYY-MM')</code>; MySQL uses <code>DATE_FORMAT(d,'%Y-%m')</code>.</div>
<p>Real-world: this exact query feeds the revenue line of nearly every BI dashboard, and "month over month" appears in the first interview round of most analyst roles.</p>`,
  task:`Return one row per month with sales (cancelled orders excluded; revenue = <code>SUM(qty * unit_price)</code>) and columns <code>month</code> (YYYY-MM), <code>revenue</code>, <code>prev_revenue</code> (revenue of the previous month that has sales, NULL for the first), and <code>growth_pct</code> = growth over <code>prev_revenue</code> in percent, rounded to 1 decimal (NULL for the first). Order by <code>month</code>.`,
  starter:`-- 1. monthly CTE (exclude cancelled)
-- 2. LAG(revenue) OVER (ORDER BY month)
-- 3. growth_pct = ROUND(100.0 * (rev - prev) / prev, 1)
WITH monthly AS (
  SELECT strftime('%Y-%m', order_date) AS month
  FROM orders
  GROUP BY month
)
SELECT month FROM monthly ORDER BY month;`,
  solution:`WITH monthly AS (
  SELECT strftime('%Y-%m', o.order_date) AS month,
         SUM(oi.qty * oi.unit_price) AS revenue
  FROM orders o
  JOIN order_items oi ON oi.order_id = o.id
  WHERE o.status <> 'cancelled'
  GROUP BY month
), lagged AS (
  SELECT month, revenue,
         LAG(revenue) OVER (ORDER BY month) AS prev_revenue
  FROM monthly
)
SELECT month, revenue, prev_revenue,
       ROUND(100.0 * (revenue - prev_revenue) / prev_revenue, 1)
         AS growth_pct
FROM lagged
ORDER BY month;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses LAG', re:'\\bLAG\\s*\\(', flags:'i' } ]
},

{ id:'m11-l2', module:10, file:'02-cancelled-order-leakage.sql', type:'exercise', title:'Cancelled-Order Leakage by Channel',
  dataset:'shop',
  concept:`<p>"Leakage" is revenue that was booked and then lost: here, cancelled orders. A single total (say "7% of order value cancels") hides where the problem is. The useful report slices it: which <em>sales channel</em> leaks, how many orders were involved, and how large the loss is relative to what was ordered. That points the owner at the real fix, for example wholesale buyers cancelling big deposits-free orders.</p>
<p>The technique is <strong>conditional aggregation</strong>: compute the total and the filtered total in the same pass using <code>SUM(CASE WHEN ... THEN x ELSE 0 END)</code>. It replaces two separate queries joined together, and it is the backbone of pivot-style reports in any database.</p>
<pre>SELECT o.channel,
  SUM(oi.qty * oi.unit_price) AS gross_value,
  SUM(CASE WHEN o.status = 'cancelled'
           THEN oi.qty * oi.unit_price
           ELSE 0 END) AS cancelled_value
FROM orders o
JOIN order_items oi ON oi.order_id = o.id
GROUP BY o.channel;</pre>
<p>Counting orders is more delicate. The join to <code>order_items</code> repeats each order once per line, so <code>COUNT(o.id)</code> counts lines, not orders. This is the classic <strong>fan-out</strong> bug: any count of the "one" side after joining to the "many" side must use <code>COUNT(DISTINCT o.id)</code>. Pairing it with <code>CASE</code> gives the cancelled-order count: <code>COUNT(DISTINCT CASE WHEN o.status='cancelled' THEN o.id END)</code>; the CASE returns NULL for other rows and <code>COUNT</code> ignores NULLs.</p>
<div class="callout"><b>Common mistake:</b> computing the percentage with integer maths or from rounded numbers. Use <code>100.0 * cancelled / gross</code> on the raw sums and round only at the end. Also be explicit about the denominator: here it is all ordered value (cancelled included), which is the standard definition of a cancellation rate. Dialect note: PostgreSQL also offers <code>SUM(x) FILTER (WHERE status='cancelled')</code>, cleaner than CASE; MySQL and SQLite use CASE.</div>
<p>Real-world: finance reviews exactly this table each month; support and operations use it to decide whether a channel needs a payment-confirmation step before production starts.</p>`,
  task:`Per sales channel return <code>channel</code>, <code>gross_value</code> (sum of <code>qty * unit_price</code> over all orders, any status), <code>cancelled_value</code> (same but only cancelled orders), <code>cancelled_orders</code> (number of distinct cancelled orders) and <code>leakage_pct</code> = cancelled_value as a percentage of gross_value, rounded to 1 decimal. Order by <code>leakage_pct</code> descending, then <code>channel</code>.`,
  starter:`-- conditional aggregation with CASE; careful with fan-out
SELECT o.channel
FROM orders o
GROUP BY o.channel;`,
  solution:`SELECT o.channel,
       SUM(oi.qty * oi.unit_price) AS gross_value,
       SUM(CASE WHEN o.status = 'cancelled'
                THEN oi.qty * oi.unit_price ELSE 0 END)
         AS cancelled_value,
       COUNT(DISTINCT CASE WHEN o.status = 'cancelled'
                           THEN o.id END) AS cancelled_orders,
       ROUND(100.0 * SUM(CASE WHEN o.status = 'cancelled'
                THEN oi.qty * oi.unit_price ELSE 0 END)
             / SUM(oi.qty * oi.unit_price), 1) AS leakage_pct
FROM orders o
JOIN order_items oi ON oi.order_id = o.id
GROUP BY o.channel
ORDER BY leakage_pct DESC, o.channel;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses CASE', re:'\\bCASE\\b', flags:'i' }, { desc:'Uses COUNT(DISTINCT', re:'COUNT\\s*\\(\\s*DISTINCT', flags:'i' } ]
},

{ id:'m11-l3', module:10, file:'03-rfm-customer-tiers.sql', type:'exercise', title:'Customer Segmentation: RFM-Style Tiers',
  dataset:'shop',
  concept:`<p>Marketing wants to know who to thank, who to chase, and who to forget. The standard framework is <strong>RFM</strong>: <em>Recency</em> (how long since the last purchase), <em>Frequency</em> (how many purchases), <em>Monetary</em> (how much spent). Three numbers per customer, then business rules turn them into a named segment. No machine learning needed, and it is still what many e-commerce teams actually run.</p>
<p>Step one is a per-customer summary built from orders that count (not cancelled). Order values must be summed per order first, otherwise the frequency would count order lines. A tidy way is two CTE layers: order totals, then customer totals. Recency needs a reference date. Real dashboards use "today", but here the data ends in June 2025, so we fix the "as of" date at the literal <code>'2025-06-30'</code> to keep results reproducible: <code>julianday('2025-06-30') - julianday(last_order)</code> gives days.</p>
<pre>WITH ord AS (
  SELECT o.id, o.customer_id, o.order_date,
         SUM(oi.qty * oi.unit_price) AS value
  FROM orders o
  JOIN order_items oi ON oi.order_id = o.id
  WHERE o.status &lt;&gt; 'cancelled'
  GROUP BY o.id
)
SELECT customer_id, COUNT(*) AS orders,
       SUM(value) AS spend,
       MAX(order_date) AS last_order
FROM ord GROUP BY customer_id;</pre>
<p>Step two is the segment, with <code>CASE</code>. A CASE expression returns at the <strong>first</strong> matching branch, so the order of the branches is part of the logic: a customer who is both "high spend" and "gone quiet" must hit the more specific rule before the generic one. Write the rules from most specific/valuable down to the catch-all <code>ELSE</code>.</p>
<div class="callout"><b>Interview trap:</b> customers who never ordered do not appear in this result at all, because they have no rows in <code>ord</code>. If marketing asks for "all customers", start from <code>customers</code> with a <code>LEFT JOIN</code> and decide explicitly what segment a never-bought customer gets (usually "Prospect"). Another trap: tier thresholds hard-coded in SQL are business decisions, so name them in a comment, and in production keep them in a config table. Dialect note: PostgreSQL date subtraction is simply <code>date1 - date2</code>; MySQL uses <code>DATEDIFF(a, b)</code>.</div>
<p>Real-world: the output drives email campaigns, loyalty discounts and the "who should the sales head call this week" list.</p>`,
  task:`For customers with at least one non-cancelled order return <code>name</code>, <code>orders</code> (count of non-cancelled orders), <code>spend</code> (sum of <code>qty * unit_price</code>), <code>recency_days</code> (whole days from the last non-cancelled order date to <code>'2025-06-30'</code>; use <code>CAST(... AS INTEGER)</code>) and <code>tier</code>, assigned by the first matching rule: <b>Champion</b> if spend &gt;= 500000 and recency_days &lt;= 100; <b>At risk</b> if spend &gt;= 300000 and recency_days &gt; 100; <b>Loyal</b> if orders &gt;= 3; <b>Lapsed</b> if recency_days &gt; 180; otherwise <b>Active</b>. Order by <code>spend</code> descending.`,
  starter:`-- ord: one row per non-cancelled order with its value
-- cust: one row per customer (orders, spend, last_order)
-- then CASE for tier, rules in the order given
WITH ord AS (
  SELECT o.id, o.customer_id
  FROM orders o
)
SELECT customer_id FROM ord;`,
  solution:`WITH ord AS (
  SELECT o.id, o.customer_id, o.order_date,
         SUM(oi.qty * oi.unit_price) AS value
  FROM orders o
  JOIN order_items oi ON oi.order_id = o.id
  WHERE o.status <> 'cancelled'
  GROUP BY o.id
), cust AS (
  SELECT customer_id,
         COUNT(*) AS orders,
         SUM(value) AS spend,
         CAST(julianday('2025-06-30')
              - julianday(MAX(order_date)) AS INTEGER)
           AS recency_days
  FROM ord
  GROUP BY customer_id
)
SELECT c.name, k.orders, k.spend, k.recency_days,
  CASE
    WHEN k.spend >= 500000 AND k.recency_days <= 100
      THEN 'Champion'
    WHEN k.spend >= 300000 AND k.recency_days > 100
      THEN 'At risk'
    WHEN k.orders >= 3 THEN 'Loyal'
    WHEN k.recency_days > 180 THEN 'Lapsed'
    ELSE 'Active'
  END AS tier
FROM cust k
JOIN customers c ON c.id = k.customer_id
ORDER BY k.spend DESC;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses CASE', re:'\\bCASE\\b', flags:'i' } ]
},

{ id:'m11-l4', module:10, file:'04-top-products-per-category.sql', type:'exercise', title:'Top N Products per Category',
  dataset:'shop',
  concept:`<p>"Best seller in each category" is the most re-asked analytics question in the world, and it cannot be answered with <code>GROUP BY</code> plus <code>LIMIT</code>: <code>LIMIT 2</code> cuts the whole result, not each group. The pattern you need is <strong>rank inside a partition, then filter on the rank</strong>.</p>
<p>First compute revenue per product. Then use <code>ROW_NUMBER() OVER (PARTITION BY category ORDER BY revenue DESC)</code> to number products 1, 2, 3 within each category. Window functions run <em>after</em> <code>WHERE</code>, <code>GROUP BY</code> and <code>HAVING</code>, so you cannot write <code>WHERE rn &lt;= 2</code> in the same query level. Wrap the ranking in a CTE (or subquery) and filter in the outer query.</p>
<pre>WITH rev AS (
  SELECT p.category, p.name,
         SUM(oi.qty * oi.unit_price) AS revenue
  FROM order_items oi
  JOIN orders o   ON o.id = oi.order_id
  JOIN products p ON p.id = oi.product_id
  WHERE o.status &lt;&gt; 'cancelled'
  GROUP BY p.id
)
SELECT *, ROW_NUMBER() OVER (
  PARTITION BY category ORDER BY revenue DESC) AS rn
FROM rev;</pre>
<p>Which ranking function? <code>ROW_NUMBER</code> always gives exactly N rows per group, breaking ties arbitrarily (add a second sort key to make it deterministic). <code>RANK</code> gives tied rows the same rank and skips numbers after (1, 1, 3), so "top 2" may return 3 rows. <code>DENSE_RANK</code> gives tied rows the same rank without gaps (1, 1, 2). Decide which one the business question actually means: "top 2 products" usually wants <code>ROW_NUMBER</code> with a tiebreaker.</p>
<div class="callout"><b>Interview trap:</b> this is the canonical "nth highest per group" question. Weak answers use a correlated subquery counting rows with higher values; it works but is O(n&sup2;) and hard to read. Also remember products that never sold have no rows in this join, so they cannot appear in a top list. PostgreSQL has <code>DISTINCT ON (category)</code> and MySQL/SQL Server use the same window approach; MySQL before 8.0 had no window functions at all.</div>
<p>Real-world: merchandising pages ("top 5 in each department"), category-manager reports and recommendation fallbacks all use this shape.</p>`,
  task:`For each product category return the two products with the highest revenue (non-cancelled orders only; revenue = <code>SUM(qty * unit_price)</code>). Columns: <code>category</code>, <code>product</code> (product name), <code>revenue</code>, <code>rank_in_category</code> (1 or 2). Order by <code>category</code>, then <code>rank_in_category</code>. Use a window function.`,
  starter:`-- 1. CTE: revenue per product (non-cancelled)
-- 2. ROW_NUMBER() OVER (PARTITION BY category ...)
-- 3. outer query keeps rank &lt;= 2
SELECT p.category, p.name AS product
FROM products p
ORDER BY p.category;`,
  solution:`WITH rev AS (
  SELECT p.id, p.category, p.name AS product,
         SUM(oi.qty * oi.unit_price) AS revenue
  FROM order_items oi
  JOIN orders o   ON o.id = oi.order_id
  JOIN products p ON p.id = oi.product_id
  WHERE o.status <> 'cancelled'
  GROUP BY p.id
), ranked AS (
  SELECT category, product, revenue,
         ROW_NUMBER() OVER (
           PARTITION BY category
           ORDER BY revenue DESC, id) AS rank_in_category
  FROM rev
)
SELECT category, product, revenue, rank_in_category
FROM ranked
WHERE rank_in_category <= 2
ORDER BY category, rank_in_category;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses a window function (OVER)', re:'\\bOVER\\s*\\(', flags:'i' } ]
},

{ id:'m11-l5', module:10, file:'05-repeat-rate-cohorts.sql', type:'exercise', title:'Repeat-Purchase Rate by First-Order Cohort',
  dataset:'shop',
  concept:`<p>A shop can grow by acquiring new customers or by selling more to existing ones, and the second is usually far cheaper. The key metric is the <strong>repeat-purchase rate</strong>: of the customers who bought at all, what share bought again? A <strong>cohort</strong> view goes further. You group customers by <em>when they first bought</em> (their cohort month) and compare groups, so you can see whether newer customers behave better or worse than older ones, instead of mixing everyone into one average.</p>
<p>The build has two ideas. First, find each customer's first order month with <code>MIN(order_date)</code> grouped by customer. Second, count how many orders each customer has. Then aggregate customers by cohort month: how many customers, and how many of them have 2+ orders.</p>
<pre>WITH per_cust AS (
  SELECT customer_id,
         MIN(order_date) AS first_date,
         COUNT(*) AS n_orders
  FROM orders
  WHERE status &lt;&gt; 'cancelled'
  GROUP BY customer_id
)
SELECT strftime('%Y-%m', first_date) AS cohort_month,
       COUNT(*) AS customers
FROM per_cust
GROUP BY cohort_month;</pre>
<p>To count the repeaters in the same pass, use a boolean-as-number trick: in SQLite (and MySQL) <code>n_orders &gt;= 2</code> evaluates to 1 or 0, so <code>SUM(n_orders &gt;= 2)</code> counts them. This is not portable (PostgreSQL has real booleans and needs <code>SUM(CASE WHEN n_orders &gt;= 2 THEN 1 ELSE 0 END)</code>), so the CASE form is the safe habit in interviews. Always say what a "repeat" is: here, two or more orders that were not cancelled.</p>
<div class="callout"><b>Common mistake:</b> filtering cancelled orders <em>after</em> computing the first date. If a customer's first order was cancelled, their real cohort is the month of the first order that stuck; filter in the <code>WHERE</code> of the per-customer CTE, as above. Another subtle one: recent cohorts always look worse, because they have had less time to buy again (cohort age bias). Compare cohorts of similar age, or state the cut-off date.</div>
<p>Real-world: retention and repeat rate are board-level numbers for any e-commerce business; the cohort table is the first thing a growth analyst builds.</p>`,
  task:`Using non-cancelled orders only, return one row per cohort month (the month of a customer's first order) with columns <code>cohort_month</code> (YYYY-MM), <code>customers</code>, <code>repeat_customers</code> (customers in that cohort with 2 or more orders) and <code>repeat_rate_pct</code> (repeat_customers as a percentage of customers, rounded to 1 decimal). Order by <code>cohort_month</code>.`,
  starter:`-- per_cust: first order date + order count per customer
-- then group by the first-order month
WITH per_cust AS (
  SELECT customer_id, MIN(order_date) AS first_date
  FROM orders
  GROUP BY customer_id
)
SELECT strftime('%Y-%m', first_date) AS cohort_month
FROM per_cust;`,
  solution:`WITH per_cust AS (
  SELECT customer_id,
         MIN(order_date) AS first_date,
         COUNT(*) AS n_orders
  FROM orders
  WHERE status <> 'cancelled'
  GROUP BY customer_id
)
SELECT strftime('%Y-%m', first_date) AS cohort_month,
       COUNT(*) AS customers,
       SUM(CASE WHEN n_orders >= 2 THEN 1 ELSE 0 END)
         AS repeat_customers,
       ROUND(100.0 * SUM(CASE WHEN n_orders >= 2
                              THEN 1 ELSE 0 END)
             / COUNT(*), 1) AS repeat_rate_pct
FROM per_cust
GROUP BY cohort_month
ORDER BY cohort_month;`,
  ordered:true, columns:true
},

{ id:'m11-l6', module:10, file:'06-never-sold-dead-stock.sql', type:'exercise', title:'Never-Sold Products and Dead Stock',
  dataset:'shop',
  concept:`<p>Stock sitting on a shelf is cash that cannot be used. Jewellery is the extreme case: a Rs 2 lakh necklace that does not sell is a big dead investment, plus insurance and display cost. So the owner asks "which products have <em>never</em> produced a real sale, and how much money is parked in them?". This is an <strong>anti-join</strong>: find rows in one table with no matching rows in another.</p>
<p>You have three ways to write an anti-join. (1) <code>LEFT JOIN ... WHERE right.id IS NULL</code>; (2) <code>NOT EXISTS (SELECT 1 ...)</code>; (3) <code>NOT IN (SELECT ...)</code>. Prefer <code>NOT EXISTS</code> when the condition has more than one part, as here: "no order line on an order that is not cancelled". With a LEFT JOIN you would have to put the status test in the <code>ON</code> clause (not <code>WHERE</code>, or you silently turn it back into an inner join), which is easy to get wrong. Avoid <code>NOT IN</code> unless the subquery column can never be NULL: one NULL makes the whole predicate return nothing.</p>
<pre>SELECT p.name
FROM products p
WHERE NOT EXISTS (
  SELECT 1
  FROM order_items oi
  JOIN orders o ON o.id = oi.order_id
  WHERE oi.product_id = p.id
    AND o.status &lt;&gt; 'cancelled'
);</pre>
<p>Notice the business definition matters: "never ordered" (no line at all) and "never actually sold" (lines exist, but only on cancelled orders) are different problems, a catalogue or pricing issue versus a fulfilment issue. In this data the two definitions happen to agree, which you can prove by running the check both ways; it is good practice to test that assumption rather than trust it. Then attach the money: <code>price * stock</code> is the stock value at list price.</p>
<div class="callout"><b>Interview trap:</b> "Find customers who never ordered" is the same pattern; candidates who write <code>JOIN ... WHERE order_id &lt;&gt; ...</code> get it backwards, because an inner join cannot return rows that have no partner. Anti-joins always need <code>LEFT JOIN ... IS NULL</code> or <code>NOT EXISTS</code>. Performance: all three forms are fast with an index on <code>order_items(product_id)</code>; PostgreSQL turns <code>NOT EXISTS</code> into a hash anti-join.</div>
<p>Real-world: used for catalogue clean-up, clearance sales, "inactive user" emails and orphan-record detection in data migrations.</p>`,
  task:`List products with no order line in any non-cancelled order. Columns: <code>product</code> (name), <code>category</code>, <code>stock</code> and <code>stock_value</code> (<code>price * stock</code>). Order by <code>stock_value</code> descending.`,
  starter:`-- NOT EXISTS for "no non-cancelled line"
SELECT p.name AS product, p.category
FROM products p;`,
  solution:`SELECT p.name AS product,
       p.category,
       p.stock,
       p.price * p.stock AS stock_value
FROM products p
WHERE NOT EXISTS (
  SELECT 1
  FROM order_items oi
  JOIN orders o ON o.id = oi.order_id
  WHERE oi.product_id = p.id
    AND o.status <> 'cancelled'
)
ORDER BY stock_value DESC;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses an anti-join (NOT EXISTS or LEFT JOIN ... IS NULL)', re:'NOT\\s+EXISTS|IS\\s+NULL', flags:'i' } ]
},

{ id:'m11-l7', module:10, file:'07-running-totals-ytd.sql', type:'exercise', title:'Running Totals and Year-to-Date',
  dataset:'shop',
  concept:`<p>A running (cumulative) total answers "how much have we sold so far?", and a <strong>year-to-date</strong> total restarts that count every January. Both are the same window function, <code>SUM(x) OVER (...)</code>, differing only in the <code>PARTITION BY</code>. Without a partition the window spans the whole table; with <code>PARTITION BY year</code> it resets at each year.</p>
<p>The pattern is: aggregate first into a CTE (one row per month), then apply the window over those monthly rows. A window function cannot be nested around <code>GROUP BY</code> sums in a confusing single level; keep the layers separate and each is easy to read. The ordering inside <code>OVER</code> defines "so far":</p>
<pre>SELECT month, revenue,
  SUM(revenue) OVER (
    ORDER BY month
    ROWS BETWEEN UNBOUNDED PRECEDING
             AND CURRENT ROW) AS running_total,
  SUM(revenue) OVER (
    PARTITION BY substr(month, 1, 4)
    ORDER BY month
    ROWS BETWEEN UNBOUNDED PRECEDING
             AND CURRENT ROW) AS ytd
FROM monthly;</pre>
<p>Why spell out <code>ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</code>? When you write only <code>ORDER BY</code>, the default frame is <code>RANGE ... CURRENT ROW</code>, which treats rows with equal sort values (peers) as one group and includes <em>all</em> of them. If two rows tie on the ordering column, both show the same running total, which is wrong for a per-row cumulative. Explicit <code>ROWS</code> is deterministic. Here months are unique so both agree, but the habit prevents a nasty bug later.</p>
<div class="callout"><b>Common mistake:</b> using a self-join (<code>b.month &lt;= a.month</code>) for running totals. It works but is quadratic and slow; window functions do it in one pass. <b>Interview note:</b> running totals over gaps skip the empty months (March 2024 has no row here); that is fine for cumulative sums, but a moving average over "the last 3 months" using <code>ROWS 2 PRECEDING</code> would then mean the last 3 <em>rows</em>, not 3 calendar months.</div>
<p>Real-world: cumulative sales against an annual target, cash-flow charts, "how many units until stock runs out" calculations. MySQL 8, PostgreSQL and SQL Server all support the identical syntax.</p>`,
  task:`Per month with sales (non-cancelled orders, revenue = <code>SUM(qty * unit_price)</code>) return <code>month</code> (YYYY-MM), <code>revenue</code>, <code>running_total</code> (cumulative revenue from the first month up to and including this one) and <code>ytd_revenue</code> (cumulative revenue within the same calendar year). Order by <code>month</code>.`,
  starter:`-- CTE monthly (month, revenue), then two window sums:
--  running_total: ORDER BY month
--  ytd_revenue : PARTITION BY the year part of month
WITH monthly AS (
  SELECT strftime('%Y-%m', order_date) AS month
  FROM orders
  GROUP BY month
)
SELECT month FROM monthly;`,
  solution:`WITH monthly AS (
  SELECT strftime('%Y-%m', o.order_date) AS month,
         SUM(oi.qty * oi.unit_price) AS revenue
  FROM orders o
  JOIN order_items oi ON oi.order_id = o.id
  WHERE o.status <> 'cancelled'
  GROUP BY month
)
SELECT month, revenue,
  SUM(revenue) OVER (
    ORDER BY month
    ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
  ) AS running_total,
  SUM(revenue) OVER (
    PARTITION BY substr(month, 1, 4)
    ORDER BY month
    ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
  ) AS ytd_revenue
FROM monthly
ORDER BY month;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses a window SUM (OVER)', re:'SUM\\s*\\([^)]*\\)\\s*OVER', flags:'i' } ]
},

{ id:'m11-l8', module:10, file:'08-data-quality-audit.sql', type:'exercise', title:'Data-Quality Audit: NULLs, Duplicates, Orphans',
  dataset:'shop',
  concept:`<p>Before anyone trusts a dashboard, someone must prove the data underneath is sane. Analysts and backend engineers spend a surprising share of their time on this, and interviewers love it because it reveals whether you think about NULLs, duplicates and referential integrity without being told. The deliverable is an <strong>audit report</strong>: one row per check, with the number of offending rows. A non-zero count is a ticket.</p>
<p>The common checks, each a one-line query:</p>
<ul><li><strong>Missing values.</strong> <code>COUNT(*) - COUNT(col)</code> or <code>SUM(col IS NULL)</code>. Remember <code>COUNT(col)</code> skips NULLs; <code>COUNT(*)</code> does not. Check also for empty strings, which are not NULL but equally useless.</li>
<li><strong>Duplicates.</strong> <code>GROUP BY</code> the columns that should be unique, <code>HAVING COUNT(*) &gt; 1</code>. Decide what "same" means: two orders by one customer on one day might be a double-click on the Pay button, or two legitimate purchases.</li>
<li><strong>Orphans.</strong> Child rows pointing at no parent (needs a LEFT JOIN anti-join), or parents without children (an order with no lines). In SQLite foreign keys are off by default, so orphans are genuinely possible.</li>
<li><strong>Impossible values.</strong> Negative quantities, future dates, prices of zero.</li></ul>
<pre>-- stack many checks into one report:
SELECT 'null_email' AS check_name, COUNT(*) AS issues
FROM customers WHERE email IS NULL
UNION ALL
SELECT 'orders_without_lines', COUNT(*)
FROM orders o
WHERE NOT EXISTS (SELECT 1 FROM order_items
                  WHERE order_id = o.id);</pre>
<p>Use <code>UNION ALL</code>, not <code>UNION</code>: plain UNION removes duplicate rows, which would silently merge two checks that happen to have the same count, and costs a sort. Each branch must return the same number of columns with compatible types; column names come from the first branch.</p>
<div class="callout"><b>Interview trap:</b> counting duplicates with <code>COUNT(DISTINCT x)</code> vs <code>COUNT(x)</code> only tells you <em>that</em> they exist. To report <em>how many surplus rows</em> exist, sum <code>(group_size - 1)</code> per duplicate group, or count groups, and say which one you chose. Also: a unique constraint is the cure, an audit query is only the detector. After finding duplicates, add a constraint so they cannot return (the schema-design module).</div>
<p>Real-world: audits run nightly as data tests (dbt tests, Great Expectations) and gate the morning reports.</p>`,
  task:`Build an audit with one row per check and columns <code>check_name</code> and <code>issues</code> (the count). Exactly these four checks: <code>null_email</code> (customers with a NULL email), <code>null_tier</code> (customers with a NULL tier), <code>same_day_repeat_orders</code> (number of customer+order_date combinations that have more than one order), and <code>never_ordered_products</code> (products with no order_items row at all, cancelled orders included). Order by <code>check_name</code>.`,
  starter:`-- one SELECT per check, stacked with UNION ALL
SELECT 'null_email' AS check_name, COUNT(*) AS issues
FROM customers
WHERE email IS NULL
ORDER BY check_name;`,
  solution:`SELECT 'null_email' AS check_name, COUNT(*) AS issues
FROM customers WHERE email IS NULL
UNION ALL
SELECT 'null_tier', COUNT(*)
FROM customers WHERE tier IS NULL
UNION ALL
SELECT 'same_day_repeat_orders', COUNT(*)
FROM (SELECT customer_id, order_date
      FROM orders
      GROUP BY customer_id, order_date
      HAVING COUNT(*) > 1)
UNION ALL
SELECT 'never_ordered_products', COUNT(*)
FROM products p
WHERE NOT EXISTS (SELECT 1 FROM order_items oi
                  WHERE oi.product_id = p.id)
ORDER BY check_name;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses UNION ALL', re:'UNION\\s+ALL', flags:'i' } ]
},

{ id:'m11-l9', module:10, file:'09-capstone-1-channel-category-matrix.sql', type:'exercise', title:'Capstone 1 of 3: Channel by Category Revenue Matrix',
  dataset:'shop',
  concept:`<p><strong>Capstone, part 1 (warm-up).</strong> The owner wants a one-glance matrix: rows are sales channels (web, store, wholesale), columns are product categories, cells are revenue. This is a <strong>pivot</strong>, and SQL has no portable <code>PIVOT</code> keyword (SQL Server and Oracle do; PostgreSQL has the <code>crosstab</code> extension). The portable technique is the one you used for leakage: conditional aggregation, one <code>SUM(CASE WHEN ...)</code> per output column.</p>
<pre>SELECT o.channel,
  SUM(CASE WHEN p.category = 'ring'
           THEN oi.qty * oi.unit_price
           ELSE 0 END) AS ring,
  SUM(oi.qty * oi.unit_price) AS total
FROM orders o
JOIN order_items oi ON oi.order_id = o.id
JOIN products p ON p.id = oi.product_id
WHERE o.status &lt;&gt; 'cancelled'
GROUP BY o.channel;</pre>
<p>Three things to get right. The set of columns is fixed in the query text, so a new category means editing the SQL (dynamic pivots need generated SQL in application code). Revenue excludes cancelled orders, so the filter belongs in <code>WHERE</code>, applied before grouping. And the final <code>total</code> column must equal the sum of the category columns: a built-in checksum, because if it does not match, a category is missing from your CASE list. Always verify a report with a cross-check like that before you hand it over.</p>
<div class="callout"><b>Sanity habit:</b> compare the grand total with the sum of monthly revenue from the first analytics lesson. Two different queries reaching the same number is the closest thing to a unit test that SQL reporting has. <b>Dialect note:</b> in MySQL you could use <code>SUM(IF(cond, x, 0))</code>; in PostgreSQL <code>SUM(x) FILTER (WHERE cond)</code> returns NULL (not 0) for an empty cell, so wrap with <code>COALESCE</code>.</div>`,
  task:`Return one row per channel with columns <code>channel</code>, <code>ring</code>, <code>necklace</code>, <code>earring</code>, <code>bracelet</code>, <code>loose_stone</code> (revenue of that category, <code>SUM(qty * unit_price)</code>, 0 when none) and <code>total</code> (all categories). Non-cancelled orders only. Order by <code>channel</code>.`,
  starter:`-- conditional aggregation: one SUM(CASE ...) per category
SELECT o.channel,
       SUM(oi.qty * oi.unit_price) AS total
FROM orders o
JOIN order_items oi ON oi.order_id = o.id
GROUP BY o.channel
ORDER BY o.channel;`,
  solution:`SELECT o.channel,
  SUM(CASE WHEN p.category = 'ring'
           THEN oi.qty * oi.unit_price ELSE 0 END) AS ring,
  SUM(CASE WHEN p.category = 'necklace'
           THEN oi.qty * oi.unit_price ELSE 0 END) AS necklace,
  SUM(CASE WHEN p.category = 'earring'
           THEN oi.qty * oi.unit_price ELSE 0 END) AS earring,
  SUM(CASE WHEN p.category = 'bracelet'
           THEN oi.qty * oi.unit_price ELSE 0 END) AS bracelet,
  SUM(CASE WHEN p.category = 'loose stone'
           THEN oi.qty * oi.unit_price ELSE 0 END) AS loose_stone,
  SUM(oi.qty * oi.unit_price) AS total
FROM orders o
JOIN order_items oi ON oi.order_id = o.id
JOIN products p ON p.id = oi.product_id
WHERE o.status <> 'cancelled'
GROUP BY o.channel
ORDER BY o.channel;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses CASE', re:'\\bCASE\\b', flags:'i' } ]
},

{ id:'m11-l10', module:10, file:'10-capstone-2-country-leaderboard.sql', type:'exercise', title:'Capstone 2 of 3: Customer Leaderboard per Country',
  dataset:'shop',
  concept:`<p><strong>Capstone, part 2 (medium).</strong> The export manager wants, for every country, a ranked list of customers by spend, and how large a slice of that country's sales each customer is. This combines four skills: joins, multi-level aggregation, <code>RANK()</code> and a window <code>SUM()</code> used as the denominator of a percentage.</p>
<p>The key insight is that <strong>window functions can run over aggregated rows</strong>. First aggregate to one row per customer (a CTE). Then, in the next query, <code>SUM(spend) OVER (PARTITION BY country)</code> adds up the customers in the same country <em>without collapsing them</em>, so each customer row can sit beside its country total. Dividing gives the share.</p>
<pre>SELECT country, name, spend,
  RANK() OVER (PARTITION BY country
               ORDER BY spend DESC) AS country_rank,
  SUM(spend) OVER (PARTITION BY country) AS country_total
FROM cust_spend;</pre>
<p>Pitfalls to avoid. Do not put the window function and <code>GROUP BY</code> in one level and expect it to see the pre-group rows: windows are evaluated after grouping, so they see only the grouped output. Do not forget the percentage uses <code>100.0</code> to avoid integer division. Spend uses non-cancelled orders only, and customers with no qualifying orders are simply absent, since they have no spend to rank.</p>
<div class="callout"><b>Interview trap:</b> "RANK vs DENSE_RANK vs ROW_NUMBER" asked with this very data shape. If two customers in one country had identical spend, RANK would give both 1 and the next 3. Here the spends happen to be distinct, but a robust query states which function and why. Dialect note: all of this syntax is identical in PostgreSQL, MySQL 8+ and SQL Server; only SQLite and MySQL 8 differ slightly in window-frame support for edge cases.</div>`,
  task:`For customers with at least one non-cancelled order return <code>country</code>, <code>customer</code> (name), <code>spend</code> (sum of <code>qty * unit_price</code>), <code>country_rank</code> (1 = highest spend within the country, using RANK) and <code>pct_of_country</code> (the customer's spend as a percentage of the total spend of all customers in that country, rounded to 1 decimal). Order by <code>country</code>, then <code>country_rank</code>.`,
  starter:`-- 1. CTE: spend per customer incl. country (non-cancelled)
-- 2. RANK() OVER (PARTITION BY country ORDER BY spend DESC)
-- 3. 100.0 * spend / SUM(spend) OVER (PARTITION BY country)
SELECT c.country, c.name AS customer
FROM customers c
ORDER BY c.country;`,
  solution:`WITH cust_spend AS (
  SELECT c.id, c.country, c.name AS customer,
         SUM(oi.qty * oi.unit_price) AS spend
  FROM customers c
  JOIN orders o ON o.customer_id = c.id
  JOIN order_items oi ON oi.order_id = o.id
  WHERE o.status <> 'cancelled'
  GROUP BY c.id
)
SELECT country, customer, spend,
  RANK() OVER (PARTITION BY country
               ORDER BY spend DESC) AS country_rank,
  ROUND(100.0 * spend
        / SUM(spend) OVER (PARTITION BY country), 1)
    AS pct_of_country
FROM cust_spend
ORDER BY country, country_rank;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses RANK()', re:'\\bRANK\\s*\\(', flags:'i' }, { desc:'Uses a window SUM', re:'SUM\\s*\\([^)]*\\)\\s*OVER', flags:'i' } ]
},

{ id:'m11-l11', module:10, file:'11-capstone-3-quarterly-new-vs-returning.sql', type:'exercise', title:'Capstone 3 of 3: Quarterly New vs Returning Customers',
  dataset:'shop',
  concept:`<p><strong>Capstone, part 3 (hardest).</strong> The board pack needs one quarterly table: net revenue, orders, active customers, and how many of those customers were <em>new</em> (their first-ever order falls in that quarter) versus <em>returning</em> (they had bought in an earlier quarter). It is the kind of query that decides a take-home test, because it needs a plan before any code. Plan it in layers, each CTE answering one small question:</p>
<ol><li><code>ord</code>: one row per non-cancelled order with its quarter label and value. (Fix the fan-out here: sum the lines per order once.)</li>
<li><code>first_q</code>: each customer's first quarter, <code>MIN(quarter)</code>. Because the label is <code>YYYY-Qn</code> text, string order equals time order, so <code>MIN</code> works.</li>
<li>Final: group <code>ord</code> by quarter, joining <code>first_q</code> to classify each customer as new (their first quarter equals this quarter) or returning (earlier).</li></ol>
<pre>-- quarter label from a 'YYYY-MM-DD' date
strftime('%Y', order_date) || '-Q' ||
  ((CAST(strftime('%m', order_date) AS INTEGER) + 2) / 3)
-- months 1-3 -> 1, 4-6 -> 2, 7-9 -> 3, 10-12 -> 4
-- (integer division in SQLite)</pre>
<p>Counting distinct people inside a conditional uses the pattern from the leakage lesson: <code>COUNT(DISTINCT CASE WHEN cond THEN customer_id END)</code>. Notice that a customer with three orders in the same quarter must count once as active; <code>DISTINCT</code> guarantees that, and <code>active = new + returning</code> is your built-in cross-check (every active customer is exactly one of the two).</p>
<div class="callout"><b>Interview trap:</b> defining "new" as <code>customers.joined_date</code> is a different, wrong metric here: someone can register in 2023 and first buy in 2025. Always define new/returning from <em>first purchase</em>, the event the business cares about. Dialect note: PostgreSQL gives you <code>date_trunc('quarter', d)</code> and <code>to_char(d, 'YYYY"-Q"Q')</code>; MySQL has <code>QUARTER(d)</code>; SQLite needs the arithmetic above.</div>
<p>If you get stuck, build and run each CTE alone first and look at its output: debugging layer by layer is the real professional skill this capstone is testing.</p>`,
  task:`Using non-cancelled orders only, return one row per quarter that has orders. Columns: <code>quarter</code> (like <code>2024-Q3</code>), <code>net_revenue</code> (sum of <code>qty * unit_price</code>), <code>orders</code> (number of orders), <code>new_customers</code> (distinct customers whose first non-cancelled order is in this quarter), <code>returning_customers</code> (distinct customers ordering this quarter whose first non-cancelled order was in an earlier quarter). Order by <code>quarter</code>.`,
  starter:`-- layer 1: ord (id, customer_id, quarter, value)
-- layer 2: first_q (customer_id, first quarter)
-- layer 3: group by quarter, classify new / returning
WITH ord AS (
  SELECT o.id, o.customer_id
  FROM orders o
  WHERE o.status <> 'cancelled'
)
SELECT COUNT(*) AS orders FROM ord;`,
  solution:`WITH ord AS (
  SELECT o.id, o.customer_id,
         strftime('%Y', o.order_date) || '-Q' ||
           ((CAST(strftime('%m', o.order_date) AS INTEGER)
             + 2) / 3) AS quarter,
         SUM(oi.qty * oi.unit_price) AS value
  FROM orders o
  JOIN order_items oi ON oi.order_id = o.id
  WHERE o.status <> 'cancelled'
  GROUP BY o.id
), first_q AS (
  SELECT customer_id, MIN(quarter) AS first_quarter
  FROM ord
  GROUP BY customer_id
)
SELECT ord.quarter,
       SUM(ord.value) AS net_revenue,
       COUNT(*) AS orders,
       COUNT(DISTINCT CASE WHEN f.first_quarter = ord.quarter
                           THEN ord.customer_id END)
         AS new_customers,
       COUNT(DISTINCT CASE WHEN f.first_quarter < ord.quarter
                           THEN ord.customer_id END)
         AS returning_customers
FROM ord
JOIN first_q f ON f.customer_id = ord.customer_id
GROUP BY ord.quarter
ORDER BY ord.quarter;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses a CTE', re:'\\bWITH\\b', flags:'i' } ]
}

);


</script>

<script>
/* ============================================================
   ENGINE
   ============================================================ */
const SQLCORE_SRC = "/* Shared SQL grading core. Used by the in-browser worker AND the Node verifier,\n   so what is verified locally is exactly what runs on the phone. */\nfunction runSqlJob(SQL, job) {\n  // job: { setup, user, solution, verify, ordered, columns, rules, mode }\n  function fresh() {\n    const db = new SQL.Database();\n    db.exec(job.setup || '');\n    return db;\n  }\n  function lastSet(sets) { return sets && sets.length ? sets[sets.length - 1] : null; }\n  function norm(v) {\n    if (v === null || v === undefined) return 'NULL';\n    if (typeof v === 'number') return String(Math.round(v * 1e6) / 1e6);\n    if (v instanceof Uint8Array) return 'BLOB(' + v.length + ')';\n    return String(v);\n  }\n  function runScript(sql) {\n    const db = fresh();\n    let sets = [], err = null, ver = null;\n    try { sets = db.exec(sql); } catch (e) { err = e.message; }\n    if (!err && job.verify) {\n      try { ver = db.exec(job.verify); } catch (e) { err = 'verify query failed: ' + e.message; }\n    }\n    const shown = job.verify ? lastSet(ver) : lastSet(sets);\n    db.close();\n    return { sets, err, shown };\n  }\n  const user = runScript(job.user);\n  const out = { error: user.err, sets: user.sets, shown: user.shown, tests: [], expected: null, allPass: false };\n  if (job.mode === 'explore') { out.allPass = !user.err; return out; }\n\n  const sol = runScript(job.solution);\n  if (sol.err) { out.error = out.error || null; out.solutionError = sol.err; }\n  out.expected = sol.shown;\n\n  const tests = out.tests;\n  tests.push({ desc: 'Your SQL runs without errors', pass: !user.err, detail: user.err || '' });\n  const exp = sol.shown, got = user.shown;\n  if (!user.err) {\n    if (!got) {\n      tests.push({ desc: 'Produces a result set to check', pass: false, detail: 'Your SQL did not return any rows/columns. ' + (job.verify ? '' : 'Did you end with a SELECT?') });\n    } else if (exp) {\n      const colsOk = got.columns.length === exp.columns.length;\n      tests.push({ desc: 'Returns ' + exp.columns.length + ' column' + (exp.columns.length === 1 ? '' : 's'), pass: colsOk, detail: colsOk ? '' : 'You returned ' + got.columns.length + ': ' + got.columns.join(', ') });\n      if (job.columns) {\n        const same = colsOk && got.columns.every((c, i) => c.toLowerCase() === exp.columns[i].toLowerCase());\n        tests.push({ desc: 'Column names are: ' + exp.columns.join(', '), pass: same, detail: same ? '' : 'You have: ' + got.columns.join(', ') });\n      }\n      const rowsOk = got.values.length === exp.values.length;\n      tests.push({ desc: 'Returns ' + exp.values.length + ' row' + (exp.values.length === 1 ? '' : 's'), pass: rowsOk, detail: rowsOk ? '' : 'You returned ' + got.values.length });\n      const toKeys = (s) => s.values.map(r => r.map(norm).join('\\u0001'));\n      let a = toKeys(got), b = toKeys(exp);\n      if (!job.ordered) { a = a.slice().sort(); b = b.slice().sort(); }\n      const match = a.length === b.length && a.every((x, i) => x === b[i]);\n      tests.push({ desc: job.ordered ? 'Rows match, in the required order' : 'Row values match the expected result', pass: match, detail: match ? '' : (job.ordered ? 'Values or ordering differ from the expected output.' : 'Some values differ from the expected output.') });\n    }\n  }\n  (job.rules || []).forEach(r => {\n    const re = new RegExp(r.re, r.flags || 'i');\n    const found = re.test(job.user);\n    tests.push({ desc: r.desc, pass: r.not ? !found : found, detail: '' });\n  });\n  out.allPass = tests.length > 0 && tests.every(t => t.pass);\n  return out;\n}\nif (typeof module !== 'undefined') module.exports = { runSqlJob };\n";
const SQLJS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/';
const STORAGE_KEY = COURSE.storageKey;
const DRAFTS_KEY = COURSE.storageKey + '_drafts';
const IS_SQL = COURSE.runner === 'sql';
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const CM_MODE = IS_SQL ? 'text/x-sqlite' : 'javascript';

function loadProgress(){ try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); } catch(e){ return new Set(); } }
function saveProgress(set){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...set])); } catch(e){} }
function loadDrafts(){ try { return JSON.parse(localStorage.getItem(DRAFTS_KEY) || '{}'); } catch(e){ return {}; } }
function saveDraft(id, code){ try { const d = loadDrafts(); d[id] = code; localStorage.setItem(DRAFTS_KEY, JSON.stringify(d)); } catch(e){} }

const state = { completed: loadProgress(), drafts: loadDrafts(), openTabs: [], activeId: null, cm: null };
document.getElementById('titleText').textContent = COURSE.title;

function escapeHtml(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- JS runner (Web Worker sandbox) ---------- */
const JS_WORKER_SRC = `
self.onmessage = function(e){
  const code = e.data.code, testsCode = e.data.testsCode || '';
  const logs = [];
  function fmt(a){
    if (a === undefined) return 'undefined';
    if (a === null) return 'null';
    if (typeof a === 'function') return '[Function]';
    if (typeof a === 'object') {
      try { if (a instanceof Map) return 'Map(' + JSON.stringify([...a]) + ')'; if (a instanceof Set) return 'Set(' + JSON.stringify([...a]) + ')'; return JSON.stringify(a); } catch(err){ return String(a); }
    }
    return String(a);
  }
  const fake = { log: function(){ logs.push(Array.prototype.map.call(arguments, fmt).join(' ')); } };
  fake.info = fake.warn = fake.error = fake.debug = fake.log;
  let error = null; const results = [];
  try {
    const runner = new Function('__results', '__logs', 'console', code + '\\n' + testsCode);
    runner(results, logs, fake);
  } catch(err){ error = err.message; }
  self.postMessage({ logs: logs, error: error, results: results });
};
`;
function runJs(code, testsCode, onDone){
  let finished = false, worker;
  try { worker = new Worker(URL.createObjectURL(new Blob([JS_WORKER_SRC], { type:'application/javascript' }))); }
  catch(e){ onDone({ logs:[], error:'Could not start the sandbox: ' + e.message, results:[], timedOut:false }); return; }
  const timer = setTimeout(() => { if (finished) return; finished = true; worker.terminate(); onDone({ logs:[], error:null, results:[], timedOut:true }); }, COURSE.timeoutMs || 5000);
  worker.onmessage = (e) => { if (finished) return; finished = true; clearTimeout(timer); worker.terminate(); onDone({ logs:e.data.logs, error:e.data.error, results:e.data.results, timedOut:false }); };
  worker.onerror = (e) => { if (finished) return; finished = true; clearTimeout(timer); worker.terminate(); onDone({ logs:[], error:e.message, results:[], timedOut:false }); };
  worker.postMessage({ code, testsCode });
}
function buildTestsCode(tests){
  const helpers = "function __throws(fn, expectedMessage){ try { fn(); return false; } catch(e){ return expectedMessage === undefined ? true : e.message === expectedMessage; } }\n" +
                  "function __eq(a, b){ return JSON.stringify(a) === JSON.stringify(b); }\n";
  return helpers + tests.map(t => {
    const d = JSON.stringify(t.desc);
    return 'try { var __pass = !!(' + t.check + '); __results.push({desc: ' + d + ', pass: __pass}); } catch(__e){ __results.push({desc: ' + d + ', pass:false, error: __e.message}); }';
  }).join('\n');
}

/* ---------- SQL runner (sql.js in a persistent Web Worker) ---------- */
let sqlWorker = null, sqlSeq = 0, sqlWarm = false;
function getSqlWorker(){
  if (sqlWorker) return sqlWorker;
  const src = "importScripts('" + SQLJS_BASE + "sql-wasm.js');\n" + SQLCORE_SRC + "\n" +
  "let SQLP=null;\n" +
  "self.onmessage=async function(e){const d=e.data;try{if(!SQLP)SQLP=await initSqlJs({locateFile:f=>'" + SQLJS_BASE + "'+f});" +
  "const out=runSqlJob(SQLP,d.job);self.postMessage({id:d.id,ok:true,out:out});}catch(err){self.postMessage({id:d.id,ok:false,error:String(err&&err.message||err)});}};";
  sqlWorker = new Worker(URL.createObjectURL(new Blob([src], { type:'application/javascript' })));
  return sqlWorker;
}
function runSql(job, onDone){
  let w;
  try { w = getSqlWorker(); } catch(e){ onDone({ ok:false, error:'Could not start the SQL engine: ' + e.message }); return; }
  const id = ++sqlSeq; let finished = false;
  const timer = setTimeout(() => {
    if (finished) return; finished = true;
    try { w.terminate(); } catch(e){}
    sqlWorker = null; sqlWarm = false;
    onDone({ ok:false, timedOut:true });
  }, sqlWarm ? 6000 : 25000);
  w.onmessage = (e) => {
    if (e.data.id !== id || finished) return;
    finished = true; clearTimeout(timer); sqlWarm = true; onDone(e.data);
  };
  w.onerror = (e) => {
    if (finished) return; finished = true; clearTimeout(timer);
    try { w.terminate(); } catch(_){}
    sqlWorker = null; sqlWarm = false;
    onDone({ ok:false, error:'SQL engine failed to load (' + (e.message || 'network?') + '). Check your internet connection and try again.' });
  };
  w.postMessage({ id, job });
}
function sqlSetupFor(lesson){
  const ds = DATASETS[lesson.dataset || COURSE.defaultDataset] || { sql:'' };
  return ds.sql + '\n' + (lesson.setupExtra || '');
}
function renderTable(set, maxRows){
  if (!set) return '';
  maxRows = maxRows || 60;
  const head = '<tr>' + set.columns.map(c => '<th>' + escapeHtml(c) + '</th>').join('') + '</tr>';
  const rows = set.values.slice(0, maxRows).map(r => '<tr>' + r.map(v => {
    if (v === null) return '<td class="null">NULL</td>';
    if (typeof v === 'number') return '<td class="num">' + (Math.round(v*1e6)/1e6) + '</td>';
    if (v instanceof Uint8Array) return '<td class="null">BLOB</td>';
    return '<td>' + escapeHtml(v) + '</td>';
  }).join('') + '</tr>').join('');
  const more = set.values.length > maxRows ? '<div class="result-note">… showing first ' + maxRows + ' of ' + set.values.length + ' rows</div>' : '';
  return '<table class="result">' + head + rows + '</table>' + more;
}

/* ---------- Sidebar / tabs ---------- */
const collapsedFolders = new Set();
function renderSidebar(){
  const tree = document.getElementById('sidebarTree'); tree.innerHTML = '';
  MODULES.forEach((mod, mi) => {
    const lessons = LESSONS.filter(l => l.module === mi);
    const folder = document.createElement('div');
    folder.className = 'folder' + (collapsedFolders.has(mi) ? ' collapsed' : '');
    const head = document.createElement('div'); head.className = 'folder-head';
    const doneCount = lessons.filter(l => state.completed.has(l.id)).length;
    head.innerHTML = '<span class="folder-chevron">▾</span><span>' + (mi+1) + '. ' + mod.title + '</span><span style="margin-left:auto;color:var(--text-dim);font-weight:400;font-size:11px;">' + doneCount + '/' + lessons.length + '</span>';
    head.onclick = () => { if (collapsedFolders.has(mi)) collapsedFolders.delete(mi); else collapsedFolders.add(mi); renderSidebar(); };
    folder.appendChild(head);
    const wrap = document.createElement('div'); wrap.className = 'folder-files';
    lessons.forEach(l => {
      const item = document.createElement('div');
      item.className = 'file-item' + (l.id === state.activeId ? ' active' : '') + (state.completed.has(l.id) ? ' done' : '');
      item.innerHTML = '<span class="file-dot"></span><span class="file-icon">' + (l.type === 'predict' ? '?' : (IS_SQL ? '▤' : '{}')) + '</span><span>' + l.file + '</span>';
      item.onclick = () => openLesson(l.id);
      wrap.appendChild(item);
    });
    folder.appendChild(wrap); tree.appendChild(folder);
  });
}
function renderTabs(){
  const bar = document.getElementById('tabbar'); bar.innerHTML = '';
  if (!state.openTabs.length){ bar.innerHTML = '<div class="tab-empty">No lesson open</div>'; return; }
  state.openTabs.forEach(id => {
    const lesson = LESSONS.find(l => l.id === id); if (!lesson) return;
    const tab = document.createElement('div');
    tab.className = 'tab' + (id === state.activeId ? ' active' : '');
    tab.innerHTML = '<span>' + lesson.file + '</span><span class="tab-close">✕</span>';
    tab.querySelector('span:first-child').onclick = () => openLesson(id);
    tab.querySelector('.tab-close').onclick = (e) => { e.stopPropagation(); closeTab(id); };
    bar.appendChild(tab);
  });
  const act = bar.querySelector('.tab.active'); if (act && act.scrollIntoView) act.scrollIntoView({ inline:'nearest', block:'nearest' });
}
function closeTab(id){
  const idx = state.openTabs.indexOf(id); if (idx === -1) return;
  state.openTabs.splice(idx, 1);
  if (state.activeId === id){
    if (state.openTabs.length) openLesson(state.openTabs[Math.max(0, idx-1)]);
    else { state.activeId = null; renderWelcome(); renderTabs(); renderSidebar(); updateStatusBar(); }
  } else renderTabs();
}

/* ---------- Welcome ---------- */
function renderWelcome(){
  const scroll = document.getElementById('editorScroll');
  const total = LESSONS.length, done = state.completed.size, pct = Math.round((done/total)*100), hasProgress = done > 0;
  scroll.innerHTML =
    '<div class="welcome">' +
      '<span class="welcome-badge">Interactive Course · ' + MODULES.length + ' Modules · ' + total + ' Lessons</span>' +
      '<h1>' + COURSE.title + '</h1>' +
      '<p class="lede">' + COURSE.lede + '</p>' +
      '<div class="welcome-steps">' + COURSE.steps.map((s, i) => '<div class="welcome-step"><b>0' + (i+1) + ' ' + s[0] + '</b><span>' + s[1] + '</span></div>').join('') + '</div>' +
      '<div class="welcome-progress"><div class="row"><span>Overall progress</span><span>' + done + ' / ' + total + ' lessons (' + pct + '%)</span></div><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div></div>' +
      '<button class="btn-primary" id="welcomeStartBtn">' + (hasProgress ? 'Resume where you left off →' : 'Start Lesson 1 →') + '</button>' +
      (hasProgress ? '<button class="btn-ghost" id="resetAllBtn">Reset all progress</button>' : '') +
      '<div class="course-map-note"><b>Course map:</b> ' + COURSE.mapNote + '</div>' +
    '</div>';
  document.getElementById('welcomeStartBtn').onclick = () => {
    const next = hasProgress ? (LESSONS.find(l => !state.completed.has(l.id)) || LESSONS[0]) : LESSONS[0];
    openLesson(next.id);
  };
  const rb = document.getElementById('resetAllBtn');
  if (rb) rb.onclick = () => { if (confirm('Reset all progress and saved drafts for this course?')) { state.completed = new Set(); state.drafts = {}; saveProgress(state.completed); try { localStorage.removeItem(DRAFTS_KEY); } catch(e){} renderWelcome(); renderSidebar(); updateStatusBar(); } };
  updateStatusBar();
}

/* ---------- Lesson ---------- */
function openLesson(id){
  const lesson = LESSONS.find(l => l.id === id); if (!lesson) return;
  state.activeId = id;
  if (!state.openTabs.includes(id)){ state.openTabs.push(id); if (state.openTabs.length > 6) state.openTabs.shift(); }
  closeSidebarMobile(); renderTabs(); renderSidebar(); renderLessonBody(lesson); updateStatusBar();
}
function lessonIndex(id){ return LESSONS.findIndex(l => l.id === id); }
function datasetPanel(lesson){
  if (!IS_SQL) return '';
  const ds = DATASETS[lesson.dataset || COURSE.defaultDataset];
  if (!ds || !ds.doc) return '';
  return '<details class="dataset"' + (lesson.openDataset ? ' open' : '') + '><summary>▸ Tables used in this lesson (' + ds.name + ')</summary><pre>' + escapeHtml(ds.doc) + '</pre></details>';
}
function renderLessonBody(lesson){
  const scroll = document.getElementById('editorScroll');
  const idx = lessonIndex(lesson.id);
  let html = '<div class="lesson">' +
    '<span class="lesson-eyebrow">MODULE ' + (lesson.module+1) + ': ' + MODULES[lesson.module].title.toUpperCase() + ' &middot; LESSON ' + (idx+1) + ' OF ' + LESSONS.length + '</span>' +
    '<h2>' + lesson.title + '</h2>' +
    '<div class="concept">' + lesson.concept + '</div>' +
    (lesson.task ? '<div class="task"><strong>Your task:</strong> ' + lesson.task + '</div>' : '') +
    datasetPanel(lesson);
  if (lesson.type === 'predict'){
    html += '<div id="predictHost"></div>';
  } else {
    html +=
      '<div class="editor-toolbar"><button class="toolbar-btn run" id="runBtn">▶ Run</button><button class="toolbar-btn" id="resetBtn">Reset</button><div class="toolbar-spacer"></div></div>' +
      '<div id="cmHost"></div>' +
      '<div class="output-panel" id="outputPanel"><div class="output-section-head">' + (IS_SQL ? 'RESULT' : 'OUTPUT') + '</div>' +
        '<div class="output-log" id="outputLog"><span class="empty">Click Run to see ' + (IS_SQL ? 'your result' : 'output') + ' here.</span></div>' +
        ((IS_SQL ? lesson.solution : (lesson.tests && lesson.tests.length)) && lesson.type !== 'explore' ? '<div class="output-section-head">CHECKS</div><div class="test-results" id="testResults"><span class="empty" style="font-size:13px;">Run your code to check it.</span></div>' : '') +
        '<div id="expectedHost"></div><div id="resultBanner" style="padding:0 14px 12px;"></div></div>' +
      (lesson.solution ? '<div class="solution-box"><button class="solution-toggle" id="solutionToggle">Show solution</button><pre class="solution-code" id="solutionCode">' + escapeHtml(lesson.solution) + '</pre></div>' : '');
  }
  html += '<div class="lesson-nav"><button class="nav-btn" id="prevLessonBtn"' + (idx===0?' disabled':'') + '>&larr; Previous</button><button class="nav-btn" id="nextLessonBtn"' + (idx===LESSONS.length-1?' disabled':'') + '>Next &rarr;</button></div></div>';
  scroll.innerHTML = html; scroll.scrollTop = 0;
  document.getElementById('prevLessonBtn').onclick = () => { if (idx>0) openLesson(LESSONS[idx-1].id); };
  document.getElementById('nextLessonBtn').onclick = () => { if (idx<LESSONS.length-1) openLesson(LESSONS[idx+1].id); };
  if (lesson.type === 'predict') renderPredict(lesson);
  else {
    initEditor(lesson);
    document.getElementById('runBtn').onclick = () => runExercise(lesson);
    document.getElementById('resetBtn').onclick = () => { state.cm.setValue(lesson.starter); saveDraft(lesson.id, lesson.starter); };
    const sb = document.getElementById('solutionToggle');
    if (sb) sb.onclick = () => { const b = document.getElementById('solutionCode'); b.classList.toggle('show'); sb.textContent = b.classList.contains('show') ? 'Hide solution' : 'Show solution'; };
  }
}
function initEditor(lesson){
  const host = document.getElementById('cmHost');
  const start = (state.drafts[lesson.id] !== undefined) ? state.drafts[lesson.id] : lesson.starter;
  state.cm = CodeMirror(host, { value:start, mode:CM_MODE, theme:'default', lineNumbers:true, matchBrackets:true, autoCloseBrackets:!IS_TOUCH, tabSize:2, indentUnit:2, viewportMargin:20, lineWrapping:IS_TOUCH });
  let deb; state.cm.on('change', () => { clearTimeout(deb); deb = setTimeout(() => saveDraft(lesson.id, state.cm.getValue()), 400); });
}
function markDone(lesson){
  if (state.completed.has(lesson.id)) return;
  state.completed.add(lesson.id); saveProgress(state.completed); renderSidebar(); updateStatusBar();
  const nb = document.getElementById('nextLessonBtn'); if (nb && !nb.disabled) nb.classList.add('next-ready');
}
function renderTests(host, tests){
  host.innerHTML = tests.map(r => '<div class="test-row ' + (r.pass ? 'pass' : 'fail') + '"><span class="mark">' + (r.pass ? '✓' : '✗') + '</span><span>' + escapeHtml(r.desc) + ((r.detail || r.error) && !r.pass ? '<span class="detail">' + escapeHtml(r.detail || r.error) + '</span>' : '') + '</span></div>').join('');
}
function runExercise(lesson){
  const code = state.cm.getValue();
  const log = document.getElementById('outputLog'), tr = document.getElementById('testResults'), banner = document.getElementById('resultBanner'), exp = document.getElementById('expectedHost');
  log.innerHTML = '<span class="empty">Running...</span>'; if (tr) tr.innerHTML = ''; banner.innerHTML = ''; exp.innerHTML = '';
  if (IS_SQL) return runSqlExercise(lesson, code, log, tr, banner, exp);
  const testsCode = lesson.tests && lesson.tests.length ? buildTestsCode(lesson.tests) : '';
  runJs(code, testsCode, (res) => {
    if (res.timedOut){ log.innerHTML = ''; banner.innerHTML = '<div class="timeout-banner">Still running after a few seconds — this usually means an infinite loop (or an algorithm that is far too slow for the input). The sandbox was stopped; check your loop or approach and try again.</div>'; return; }
    log.innerHTML = res.logs.length ? res.logs.map(l => '<div>' + escapeHtml(l) + '</div>').join('') : '<span class="empty">No console.log output.</span>';
    if (res.error) log.innerHTML += '<div class="err">Uncaught Error: ' + escapeHtml(res.error) + '</div>';
    if (tr && lesson.tests && lesson.tests.length){
      renderTests(tr, res.results);
      if (res.results.length > 0 && res.results.every(r => r.pass)){ banner.innerHTML = '<div class="success-banner">✓ All checks passed — lesson complete.</div>'; markDone(lesson); }
    } else if (!res.error) markDone(lesson);
  });
}
function runSqlExercise(lesson, code, log, tr, banner, exp){
  const mode = (lesson.type === 'explore' || !lesson.solution) ? 'explore' : 'check';
  const job = { setup: sqlSetupFor(lesson), user: code, solution: lesson.solution, verify: lesson.verify, ordered: !!lesson.ordered, columns: !!lesson.columns, rules: lesson.rules || [], mode };
  runSql(job, (res) => {
    if (res.timedOut){ log.innerHTML = ''; banner.innerHTML = '<div class="timeout-banner">The query ran for too long and was stopped (possibly an endless recursive CTE or a huge cross join). Check your query and try again.</div>'; return; }
    if (!res.ok){ log.innerHTML = '<div class="err">' + escapeHtml(res.error || 'Unknown error') + '</div>'; return; }
    const out = res.out;
    if (out.error) log.innerHTML = '<div class="err">SQL error: ' + escapeHtml(out.error) + '</div>';
    else {
      const sets = lesson.verify ? (out.shown ? [out.shown] : []) : out.sets;
      const label = lesson.verify ? '<div class="result-note">Table state after your SQL (checked with: ' + escapeHtml(lesson.verify.trim()) + ')</div>' : '';
      log.innerHTML = '<div class="result-wrap" style="padding:0">' + label + (sets.length ? sets.map(s => renderTable(s)).join('<div style="height:8px"></div>') : '<span class="empty">Statement ran OK — it returned no rows. (Use a SELECT to look at data.)</span>') + '</div>';
    }
    if (mode === 'check'){
      if (tr) renderTests(tr, out.tests);
      if (out.expected){
        exp.innerHTML = '<details class="dataset" style="margin:0 14px 12px;"' + (out.allPass ? '' : ' open') + '><summary>Expected result' + (out.allPass ? '' : ' (what your query should produce)') + '</summary><div class="result-wrap">' + renderTable(out.expected, 15) + '</div></details>';
      }
      if (out.allPass){ banner.innerHTML = '<div class="success-banner">✓ All checks passed — lesson complete.</div>'; markDone(lesson); }
    } else if (!out.error) markDone(lesson);
  });
}

/* ---------- Predict ---------- */
function renderPredict(lesson){
  const host = document.getElementById('predictHost'), p = lesson.predict;
  host.innerHTML = '<div class="predict-snippet"><div id="predictCmHost"></div></div><div class="predict-question">' + p.question + '</div><div class="predict-options" id="predictOptions"></div><div class="predict-explain" id="predictExplain">' + p.afterExplain + '</div><button class="run-verify-btn" id="runVerifyBtn">▶ Run it to see the real ' + (IS_SQL ? 'result' : 'output') + '</button><div class="output-panel" style="display:none;" id="predictOutputPanel"><div class="output-section-head">' + (IS_SQL ? 'RESULT' : 'OUTPUT') + '</div><div class="output-log" id="predictOutputLog"></div></div>';
  CodeMirror(document.getElementById('predictCmHost'), { value:p.snippet, mode:CM_MODE, theme:'default', lineNumbers:true, readOnly:true, viewportMargin:Infinity, lineWrapping:IS_TOUCH });
  const wrap = document.getElementById('predictOptions');
  p.options.forEach((opt, i) => {
    const btn = document.createElement('button'); btn.className = 'predict-opt'; btn.textContent = opt;
    btn.onclick = () => {
      wrap.querySelectorAll('.predict-opt').forEach((b, bi) => { b.disabled = true; if (bi === p.correctIndex) b.classList.add('correct'); else if (bi === i) b.classList.add('wrong'); });
      document.getElementById('predictExplain').classList.add('show'); markDone(lesson);
    };
    wrap.appendChild(btn);
  });
  document.getElementById('runVerifyBtn').onclick = () => {
    const panel = document.getElementById('predictOutputPanel'), log = document.getElementById('predictOutputLog');
    panel.style.display = 'block'; log.innerHTML = '<span class="empty">Running...</span>';
    if (IS_SQL){
      runSql({ setup: sqlSetupFor(lesson), user: p.snippet, mode:'explore', rules:[] }, (res) => {
        if (res.timedOut){ log.innerHTML = '<span class="err">Timed out.</span>'; return; }
        if (!res.ok){ log.innerHTML = '<div class="err">' + escapeHtml(res.error) + '</div>'; return; }
        if (res.out.error) log.innerHTML = '<div class="err">SQL error: ' + escapeHtml(res.out.error) + '</div>';
        else log.innerHTML = '<div class="result-wrap" style="padding:0">' + (res.out.sets.length ? res.out.sets.map(s => renderTable(s)).join('') : '<span class="empty">No rows returned.</span>') + '</div>';
      });
    } else {
      runJs(p.snippet, '', (res) => {
        if (res.timedOut){ log.innerHTML = '<span class="err">Timed out — possible infinite loop.</span>'; return; }
        log.innerHTML = res.logs.map(l => '<div>' + escapeHtml(l) + '</div>').join('');
        if (res.error) log.innerHTML += '<div class="err">Uncaught Error: ' + escapeHtml(res.error) + '</div>';
      });
    }
  };
}

/* ---------- Status / mobile / init ---------- */
function updateStatusBar(){
  const crumb = document.getElementById('statusBreadcrumb'), prog = document.getElementById('statusProgress');
  if (state.activeId){ const l = LESSONS.find(x => x.id === state.activeId); crumb.textContent = COURSE.shortName + ' › ' + MODULES[l.module].title + ' › ' + l.title; }
  else crumb.textContent = 'Welcome';
  prog.textContent = state.completed.size + ' / ' + LESSONS.length + ' complete';
}
function openSidebarMobile(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarOverlay').classList.add('open'); }
function closeSidebarMobile(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('open'); }
document.getElementById('hamburgerBtn').onclick = () => { document.getElementById('sidebar').classList.contains('open') ? closeSidebarMobile() : openSidebarMobile(); };
document.getElementById('sidebarOverlay').onclick = closeSidebarMobile;
document.getElementById('navHome').onclick = () => { state.activeId = null; closeSidebarMobile(); renderWelcome(); renderTabs(); renderSidebar(); };
document.getElementById('navExplorer').onclick = () => { if (window.innerWidth <= 860) openSidebarMobile(); };

renderSidebar(); renderTabs(); renderWelcome();
</script>
