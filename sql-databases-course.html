{ id:'m9-l1', module:8, file:'01-explore-schema.sql', type:'explore', title:'Explore: How a Database Describes Itself',
  dataset:'shop',
  concept:`<p>Before you design tables, learn to read them. A database stores its own structure in tables too. In SQLite the master catalogue is <code>sqlite_master</code>: one row per table, index and view, including the original <code>CREATE</code> text. <code>pragma_table_info('products')</code> lists each column with its declared type, whether it is <code>NOT NULL</code>, its default, and whether it is part of the primary key.</p>
<p>PostgreSQL and MySQL expose the same idea through <code>information_schema.tables</code> and <code>information_schema.columns</code> (standard SQL), plus shortcuts like <code>\\d products</code> in psql and <code>DESCRIBE products</code> in MySQL. When you join a new team, the first thing a senior engineer does is look at the schema, because the schema is the most honest documentation of what the business really stores.</p>
<p>Run the queries in the starter one at a time (select a statement and tap Run, or uncomment one at a time). Notice the declared types, which columns are primary keys, and how the foreign-key-looking columns (<code>customer_id</code>, <code>product_id</code>) are only plain integers in this dataset, with no enforced link. You will learn how to enforce that link in this module.</p>`,
  starter:`-- 1) every table, index and view\nSELECT type, name FROM sqlite_master ORDER BY name;\n\n-- 2) the columns of products\n-- SELECT cid, name, type, "notnull", dflt_value, pk\n-- FROM pragma_table_info('products');\n\n-- 3) the original CREATE statement\n-- SELECT sql FROM sqlite_master WHERE name = 'orders';\n\n-- 4) typeof() shows what is really stored\n-- SELECT typeof(price), typeof(carat), typeof(metal)\n-- FROM products LIMIT 3;`
},

{ id:'m9-l2', module:8, file:'02-create-table-types.sql', type:'exercise', title:'CREATE TABLE, Data Types and Type Affinity',
  dataset:'blank',
  concept:`<p><code>CREATE TABLE</code> defines the shape of your data: column names, types and rules. It is the foundation every query rests on, and mistakes here are expensive because changing a populated production table is slow and risky. Think about each column: what values are legal, can it be missing, and what will we ask of it later?</p>
<pre>CREATE TABLE stones (
  id          INTEGER PRIMARY KEY,
  name        TEXT,
  carat       REAL,
  origin      TEXT,
  price_paise INTEGER
);</pre>
<p><b>SQLite's types are different from most databases.</b> Most engines (PostgreSQL, MySQL, SQL Server) are <em>strictly typed</em>: a column declared <code>INTEGER</code> rejects the text 'abc'. SQLite uses <strong>type affinity</strong>: the declared type is a hint. A column with <code>INTEGER</code> affinity will convert '42' to the number 42 if it can, but will happily store 'abc' as text if it cannot. Values carry their own type (check with <code>typeof(x)</code>). There are five storage classes: NULL, INTEGER, REAL, TEXT, BLOB. Names like <code>VARCHAR(50)</code> or <code>DATETIME</code> are accepted but mapped by rules (anything containing "CHAR", "CLOB" or "TEXT" gets TEXT affinity; "INT" gets INTEGER; "REAL", "FLOA", "DOUB" get REAL; otherwise NUMERIC). The length in <code>VARCHAR(50)</code> is not enforced. SQLite 3.37+ offers <code>CREATE TABLE ... STRICT</code> for real type enforcement.</p>
<p>In PostgreSQL you would choose richer types: <code>numeric(12,2)</code>, <code>timestamptz</code>, <code>boolean</code>, <code>uuid</code>, <code>jsonb</code>; in MySQL <code>DECIMAL</code>, <code>DATETIME</code>, <code>TINYINT(1)</code>. SQLite has no boolean or date type: use INTEGER 0/1 and TEXT 'YYYY-MM-DD'.</p>
<div class="callout"><b>Interview trap:</b> "Why did my INTEGER column accept the word 'pending'?" Because of affinity. And never store a phone number or PIN code as an INTEGER: leading zeros vanish and you will never sum or average it. If you do not do arithmetic on it, it is text. Also, never use REAL for money (see the money lesson).</div>`,
  task:`Create a table named <code>stones</code> with exactly these columns in this order: <code>id INTEGER PRIMARY KEY</code>, <code>name TEXT</code>, <code>carat REAL</code>, <code>origin TEXT</code>, <code>price_paise INTEGER</code>. Write the type names in UPPERCASE as shown.`,
  starter:`CREATE TABLE stones (\n  -- columns here\n);`,
  solution:`CREATE TABLE stones (
  id INTEGER PRIMARY KEY,
  name TEXT,
  carat REAL,
  origin TEXT,
  price_paise INTEGER
);`,
  verify:`SELECT cid, name, type, pk FROM pragma_table_info('stones') ORDER BY cid;`,
  ordered:true,
  rules:[ { desc:'Uses CREATE TABLE', re:'\\bCREATE\\s+TABLE\\b', flags:'i' } ]
},

{ id:'m9-l3', module:8, file:'03-constraints.sql', type:'exercise', title:'NOT NULL, UNIQUE, DEFAULT and CHECK',
  dataset:'blank',
  concept:`<p>Application code validates input, but application code has bugs, there may be three different services writing to the same table, and someone will eventually run a manual script. <strong>Constraints put the rules inside the database</strong>, where no code path can bypass them. A bad row is rejected at the door instead of poisoning every report for years.</p>
<ul>
<li><code>NOT NULL</code>: the value must be present. Most columns should be NOT NULL; allow NULL only when "unknown/not applicable" is a real state.</li>
<li><code>UNIQUE</code>: no two rows share the value (a hallmark number, an email). Several NULLs are still allowed, because NULL is not equal to NULL.</li>
<li><code>DEFAULT x</code>: value used when an INSERT omits the column.</li>
<li><code>CHECK (condition)</code>: any boolean rule: <code>price &gt; 0</code>, <code>metal IN ('gold','silver','platinum')</code>.</li>
<li><code>PRIMARY KEY</code>: NOT NULL + UNIQUE, the row's identity.</li>
</ul>
<pre>CREATE TABLE pieces (
  sku      TEXT PRIMARY KEY,
  name     TEXT NOT NULL,
  metal    TEXT NOT NULL DEFAULT 'gold'
           CHECK (metal IN ('gold','silver','platinum')),
  price    INTEGER NOT NULL CHECK (price &gt; 0),
  hallmark TEXT UNIQUE
);</pre>
<p>An INSERT that breaks a rule fails with an error and changes nothing, e.g. <code>UNIQUE constraint failed: pieces.hallmark</code>. In a multi-statement transaction the application catches this and rolls back.</p>
<div class="callout"><b>Common mistake / Dialect note:</b> a CHECK that evaluates to NULL <em>passes</em> (only FALSE rejects), so <code>CHECK (price &gt; 0)</code> lets a NULL price through unless the column is also NOT NULL: always pair them. MySQL ignored CHECK constraints before 8.0.16 (it parsed and silently dropped them). PostgreSQL can name constraints (<code>CONSTRAINT price_positive CHECK ...</code>) so error messages are readable; do this in real projects. Also remember: SQLite does not enforce foreign keys unless asked (next lessons).</div>`,
  task:`Create a table <code>pieces</code> with columns: <code>sku TEXT PRIMARY KEY</code>; <code>name TEXT NOT NULL</code>; <code>metal TEXT NOT NULL DEFAULT 'gold'</code> with a CHECK that metal is one of <code>'gold','silver','platinum'</code>; <code>price INTEGER NOT NULL</code> with CHECK <code>price &gt; 0</code>; <code>hallmark TEXT UNIQUE</code>. Then insert exactly three rows: <code>('RG-100','Rose Ring', metal omitted, 25000, 'H-1')</code>, <code>('NK-100','Silver Chain','silver',4800, no hallmark)</code> and <code>('ER-100','Platinum Drops','platinum',88000, no hallmark)</code>. The first row must get its metal from the DEFAULT.`,
  starter:`CREATE TABLE pieces (\n  -- columns and constraints\n);\n\n-- insert the three rows (name your columns!)\n`,
  solution:`CREATE TABLE pieces (
  sku TEXT PRIMARY KEY,
  name TEXT NOT NULL,
  metal TEXT NOT NULL DEFAULT 'gold'
        CHECK (metal IN ('gold', 'silver', 'platinum')),
  price INTEGER NOT NULL CHECK (price > 0),
  hallmark TEXT UNIQUE
);

INSERT INTO pieces (sku, name, price, hallmark)
VALUES ('RG-100', 'Rose Ring', 25000, 'H-1');

INSERT INTO pieces (sku, name, metal, price)
VALUES
  ('NK-100', 'Silver Chain', 'silver', 4800),
  ('ER-100', 'Platinum Drops', 'platinum', 88000);`,
  verify:`SELECT sku, name, metal, price, hallmark FROM pieces ORDER BY sku;`,
  ordered:true,
  rules:[ { desc:'Has a CHECK constraint', re:'\\bCHECK\\s*\\(', flags:'i' }, { desc:'Has DEFAULT', re:'\\bDEFAULT\\b', flags:'i' }, { desc:'Has UNIQUE', re:'\\bUNIQUE\\b', flags:'i' }, { desc:'Has NOT NULL', re:'\\bNOT\\s+NULL\\b', flags:'i' } ]
},

{ id:'m9-l4', module:8, file:'04-foreign-keys-predict.sql', type:'predict', title:'FOREIGN KEY and ON DELETE: Predict the Cascade',
  dataset:'blank',
  setupExtra:`CREATE TABLE clients (
  id INTEGER PRIMARY KEY,
  name TEXT NOT NULL
);
CREATE TABLE jobs (
  id INTEGER PRIMARY KEY,
  client_id INTEGER NOT NULL
    REFERENCES clients(id) ON DELETE CASCADE,
  item TEXT
);
INSERT INTO clients (id, name) VALUES (1, 'Mehta'), (2, 'Nair');
INSERT INTO jobs (client_id, item) VALUES
  (1, 'Ring'), (1, 'Pendant'), (1, 'Kada'),
  (2, 'Bangle'), (2, 'Studs');`,
  concept:`<p>A <strong>foreign key</strong> says "this column must point at a row that exists in another table". In the tables below, <code>jobs.client_id REFERENCES clients(id)</code> guarantees you can never have a job for a client that does not exist (an <em>orphan</em>). It is the database-level version of the join keys you used in the joins module.</p>
<p>The same constraint answers the opposite question: what happens when someone deletes a client who still has jobs? You choose the <code>ON DELETE</code> action:</p>
<ul><li><code>RESTRICT</code> / <code>NO ACTION</code> (default): refuse the delete.</li><li><code>CASCADE</code>: delete the child rows too.</li><li><code>SET NULL</code>: keep the jobs, blank their client_id (the column must allow NULL).</li><li><code>SET DEFAULT</code>: set it to the column default.</li></ul>
<p><b>SQLite twist:</b> foreign keys are <em>off</em> by default for backwards compatibility. You must run <code>PRAGMA foreign_keys = ON;</code> on every connection, or the REFERENCES clause is just decoration. PostgreSQL and MySQL InnoDB always enforce them. The script below turns enforcement on, deletes client 1, then counts jobs.</p>`,
  predict:{
    snippet:`PRAGMA foreign_keys = ON;\n\nDELETE FROM clients WHERE id = 1;\n\nSELECT COUNT(*) AS jobs_left\nFROM jobs;`,
    question:`The jobs table had 5 rows (3 for client 1). What is jobs_left?`,
    options:['5','3','2','0'],
    correctIndex:2,
    afterExplain:`With <code>ON DELETE CASCADE</code> and enforcement on, deleting client 1 silently deletes their 3 jobs, leaving 2. Had the PRAGMA been missing, SQLite would have deleted the client and left 5 orphaned jobs pointing at nothing (answer 5). With the default RESTRICT the DELETE itself would fail with <code>FOREIGN KEY constraint failed</code>.<br><br><b>Which action should you pick?</b> CASCADE suits true "parts of" relationships (an order's line items die with the order). For business records like clients, invoices and jobs, prefer RESTRICT (or soft deletes): an accidental cascade can wipe years of history in a single statement, which is why many teams ban CASCADE on core tables. <b>Interview trap:</b> foreign keys do not create an index on the child column in PostgreSQL or SQLite (MySQL InnoDB does), so index <code>jobs.client_id</code> yourself or deletes and joins on the parent will scan the whole child table.`
  }
},

{ id:'m9-l5', module:8, file:'05-normalisation.sql', type:'exercise', title:'Normalisation: Splitting a Spreadsheet into Tables',
  dataset:'blank',
  setupExtra:`CREATE TABLE sheet (
  job_no INTEGER,
  customer TEXT,
  phone TEXT,
  item TEXT,
  karigar TEXT,
  karigar_city TEXT
);
INSERT INTO sheet VALUES
  (101, 'Aarav Mehta', '98200 11111', 'Ring', 'Rajesh', 'Surat'),
  (102, 'Aarav Mehta', '98200 11111', 'Pendant', 'Rajesh', 'Surat'),
  (103, 'Priya Nair', '98300 22222', 'Bangle', 'Imran', 'Mumbai'),
  (104, 'Priya Nair', '98300 22222', 'Ring', 'Rajesh', 'Surat');`,
  concept:`<p>Most people start by building a spreadsheet: one wide table with everything about a job on each row. It feels natural, and it breaks in predictable ways, called <strong>anomalies</strong>. Look at the <code>sheet</code> table: Aarav's phone number is typed on every one of his rows. Change it in one row and forget the other, and the database now holds two contradictory phone numbers (update anomaly). Delete job 103 and you also lose the only record that Imran exists in Mumbai (delete anomaly). You cannot record a new karigar until he has a job (insert anomaly).</p>
<p><b>Normalisation</b> is the discipline of removing that redundancy, in stages:</p>
<ul>
<li><b>1NF</b>: every cell holds one atomic value; no lists like "Ring, Pendant" in a cell, no repeating columns like item1, item2, item3; every row identifiable.</li>
<li><b>2NF</b>: every non-key column depends on the <em>whole</em> key (matters when the key is composite).</li>
<li><b>3NF</b>: non-key columns depend on <em>the key, nothing but the key</em>. A customer's phone depends on the customer, not on the job; a karigar's city depends on the karigar. Those facts move to their own tables.</li>
</ul>
<p>Rule of thumb: <em>one fact, one place</em>. The result for our sheet is three tables: <code>clients(id, name, phone)</code>, <code>karigars(id, name, city)</code> and <code>jobs(job_no, client_id, karigar_id, item)</code>, where jobs refer to the others by id. You rebuild the wide view with joins whenever you need it.</p>
<pre>INSERT INTO clients (name, phone)
SELECT DISTINCT customer, phone
FROM sheet
ORDER BY customer;</pre>
<div class="callout"><b>Interview trap:</b> "Is more normalisation always better?" No. Analytics warehouses deliberately <em>denormalise</em> (star schemas, wide tables) because joins on billions of rows cost more than duplicated text, and the data is loaded once and never edited. OLTP systems (orders, jobs, stock) normalise to 3NF; you denormalise later, on purpose, with measurements. Also name the natural-vs-surrogate key trade-off: a phone number or name is not a safe primary key (people change them), so use a surrogate <code>id</code>.</div>`,
  task:`Refactor <code>sheet</code> into three tables and fill them with SQL (no hand-typed data). (1) <code>clients(id INTEGER PRIMARY KEY, name TEXT, phone TEXT)</code> filled with each distinct customer/phone pair. (2) <code>karigars(id INTEGER PRIMARY KEY, name TEXT, city TEXT)</code> with each distinct karigar/city pair. (3) <code>jobs(job_no INTEGER PRIMARY KEY, client_id INTEGER, karigar_id INTEGER, item TEXT)</code> with one row per sheet row, where client_id and karigar_id are looked up by joining <code>sheet</code> to the new tables. Use <code>INSERT ... SELECT</code> for all three; leave <code>id</code> to auto-assign.`,
  starter:`CREATE TABLE clients (\n  id INTEGER PRIMARY KEY, name TEXT, phone TEXT\n);\n-- CREATE TABLE karigars ...\n-- CREATE TABLE jobs ...\n\n-- INSERT ... SELECT DISTINCT into clients\n-- INSERT ... SELECT DISTINCT into karigars\n-- INSERT ... SELECT with JOINs into jobs\n`,
  solution:`CREATE TABLE clients (
  id INTEGER PRIMARY KEY, name TEXT, phone TEXT
);
CREATE TABLE karigars (
  id INTEGER PRIMARY KEY, name TEXT, city TEXT
);
CREATE TABLE jobs (
  job_no INTEGER PRIMARY KEY,
  client_id INTEGER REFERENCES clients(id),
  karigar_id INTEGER REFERENCES karigars(id),
  item TEXT
);

INSERT INTO clients (name, phone)
SELECT DISTINCT customer, phone FROM sheet ORDER BY customer;

INSERT INTO karigars (name, city)
SELECT DISTINCT karigar, karigar_city FROM sheet ORDER BY karigar;

INSERT INTO jobs (job_no, client_id, karigar_id, item)
SELECT s.job_no, c.id, k.id, s.item
FROM sheet s
JOIN clients c ON c.name = s.customer AND c.phone = s.phone
JOIN karigars k ON k.name = s.karigar AND k.city = s.karigar_city;`,
  verify:`SELECT j.job_no, c.name AS customer, c.phone, j.item, k.name AS karigar, k.city
FROM jobs j
JOIN clients c ON c.id = j.client_id
JOIN karigars k ON k.id = j.karigar_id
ORDER BY j.job_no;`,
  ordered:true,
  rules:[ { desc:'Uses INSERT ... SELECT', re:'\\bINSERT\\s+INTO\\b[\\s\\S]*\\bSELECT\\b', flags:'i' }, { desc:'Uses DISTINCT', re:'\\bDISTINCT\\b', flags:'i' }, { desc:'Uses a JOIN', re:'\\bJOIN\\b', flags:'i' } ]
},

{ id:'m9-l6', module:8, file:'06-many-to-many.sql', type:'exercise', title:'One-to-Many vs Many-to-Many: Junction Tables',
  dataset:'blank',
  setupExtra:`CREATE TABLE designs (id INTEGER PRIMARY KEY, name TEXT NOT NULL);
CREATE TABLE stones (id INTEGER PRIMARY KEY, name TEXT NOT NULL);
INSERT INTO designs (id, name) VALUES
  (1, 'Lotus Pendant'), (2, 'Peacock Set'), (3, 'Solitaire Ring');
INSERT INTO stones (id, name) VALUES
  (1, 'Diamond'), (2, 'Ruby'), (3, 'Emerald');`,
  concept:`<p>There are three shapes of relationship, and recognising them is the core of schema design.</p>
<ul>
<li><b>One-to-one</b>: a user and their profile. Often just extra columns; split only for size or security reasons.</li>
<li><b>One-to-many</b>: one customer has many orders. The <em>many</em> side stores a foreign key: <code>orders.customer_id</code>. This is 90% of all relationships.</li>
<li><b>Many-to-many</b>: a design can use many stones, and a stone type is used by many designs. You cannot put a foreign key on either side without cramming a list into one cell (breaking 1NF).</li>
</ul>
<p>The standard solution is a <strong>junction table</strong> (also called bridge, link, or associative table) with one row per pairing:</p>
<pre>CREATE TABLE design_stones (
  design_id INTEGER NOT NULL REFERENCES designs(id),
  stone_id  INTEGER NOT NULL REFERENCES stones(id),
  qty       INTEGER NOT NULL DEFAULT 1,
  PRIMARY KEY (design_id, stone_id)
);</pre>
<p>The <strong>composite primary key</strong> <code>(design_id, stone_id)</code> forbids listing the same stone twice for one design, and the junction table is the natural home for facts about the <em>pairing</em> itself (how many stones, which setting). Your own shop schema already uses this idea: <code>order_items</code> is a junction between <code>orders</code> and <code>products</code>, with <code>qty</code> and <code>unit_price</code> as the pairing facts.</p>
<div class="callout"><b>Interview trap / Dialect note:</b> to find "all designs using Ruby" you join through the junction: <code>designs JOIN design_stones JOIN stones</code>. Index the second column too: the primary key index helps lookups by design, but "which designs use stone 2?" needs an index on <code>stone_id</code>. Never store comma-separated ids in a text column; in PostgreSQL arrays and jsonb tempt people into this, but you lose foreign key integrity. Note that a SQLite <code>WITHOUT ROWID</code> table suits junction tables (it stores them as a single B-tree).</div>`,
  task:`Tables <code>designs</code> and <code>stones</code> exist. Create the junction table <code>design_stones(design_id, stone_id, qty)</code> as in the lesson (both ids NOT NULL with REFERENCES, <code>qty INTEGER NOT NULL DEFAULT 1</code>, composite PRIMARY KEY on both ids). Insert these pairings: Lotus Pendant (1) uses Diamond (1) x1 [omit qty, use the default] and Ruby (2) x12; Peacock Set (2) uses Ruby (2) x8 and Emerald (3) x20; Solitaire Ring (3) uses Diamond (1) x1 [again via default].`,
  starter:`CREATE TABLE design_stones (\n  -- two foreign keys, qty, composite primary key\n);\n\n-- INSERT the five pairings\n`,
  solution:`CREATE TABLE design_stones (
  design_id INTEGER NOT NULL REFERENCES designs(id),
  stone_id INTEGER NOT NULL REFERENCES stones(id),
  qty INTEGER NOT NULL DEFAULT 1,
  PRIMARY KEY (design_id, stone_id)
);

INSERT INTO design_stones (design_id, stone_id)
VALUES (1, 1), (3, 1);

INSERT INTO design_stones (design_id, stone_id, qty)
VALUES (1, 2, 12), (2, 2, 8), (2, 3, 20);`,
  verify:`SELECT d.name AS design, s.name AS stone, ds.qty
FROM design_stones ds
JOIN designs d ON d.id = ds.design_id
JOIN stones s ON s.id = ds.stone_id
ORDER BY d.name, s.name;`,
  ordered:true,
  rules:[ { desc:'Composite PRIMARY KEY', re:'PRIMARY\\s+KEY\\s*\\(\\s*\\w+\\s*,\\s*\\w+\\s*\\)', flags:'i' }, { desc:'Uses REFERENCES', re:'\\bREFERENCES\\b', flags:'i' } ]
},

{ id:'m9-l7', module:8, file:'07-money-predict.sql', type:'predict', title:'Storing Money: Why REAL Is a Trap',
  dataset:'blank',
  concept:`<p>Computers store <code>REAL</code> / <code>FLOAT</code> / <code>DOUBLE</code> numbers in binary. Just as 1/3 cannot be written exactly in decimal (0.3333...), the number 0.1 cannot be written exactly in binary. Every language you know shows it: in JavaScript, <code>0.1 + 0.2 === 0.3</code> is false. SQL is no different, and for a jewellery business that sums thousands of invoice lines, tiny errors become rupees that do not reconcile at month end, and an accountant who stops trusting your reports.</p>
<p>Study the query: the first comparison uses decimal fractions, the second uses whole numbers (paise, the smallest unit). Predict both results; 1 means true and 0 means false.</p>`,
  predict:{
    snippet:`SELECT\n  (0.1 + 0.2 = 0.3) AS with_decimals,\n  (10 + 20 = 30)    AS with_integers;`,
    question:`What do with_decimals and with_integers return?`,
    options:['1, 1','0, 1','0, 0','1, 0'],
    correctIndex:1,
    afterExplain:`<code>0.1 + 0.2</code> is actually 0.30000000000000004 in binary floating point, so the comparison is false (0). Integers are exact.<br><br><b>The three correct ways to store money:</b><ol><li><b>Integer minor units</b>: store paise (or cents), so Rs 249.50 is 24950. Exact, fast, works in every database, and SUM stays exact. Convert to rupees only for display. This is what Stripe and most payment APIs do. Beware dividing: Rs 100 split three ways needs an explicit rounding rule (and who gets the extra paisa).</li><li><b>DECIMAL / NUMERIC(12,2)</b> in PostgreSQL, MySQL and SQL Server: exact decimal arithmetic. The best choice where available. SQLite has no real decimal type (a NUMERIC column still becomes a float for fractions), which is why integer paise is the SQLite answer.</li><li><b>Never FLOAT/REAL/DOUBLE</b> for amounts, prices, balances or tax. It is acceptable for measurements that are inherently approximate, such as carat weight or gram weight (but compare with a tolerance, <code>ABS(a - b) &lt; 0.001</code>, never <code>=</code>).</li></ol>Also store the <b>currency</b> (a 3-letter code, e.g. INR, USD) next to any amount that might ever be multi-currency, and keep the price actually charged on <code>order_items.unit_price</code>, as your shop schema does, so later list-price changes do not rewrite history.`
  }
},

{ id:'m9-l8', module:8, file:'08-alter-table-naming.sql', type:'exercise', title:'ALTER TABLE, SQLite Limits and Naming Conventions',
  dataset:'blank',
  setupExtra:`CREATE TABLE pieces (
  id INTEGER PRIMARY KEY,
  nm TEXT NOT NULL,
  wt REAL
);
INSERT INTO pieces (id, nm, wt) VALUES
  (1, 'Rose Ring', 4.2),
  (2, 'Lotus Pendant', 6.8),
  (3, 'Plain Band', 5.1);`,
  concept:`<p>Requirements change. The table you designed in January needs a hallmark column by March. <code>ALTER TABLE</code> modifies an existing table without recreating it, and the data stays.</p>
<pre>ALTER TABLE pieces ADD COLUMN purity TEXT;
ALTER TABLE pieces RENAME COLUMN nm TO name;
ALTER TABLE pieces RENAME TO jewellery_pieces;</pre>
<p>Adding a column is cheap: existing rows get NULL (or the DEFAULT). You can write <code>ADD COLUMN hallmarked INTEGER NOT NULL DEFAULT 0</code>; a NOT NULL column <em>requires</em> a non-NULL default, because the existing rows need some value. <code>DROP COLUMN</code> works in SQLite 3.35+ but refuses columns that are indexed, in a key, or used in a CHECK.</p>
<p><b>SQLite's limits:</b> you cannot <code>ALTER COLUMN</code> to change a type, nor add or remove a constraint or foreign key on an existing column. The official recipe is the <em>rebuild</em>: create <code>new_table</code> with the desired schema, <code>INSERT INTO new_table SELECT ... FROM old_table</code>, drop the old table, rename the new one (all in a transaction). PostgreSQL has <code>ALTER COLUMN ... TYPE</code> and <code>ADD CONSTRAINT</code>; MySQL has <code>MODIFY COLUMN</code>. On big production tables those can lock the table for minutes, so teams use online-schema-change tools and the "expand, migrate, contract" pattern: add the new column, backfill, switch the code, drop the old one later.</p>
<p><b>Naming conventions</b> matter because you read schema far more than you write it: <code>snake_case</code> everywhere; tables as plural nouns (<code>customers</code>) or consistently singular (pick one); primary key <code>id</code>; foreign keys <code>customer_id</code> (singular parent + <code>_id</code>); booleans as <code>is_active</code>; timestamps <code>created_at</code>; no abbreviations like <code>nm</code> and <code>wt</code>, and never reserved words (<code>order</code>, <code>group</code>, <code>user</code>) as table names, which force quoting. Mixed case in PostgreSQL requires quotes forever, so avoid it.</p>
<div class="callout"><b>Interview trap:</b> "How do you add a NOT NULL column to a ten-million-row table with zero downtime?" Add it nullable, backfill in batches, then add the constraint, rather than one blocking ALTER.</div>`,
  task:`Using ALTER TABLE statements on <code>pieces</code>: (1) rename the column <code>nm</code> to <code>name</code> and the column <code>wt</code> to <code>weight_g</code>; (2) add a column <code>purity TEXT</code>; (3) add <code>hallmarked INTEGER NOT NULL DEFAULT 0</code>; (4) rename the table to <code>jewellery_pieces</code>. Then run an UPDATE setting <code>purity = '22K'</code> and <code>hallmarked = 1</code> for the piece with id 2 only.`,
  starter:`-- ALTER TABLE ... RENAME COLUMN\n-- ALTER TABLE ... ADD COLUMN\n-- ALTER TABLE ... RENAME TO\n-- then the UPDATE (use the NEW table name)\n`,
  solution:`ALTER TABLE pieces RENAME COLUMN nm TO name;
ALTER TABLE pieces RENAME COLUMN wt TO weight_g;
ALTER TABLE pieces ADD COLUMN purity TEXT;
ALTER TABLE pieces ADD COLUMN hallmarked INTEGER NOT NULL DEFAULT 0;
ALTER TABLE pieces RENAME TO jewellery_pieces;

UPDATE jewellery_pieces
SET purity = '22K', hallmarked = 1
WHERE id = 2;`,
  verify:`SELECT id, name, weight_g, purity, hallmarked FROM jewellery_pieces ORDER BY id;`,
  ordered:true,
  rules:[ { desc:'Uses ALTER TABLE', re:'\\bALTER\\s+TABLE\\b', flags:'i' } ]
},

{ id:'m9-l9', module:8, file:'09-views-job-tracking.sql', type:'exercise', title:'Designing a Job-Tracking Schema and Using Views',
  dataset:'blank',
  setupExtra:`CREATE TABLE karigars (
  id INTEGER PRIMARY KEY,
  name TEXT NOT NULL UNIQUE
);
CREATE TABLE jobs (
  id INTEGER PRIMARY KEY,
  order_ref TEXT NOT NULL,
  karigar_id INTEGER NOT NULL REFERENCES karigars(id),
  status TEXT NOT NULL DEFAULT 'open'
    CHECK (status IN ('open','in_progress','done','delivered')),
  due_date TEXT NOT NULL
);
INSERT INTO karigars (id, name) VALUES (1, 'Rajesh'), (2, 'Imran');
INSERT INTO jobs (id, order_ref, karigar_id, status, due_date) VALUES
  (1, 'ORD-10', 1, 'delivered', '2025-02-10'),
  (2, 'ORD-11', 1, 'in_progress', '2025-02-20'),
  (3, 'ORD-12', 2, 'open', '2025-02-25'),
  (4, 'ORD-13', 2, 'in_progress', '2025-03-15'),
  (5, 'ORD-14', 1, 'done', '2025-02-18');`,
  concept:`<p>Now put the pieces together on a scenario from your own work: tracking jewellery jobs through a workshop. Good design starts with questions, not tables. <em>What are the nouns?</em> Orders, jobs, karigars, stages. <em>What are the relationships?</em> A karigar has many jobs (one-to-many); a job passes through many stages over time. <em>What will we ask?</em> Which jobs are overdue? Who is overloaded? How long does casting take on average?</p>
<p>A strong design stores <strong>facts</strong> and derives answers. Keep the current <code>status</code> on <code>jobs</code> for fast "what is open" queries, but record every transition in an append-only <code>job_events(job_id, stage, changed_at, changed_by)</code> table, so history, audit and cycle-time analytics are possible and nothing is overwritten. Do not store derived values (such as "days overdue") that go stale; compute them. Give every table a surrogate <code>id</code>, put foreign keys and CHECKs on status codes, and store weights in grams and money in paise.</p>
<p>A <strong>view</strong> is a saved SELECT with a name. It stores no data; it re-runs the query each time you read it, so it is always current.</p>
<pre>CREATE VIEW v_live_designs AS
SELECT id, name FROM designs
WHERE deleted_at IS NULL;

SELECT * FROM v_live_designs;</pre>
<p>Views give your team one agreed definition of a business term ("overdue"), hide join complexity from analysts, and can restrict which columns a role may see. They also solve the soft-delete problem from earlier: everyone queries the view and forgets about <code>deleted_at</code>.</p>
<div class="callout"><b>Dialect note / Interview trap:</b> a plain view is not faster than the underlying query. PostgreSQL has <code>MATERIALIZED VIEW</code> (stored result, refreshed with <code>REFRESH MATERIALIZED VIEW</code>); MySQL and SQLite do not. Views over views over views become unreadable and slow, since the optimiser must expand all of them. Simple views can be updatable in PostgreSQL/MySQL; in SQLite views are read-only (unless you add INSTEAD OF triggers).</div>`,
  task:`The tables <code>karigars</code> and <code>jobs</code> exist. (1) Create a view <code>v_overdue_jobs</code> with columns <code>job_id</code> (the job's id), <code>order_ref</code>, <code>karigar</code> (the karigar's name) and <code>due_date</code>, containing jobs whose status is <b>not</b> <code>'delivered'</code> and whose <code>due_date</code> is before <code>'2025-03-01'</code>. (2) Afterwards insert a new job: id 6, order_ref <code>'ORD-15'</code>, karigar 1, status <code>'open'</code>, due date <code>'2025-02-01'</code>. The view must reflect the new job automatically.`,
  starter:`-- 1) the view (join jobs to karigars)\nCREATE VIEW v_overdue_jobs AS\nSELECT 1;\n\n-- 2) the new job row\n`,
  solution:`CREATE VIEW v_overdue_jobs AS
SELECT j.id AS job_id,
       j.order_ref,
       k.name AS karigar,
       j.due_date
FROM jobs j
JOIN karigars k ON k.id = j.karigar_id
WHERE j.status <> 'delivered'
  AND j.due_date < '2025-03-01';

INSERT INTO jobs (id, order_ref, karigar_id, status, due_date)
VALUES (6, 'ORD-15', 1, 'open', '2025-02-01');`,
  verify:`SELECT job_id, order_ref, karigar, due_date FROM v_overdue_jobs ORDER BY job_id;`,
  ordered:true,
  columns:true,
  rules:[ { desc:'Uses CREATE VIEW', re:'\\bCREATE\\s+VIEW\\b', flags:'i' }, { desc:'Joins the tables', re:'\\bJOIN\\b', flags:'i' } ]
}

);

{ id:'m10-l1', module:9, file:'01-what-is-an-index.sql', type:'explore', title:'What an Index Really Is (B-Tree Mental Model)',
  dataset:'shop',
  concept:`<p>Imagine the jewellery shop keeps every sale in one giant paper register, in the order the sales happened. A customer walks in and says "show me everything I bought". The only way to answer is to read the register from page one to the last page, checking every line. That is a <strong>full table scan</strong>: the database visits every row, keeps the matches, throws away the rest. With 40 orders nobody notices. With 40 million orders it is the difference between milliseconds and minutes.</p>
<p>Now picture the index at the back of a textbook: an <em>alphabetical</em> list of terms, each with the page numbers where it appears. You look up "Platinum", jump straight to pages 14 and 92, and never touch the other 400 pages. A database index is exactly that: a separate, <strong>sorted</strong> structure holding the indexed column's values plus a pointer to the row. Because it is sorted, the database can binary-search it instead of reading it linearly.</p>
<p>Real engines store that sorted structure as a <strong>B-tree</strong> (balanced tree). The top node says "values below M go left, M and above go right"; each level narrows the search, and the bottom level (the leaves) holds the actual sorted values with row pointers. A tree with a few hundred keys per node is only 3 or 4 levels deep even for hundreds of millions of rows, so finding one value costs about 3 or 4 page reads. That is the whole trick: <code>O(log n)</code> lookups instead of <code>O(n)</code> scans. Leaves are also linked in order, so a <em>range</em> (<code>BETWEEN</code>, <code>&gt;=</code>) is "find the start, then walk along".</p>
<pre>-- see how SQLite will run a query:
EXPLAIN QUERY PLAN
SELECT * FROM orders WHERE status = 'pending';
-- SCAN orders        = read every row
-- SEARCH ... USING INDEX = jump via an index</pre>
<p>Indexes are not free and not always used. Each one is an extra copy of data that must be kept in sync on every <code>INSERT</code>, <code>UPDATE</code> and <code>DELETE</code>. And an index only helps when it is <strong>selective</strong>: an index on <code>status</code> (4 distinct values) returns a quarter of the table per lookup, so scanning may be just as good. An index on <code>email</code> (almost all distinct) is gold.</p>
<div class="callout"><b>Interview trap:</b> "Does adding an index always make queries faster?" No. It speeds up reads that can use it, slows down writes, uses disk and memory, and the optimizer may ignore it when it expects to read a big share of the table anyway. Also: primary keys are indexed automatically (in SQLite the <code>INTEGER PRIMARY KEY</code> <em>is</em> the table's B-tree, called the rowid). PostgreSQL and MySQL/InnoDB also index the PK automatically; <b>foreign key columns are NOT indexed automatically</b> in PostgreSQL, which causes slow joins and slow deletes in real apps.</div>
<p>Experiment below: run the plan for a lookup by <code>id</code> (primary key) and by <code>status</code>, then uncomment the <code>CREATE INDEX</code> and watch the second plan change from SCAN to SEARCH. The <code>pragma_index_list</code> line shows which indexes a table owns.</p>`,
  starter:`-- 1. which indexes does orders have right now?
SELECT * FROM pragma_index_list('orders');

-- 2. primary key lookup vs unindexed column
EXPLAIN QUERY PLAN SELECT * FROM orders WHERE id = 5;
EXPLAIN QUERY PLAN SELECT * FROM orders WHERE status = 'pending';

-- 3. uncomment, run again, compare plan 2
-- CREATE INDEX idx_orders_status ON orders(status);
-- EXPLAIN QUERY PLAN SELECT * FROM orders WHERE status = 'pending';`
},

{ id:'m10-l2', module:9, file:'02-create-index.sql', type:'exercise', title:'CREATE INDEX and UNIQUE INDEX',
  dataset:'shop',
  concept:`<p>Creating an index is one statement: <code>CREATE INDEX name ON table (column)</code>. The database reads the whole table once, builds the sorted structure, and from then on keeps it up to date automatically. You never reference an index in your <code>SELECT</code>; the query optimizer decides on its own whether to use it. That is why indexing is a <em>deployment</em> concern (a migration) and not an application-code change.</p>
<pre>CREATE INDEX idx_orders_customer
  ON orders (customer_id);

CREATE UNIQUE INDEX uq_products_sku
  ON products (sku);</pre>
<p>A <strong>UNIQUE index</strong> does two jobs at once: it speeds up lookups <em>and</em> it rejects duplicates. Inserting a second product with SKU <code>RG-001</code> fails with a constraint error. In fact a <code>UNIQUE</code> constraint in <code>CREATE TABLE</code> is implemented by the database as a unique index behind the scenes. So "make the SKU unique" and "index the SKU" are one decision, not two.</p>
<p>Naming convention matters in teams: <code>idx_&lt;table&gt;_&lt;cols&gt;</code> for ordinary and <code>uq_&lt;table&gt;_&lt;cols&gt;</code> for unique ones. Migrations are read by humans at 2 a.m. during an incident.</p>
<p><strong>The cost.</strong> Every index is another B-tree. When you insert one order, the database writes the table row <em>and</em> one entry into every index on that table. Update a column that is indexed, and the index entry is deleted and re-inserted. A table with 8 indexes does roughly 9 writes per insert. Read-heavy reporting tables can afford many; hot write tables (orders, events, logs) should carry only the indexes their queries truly need. Also on large tables, building an index can lock writes for a long time: PostgreSQL offers <code>CREATE INDEX CONCURRENTLY</code> for exactly this; MySQL 8 builds most indexes online.</p>
<div class="callout"><b>Dialect note:</b> a unique index treats NULLs as "distinct from each other" in SQLite, PostgreSQL and MySQL, so many NULL emails are allowed. SQL Server is the odd one out: it allows only one NULL in a unique index unless you add a filter (<code>WHERE email IS NOT NULL</code>). Also <code>CREATE INDEX IF NOT EXISTS</code> exists in SQLite/PostgreSQL but not in older MySQL.</div>
<p>Real-world: when a ticket says "the orders page is slow", step one is nearly always <em>look at the query, then add the missing index on the WHERE / JOIN column</em>.</p>`,
  task:`In one script create three indexes with exactly these names: (1) a normal index <code>idx_orders_customer</code> on <code>orders(customer_id)</code>; (2) a unique index <code>uq_products_sku</code> on <code>products(sku)</code>; (3) a unique index <code>uq_customers_email</code> on <code>customers(email)</code> (some emails are NULL, which a unique index allows). The checker inspects the indexes that exist afterwards.`,
  starter:`-- three CREATE statements, exactly the names given in the task
CREATE INDEX idx_orders_customer ON orders (customer_id);
`,
  solution:`CREATE INDEX idx_orders_customer ON orders (customer_id);
CREATE UNIQUE INDEX uq_products_sku ON products (sku);
CREATE UNIQUE INDEX uq_customers_email ON customers (email);`,
  verify:`SELECT l.name AS index_name, l."unique" AS is_unique,
       (SELECT group_concat(name, ',') FROM pragma_index_info(l.name)) AS cols
FROM sqlite_master t, pragma_index_list(t.name) l
WHERE t.type = 'table' AND l.origin = 'c'
ORDER BY l.name`,
  ordered:true,
  rules:[ { desc:'Uses CREATE UNIQUE INDEX', re:'CREATE\\s+UNIQUE\\s+INDEX', flags:'i' } ]
},

{ id:'m10-l3', module:9, file:'03-reading-explain-predict.sql', type:'predict', title:'Reading EXPLAIN QUERY PLAN — Predict the Plan',
  dataset:'shop',
  setupExtra:`CREATE INDEX idx_orders_status ON orders (status);`,
  concept:`<p>A query plan is the database's answer to "how will you run this?". In SQLite you get it with <code>EXPLAIN QUERY PLAN</code> in front of the query; the <code>detail</code> column is the part to read. Learn four phrases: <code>SCAN t</code> (read the whole table, slow at scale), <code>SEARCH t USING INDEX i (col=?)</code> (jump through an index), <code>SEARCH t USING INTEGER PRIMARY KEY (rowid=?)</code> (PK lookup), and <code>USING COVERING INDEX</code> (answered from the index alone, never touching the table).</p><p>Here an index exists on <code>orders(status)</code> only. The query asks for orders of one <em>customer</em>. Predict what the plan row looks like (<code>id, parent, notused, detail</code>).</p>`,
  predict:{
    snippet:`EXPLAIN QUERY PLAN
SELECT * FROM orders
WHERE customer_id = 5;`,
    question:'Which plan row does SQLite print?',
    options:['3, 0, 0, SEARCH orders USING INDEX idx_orders_status (status=?)','2, 0, 0, SCAN orders','2, 0, 0, SEARCH orders USING INTEGER PRIMARY KEY (rowid=?)','3, 0, 0, SCAN orders USING INDEX idx_orders_status'],
    correctIndex:1,
    afterExplain:`<p>An index is only usable for the columns it is built on. <code>idx_orders_status</code> knows nothing about <code>customer_id</code>, so the database has no choice but to <strong>SCAN</strong> the table. (The leading number is just a node id and can differ between versions; ignore it.) Change the filter to <code>status = 'pending'</code> and you would see <code>SEARCH orders USING INDEX idx_orders_status (status=?)</code>. The text in brackets tells you which predicate the index serves: <code>(status=?)</code> equality, <code>(order_date&gt;?)</code> a range, <code>(customer_id=? AND order_date&gt;?)</code> a composite index used on two columns.</p>
<p><strong>Same idea in other databases.</strong> <em>PostgreSQL</em>: <code>EXPLAIN</code> shows a tree with <code>Seq Scan</code> (= SCAN), <code>Index Scan</code>, <code>Index Only Scan</code> (= COVERING INDEX) and <code>Bitmap Heap Scan</code>; <code>EXPLAIN (ANALYZE, BUFFERS)</code> actually <em>runs</em> the query and reports real row counts and timings, which is what you paste into a performance ticket. <em>MySQL</em>: <code>EXPLAIN</code> returns a table: <code>type</code> is <code>ALL</code> (full scan) / <code>ref</code> / <code>range</code> / <code>const</code>, <code>key</code> is the index chosen, <code>rows</code> the estimate, and <code>Extra: Using index</code> means covering; MySQL 8.0.18+ has <code>EXPLAIN ANALYZE</code> too. <em>SQL Server</em> shows graphical plans with <code>Index Seek</code> vs <code>Index Scan</code>, and <code>Key Lookup</code> when an index had to fetch extra columns from the table.</p>
<div class="callout"><b>Interview trap:</b> in PostgreSQL a plain <code>EXPLAIN</code> only shows <em>estimates</em>; the numbers can be badly wrong when table statistics are stale (run <code>ANALYZE</code>). Always compare estimated rows with the actual rows from <code>EXPLAIN ANALYZE</code>. Warning: <code>EXPLAIN ANALYZE</code> on an <code>UPDATE</code>/<code>DELETE</code> really executes it, so wrap it in a transaction and roll back.</div>`
  }
},

{ id:'m10-l4', module:9, file:'04-composite-indexes.sql', type:'exercise', title:'Composite Indexes and the Leftmost-Prefix Rule',
  dataset:'shop',
  concept:`<p>An index can cover several columns: <code>CREATE INDEX i ON orders (customer_id, order_date)</code>. Think of a phone book sorted by <em>surname, then first name</em>. You can find "Mehta" quickly. You can find "Mehta, Aarav" even faster. But you cannot use the book to find everyone named "Aarav", because within the whole book the first names are scattered. The same holds for a composite B-tree: entries are sorted by the first column, ties broken by the second, and so on.</p>
<p>This gives the <strong>leftmost-prefix rule</strong>. An index on <code>(a, b, c)</code> can serve filters on <code>a</code>, on <code>a, b</code>, or on <code>a, b, c</code>. It generally cannot serve a filter on <code>b</code> alone or <code>c</code> alone (some engines can do an inefficient "skip scan"). So column order is the design decision.</p>
<p>Rules of thumb for order:</p>
<ul><li><strong>Equality columns first, range column last.</strong> For <code>WHERE customer_id = 12 AND order_date &gt;= '2025-01-01'</code> use <code>(customer_id, order_date)</code>: the equality narrows to one contiguous slice, and inside it the dates are already sorted. Reverse it and the database must walk every date from 2025 on and filter customers one by one.</li>
<li>Among several equality columns, put the more <em>selective</em> one (more distinct values) first only if some queries filter on it alone; otherwise either order works for the equality query itself.</li>
<li>A composite index also serves <code>ORDER BY</code>: <code>WHERE customer_id = 12 ORDER BY order_date</code> needs no sort step at all.</li></ul>
<pre>-- served by (customer_id, order_date):
WHERE customer_id = 12
WHERE customer_id = 12 AND order_date &gt; '2025-01-01'
-- NOT served efficiently:
WHERE order_date &gt; '2025-01-01'</pre>
<div class="callout"><b>Common mistake:</b> creating one index per column ("index everything") instead of one composite index matched to the real query. Two single-column indexes are not equivalent to one composite: most engines use just one of them and filter the rest. Another review comment you will receive: an index on <code>(customer_id)</code> is redundant once you have <code>(customer_id, order_date)</code>, because the composite already serves every customer_id-only lookup. Drop the shorter one to save write cost.</div>
<p>Real-world: the customer account page ("my orders this year") and the warehouse screen ("items of order X for product Y") are classic composite candidates.</p>`,
  task:`Create two composite indexes with exactly these names. (1) <code>idx_orders_cust_date</code> to serve <code>WHERE customer_id = ? AND order_date &gt;= ?</code> on <code>orders</code>. (2) <code>idx_items_product_qty</code> to serve <code>WHERE product_id = ? AND qty &gt;= ?</code> on <code>order_items</code>. Choose the column order that follows the equality-first, range-last rule.`,
  starter:`-- two composite indexes; think about column ORDER
-- CREATE INDEX idx_orders_cust_date ON orders (...);
-- CREATE INDEX idx_items_product_qty ON order_items (...);
`,
  solution:`CREATE INDEX idx_orders_cust_date
  ON orders (customer_id, order_date);
CREATE INDEX idx_items_product_qty
  ON order_items (product_id, qty);`,
  verify:`SELECT l.name AS index_name, i.seqno, i.name AS col
FROM sqlite_master t, pragma_index_list(t.name) l, pragma_index_info(l.name) i
WHERE t.type = 'table' AND l.origin = 'c'
ORDER BY l.name, i.seqno`,
  ordered:true,
  rules:[ { desc:'Uses CREATE INDEX', re:'CREATE\\s+INDEX', flags:'i' } ]
},

{ id:'m10-l5', module:9, file:'05-covering-indexes.sql', type:'exercise', title:'Covering Indexes: Never Touch the Table',
  dataset:'shop',
  concept:`<p>A normal index lookup is two steps: (1) search the index to find matching row pointers, (2) jump to the table to fetch the columns you selected. Step 2 is random I/O and is often the expensive part, especially when the query matches many rows. A <strong>covering index</strong> contains <em>every column the query needs</em>, so step 2 disappears: the answer is read entirely from the index, which is also narrower than the table and therefore more cache-friendly.</p>
<p>Take the customer account page: <code>SELECT order_date, status FROM orders WHERE customer_id = 12</code>. An index on <code>(customer_id)</code> finds the rows but must still visit the table for date and status. An index on <code>(customer_id, order_date, status)</code> holds all three columns, so the plan reads <code>USING COVERING INDEX</code>. Order: the filter column first, then the output columns.</p>
<pre>CREATE INDEX idx_orders_cust_cover
  ON orders (customer_id, order_date, status);

EXPLAIN QUERY PLAN
SELECT order_date, status
FROM orders WHERE customer_id = 12;
-- SEARCH orders USING COVERING INDEX ...</pre>
<p>Other databases make this explicit. PostgreSQL 11+ has <code>INCLUDE</code>: <code>CREATE INDEX ... ON orders (customer_id) INCLUDE (order_date, status)</code>, which stores extra payload columns in the index without making them part of the sort key. SQL Server has the same <code>INCLUDE</code> syntax. In PostgreSQL the plan node is <code>Index Only Scan</code> (and it still needs the visibility map to be fresh, so run <code>VACUUM</code>). In MySQL/InnoDB, secondary indexes silently include the primary key, and <code>Extra: Using index</code> signals coverage.</p>
<div class="callout"><b>Interview trap:</b> "Why not make every index cover everything?" Because a wide index costs more storage, more memory, and more work on every write, and it only helps the specific query shape it was designed for. <code>SELECT *</code> kills covering indexes: you almost never cover every column. Naming only the columns you need is a performance feature, not just style.</div>
<p>In this exercise the checker does something new: after your script runs, it runs <code>EXPLAIN QUERY PLAN</code> on the account-page query and compares the plan text. You pass only if the optimizer reports your named index as covering.</p>`,
  task:`Create an index named <code>idx_orders_cust_cover</code> on <code>orders</code> so that <code>SELECT order_date, status FROM orders WHERE customer_id = 12</code> is answered by a <em>covering</em> index search on <code>customer_id</code>. The checker prints the query plan after your script runs; it must read <code>SEARCH orders USING COVERING INDEX idx_orders_cust_cover (customer_id=?)</code>.`,
  starter:`-- one CREATE INDEX; which columns must it contain?
-- name: idx_orders_cust_cover
`,
  solution:`CREATE INDEX idx_orders_cust_cover
  ON orders (customer_id, order_date, status);`,
  verify:`EXPLAIN QUERY PLAN
SELECT order_date, status FROM orders WHERE customer_id = 12`,
  rules:[ { desc:'Uses CREATE INDEX', re:'CREATE\\s+INDEX', flags:'i' } ]
},

{ id:'m10-l6', module:9, file:'06-sargability-predict.sql', type:'predict', title:'Sargability: Functions on Columns Defeat Indexes',
  dataset:'shop',
  setupExtra:`CREATE INDEX idx_orders_date ON orders (order_date);`,
  concept:`<p>"Sargable" means <em>Search ARGument ABLE</em>: a filter the database can answer by navigating the index. An index is sorted by the stored column value. The moment you wrap the column in a function or expression, you are asking about a <em>different</em> value (the year of the date, the lower-case name) that the index never stored, so the database must compute it for every row.</p><p>The shop has an index on <code>orders(order_date)</code>. A developer wants all 2025 orders and writes a filter with <code>strftime</code> around the column. Predict the plan row.</p>`,
  predict:{
    snippet:`EXPLAIN QUERY PLAN
SELECT * FROM orders
WHERE strftime('%Y', order_date) = '2025';`,
    question:'What does the plan look like?',
    options:['3, 0, 0, SEARCH orders USING INDEX idx_orders_date (order_date=?)','2, 0, 0, SCAN orders','3, 0, 0, SEARCH orders USING INDEX idx_orders_date (order_date>?)','2, 0, 0, SCAN orders USING INDEX idx_orders_date'],
    correctIndex:1,
    afterExplain:`<p>The index exists, yet the plan is a plain <strong>SCAN</strong>. The fix is to rewrite the predicate as a <em>range on the bare column</em>:</p>
<pre>-- not sargable
WHERE strftime('%Y', order_date) = '2025'
-- sargable: SEARCH ... (order_date&gt;?)
WHERE order_date &gt;= '2025-01-01'
  AND order_date &lt;  '2026-01-01'</pre>
<p>Use a half-open range (<code>&gt;=</code> start, <code>&lt;</code> next start): it works for dates, timestamps and datetimes alike, with no off-by-one on the last day. The same pattern appears everywhere:</p>
<ul><li><code>WHERE LOWER(email) = 'x'</code> is not sargable. Store emails normalised, or create an <em>expression index</em> (<code>CREATE INDEX ... ON customers (LOWER(email))</code>, supported by SQLite, PostgreSQL, and MySQL 8.0.13+).</li>
<li><code>WHERE price * 1.18 &gt; 50000</code> becomes <code>WHERE price &gt; 50000 / 1.18</code>: move the arithmetic to the constant side.</li>
<li><code>WHERE name LIKE '%ring'</code> (leading wildcard) cannot use a B-tree: the sort order starts at the first letter, and you do not know it. <code>LIKE 'Solitaire%'</code> (prefix only) can, in PostgreSQL only with the right operator class or <code>C</code> collation, and in SQLite when collations line up. For true "contains" search use full-text search (<code>FTS5</code>, PostgreSQL <code>tsvector</code> / <code>pg_trgm</code>, MySQL <code>FULLTEXT</code>).</li>
<li>Comparing mismatched types (text column vs number) makes MySQL and others cast the column, silently disabling the index. A classic production surprise.</li></ul>
<div class="callout"><b>Interview trap:</b> "My index exists but the query is still slow. Why?" Check, in order: is the column wrapped in a function? is there a leading wildcard? is a type mismatch forcing a cast? is the filter so unselective that a scan is cheaper? is the composite index's leftmost column missing from the filter? Then read the plan, never guess.</div>`
  }
},

{ id:'m10-l7', module:9, file:'07-n-plus-one.sql', type:'exercise', title:'The N+1 Query Problem (and the Single-Query Fix)',
  dataset:'shop',
  concept:`<p>This is the most common database performance bug in web applications, and the one backend interviews love. It looks innocent in code:</p>
<pre>orders = db.query("SELECT * FROM orders
                   WHERE status = 'pending'")   # 1 query
for o in orders:                                # N rows
    c = db.query("SELECT name FROM customers
                  WHERE id = ?", o.customer_id) # N queries
    n = db.query("SELECT COUNT(*) FROM order_items
                  WHERE order_id = ?", o.id)    # N more</pre>
<p>One query to get the list, then one (or more) extra queries <em>per row</em>. With 7 pending orders that is 15 round trips; with 5,000 it is 10,001. Each round trip costs network latency (often 1 to 5 ms even on a fast LAN), parsing, planning and locking, so a page that "worked fine in dev" takes seconds in production. ORMs hide it: touching <code>order.customer.name</code> in a template silently fires a lazy-load query per row. Django calls the cure <code>select_related</code> / <code>prefetch_related</code>, Rails <code>includes</code>, Hibernate/JPA <code>JOIN FETCH</code>, Sequelize/Prisma <code>include</code>.</p>
<p>The cure in SQL is to ask for the whole shape at once with a <strong>JOIN</strong> (and <code>GROUP BY</code> for the per-order aggregates). The database is built to do this in one pass, using indexes on the join keys, and a single network round trip returns everything. The alternative when joins would duplicate too much data is the "batched" form: <code>WHERE id IN (...all ids...)</code> run once, then stitched in code: 2 queries instead of N+1.</p>
<div class="callout"><b>How to spot it:</b> enable query logging in dev and watch for the same statement repeated with different ids; use a counter assertion in tests (Django's <code>assertNumQueries</code>). <b>Index link:</b> the fix only stays fast if the join column is indexed; in PostgreSQL <code>order_items.order_id</code> needs its own index because foreign keys do not create one. <b>Do not</b> over-correct by joining five one-to-many tables at once, the row counts multiply (a "fan-out") and totals get inflated.</div>
<p>Your task is the SQL side of the fix: one statement that returns everything the loop above was assembling.</p>`,
  task:`In a single query, return one row per <em>pending</em> order with columns <code>order_id</code>, <code>customer_name</code>, <code>lines</code> (number of order_items rows) and <code>total</code> (sum of <code>qty * unit_price</code>). Order by <code>order_id</code>. Use JOINs and GROUP BY, no per-row subqueries.`,
  starter:`-- one query replacing the whole N+1 loop
SELECT o.id AS order_id
FROM orders o
WHERE o.status = 'pending'
ORDER BY o.id;`,
  solution:`SELECT o.id AS order_id,
       c.name AS customer_name,
       COUNT(*) AS lines,
       SUM(oi.qty * oi.unit_price) AS total
FROM orders o
JOIN customers c ON c.id = o.customer_id
JOIN order_items oi ON oi.order_id = o.id
WHERE o.status = 'pending'
GROUP BY o.id, c.name
ORDER BY o.id;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses JOIN', re:'\\bJOIN\\b', flags:'i' }, { desc:'Uses GROUP BY', re:'GROUP\\s+BY', flags:'i' } ]
},

{ id:'m10-l8', module:9, file:'08-keyset-pagination.sql', type:'exercise', title:'Pagination: OFFSET vs Keyset (Seek) Pagination',
  dataset:'shop',
  concept:`<p>Every list screen needs paging. The textbook way is <code>LIMIT 5 OFFSET 10</code>: "skip 10 rows, give me the next 5". It is simple, and it has two serious flaws at scale.</p>
<ul><li><strong>It gets slower the deeper you go.</strong> The database cannot jump to row 10,000. It must produce and discard all 10,000 skipped rows first, so page 2,000 costs 2,000 times page 1, even with a perfect index.</li>
<li><strong>It is unstable.</strong> If a new order arrives while the user is on page 3, every row shifts by one and the next page repeats a row or skips one.</li></ul>
<p><strong>Keyset pagination</strong> (also "seek" or "cursor" pagination) fixes both. Instead of "skip N", the client sends the <em>last row it saw</em>, and the query says "give me rows strictly after that one in sort order". With an index on the sort columns, the database seeks directly to that spot and reads 5 rows: constant cost for every page.</p>
<pre>-- newest first; cursor = (order_date, id) of last row
SELECT id, order_date, status
FROM orders
WHERE order_date &lt; :d
   OR (order_date = :d AND id &lt; :id)
ORDER BY order_date DESC, id DESC
LIMIT 5;</pre>
<p>Two details decide correctness. First, the sort must be <strong>total</strong>: <code>order_date</code> alone is not unique (two orders on one day), so add the primary key as a tiebreaker both in <code>ORDER BY</code> and in the cursor condition. Second, the condition must mirror the sort direction: descending sort means "smaller than the cursor". PostgreSQL, MySQL 8 and SQLite 3.15+ also accept the compact row-value form <code>WHERE (order_date, id) &lt; (:d, :id)</code>, though older MySQL optimizers handle it poorly, so the expanded OR form is the portable choice.</p>
<div class="callout"><b>Trade-offs / interview answer:</b> keyset pagination cannot jump to "page 37" or show "page 3 of 80"; it only does next/previous (infinite scroll, API cursors such as <code>?after=abc</code>). The cursor is usually the sort values encoded (base64) into an opaque token. Choose OFFSET for small admin tables with page numbers; choose keyset for feeds, APIs and any table that can grow big. Also note <code>COUNT(*)</code> for a total is its own full count and is expensive on huge tables.</div>
<p>Practice on the real data, and note the tie: orders 14 and 15 share the date 2024-10-26.</p>`,
  task:`Orders are listed newest first: <code>ORDER BY order_date DESC, id DESC</code>, 5 per page. The previous page ended with the row <code>order_date = '2024-10-26'</code>, <code>id = 15</code>. Return the next page using keyset pagination (no OFFSET): columns <code>id</code>, <code>order_date</code>, <code>status</code>, exactly 5 rows, in that sort order. Make sure the tied row from the same day is not lost.`,
  starter:`-- keyset: rows strictly AFTER (2024-10-26, id 15)
-- in the order_date DESC, id DESC sort
SELECT id, order_date, status
FROM orders
ORDER BY order_date DESC, id DESC
LIMIT 5;`,
  solution:`SELECT id, order_date, status
FROM orders
WHERE order_date < '2024-10-26'
   OR (order_date = '2024-10-26' AND id < 15)
ORDER BY order_date DESC, id DESC
LIMIT 5;`,
  ordered:true, columns:true,
  rules:[ { desc:'Does not use OFFSET', re:'\\bOFFSET\\b', flags:'i', not:true } ]
}

);
