{ id:'m6-l1', module:5, file:'01-scalar-and-in-subqueries.sql', type:'exercise', title:'Subqueries: Scalar Values and IN Lists',
  dataset:'shop',
  concept:`<p>So far every query asked one question. Real questions are often two-step: "which products cost more than <em>the average</em> product?" You cannot write <code>WHERE price &gt; AVG(price)</code>, because aggregates are not allowed in <code>WHERE</code> (rows are filtered before groups exist). The fix is a <strong>subquery</strong>: a complete <code>SELECT</code> wrapped in parentheses and used as a value inside another query. The inner query runs, produces a result, and the outer query uses it.</p>
<p>The shape of the inner result decides where it may go:</p>
<ul>
<li><b>Scalar subquery</b>: exactly one row, one column. It behaves like a single value, so it works anywhere a value works: <code>WHERE price &gt; (SELECT AVG(price) FROM products)</code>, or even in the <code>SELECT</code> list.</li>
<li><b>List subquery</b>: one column, many rows. It is used with <code>IN</code> / <code>NOT IN</code>: <code>WHERE id IN (SELECT product_id FROM order_items)</code>.</li>
</ul>
<pre>-- scalar: products dearer than average
SELECT name, price
FROM products
WHERE price &gt; (SELECT AVG(price) FROM products);

-- list: products that appear on at least one order
SELECT name
FROM products
WHERE id IN (SELECT product_id FROM order_items);</pre>
<p>The subquery in these examples is <em>uncorrelated</em>: it does not mention the outer query at all, so the database can run it once, remember the answer, and then scan the outer table. You can paste the inner query alone into the editor and it works, which is also the best way to debug nested SQL: run the innermost query first, then wrap outwards.</p>
<div class="callout"><b>Common mistake:</b> a scalar subquery that returns more than one row. PostgreSQL raises an error ("more than one row returned by a subquery used as an expression"); SQLite and MySQL (in some contexts) silently take the first row, which is worse because the bug hides. Guard it with an aggregate or <code>LIMIT 1</code> with a deterministic <code>ORDER BY</code>. A scalar subquery that returns zero rows yields <code>NULL</code>, and <code>price &gt; NULL</code> is unknown, so the outer query returns nothing.</div>
<p>Real-world use: "orders larger than this customer's average", "users who signed up after the last campaign date", "SKUs that sold at least once". In an interview, always say which type of subquery you are writing (scalar, list, correlated) because it tells the interviewer you understand how it will execute.</p>`,
  task:`Return the <code>name</code> and <code>price</code> of products that cost <b>more than the average price of all products</b> (scalar subquery) <b>and</b> have appeared on at least one order line (<code>id IN</code> a list subquery on <code>order_items.product_id</code>). Sort by <code>price</code> descending.`,
  starter:`-- 1) avg price: (SELECT AVG(price) FROM products)
-- 2) ordered products: id IN (SELECT product_id FROM order_items)
SELECT name, price
FROM products
ORDER BY price DESC;`,
  solution:`SELECT name, price
FROM products
WHERE price > (SELECT AVG(price) FROM products)
  AND id IN (SELECT product_id FROM order_items)
ORDER BY price DESC;`,
  ordered:true,
  rules:[ { desc:'Uses an AVG subquery', re:'\\(\\s*SELECT\\s+AVG', flags:'i' }, { desc:'Uses IN with a subquery', re:'\\bIN\\s*\\(\\s*SELECT', flags:'i' } ]
},

{ id:'m6-l2', module:5, file:'02-correlated-subqueries.sql', type:'exercise', title:'Correlated Subqueries: One Inner Query Per Outer Row',
  dataset:'shop',
  concept:`<p>"Products above the <em>overall</em> average" was easy. Now the question gets sharper: "products priced above the average <em>of their own category</em>". A ring should be compared with rings, not with necklaces. The inner query now needs to know which row the outer query is currently looking at. That link is what makes a subquery <strong>correlated</strong>.</p>
<pre>SELECT p.name, p.category, p.price
FROM products p
WHERE p.price &gt; (
  SELECT AVG(x.price)
  FROM products x
  WHERE x.category = p.category   -- the correlation
);</pre>
<p>The inner query refers to <code>p.category</code>, a column of the <em>outer</em> table. Mentally, the engine executes it like a loop: take product 1, run the inner query with its category, compare, keep or drop; take product 2, and so on. That is why we give the two copies of <code>products</code> different aliases (<code>p</code> and <code>x</code>): without aliases the inner <code>category</code> would just refer to itself and the condition would be true for every row.</p>
<p>Because it is conceptually "once per outer row", a naive correlated subquery over a million rows could mean a million inner executions. Modern optimizers often rewrite them into joins or hash aggregates, and an index on the inner filter column (<code>category</code> here) makes each probe cheap, but you should always be able to explain the loop model. A common rewrite is to compute the per-group averages once in a derived table and join to it (lesson 5), or, as you will see in the window functions module, <code>AVG(price) OVER (PARTITION BY category)</code>.</p>
<div class="callout"><b>Interview trap:</b> "Find employees who earn more than their manager" is the classic correlated/self-join question: <code>WHERE salary &gt; (SELECT m.salary FROM staff m WHERE m.id = e.manager_id)</code>. Remember the CEO has a NULL manager, so the subquery returns NULL and that row is silently dropped. <b>Dialect note:</b> all major databases support correlated subqueries; MySQL before 8.0 optimised them poorly, which is where the "avoid subqueries in MySQL" folklore comes from.</div>
<p>Real-world use: "each customer's latest order", "orders bigger than that customer's own average", "products with stock below their category's median".</p>`,
  task:`Return <code>name</code>, <code>category</code> and <code>price</code> of every product priced <b>above the average price of its own category</b>. Use a correlated subquery. Sort by <code>category</code>, then <code>name</code>.`,
  starter:`-- compare each product with the average of ITS category
SELECT p.name, p.category, p.price
FROM products p
ORDER BY p.category, p.name;`,
  solution:`SELECT p.name, p.category, p.price
FROM products p
WHERE p.price > (
  SELECT AVG(x.price)
  FROM products x
  WHERE x.category = p.category
)
ORDER BY p.category, p.name;`,
  ordered:true,
  rules:[ { desc:'Contains a subquery', re:'\\(\\s*SELECT', flags:'i' }, { desc:'Does not use window functions', re:'\\bOVER\\s*\\(', flags:'i', not:true } ]
},

{ id:'m6-l3', module:5, file:'03-exists-not-exists.sql', type:'exercise', title:'EXISTS and NOT EXISTS: Asking "Is There Any?"',
  dataset:'shop',
  concept:`<p>Often you do not need the inner data, only an answer to "does at least one matching row exist?" That is exactly what <code>EXISTS (subquery)</code> returns: true if the subquery yields <em>any</em> row, false otherwise. What the subquery selects is irrelevant (convention: <code>SELECT 1</code>), and the engine can stop at the first match, so it never builds the full list.</p>
<pre>-- customers with at least one order
SELECT c.name
FROM customers c
WHERE EXISTS (
  SELECT 1 FROM orders o
  WHERE o.customer_id = c.id
);</pre>
<p><code>EXISTS</code> is always correlated (it needs to link the inner rows to the current outer row) and it only ever answers yes/no, so it never returns NULL. That makes <code>NOT EXISTS</code> the safest way to write an anti-join: "customers with no orders", "products never sold", "staff who manage nobody".</p>
<p><b>Join vs subquery.</b> Why not just <code>JOIN orders</code>? Because a join multiplies rows: a customer with 5 orders appears 5 times, so you need <code>DISTINCT</code> or <code>GROUP BY</code> to undo the damage. <code>EXISTS</code> and <code>IN</code> are <em>semi-joins</em>: each outer row appears at most once, whatever the number of matches. Rule of thumb: if you need columns from the other table, join; if you only need to test for existence or absence, use <code>EXISTS</code> / <code>NOT EXISTS</code>; if you need to compare against an aggregate, use a scalar subquery or a CTE. For presence tests, PostgreSQL, MySQL 8 and SQL Server all plan <code>EXISTS</code> and <code>IN</code> as semi-joins, so performance is usually equal and readability decides.</p>
<div class="callout"><b>Common mistake:</b> forgetting the correlation. <code>WHERE EXISTS (SELECT 1 FROM orders)</code> has no link to the outer row, so it is true for everyone as soon as the orders table is non-empty. Also, put the extra filter <em>inside</em> the subquery: "never had a delivered order" is <code>NOT EXISTS (... AND o.status = 'delivered')</code>, not a filter outside.</div>
<p>You can combine the two in one query to express "has orders, but none were delivered", which is awkward with joins and natural here.</p>`,
  task:`Return <code>id</code> and <code>name</code> of customers who have <b>placed at least one order</b> (<code>EXISTS</code>) but <b>never had a delivered order</b> (<code>NOT EXISTS</code> with <code>status = 'delivered'</code>). Sort by <code>name</code>.`,
  starter:`-- EXISTS (any order) AND NOT EXISTS (a delivered order)
SELECT c.id, c.name
FROM customers c
ORDER BY c.name;`,
  solution:`SELECT c.id, c.name
FROM customers c
WHERE EXISTS (
    SELECT 1 FROM orders o
    WHERE o.customer_id = c.id
  )
  AND NOT EXISTS (
    SELECT 1 FROM orders o
    WHERE o.customer_id = c.id
      AND o.status = 'delivered'
  )
ORDER BY c.name;`,
  ordered:true,
  rules:[ { desc:'Uses EXISTS', re:'\\bEXISTS\\s*\\(', flags:'i' }, { desc:'Uses NOT EXISTS', re:'\\bNOT\\s+EXISTS\\b', flags:'i' } ]
},

{ id:'m6-l4', module:5, file:'04-not-in-null-trap-predict.sql', type:'predict', title:'NOT IN vs NOT EXISTS: The Subquery NULL Trap',
  dataset:'staff',
  concept:`<p>You met the NULL trap with a literal list. The same trap bites far more often with a <em>subquery</em>, because you cannot see the NULL: it hides in a column you assumed was clean. In the staff table, <code>manager_id</code> is NULL for exactly one person, the founder. The query below tries to find people who manage nobody, i.e. whose id never appears as someone's manager. Think about what the subquery produces before you pick an answer.</p>
<p>Recall the rule from the NULL module: a <code>WHERE</code> clause keeps a row only when the condition is <em>true</em>; false and unknown both discard it. <code>NOT IN</code> is shorthand for a chain of <code>&lt;&gt;</code> tests joined by <code>AND</code>, and one unknown link makes the entire chain unknown. In this table, 6 people appear as a manager and the founder's row contributes a NULL to that list. Count the people who manage nobody by hand first (everyone except those 6), then decide whether the SQL will agree with you.</p>`,
  predict:{
    snippet:`SELECT COUNT(*) AS n
FROM staff
WHERE id NOT IN (
  SELECT manager_id FROM staff
);`,
    question:'What does this query return?',
    options:['9','0','6','15'],
    correctIndex:1,
    afterExplain:`The subquery returns the list of manager ids <em>including a NULL</em> (the CEO's row). <code>id NOT IN (2, 3, 4, ..., NULL)</code> expands to <code>id &lt;&gt; 2 AND id &lt;&gt; 3 AND ... AND id &lt;&gt; NULL</code>. The last comparison is always unknown, so the whole condition can never be true and the count is <b>0</b>. The intended answer is 9 (the people who manage nobody).<br><br>Two correct fixes. Filter the NULLs out: <code>NOT IN (SELECT manager_id FROM staff WHERE manager_id IS NOT NULL)</code>. Or, better, use <code>NOT EXISTS</code>:<pre>SELECT COUNT(*)
FROM staff s
WHERE NOT EXISTS (
  SELECT 1 FROM staff m
  WHERE m.manager_id = s.id
);</pre>Here the inner comparison <code>m.manager_id = s.id</code> being unknown for the CEO row simply means "no match", which is the right behaviour. <b>Dialect note:</b> this trap is identical in PostgreSQL, MySQL and SQL Server. It is a favourite interview question and a classic production bug: the query works for months, then one day a row with a NULL arrives and a report goes blank. Senior reviewers flag <code>NOT IN (subquery)</code> on any nullable column for this reason.`
  }
},

{ id:'m6-l5', module:5, file:'05-derived-tables.sql', type:'exercise', title:'Derived Tables: A Query in the FROM Clause',
  dataset:'shop',
  concept:`<p>A subquery can also stand in for a <em>table</em>. Put it in the <code>FROM</code> clause, give it an alias, and the outer query treats its result like any other table. This is a <strong>derived table</strong> (or inline view). It is the answer to the question "how do I aggregate an aggregate?": SQL cannot write <code>AVG(COUNT(*))</code>, but it can aggregate over a table that is <em>already</em> the result of a <code>GROUP BY</code>.</p>
<p>Take a distribution question from the sales team: "how many customers have placed 1 order, 2 orders, 3 orders...?" Step one is orders per customer. Step two is to group those counts.</p>
<pre>SELECT n_orders, COUNT(*) AS customers
FROM (
  SELECT customer_id, COUNT(*) AS n_orders
  FROM orders
  GROUP BY customer_id
) AS per_customer
GROUP BY n_orders
ORDER BY n_orders;</pre>
<p>Execution reads inside-out: the inner query produces one row per customer with their order count; that intermediate table is then grouped again. Columns defined inside (<code>n_orders</code>) are available to the outer query by name, which is also how you can filter on an aggregate alias without <code>HAVING</code>: <code>WHERE n_orders &gt; 2</code> in the outer query.</p>
<div class="callout"><b>Dialect note:</b> PostgreSQL, MySQL and SQL Server <b>require an alias</b> on every derived table (<code>) AS per_customer</code>); SQLite lets you skip it, but always write one so your SQL ports. Another trap: a customer with zero orders does not appear in the inner <code>GROUP BY</code> at all, so they are missing from the histogram. To count them you would need to start from <code>customers</code> with a <code>LEFT JOIN</code>.</div>
<p>Derived tables are also how you join to pre-aggregated data without fan-out: join <code>customers</code> to a derived table of per-customer totals instead of joining to every order line and re-summing. In practice, once a query needs more than one derived table, or the same one twice, people switch to CTEs, which we cover next; the logic is identical, only the layout is more readable.</p>`,
  task:`Build the order-count histogram: return <code>n_orders</code> (how many orders a customer has placed) and <code>customers</code> (how many customers have exactly that many orders). Use a derived table in <code>FROM</code> that counts orders per <code>customer_id</code>. Customers with no orders are not included. Sort by <code>n_orders</code>. Use these exact column names.`,
  starter:`-- inner query: orders per customer
-- outer query: group those counts
SELECT n_orders, COUNT(*) AS customers
FROM (
  SELECT 1 AS n_orders   -- replace me
) AS per_customer
GROUP BY n_orders
ORDER BY n_orders;`,
  solution:`SELECT n_orders, COUNT(*) AS customers
FROM (
  SELECT customer_id, COUNT(*) AS n_orders
  FROM orders
  GROUP BY customer_id
) AS per_customer
GROUP BY n_orders
ORDER BY n_orders;`,
  ordered:true, columns:true,
  rules:[ { desc:'Has a subquery in FROM', re:'\\bFROM\\s*\\(\\s*SELECT', flags:'i' } ]
},

{ id:'m6-l6', module:5, file:'06-ctes-with.sql', type:'exercise', title:'CTEs with WITH: Naming and Chaining Steps',
  dataset:'shop',
  concept:`<p>A <strong>Common Table Expression</strong> is a named, temporary result defined at the top of a query with <code>WITH name AS (...)</code>. It does everything a derived table does, but you write the steps in reading order (top to bottom) instead of nesting them inside-out, and you can reference the same CTE more than once. This is the single biggest readability upgrade in SQL, and code reviewers expect it for anything beyond one level of nesting.</p>
<p>Several CTEs are separated by commas, with a single <code>WITH</code>, and each can use the ones defined above it. That is "chaining": each CTE is one clearly named step of a pipeline.</p>
<pre>WITH order_totals AS (
  SELECT o.id AS order_id, o.customer_id,
         SUM(oi.qty * oi.unit_price) AS total
  FROM orders o
  JOIN order_items oi ON oi.order_id = o.id
  GROUP BY o.id
),
customer_totals AS (
  SELECT customer_id, SUM(total) AS spent
  FROM order_totals
  GROUP BY customer_id
)
SELECT * FROM customer_totals;</pre>
<p>Notice the two levels of aggregation: order lines roll up to orders, then orders roll up to customers. Doing both in one <code>GROUP BY</code> would give the wrong grain; naming the steps makes the grain of each step obvious. You can debug a CTE chain by ending the query with <code>SELECT * FROM step_name</code> and checking each step alone.</p>
<div class="callout"><b>Dialect note:</b> in PostgreSQL 12+ and SQLite a CTE referenced once is usually inlined like a view; before PostgreSQL 12 every CTE was an optimisation fence (materialised), which is why old advice says "CTEs are slow". MySQL supports CTEs only from 8.0. <b>Common mistake:</b> thinking a CTE is stored. It exists only for that one statement; to reuse it across queries you want a view.</div>
<p>Real-world use: monthly KPI queries, funnel analysis, dedupe pipelines. The CTE below also reuses <code>customer_totals</code> twice (once as the data, once for the average), which is much cleaner than repeating a subquery.</p>`,
  task:`Using two chained CTEs (<code>order_totals</code> then <code>customer_totals</code>, ignoring <b>cancelled</b> orders), return the <code>name</code> and <code>spent</code> of customers whose total spend is <b>greater than the average spend per customer</b> (average over customers who have at least one non-cancelled order). Sort by <code>spent</code> descending, then <code>name</code>.`,
  starter:`WITH order_totals AS (
  -- one row per non-cancelled order: order_id, customer_id, total
  SELECT 1 AS order_id, 1 AS customer_id, 0 AS total
),
customer_totals AS (
  -- one row per customer: customer_id, spent
  SELECT 1 AS customer_id, 0 AS spent
)
SELECT c.name, ct.spent
FROM customer_totals ct
JOIN customers c ON c.id = ct.customer_id
ORDER BY ct.spent DESC, c.name;`,
  solution:`WITH order_totals AS (
  SELECT o.id AS order_id, o.customer_id,
         SUM(oi.qty * oi.unit_price) AS total
  FROM orders o
  JOIN order_items oi ON oi.order_id = o.id
  WHERE o.status <> 'cancelled'
  GROUP BY o.id
),
customer_totals AS (
  SELECT customer_id, SUM(total) AS spent
  FROM order_totals
  GROUP BY customer_id
)
SELECT c.name, ct.spent
FROM customer_totals ct
JOIN customers c ON c.id = ct.customer_id
WHERE ct.spent > (SELECT AVG(spent) FROM customer_totals)
ORDER BY ct.spent DESC, c.name;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses WITH', re:'\\bWITH\\b', flags:'i' }, { desc:'Defines two CTEs', re:'\\bAS\\s*\\([\\s\\S]*\\)\\s*,\\s*\\w+\\s+AS\\s*\\(', flags:'i' } ]
},

{ id:'m6-l7', module:5, file:'07-recursive-ctes.sql', type:'exercise', title:'Recursive CTEs: Hierarchies and Number Series',
  dataset:'staff',
  concept:`<p>Some data is a tree: an employee has a manager who has a manager. How do you list everyone under the Head of Production, at any depth? A fixed number of self-joins only handles a fixed number of levels. A <strong>recursive CTE</strong> loops until there is nothing left to add.</p>
<p>It always has the same two-part shape joined by <code>UNION ALL</code>: an <b>anchor</b> query that produces the starting rows, and a <b>recursive member</b> that refers to the CTE's own name and produces the next layer from the previous one. The engine runs the anchor once, then repeatedly runs the recursive member against only the rows added in the last round, until a round adds nothing.</p>
<pre>WITH RECURSIVE reports AS (
  SELECT id, name, 0 AS depth     -- anchor: the start
  FROM staff WHERE id = 2
  UNION ALL
  SELECT s.id, s.name, r.depth + 1   -- recursive step
  FROM staff s
  JOIN reports r ON s.manager_id = r.id
)
SELECT name, depth FROM reports;</pre>
<p>Round 0 yields Suresh. Round 1 finds rows whose <code>manager_id</code> is 2 (Imran, Pooja). Round 2 finds their reports, and so on until nobody is left. The <code>depth</code> column is carried along and incremented. Walk the other direction (<code>JOIN ... ON s.id = r.manager_id</code>) and you climb from an employee up to the CEO.</p>
<p>The same machinery generates sequences with no table at all, which is how you build calendars or fill gaps in reports:</p>
<pre>WITH RECURSIVE n(x) AS (
  SELECT 1
  UNION ALL
  SELECT x + 1 FROM n WHERE x &lt; 10
)
SELECT x FROM n;</pre>
<div class="callout"><b>Interview trap:</b> the termination condition. A recursive member with no <code>WHERE x &lt; 10</code>, or data containing a cycle (A manages B, B manages A), loops forever; use a depth cap or a visited-path column. <b>Dialect note:</b> PostgreSQL, MySQL 8 and SQLite require the keyword <code>RECURSIVE</code>; SQL Server omits it. Oracle uses <code>CONNECT BY</code> historically.</div>`,
  task:`List everyone in Suresh Patel's reporting tree (<code>id = 2</code>), <b>including Suresh himself</b>, with a <code>depth</code> column (0 for Suresh, 1 for his direct reports, and so on). Return <code>name</code>, <code>role</code>, <code>depth</code>. Sort by <code>depth</code>, then <code>name</code>. Use a recursive CTE.`,
  starter:`WITH RECURSIVE tree AS (
  -- anchor: Suresh (id = 2), depth 0
  SELECT id, name, role, 0 AS depth
  FROM staff
  WHERE id = 2
  -- UNION ALL
  -- recursive step: staff whose manager_id is in tree
)
SELECT name, role, depth
FROM tree
ORDER BY depth, name;`,
  solution:`WITH RECURSIVE tree AS (
  SELECT id, name, role, 0 AS depth
  FROM staff
  WHERE id = 2
  UNION ALL
  SELECT s.id, s.name, s.role, t.depth + 1
  FROM staff s
  JOIN tree t ON s.manager_id = t.id
)
SELECT name, role, depth
FROM tree
ORDER BY depth, name;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses WITH RECURSIVE', re:'\\bWITH\\s+RECURSIVE\\b', flags:'i' }, { desc:'Uses UNION ALL', re:'\\bUNION\\s+ALL\\b', flags:'i' } ]
},

{ id:'m6-l8', module:5, file:'08-set-operations.sql', type:'exercise', title:'UNION, INTERSECT, EXCEPT: Combining Result Sets',
  dataset:'shop',
  concept:`<p>Joins combine tables <em>sideways</em> (more columns). Set operators combine query results <em>vertically</em> (more rows): stack two result sets, find what they share, or subtract one from the other. Each side must return the same number of columns with compatible types; column names come from the first query.</p>
<ul>
<li><code>UNION ALL</code>: stack both results, keep every row, duplicates included. Fast: no comparison work.</li>
<li><code>UNION</code>: stack, then remove duplicate rows. Slower, because the engine sorts or hashes the whole result.</li>
<li><code>INTERSECT</code>: only rows present in both results (distinct).</li>
<li><code>EXCEPT</code>: rows in the first result that are not in the second (distinct). Oracle calls it <code>MINUS</code>; MySQL added <code>INTERSECT</code>/<code>EXCEPT</code> only in 8.0.31.</li>
</ul>
<pre>-- who ordered on the web AND in store?
SELECT customer_id FROM orders WHERE channel = 'web'
INTERSECT
SELECT customer_id FROM orders WHERE channel = 'store';

-- web customers who never used wholesale
SELECT customer_id FROM orders WHERE channel = 'web'
EXCEPT
SELECT customer_id FROM orders WHERE channel = 'wholesale'
ORDER BY customer_id;</pre>
<p>An <code>ORDER BY</code> goes once, at the very end, and applies to the combined result. Set operators treat NULL as equal to NULL when comparing rows (unlike <code>=</code>), which is why <code>EXCEPT</code> is sometimes a tidy NULL-safe alternative to <code>NOT IN</code>.</p>
<div class="callout"><b>Common mistake:</b> using <code>UNION</code> when you meant <code>UNION ALL</code>. If you are concatenating two disjoint sources, such as 2024 and 2025 order tables, <code>UNION ALL</code> is the correct and faster choice; plain <code>UNION</code> may quietly delete genuine duplicate rows (two identical orders) and costs a sort. Default to <code>UNION ALL</code> and use <code>UNION</code> only when you actually want de-duplication. The web+store lists above have 31 rows with <code>UNION ALL</code> but only 15 with <code>UNION</code>.</div>
<p>When to prefer a set operator over a join or subquery: when the two sides come from <em>different</em> tables with the same shape (archive + live data), or when the question is naturally "in A but not B". For "in A but not B" on one table, <code>NOT EXISTS</code> is equally good and more flexible when you need extra columns.</p>`,
  task:`Return the <code>customer_id</code> values of customers who ordered through the <code>web</code> channel but <b>never</b> through the <code>wholesale</code> channel. Use <code>EXCEPT</code> between two queries on <code>orders</code>. Sort by <code>customer_id</code>.`,
  starter:`-- web customers EXCEPT wholesale customers
SELECT customer_id FROM orders
WHERE channel = 'web'
ORDER BY customer_id;`,
  solution:`SELECT customer_id FROM orders WHERE channel = 'web'
EXCEPT
SELECT customer_id FROM orders WHERE channel = 'wholesale'
ORDER BY customer_id;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses EXCEPT', re:'\\bEXCEPT\\b', flags:'i' } ]
}

);

LESSONS.push(

{ id:'m7-l1', module:6, file:'01-window-vs-group-by.sql', type:'explore', title:'Window Functions vs GROUP BY: Keep the Rows',
  dataset:'shop',
  concept:`<p><code>GROUP BY</code> collapses rows: ask for the average price per category and you get one row per category, and the individual products are gone. That is a problem the moment you want both levels at once: "show every product <em>next to</em> its category average". Before window functions you had to compute the aggregate in a subquery and join it back. A <strong>window function</strong> does the calculation over a set of related rows but <em>does not collapse them</em>: every input row stays in the output and simply gains an extra column.</p>
<p>The syntax is a function followed by <code>OVER (...)</code>. The <code>OVER</code> clause defines the "window": which rows the function may look at for the current row. Empty parentheses mean "all rows of the result".</p>
<pre>SELECT name, category, price,
       AVG(price) OVER () AS shop_avg
FROM products;</pre>
<p>Think of it as a spreadsheet column that says "for this row, look at that group of rows and compute something". Window functions run <em>late</em> in the logical order: after <code>FROM</code>, <code>WHERE</code>, <code>GROUP BY</code> and <code>HAVING</code>, but before the final <code>ORDER BY</code> and <code>LIMIT</code>. Two consequences you will use constantly: you can window over grouped results (window over an aggregate), and you cannot put a window function directly in <code>WHERE</code>. To filter on one, wrap the query in a CTE or derived table and filter outside.</p>
<div class="callout"><b>Interview trap:</b> "Why can't I write <code>WHERE ROW_NUMBER() OVER (...) = 1</code>?" Because <code>WHERE</code> is evaluated before windows exist. The standard answer is the CTE/subquery wrap you will practise in the top-N lesson. <b>Dialect note:</b> windows are standard SQL (2003) and work in PostgreSQL, SQL Server, Oracle and MySQL 8+ (MySQL 5.7 has none, which is why old Stack Overflow answers use ugly self-joins). SQLite supports them since 3.25.</div>
<p>Poke at it below. Run the starter, then try changing the window: add <code>PARTITION BY category</code> inside <code>OVER ( )</code>, or swap <code>AVG</code> for <code>MAX</code>, <code>MIN</code>, <code>COUNT</code>. Compare the first block of columns with the <code>GROUP BY</code> version at the bottom, which has far fewer rows.</p>`,
  starter:`-- window: every product stays, shop-wide numbers appended
SELECT name, category, price,
       AVG(price) OVER () AS shop_avg,
       MAX(price) OVER () AS shop_max
FROM products
ORDER BY category, name;

-- GROUP BY: one row per category, products are gone
-- SELECT category, AVG(price) AS cat_avg
-- FROM products GROUP BY category;`
},

{ id:'m7-l2', module:6, file:'02-partition-by.sql', type:'exercise', title:'OVER and PARTITION BY: A Separate Window per Group',
  dataset:'shop',
  concept:`<p>An empty <code>OVER ()</code> uses one window over all rows. <code>PARTITION BY</code> splits the rows into independent groups, and the function is calculated separately inside each one, while every row is still returned. It is "GROUP BY without the collapse".</p>
<pre>SELECT name, category, price,
       AVG(price) OVER (PARTITION BY category) AS cat_avg
FROM products;</pre>
<p>For each row the engine finds the other rows with the same <code>category</code> and averages their prices. Every ring shows the ring average, every necklace the necklace average. Compare this with the correlated subquery from the previous module: same answer, but the data is read once and the intent reads left-to-right. That is why analysts reach for window functions for "compared to its own group" questions: share of the group total, difference from the group average, count of items in the group.</p>
<p>Any aggregate works as a window function: <code>SUM</code>, <code>AVG</code>, <code>MIN</code>, <code>MAX</code>, <code>COUNT</code>. Since the window column lives next to the row's own columns, you can do arithmetic between them immediately: <code>price - AVG(price) OVER (PARTITION BY category)</code> is how far this piece is from the typical piece of its category. You can PARTITION BY several columns (<code>PARTITION BY category, metal</code>) just like GROUP BY.</p>
<div class="callout"><b>Common mistake:</b> mixing a window function and a plain aggregate carelessly. <code>SELECT category, AVG(price) OVER (PARTITION BY category) ... GROUP BY category</code> is legal only if the window's arguments are themselves grouped/aggregated; otherwise the engine complains (or, in lenient databases, picks arbitrary values). Decide first whether you want one row per group (GROUP BY) or every row annotated (OVER). <b>Also:</b> you cannot reuse a window alias in the same SELECT (<code>cat_avg</code> cannot appear in <code>price - cat_avg</code> beside its definition); repeat the expression or use a CTE.</div>
<p>Real-world use: "orders compared to the customer's average order", "each employee's salary vs. department average" (a staple HR report), "stock level as a percentage of the category total".</p>`,
  task:`For every product return <code>name</code>, <code>category</code>, <code>price</code>, <code>cat_avg</code> (the average price of its category, <code>ROUND(..., 0)</code>) and <code>diff_from_avg</code> (<code>price - cat_avg</code>). Use <code>AVG(...) OVER (PARTITION BY ...)</code>. Sort by <code>category</code>, then <code>price</code> descending, then <code>name</code>. Use these exact column names.`,
  starter:`-- 20 rows, one per product
SELECT name, category, price,
       0 AS cat_avg,
       0 AS diff_from_avg
FROM products
ORDER BY category, price DESC, name;`,
  solution:`SELECT name, category, price,
       ROUND(AVG(price) OVER (PARTITION BY category), 0) AS cat_avg,
       price - ROUND(AVG(price) OVER (PARTITION BY category), 0)
         AS diff_from_avg
FROM products
ORDER BY category, price DESC, name;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses a window with PARTITION BY', re:'\\bOVER\\s*\\(\\s*PARTITION\\s+BY\\b', flags:'i' } ]
},

{ id:'m7-l3', module:6, file:'03-rank-ties-predict.sql', type:'predict', title:'ROW_NUMBER vs RANK vs DENSE_RANK: What Happens on Ties',
  dataset:'staff',
  concept:`<p>Numbering rows within an ordering is the most-used family of window functions, and the three variants differ only in how they treat <strong>ties</strong>. <code>ROW_NUMBER()</code> always gives unique numbers 1, 2, 3, ... (ties are broken arbitrarily unless you add a tiebreaker). <code>RANK()</code> gives tied rows the same number and then <em>skips</em> numbers: 1, 2, 2, 4. <code>DENSE_RANK()</code> gives tied rows the same number and does <em>not</em> skip: 1, 2, 2, 3. Think of an Olympic podium: two silvers means no bronze (RANK), or a "second place tier" and the next group is third (DENSE_RANK).</p>
<pre>SELECT name, salary,
  ROW_NUMBER() OVER (ORDER BY salary DESC) AS rn,
  RANK()       OVER (ORDER BY salary DESC) AS rk,
  DENSE_RANK() OVER (ORDER BY salary DESC) AS dr
FROM staff;</pre>
<p>In the staff table, Harsh Vora and Pooja Verma both earn 150000, and Farhan Sheikh and Meghna Das both earn 61000. Sort all 15 salaries from highest to lowest in your head and work out where the ties fall; then answer for the lowest paid person, the intern.</p>`,
  predict:{
    snippet:`SELECT name, rk, dr
FROM (
  SELECT name,
    RANK()       OVER (ORDER BY salary DESC) AS rk,
    DENSE_RANK() OVER (ORDER BY salary DESC) AS dr
  FROM staff
)
WHERE name = 'Tarun Bhatt';`,
    question:'What do rk and dr show for Tarun Bhatt (lowest salary, 18000)?',
    options:['Tarun Bhatt, 15, 13','Tarun Bhatt, 13, 13','Tarun Bhatt, 15, 15','Tarun Bhatt, 14, 12'],
    correctIndex:0,
    afterExplain:`There are 15 people but only 13 distinct salaries (two ties). <code>RANK</code> counts everyone who is strictly above plus one: 14 people earn more than Tarun, so his rank is <b>15</b>, the gaps left by the two ties are preserved. <code>DENSE_RANK</code> counts distinct salary values above him plus one: 12 distinct values are higher, so <b>13</b>. <code>ROW_NUMBER</code> would also say 15 here but would have separated Harsh/Pooja into 5 and 6 arbitrarily.<br><br>Notice the structure: the <code>WHERE name = ...</code> is <em>outside</em> the subquery on purpose. If you wrote the filter in the inner query, it would run <em>before</em> the window and rank Tarun among a single row, giving 1 and 1. Windows see only the rows that survive <code>WHERE</code>. <b>Which to use?</b> <code>ROW_NUMBER</code> for "exactly one row per group" (dedupe, latest record), <code>RANK</code> for competition-style leaderboards, <code>DENSE_RANK</code> for "top 3 distinct salary levels". <b>Interview tip:</b> always add a deterministic tiebreaker to <code>ROW_NUMBER</code>'s ORDER BY (e.g. <code>salary DESC, id</code>), otherwise two runs of the same query may return different rows.`
  }
},

{ id:'m7-l4', module:6, file:'04-top-n-per-group.sql', type:'exercise', title:'Top-N per Group: The Classic Interview Question',
  dataset:'shop',
  concept:`<p>"Show the two most expensive products in each category." If you have heard one SQL interview question, it is this one. <code>LIMIT 2</code> gives the top 2 overall, not per category; <code>GROUP BY</code> can give the single max per category but not the full row, and cannot do top 2 at all. The standard solution is a ranking window function inside a CTE or derived table, filtered outside.</p>
<pre>WITH ranked AS (
  SELECT name, category, price,
    ROW_NUMBER() OVER (
      PARTITION BY category
      ORDER BY price DESC, name
    ) AS rn
  FROM products
)
SELECT category, name, price
FROM ranked
WHERE rn &lt;= 2;</pre>
<p>Step by step: <code>PARTITION BY category</code> restarts the numbering for each category. <code>ORDER BY price DESC</code> inside <code>OVER</code> decides what "first" means. The numbering becomes an ordinary column (<code>rn</code>) of the CTE, so the outer query can finally use it in <code>WHERE</code>, which you cannot do in the same SELECT where the window is computed (<code>WHERE</code> runs before windows).</p>
<p>Which ranking function you pick changes the semantics: <code>ROW_NUMBER() &lt;= 2</code> returns exactly 2 rows per group (ties cut arbitrarily, so add a tiebreaker as above); <code>RANK() &lt;= 2</code> may return more than 2 when the cut-off position is tied; <code>DENSE_RANK() &lt;= 2</code> returns everyone within the top two distinct prices. Clarify this with the interviewer; it is exactly the follow-up they expect.</p>
<div class="callout"><b>Dialect note:</b> PostgreSQL can also do this with <code>DISTINCT ON (category)</code> (top 1 only) or a <code>LATERAL</code> join with <code>LIMIT n</code>, which is very fast with an index. MySQL 8, SQL Server and Oracle use the window approach shown here (SQL Server also has <code>CROSS APPLY</code> with <code>TOP</code>). <b>Common mistake:</b> using a correlated <code>COUNT(*)</code> to emulate rank on MySQL 5.7; it works but is quadratic on big tables.</div>
<p>Real-world use: latest order per customer, best-selling product per month, highest-paid employee per department, newest 3 articles per author.</p>`,
  task:`Return the <b>two most expensive products in each category</b>. Columns: <code>category</code>, <code>name</code>, <code>price</code>. Use <code>ROW_NUMBER()</code> with <code>PARTITION BY category</code> in a CTE (or derived table) and filter outside. Sort by <code>category</code>, then <code>price</code> descending.`,
  starter:`WITH ranked AS (
  SELECT name, category, price
         -- add: ROW_NUMBER() OVER (...) AS rn
  FROM products
)
SELECT category, name, price
FROM ranked
ORDER BY category, price DESC;`,
  solution:`WITH ranked AS (
  SELECT name, category, price,
    ROW_NUMBER() OVER (
      PARTITION BY category
      ORDER BY price DESC, name
    ) AS rn
  FROM products
)
SELECT category, name, price
FROM ranked
WHERE rn <= 2
ORDER BY category, price DESC;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses ROW_NUMBER with PARTITION BY', re:'ROW_NUMBER\\s*\\(\\s*\\)\\s*OVER\\s*\\(\\s*PARTITION\\s+BY', flags:'i' } ]
},

{ id:'m7-l5', module:6, file:'05-running-total.sql', type:'exercise', title:'ORDER BY inside OVER: Running Totals',
  dataset:'shop',
  concept:`<p>Adding <code>ORDER BY</code> inside <code>OVER</code> changes the meaning of an aggregate window. Without it, <code>SUM(x) OVER ()</code> is the grand total on every row. With it, the window grows row by row: each row sees itself and everything before it in the ordering. That is a <strong>running total</strong> (cumulative sum), the workhorse of finance dashboards: year-to-date revenue, stock on hand after each movement, a bank statement's balance column.</p>
<pre>SELECT month, revenue,
  SUM(revenue) OVER (ORDER BY month) AS running
FROM monthly
ORDER BY month;</pre>
<p>Two orderings are easy to confuse. The <code>ORDER BY</code> <em>inside</em> <code>OVER</code> defines the sequence for the calculation. The <code>ORDER BY</code> at the end of the query defines the order rows are <em>displayed</em>. They are independent, and you almost always want both, because SQL guarantees no output order without an explicit final <code>ORDER BY</code>.</p>
<p>Real reports build this on a pre-aggregated step, so the pattern is nearly always a CTE that groups to months, followed by a window over that CTE. You can also combine with <code>PARTITION BY</code> to restart the total per group, for example <code>SUM(revenue) OVER (PARTITION BY year ORDER BY month)</code> gives year-to-date that resets each January.</p>
<div class="callout"><b>Common mistake:</b> windowing before grouping. You cannot nest <code>SUM(SUM(...))</code> neatly; keep the two steps separate (group in the CTE, window in the outer query), or write <code>SUM(SUM(x)) OVER (...)</code> if you really want a one-liner, which PostgreSQL allows but is hard to read. <b>Another trap:</b> a month with no orders does not appear in the grouped data, so the running total skips it silently. In this data there are no orders at all in 2024-03; the series jumps from 2024-02 to 2024-04. Calendar-complete reports need a generated calendar (a recursive CTE, see module 6) joined in.</div>`,
  task:`Using a CTE <code>monthly</code> that sums revenue (<code>qty * unit_price</code>) per month (<code>strftime('%Y-%m', order_date)</code>), excluding <b>cancelled</b> orders, return <code>month</code>, <code>revenue</code> and <code>running_revenue</code> (cumulative revenue up to and including that month). Sort by <code>month</code>. Use these exact column names.`,
  starter:`WITH monthly AS (
  SELECT strftime('%Y-%m', o.order_date) AS month,
         SUM(oi.qty * oi.unit_price) AS revenue
  FROM orders o
  JOIN order_items oi ON oi.order_id = o.id
  -- exclude cancelled orders
  GROUP BY month
)
SELECT month, revenue
       -- add the running total column
FROM monthly
ORDER BY month;`,
  solution:`WITH monthly AS (
  SELECT strftime('%Y-%m', o.order_date) AS month,
         SUM(oi.qty * oi.unit_price) AS revenue
  FROM orders o
  JOIN order_items oi ON oi.order_id = o.id
  WHERE o.status <> 'cancelled'
  GROUP BY month
)
SELECT month, revenue,
       SUM(revenue) OVER (ORDER BY month) AS running_revenue
FROM monthly
ORDER BY month;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses SUM(...) OVER (ORDER BY ...)', re:'SUM\\s*\\([^)]*\\)\\s*OVER\\s*\\([^)]*ORDER\\s+BY', flags:'i' } ]
},

{ id:'m7-l6', module:6, file:'06-default-frame-trap-predict.sql', type:'predict', title:'The Default Frame Trap: RANGE vs ROWS on Ties',
  dataset:'staff',
  concept:`<p>When you write <code>SUM(x) OVER (ORDER BY y)</code> you did not say <em>which</em> rows around the current one count; the database filled in a default. This hidden default is called the <strong>frame</strong>, and it is behind one of the most common silent wrong answers in window queries.</p>
<p>The default, when there is an <code>ORDER BY</code> and no explicit frame, is <code>RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</code>. The key word is RANGE: "current row" means <em>all rows that tie with the current row on the ORDER BY value</em>, not just this physical row. The explicit alternative <code>ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</code> counts physical rows one at a time.</p>
<pre>SUM(salary) OVER (ORDER BY salary)
-- same as ... RANGE BETWEEN UNBOUNDED PRECEDING
--             AND CURRENT ROW</pre>
<p>Consider the three lowest salaries in the whole staff table: Tarun Bhatt 18000, then Farhan Sheikh 61000 and Meghna Das 61000 (tied). A running total ordered by salary is calculated for Farhan. Decide whether his running total counts Meghna.</p>`,
  predict:{
    snippet:`SELECT running
FROM (
  SELECT name,
    SUM(salary) OVER (ORDER BY salary) AS running
  FROM staff
)
WHERE name = 'Farhan Sheikh';`,
    question:'What is the value of running for Farhan Sheikh?',
    options:['79000','140000','61000','18000'],
    correctIndex:1,
    afterExplain:`<b>140000</b> = 18000 + 61000 + 61000. Because the default frame is RANGE, Farhan's "current row" includes his peer Meghna (same salary), so both tied rows show 140000. A person who thinks in physical rows expects 79000 for the first tied row and 140000 for the second.<br><br>The fix is to be explicit, and to add a unique tiebreaker to the ordering:<pre>SUM(salary) OVER (
  ORDER BY salary, id
  ROWS BETWEEN UNBOUNDED PRECEDING
           AND CURRENT ROW
)</pre>Now every row has a distinct position and the total increases row by row. In real reports this matters whenever the ordering column repeats, which is the norm for dates (many orders per day): a running total ordered by <code>order_date</code> with the default frame jumps by the whole day's sales on every row of that day. <b>Dialect note:</b> PostgreSQL, MySQL and SQL Server (with explicit frames) behave the same; SQL Server's default without an explicit frame also uses RANGE and is notoriously slower than ROWS because it spools to disk. Many teams ban the implicit frame in code review for exactly that reason.`
  }
},

{ id:'m7-l7', module:6, file:'07-frame-clauses-moving-average.sql', type:'exercise', title:'Frame Clauses: ROWS BETWEEN and Moving Averages',
  dataset:'shop',
  concept:`<p>A frame narrows the window to a sliding slice around the current row. The syntax is <code>ROWS BETWEEN &lt;start&gt; AND &lt;end&gt;</code> where each bound is one of:</p>
<ul>
<li><code>UNBOUNDED PRECEDING</code>: from the first row of the partition</li>
<li><code>n PRECEDING</code>: n rows before the current row</li>
<li><code>CURRENT ROW</code></li>
<li><code>n FOLLOWING</code>: n rows after</li>
<li><code>UNBOUNDED FOLLOWING</code>: to the last row of the partition</li>
</ul>
<pre>-- 3-row moving average (this + 2 before)
AVG(revenue) OVER (
  ORDER BY month
  ROWS BETWEEN 2 PRECEDING AND CURRENT ROW
)

-- centred: one before, this, one after
ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING</pre>
<p>A <strong>moving average</strong> smooths noise: monthly jewellery sales spike around Diwali and wedding season, and a 3-month average shows the underlying trend. The first rows have fewer than three rows available, so the window simply shrinks (the first row averages only itself); if you want NULL until a full window exists you must test the row number or count explicitly.</p>
<p>The unit matters: <code>ROWS</code> counts physical rows, so "2 PRECEDING" means the two previous <em>rows</em> in the data, which are not necessarily the two previous <em>calendar months</em>. Our monthly data skips March 2024, so the window for April 2024 covers February and April only. For a true calendar window you need either a gap-free calendar or a <code>RANGE</code> frame with an interval (PostgreSQL 11+ supports <code>RANGE BETWEEN INTERVAL '2 months' PRECEDING AND CURRENT ROW</code>; SQLite has numeric RANGE only).</p>
<div class="callout"><b>Interview trap:</b> <code>LAST_VALUE(x) OVER (ORDER BY y)</code> returns the current row, not the last row of the partition, because the default frame ends at CURRENT ROW. You need <code>ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING</code> to see the true last row. Also, ranking functions (<code>ROW_NUMBER</code>, <code>RANK</code>, <code>LAG</code>, <code>LEAD</code>, <code>NTILE</code>) ignore frames; frames only affect aggregates and <code>FIRST_VALUE</code>/<code>LAST_VALUE</code>/<code>NTH_VALUE</code>.</div>`,
  task:`Reusing the monthly revenue idea (non-cancelled orders, <code>strftime('%Y-%m', order_date)</code>), return <code>month</code>, <code>revenue</code> and <code>avg3</code>: the average revenue of the current and the previous two <b>rows</b> in month order, rounded with <code>ROUND(..., 0)</code>. Use an explicit <code>ROWS BETWEEN 2 PRECEDING AND CURRENT ROW</code> frame. Sort by <code>month</code>.`,
  starter:`WITH monthly AS (
  SELECT strftime('%Y-%m', o.order_date) AS month,
         SUM(oi.qty * oi.unit_price) AS revenue
  FROM orders o
  JOIN order_items oi ON oi.order_id = o.id
  WHERE o.status <> 'cancelled'
  GROUP BY month
)
SELECT month, revenue
       -- add avg3 with a ROWS frame
FROM monthly
ORDER BY month;`,
  solution:`WITH monthly AS (
  SELECT strftime('%Y-%m', o.order_date) AS month,
         SUM(oi.qty * oi.unit_price) AS revenue
  FROM orders o
  JOIN order_items oi ON oi.order_id = o.id
  WHERE o.status <> 'cancelled'
  GROUP BY month
)
SELECT month, revenue,
  ROUND(AVG(revenue) OVER (
    ORDER BY month
    ROWS BETWEEN 2 PRECEDING AND CURRENT ROW
  ), 0) AS avg3
FROM monthly
ORDER BY month;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses an explicit ROWS BETWEEN frame', re:'ROWS\\s+BETWEEN\\s+2\\s+PRECEDING', flags:'i' } ]
},

{ id:'m7-l8', module:6, file:'08-lag-lead.sql', type:'exercise', title:'LAG and LEAD: Month-over-Month Change',
  dataset:'shop',
  concept:`<p>"Did sales go up or down compared with last month?" needs each row to see its neighbour. Before windows this meant joining a table to itself with an offset (<code>ON b.month = a.month - 1</code>), which is clumsy and breaks with dates. <code>LAG(col, n)</code> returns the value from <code>n</code> rows <em>before</em> the current row in the window's ordering; <code>LEAD(col, n)</code> looks <code>n</code> rows <em>after</em>. Default <code>n</code> is 1.</p>
<pre>SELECT month, revenue,
  LAG(revenue) OVER (ORDER BY month) AS prev,
  revenue - LAG(revenue) OVER (ORDER BY month) AS change
FROM monthly;</pre>
<p>The first row has no predecessor, so <code>LAG</code> returns <code>NULL</code>, and anything arithmetic on NULL is NULL. A third argument supplies a default: <code>LAG(revenue, 1, 0)</code> yields 0 instead, but think before using it, because "no previous month" and "previous month had zero sales" are different facts, and a 0 would give a nonsense percentage change. Percentage change is <code>100.0 * (cur - prev) / prev</code>; use <code>100.0</code> (not <code>100</code>) to avoid integer division, and remember division by a zero or NULL previous value.</p>
<p>Combine with <code>PARTITION BY</code> to compare within a group: <code>LAG(price) OVER (PARTITION BY product_id ORDER BY changed_at)</code> gives the previous price in a price-history table. <code>LEAD</code> is the mirror image, useful for "days until next order" or "time to the next event" (session gaps, churn detection).</p>
<div class="callout"><b>Common mistake:</b> assuming "previous row" means "previous calendar period". As in the last lesson, our data has no sales in 2024-03, so the row after 2024-02 is 2024-04 and LAG compares April to February. For strict month-over-month you must first build a gap-free month list (recursive CTE) and LEFT JOIN revenue onto it with <code>COALESCE(..., 0)</code>. Also note that <b>MySQL 8, PostgreSQL, SQL Server (2012+) and Oracle</b> all support LAG/LEAD with identical syntax: this is portable knowledge.</div>`,
  task:`Using the same <code>monthly</code> revenue CTE (non-cancelled orders), return <code>month</code>, <code>revenue</code>, <code>prev_revenue</code> (revenue of the previous row in month order, NULL for the first) and <code>change</code> (<code>revenue - prev_revenue</code>, NULL for the first). Sort by <code>month</code>. Use these exact column names.`,
  starter:`WITH monthly AS (
  SELECT strftime('%Y-%m', o.order_date) AS month,
         SUM(oi.qty * oi.unit_price) AS revenue
  FROM orders o
  JOIN order_items oi ON oi.order_id = o.id
  WHERE o.status <> 'cancelled'
  GROUP BY month
)
SELECT month, revenue
       -- add prev_revenue and change
FROM monthly
ORDER BY month;`,
  solution:`WITH monthly AS (
  SELECT strftime('%Y-%m', o.order_date) AS month,
         SUM(oi.qty * oi.unit_price) AS revenue
  FROM orders o
  JOIN order_items oi ON oi.order_id = o.id
  WHERE o.status <> 'cancelled'
  GROUP BY month
)
SELECT month, revenue,
  LAG(revenue) OVER (ORDER BY month) AS prev_revenue,
  revenue - LAG(revenue) OVER (ORDER BY month) AS change
FROM monthly
ORDER BY month;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses LAG', re:'\\bLAG\\s*\\(', flags:'i' } ]
},

{ id:'m7-l9', module:6, file:'09-ntile-pct-first-value.sql', type:'exercise', title:'NTILE, Percent of Total and FIRST_VALUE',
  dataset:'staff',
  concept:`<p>Three more window tools finish the toolbox, and together they answer the "where does this row sit?" questions managers love.</p>
<p><b>NTILE(n)</b> splits the ordered rows into <code>n</code> buckets of (nearly) equal size and returns the bucket number. <code>NTILE(4)</code> gives quartiles, <code>NTILE(100)</code> percentile-ish groups, <code>NTILE(10)</code> deciles: "top 10% of customers by spend". When the rows do not divide evenly, the first buckets get the extra rows (15 rows into 4 buckets: 4, 4, 4, 3). NTILE does not respect ties, so tied values can land in different buckets; add a tiebreaker to make it deterministic.</p>
<p><b>Percent of total</b> is just an aggregate window with an empty <code>OVER ()</code> used as a denominator: <code>salary / SUM(salary) OVER ()</code>. For percent of the <em>group</em> total use <code>PARTITION BY dept</code>. Multiply by <code>100.0</code> to dodge integer division.</p>
<p><b>FIRST_VALUE(col)</b> returns the value from the first row of the window frame in the ordering, which is the "best of the group" lookup: the name of the top earner in each department, shown on every row for comparison. Its sibling <code>LAST_VALUE</code> needs an explicit full frame (see the frames lesson).</p>
<pre>SELECT name, salary,
  ROUND(100.0 * salary / SUM(salary) OVER (), 1) AS pct,
  NTILE(4) OVER (ORDER BY salary DESC, name) AS band,
  FIRST_VALUE(name) OVER (
    PARTITION BY dept
    ORDER BY salary DESC, name
  ) AS dept_top
FROM staff;</pre>
<div class="callout"><b>Interview trap:</b> "What is the difference between NTILE and PERCENT_RANK / CUME_DIST?" NTILE forces equal-size buckets regardless of values; <code>PERCENT_RANK</code> and <code>CUME_DIST</code> compute a fractional position. PostgreSQL and SQL Server have all of these; SQLite and MySQL 8 do too. Also: percent of total over a <em>filtered</em> result is relative to the filtered rows (WHERE runs first), which is often a silent reporting bug.</div>`,
  task:`From <code>staff</code> return <code>name</code>, <code>salary</code>, <code>pct_of_payroll</code> (<code>ROUND(100.0 * salary / SUM(salary) OVER (), 1)</code>), <code>quartile</code> (<code>NTILE(4)</code> ordered by <code>salary DESC, name</code>) and <code>dept_top</code> (the name of the highest paid person in the same <code>dept</code>, via <code>FIRST_VALUE</code> with <code>PARTITION BY dept</code> and <code>ORDER BY salary DESC, name</code>). Sort by <code>salary</code> descending, then <code>name</code>. Use these exact column names.`,
  starter:`SELECT name, salary
       -- add pct_of_payroll, quartile, dept_top
FROM staff
ORDER BY salary DESC, name;`,
  solution:`SELECT name, salary,
  ROUND(100.0 * salary / SUM(salary) OVER (), 1) AS pct_of_payroll,
  NTILE(4) OVER (ORDER BY salary DESC, name) AS quartile,
  FIRST_VALUE(name) OVER (
    PARTITION BY dept
    ORDER BY salary DESC, name
  ) AS dept_top
FROM staff
ORDER BY salary DESC, name;`,
  ordered:true, columns:true,
  rules:[ { desc:'Uses NTILE', re:'\\bNTILE\\s*\\(', flags:'i' }, { desc:'Uses FIRST_VALUE', re:'\\bFIRST_VALUE\\s*\\(', flags:'i' } ]
}

);

{ id:'m8-l1', module:7, file:'01-insert.sql', type:'exercise', title:'INSERT: Adding Rows (Single, Multi-Row, Column Lists)',
  dataset:'blank',
  setupExtra:`CREATE TABLE gems (
  id INTEGER PRIMARY KEY,
  code TEXT NOT NULL,
  name TEXT NOT NULL,
  carat REAL,
  price INTEGER DEFAULT 0
);`,
  concept:`<p>Everything so far only <em>read</em> data. Real applications spend half their life writing it: a new customer signs up, a karigar finishes a job, a delivery of stones arrives. In SQL the statement that adds rows is <code>INSERT</code>, and the most important habit to build is this: <strong>always name the columns you are filling</strong>.</p>
<pre>INSERT INTO gems (code, name, carat)
VALUES ('RB-01', 'Ruby', 1.0);</pre>
<p>The column list in parentheses says which columns receive which values, matched by position. Any column you leave out gets its <code>DEFAULT</code> (here <code>price</code> becomes 0), or <code>NULL</code> if it has no default, or an error if it is <code>NOT NULL</code> with no default. The <code>id INTEGER PRIMARY KEY</code> column is special in SQLite: leave it out and the database assigns the next number for you.</p>
<p>You can insert many rows in one statement by giving several value tuples separated by commas. This is atomic (all rows go in or none do) and much faster than a hundred separate statements, because the database parses and commits once:</p>
<pre>INSERT INTO gems (code, name, carat, price)
VALUES
  ('EM-01', 'Emerald', 1.5, 78000),
  ('SP-01', 'Sapphire', 2.0, 120000);</pre>
<div class="callout"><b>Common mistake / Interview trap:</b> <code>INSERT INTO gems VALUES (...)</code> without a column list works only while the table has exactly the columns you expect, in exactly that order. The day someone runs <code>ALTER TABLE ... ADD COLUMN</code> or reorders the schema, your code either errors or, far worse, silently puts the price into the carat column. Senior reviewers reject column-less inserts in application code. Also: in MySQL and PostgreSQL the multi-row <code>VALUES</code> syntax is identical, but PostgreSQL gives you the new id through <code>RETURNING id</code> while MySQL uses <code>LAST_INSERT_ID()</code>.</div>
<p>Real-world use: an ERP import job, a signup endpoint, or a seed script for test data. Application code almost always uses parameter placeholders (<code>VALUES (?, ?, ?)</code>) rather than pasting values into the string, which protects against SQL injection, but the SQL shape is exactly what you are writing here.</p>`,
  task:`The empty table <code>gems(id, code, name, carat, price)</code> already exists. (1) With a <b>single-row</b> INSERT that has a column list, add code <code>RB-01</code>, name <code>Ruby</code>, carat <code>1.0</code> and <b>do not</b> supply a price (let the default apply). (2) With <b>one multi-row</b> INSERT (column list: <code>code, name, carat, price</code>) add three gems: <code>EM-01</code> Emerald 1.5ct at 78000, <code>SP-01</code> Sapphire 2.0ct at 120000, and <code>DM-01</code> Diamond 0.5ct at 95000.`,
  starter:`-- 1) single row, no price\n\n-- 2) one multi-row INSERT for three gems\n`,
  solution:`INSERT INTO gems (code, name, carat)
VALUES ('RB-01', 'Ruby', 1.0);

INSERT INTO gems (code, name, carat, price)
VALUES
  ('EM-01', 'Emerald', 1.5, 78000),
  ('SP-01', 'Sapphire', 2.0, 120000),
  ('DM-01', 'Diamond', 0.5, 95000);`,
  verify:`SELECT code, name, carat, price FROM gems ORDER BY code;`,
  ordered:true,
  rules:[ { desc:'Uses INSERT INTO', re:'\\bINSERT\\s+INTO\\b', flags:'i' }, { desc:'Gives a column list', re:'gems\\s*\\(\\s*code', flags:'i' } ]
},

{ id:'m8-l2', module:7, file:'02-insert-select.sql', type:'exercise', title:'INSERT ... SELECT: Copying Rows Between Tables',
  dataset:'shop',
  setupExtra:`CREATE TABLE restock_list (
  product_id INTEGER,
  sku TEXT,
  name TEXT,
  stock INTEGER
);`,
  concept:`<p>Often the rows you want to insert already exist somewhere else in the database. Building a report table, archiving old orders, creating a "to be re-ordered" list: you do not want to fetch rows into application code and push them back one by one. <code>INSERT ... SELECT</code> lets the database do the whole copy in a single statement, entirely server-side.</p>
<pre>INSERT INTO restock_list (product_id, sku, name, stock)
SELECT id, sku, name, stock
FROM products
WHERE stock &lt;= 5;</pre>
<p>The mental model: the <code>SELECT</code> runs first and produces a result set; each result row is then inserted into the target. Columns are matched <strong>by position, not by name</strong>, so the number and order of columns in your SELECT must line up with the column list. Aliases in the SELECT are irrelevant to the insert. You may use any SELECT you like: joins, aggregates, window functions, CTEs.</p>
<p>A very common production use is the "snapshot" pattern: every night, <code>INSERT INTO daily_stock_snapshot (snap_date, product_id, stock) SELECT '2025-06-30', id, stock FROM products</code> builds a history table so you can later answer "what was our stock last Tuesday?". A related one-liner is <code>CREATE TABLE copy AS SELECT ...</code>, handy for ad-hoc backups before a risky change (it does not copy constraints or indexes, though).</p>
<div class="callout"><b>Common mistake / Dialect note:</b> if the SELECT reads from the same table you insert into, you can double the table or loop forever in some databases; SQLite handles it safely by materialising first, but design such statements carefully. Another trap: a mismatch such as selecting <code>(name, sku)</code> into <code>(sku, name)</code> never errors, because both are text: the data is just silently in the wrong columns. In PostgreSQL and MySQL the syntax is identical; MySQL additionally allows <code>INSERT IGNORE ... SELECT</code> to skip duplicate-key rows, and PostgreSQL uses <code>ON CONFLICT DO NOTHING</code> (which SQLite also supports).</div>`,
  task:`The empty table <code>restock_list(product_id, sku, name, stock)</code> exists. With a <b>single INSERT ... SELECT</b> copy into it the <code>id</code>, <code>sku</code>, <code>name</code> and <code>stock</code> of every product whose stock is <b>5 or fewer</b>.`,
  starter:`-- one INSERT ... SELECT into restock_list\nINSERT INTO restock_list (product_id, sku, name, stock)\n-- your SELECT here\n;`,
  solution:`INSERT INTO restock_list (product_id, sku, name, stock)
SELECT id, sku, name, stock
FROM products
WHERE stock <= 5;`,
  verify:`SELECT product_id, sku, name, stock FROM restock_list ORDER BY product_id;`,
  ordered:true,
  rules:[ { desc:'Uses INSERT ... SELECT (no VALUES)', re:'\\bINSERT\\s+INTO\\b[\\s\\S]*\\bSELECT\\b', flags:'i' }, { desc:'Does not hand-type rows with VALUES', re:'\\bVALUES\\b', flags:'i', not:true } ]
},

{ id:'m8-l3', module:7, file:'03-update-where-predict.sql', type:'predict', title:'UPDATE and the Forgotten WHERE: Predict the Damage',
  dataset:'shop',
  concept:`<p><code>UPDATE table SET column = value WHERE condition</code> changes existing rows. The <code>WHERE</code> clause chooses which rows; <strong>if you omit it, every row in the table is updated</strong>. There is no confirmation prompt, no "are you sure", and in autocommit mode there is no undo. Almost every team has a war story: an <code>UPDATE customers SET email = 'test@x.com'</code> run on production because the WHERE line was below the cursor selection.</p>
<p>Think of UPDATE as a loop: for each row in the table, if the WHERE condition is true, apply the SET. With no WHERE the condition is vacuously true for all rows, including rows with NULLs in the column you are overwriting. Read the statement below as if you were the database, then choose.</p>`,
  predict:{
    snippet:`-- intended: fix ONE product (id 7)\nUPDATE products\nSET metal = 'gold';\n\nSELECT COUNT(*) AS gold_items\nFROM products\nWHERE metal = 'gold';`,
    question:`Someone forgot the WHERE. Before the UPDATE, 10 products were gold. What does the final SELECT return?`,
    options:['1','10','11','20'],
    correctIndex:3,
    afterExplain:`All 20 rows were rewritten, including the silver and platinum pieces <em>and</em> the three loose stones whose metal was NULL. A WHERE-less UPDATE overwrites NULLs too. The fix after the fact is only possible from a backup or a transaction you have not committed yet (coming up in the transaction lessons).<br><br><b>Safe-change habits that prevent this:</b> (1) write the WHERE first, then the SET; (2) turn the UPDATE into a SELECT with the same WHERE and eyeball the rows (<code>SELECT * FROM products WHERE id = 7</code>); (3) check the "rows affected" count afterwards: expected 1, got 20 means roll back immediately; (4) in MySQL, start the client with <code>--safe-updates</code> (also called <code>--i-am-a-dummy</code>), which refuses UPDATE/DELETE without a key-based WHERE. Many companies also grant app users no direct write access to production tables at all.`
  }
},

{ id:'m8-l4', module:7, file:'04-update-expressions-subqueries.sql', type:'exercise', title:'UPDATE with Expressions and Subqueries',
  dataset:'shop',
  concept:`<p>The right-hand side of <code>SET</code> is any expression, and it can refer to the row's <em>current</em> values. That is how you write relative changes like "raise prices by 10%" or "add 6 pieces to stock" in a single atomic statement:</p>
<pre>UPDATE products
SET price = price * 110 / 100
WHERE metal = 'platinum';</pre>
<p>Using integer arithmetic (<code>* 110 / 100</code>) instead of <code>* 1.1</code> keeps whole-rupee prices as integers and avoids floating-point noise like <code>123200.00000000001</code>. And note the pattern <code>SET stock = stock - 1</code>: the database reads and writes inside the same statement, so two concurrent sales never overwrite each other's decrement. Doing it in app code (read stock, subtract, write back) is the classic lost-update bug.</p>
<p>The WHERE clause may contain subqueries, which lets you update rows based on facts stored in <em>other</em> tables, something plain UPDATE cannot join to in standard SQL:</p>
<pre>UPDATE customers
SET tier = 'gold'
WHERE id IN (
  SELECT customer_id
  FROM orders
  GROUP BY customer_id
  HAVING COUNT(*) &gt;= 4
);</pre>
<p>The subquery is evaluated, producing a set of customer ids, then every matching customer is updated. Correlated subqueries also work inside <code>SET</code> itself, e.g. <code>SET stock = (SELECT ... WHERE ... = products.id)</code>.</p>
<div class="callout"><b>Dialect note / Interview trap:</b> PostgreSQL and SQL Server offer <code>UPDATE ... FROM other_table WHERE ...</code>, MySQL uses <code>UPDATE a JOIN b ON ... SET a.x = b.y</code>; SQLite supports the PostgreSQL-style <code>UPDATE ... FROM</code> since 3.33. Be careful with a scalar subquery in SET that returns no rows: it yields NULL and wipes the column. Always add a WHERE that limits to rows where the subquery will find something, or wrap in <code>COALESCE</code>.</div>`,
  task:`Run two UPDATE statements. (1) Raise the <code>price</code> of every <b>platinum</b> product by 10%, written as <code>price * 110 / 100</code> so prices stay integers. (2) Set <code>tier = 'gold'</code> for every customer who has placed <b>4 or more orders</b> (use a subquery on <code>orders</code>, any status counts). Touch nothing else.`,
  starter:`-- 1) platinum prices +10%\n\n-- 2) customers with >= 4 orders become gold\n`,
  solution:`UPDATE products
SET price = price * 110 / 100
WHERE metal = 'platinum';

UPDATE customers
SET tier = 'gold'
WHERE id IN (
  SELECT customer_id
  FROM orders
  GROUP BY customer_id
  HAVING COUNT(*) >= 4
);`,
  verify:`SELECT 'P' AS t, id, price AS a FROM products
UNION ALL
SELECT 'C', id, tier FROM customers
ORDER BY 1, 2;`,
  ordered:true,
  rules:[ { desc:'Uses UPDATE', re:'\\bUPDATE\\b', flags:'i' }, { desc:'Uses a subquery', re:'\\(\\s*SELECT\\b', flags:'i' } ]
},

{ id:'m8-l5', module:7, file:'05-delete-soft-delete.sql', type:'exercise', title:'DELETE and the Soft-Delete Pattern',
  dataset:'blank',
  setupExtra:`CREATE TABLE designs (
  id INTEGER PRIMARY KEY,
  name TEXT NOT NULL,
  status TEXT NOT NULL,
  deleted_at TEXT
);
INSERT INTO designs (id, name, status) VALUES
  (1, 'Lotus Pendant', 'approved'),
  (2, 'Old Kada', 'draft'),
  (3, 'Rose Ring', 'retired'),
  (4, 'Peacock Set', 'draft'),
  (5, 'Vine Band', 'retired'),
  (6, 'Halo Studs', 'approved');`,
  concept:`<p><code>DELETE FROM table WHERE condition</code> removes rows permanently. It has exactly the same danger as UPDATE: no WHERE means an empty table. (<code>DELETE FROM t</code> is not <code>DROP TABLE t</code>: the table and its columns stay, only the rows go. <code>TRUNCATE</code> in PostgreSQL/MySQL is the fast version; SQLite has no TRUNCATE.)</p>
<pre>DELETE FROM designs
WHERE status = 'draft';</pre>
<p>Hard deletes are right for throwaway data: drafts, temp rows, expired sessions. They are usually <em>wrong</em> for business records. Imagine deleting a retired design that three old orders point to: the orders lose their history, foreign keys may block you, and the auditor asks what happened to it. The common answer is the <strong>soft-delete pattern</strong>: add a column such as <code>deleted_at</code> (or <code>is_deleted</code>), and "delete" by setting it:</p>
<pre>UPDATE designs
SET deleted_at = '2025-03-01'
WHERE status = 'retired';</pre>
<p>Every normal query then has to remember <code>WHERE deleted_at IS NULL</code>. That is the cost: forget it once and deleted records reappear in the UI. Teams mitigate this with a view (<code>CREATE VIEW live_designs AS SELECT * FROM designs WHERE deleted_at IS NULL</code>, which you will build in the schema module) or an ORM default scope.</p>
<div class="callout"><b>Interview trap:</b> "How do you handle deletion in a system with an audit trail?" The strong answer: soft delete plus a timestamp (and who did it), a periodic archival job for old rows, and awareness of the trade-offs: UNIQUE constraints now collide with deleted rows (a re-created design with the same name fails unless you use a partial unique index <code>WHERE deleted_at IS NULL</code>, supported by SQLite and PostgreSQL, not MySQL), and GDPR-style "right to erasure" requests may legally require a real DELETE.</div>`,
  task:`The table <code>designs</code> has 6 rows. (1) <b>Hard-delete</b> every design whose <code>status</code> is <code>'draft'</code>. (2) <b>Soft-delete</b> every design whose status is <code>'retired'</code> by setting <code>deleted_at = '2025-03-01'</code> (do not remove those rows). Leave the approved designs untouched.`,
  starter:`-- 1) hard delete drafts\n\n-- 2) soft delete retired designs\n`,
  solution:`DELETE FROM designs
WHERE status = 'draft';

UPDATE designs
SET deleted_at = '2025-03-01'
WHERE status = 'retired';`,
  verify:`SELECT id, name, status, deleted_at FROM designs ORDER BY id;`,
  ordered:true,
  rules:[ { desc:'Uses DELETE', re:'\\bDELETE\\s+FROM\\b', flags:'i' }, { desc:'Uses UPDATE for the soft delete', re:'\\bUPDATE\\b', flags:'i' } ]
},

{ id:'m8-l6', module:7, file:'06-upsert-returning.sql', type:'exercise', title:'UPSERT (ON CONFLICT) and RETURNING',
  dataset:'blank',
  setupExtra:`CREATE TABLE stock_levels (
  sku TEXT PRIMARY KEY,
  qty INTEGER NOT NULL
);
INSERT INTO stock_levels (sku, qty) VALUES
  ('RG-001', 14),
  ('NK-001', 9);`,
  concept:`<p>A delivery note arrives listing SKUs and quantities. Some SKUs are already in your stock table, some are brand new. Doing "SELECT to see if it exists, then INSERT or UPDATE" in application code is slow and, under concurrency, <em>wrong</em>: two requests can both see "not found" and both insert, causing a duplicate-key error. <strong>UPSERT</strong> does the whole thing atomically in one statement:</p>
<pre>INSERT INTO stock_levels (sku, qty)
VALUES ('RG-001', 6), ('ER-009', 12)
ON CONFLICT (sku) DO UPDATE
SET qty = qty + excluded.qty
RETURNING sku, qty;</pre>
<p>How it reads: try to insert each row. If that violates the uniqueness of the <em>conflict target</em> <code>(sku)</code> (a PRIMARY KEY or UNIQUE column), then instead run the <code>DO UPDATE</code> on the existing row. Inside it, a bare column name (<code>qty</code>) means the <em>existing</em> row's value, and <code>excluded.qty</code> means the value you tried to insert. So existing 14 plus incoming 6 gives 20, while the new SKU simply inserts. Use <code>DO NOTHING</code> instead to silently skip duplicates (idempotent imports).</p>
<p><code>RETURNING</code> hands back the affected rows from an INSERT/UPDATE/DELETE, saving a second SELECT round trip: you get the generated id, the final quantity, or the deleted rows. It is how most PostgreSQL apps fetch a new primary key.</p>
<div class="callout"><b>Dialect note / Interview trap:</b> the spelling differs everywhere. PostgreSQL and SQLite: <code>ON CONFLICT (...) DO UPDATE</code> with <code>excluded.col</code>. MySQL: <code>ON DUPLICATE KEY UPDATE qty = qty + VALUES(qty)</code> (newer versions: alias syntax). SQL Server and Oracle use <code>MERGE</code>. And the conflict target must match an actual unique index, otherwise the statement errors. In MySQL there is no RETURNING (MariaDB has it for INSERT/DELETE); SQL Server uses <code>OUTPUT</code>.</div>`,
  task:`<code>stock_levels(sku PRIMARY KEY, qty)</code> holds RG-001 (14) and NK-001 (9). A delivery brings <b>6 pieces of RG-001</b> and <b>12 pieces of ER-009</b> (a new SKU). In <b>one</b> multi-row INSERT with <code>ON CONFLICT (sku) DO UPDATE</code>, <b>add</b> the delivered quantity to existing stock (use <code>excluded.qty</code>) and insert the new SKU. End the statement with <code>RETURNING sku, qty</code>.`,
  starter:`-- one upsert statement for both SKUs\nINSERT INTO stock_levels (sku, qty)\nVALUES\n  -- your rows\n;`,
  solution:`INSERT INTO stock_levels (sku, qty)
VALUES ('RG-001', 6), ('ER-009', 12)
ON CONFLICT (sku) DO UPDATE
SET qty = qty + excluded.qty
RETURNING sku, qty;`,
  verify:`SELECT sku, qty FROM stock_levels ORDER BY sku;`,
  ordered:true,
  rules:[ { desc:'Uses ON CONFLICT ... DO UPDATE', re:'\\bON\\s+CONFLICT\\b[\\s\\S]*\\bDO\\s+UPDATE\\b', flags:'i' }, { desc:'Uses excluded.', re:'\\bexcluded\\.', flags:'i' }, { desc:'Uses RETURNING', re:'\\bRETURNING\\b', flags:'i' } ]
},

{ id:'m8-l7', module:7, file:'07-transactions.sql', type:'exercise', title:'Transactions: BEGIN, COMMIT and ACID',
  dataset:'blank',
  setupExtra:`CREATE TABLE accounts (
  name TEXT PRIMARY KEY,
  balance INTEGER NOT NULL CHECK (balance >= 0)
);
INSERT INTO accounts (name, balance) VALUES
  ('Showroom', 90000),
  ('Vault', 10000);
CREATE TABLE transfer_log (
  id INTEGER PRIMARY KEY,
  from_acc TEXT,
  to_acc TEXT,
  amount INTEGER
);`,
  concept:`<p>Moving 25,000 rupees from the Showroom till to the Vault takes <em>two</em> statements: subtract from one account, add to the other. If the server crashes between them, 25,000 has vanished from the books. A <strong>transaction</strong> groups statements into one all-or-nothing unit of work.</p>
<pre>BEGIN;
UPDATE accounts SET balance = balance - 25000
 WHERE name = 'Showroom';
UPDATE accounts SET balance = balance + 25000
 WHERE name = 'Vault';
COMMIT;</pre>
<p>Everything between <code>BEGIN</code> and <code>COMMIT</code> becomes permanent together, or (after <code>ROLLBACK</code>, or a crash) not at all. Without BEGIN, databases run in <em>autocommit</em> mode: every statement is its own tiny transaction. The same shape protects stock reservation: insert the reservation row <em>and</em> decrement stock, or neither.</p>
<p><b>ACID in plain words:</b></p>
<ul>
<li><b>Atomicity</b>: all statements happen or none do.</li>
<li><b>Consistency</b>: constraints (CHECK, FOREIGN KEY, UNIQUE) hold at commit, so you cannot commit a negative balance.</li>
<li><b>Isolation</b>: concurrent transactions do not see each other's half-done work (how strictly is configurable, next lesson).</li>
<li><b>Durability</b>: once COMMIT returns, the data survives a power cut (the write-ahead log is flushed to disk).</li>
</ul>
<div class="callout"><b>Common mistake / Interview trap:</b> application code that opens a transaction, then makes a slow HTTP call (payment gateway, email) before committing, holds row locks for seconds and stalls every other writer. Keep transactions short and do external I/O outside them. Dialect note: MySQL needs the InnoDB engine for transactions (MyISAM silently ignores them), uses <code>START TRANSACTION</code> or <code>BEGIN</code>, and PostgreSQL even supports transactional DDL (you can roll back a CREATE TABLE). SQLite can too.</div>`,
  task:`Accounts: Showroom 90000, Vault 10000. Inside <b>one transaction</b> (<code>BEGIN</code> ... <code>COMMIT</code>): (1) subtract 25000 from <code>Showroom</code>, (2) add 25000 to <code>Vault</code>, (3) insert one row into <code>transfer_log (from_acc, to_acc, amount)</code> with values <code>'Showroom'</code>, <code>'Vault'</code>, <code>25000</code>. Finish with COMMIT.`,
  starter:`BEGIN;\n-- 1) debit Showroom\n-- 2) credit Vault\n-- 3) log the transfer\n-- COMMIT when done\n`,
  solution:`BEGIN;
UPDATE accounts SET balance = balance - 25000
 WHERE name = 'Showroom';
UPDATE accounts SET balance = balance + 25000
 WHERE name = 'Vault';
INSERT INTO transfer_log (from_acc, to_acc, amount)
VALUES ('Showroom', 'Vault', 25000);
COMMIT;`,
  verify:`SELECT name AS item, balance AS value FROM accounts
UNION ALL
SELECT from_acc || '>' || to_acc, amount FROM transfer_log
ORDER BY 1;`,
  ordered:true,
  rules:[ { desc:'Uses BEGIN', re:'\\bBEGIN\\b', flags:'i' }, { desc:'Uses COMMIT', re:'\\bCOMMIT\\b', flags:'i' } ]
},

{ id:'m8-l8', module:7, file:'08-rollback-isolation-predict.sql', type:'predict', title:'ROLLBACK and Isolation Levels: Predict the Balance',
  dataset:'blank',
  setupExtra:`CREATE TABLE accounts (
  name TEXT PRIMARY KEY,
  balance INTEGER NOT NULL
);
INSERT INTO accounts (name, balance) VALUES
  ('A', 1000),
  ('B', 200);`,
  concept:`<p><code>ROLLBACK</code> throws away every change made since <code>BEGIN</code>. It is what you type when the "rows affected" count is wrong, and what your application issues automatically when any statement in the unit of work throws an error. In the script below the money is moved, looked at, and then the transaction is abandoned. Trace it carefully: what does the <em>last</em> SELECT see?</p><p>Think of a transaction as a private scratch copy of the changes: nobody else sees them, the database writes them to a log, and only <code>COMMIT</code> makes them the official truth. That is why a crash mid-transfer is harmless: on restart the database finds a BEGIN with no COMMIT in the log and discards it, exactly as if you had typed ROLLBACK. In a jewellery workshop it is the same as writing a stock movement on a rough slip and only entering it in the ledger when both the issuing and receiving counters agree.</p>`,
  predict:{
    snippet:`BEGIN;\nUPDATE accounts SET balance = balance - 500\n WHERE name = 'A';\nUPDATE accounts SET balance = balance + 500\n WHERE name = 'B';\nROLLBACK;\n\nSELECT name, balance\nFROM accounts\nORDER BY name;`,
    question:`What do the final two rows show?`,
    options:['A, 500; B, 700','A, 1000; B, 200','A, 500; B, 200','A, 1000; B, 700'],
    correctIndex:1,
    afterExplain:`Both UPDATEs were undone, so nothing changed. Inside the transaction, before the ROLLBACK, a SELECT <em>would</em> have shown 500 and 700: you always see your own uncommitted work.<br><br><b>Isolation levels.</b> What do <em>other</em> sessions see while your transaction is open? The SQL standard defines levels by which anomalies they allow:<ul><li><b>Dirty read</b>: seeing another transaction's uncommitted change (which may then be rolled back, so you acted on data that never existed). Allowed only at READ UNCOMMITTED.</li><li><b>Non-repeatable read</b>: you read a row twice and it changed in between because someone committed. Allowed at READ COMMITTED, prevented at REPEATABLE READ.</li><li><b>Phantom read</b>: you run the same query twice and a <em>new row</em> appears, because someone inserted a matching row. Prevented by SERIALIZABLE (and in practice by PostgreSQL's and MySQL InnoDB's REPEATABLE READ snapshots, with caveats).</li></ul><b>Dialect notes:</b> PostgreSQL defaults to READ COMMITTED (and never allows dirty reads, even if you ask for READ UNCOMMITTED); MySQL InnoDB defaults to REPEATABLE READ; SQL Server to READ COMMITTED. SQLite serialises writers, so it is effectively SERIALIZABLE. Higher isolation costs throughput and can abort transactions with serialization failures that your code must retry.<br><br><b>Safe-change habits:</b> before a risky UPDATE/DELETE, <code>BEGIN</code>, run it, SELECT to verify, and only then <code>COMMIT</code>. If anything looks off, <code>ROLLBACK</code>. A transaction is the cheapest safety net you have. One more trap: DDL in MySQL (CREATE/ALTER/DROP) auto-commits, so you cannot roll those back there.`
  }
}

);
