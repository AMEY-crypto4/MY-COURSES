{ id:'m7-l1', module:6, file:'01-try-catch.js', type:'exercise', title:'try / catch — Handling Errors Gracefully',
  concept:'<p>Real programs deal with unpredictable input: a user types text where a number was expected, a network call fails, a piece of data is missing a field you expected. <code>try</code> / <code>catch</code> lets your program catch an error and respond sensibly instead of crashing entirely.</p><pre>try {\n  const age = JSON.parse(inputText);\n} catch (error) {\n  console.log("invalid input, falling back to a default");\n}</pre><p>JavaScript does not have separate catchable exception "types" the way some languages do by default -- instead, you check <code>error.message</code> or <code>error instanceof SomeErrorClass</code> inside the catch block if you need to respond differently to different problems.</p><div class="callout"><b>Industry habit:</b> only wrap the specific lines that can actually fail in a try block, not your entire function -- a try block that is too broad makes it harder to tell what actually went wrong.</div>',
  task:'Write safeDivide(a, b), returning a / b, but checking for b === 0 first and returning null instead of dividing (division by zero does not throw in JavaScript, so this needs an explicit check, not try/catch). Then write safeParseJSON(text), using try/catch around JSON.parse(text), returning null if parsing fails.',
  starter:'function safeDivide(a, b) {\n  // check for b === 0 first, return null; otherwise divide\n}\n\nfunction safeParseJSON(text) {\n  // try JSON.parse(text), catch and return null on failure\n}',
  solution:'function safeDivide(a, b) {\n  if (b === 0) return null;\n  return a / b;\n}\n\nfunction safeParseJSON(text) {\n  try {\n    return JSON.parse(text);\n  } catch (error) {\n    return null;\n  }\n}',
  tests:[
    { desc:'safeDivide(10, 2) === 5', check:'safeDivide(10, 2) === 5' },
    { desc:'safeDivide(10, 0) is null instead of Infinity', check:'safeDivide(10, 0) === null' },
    { desc:'safeParseJSON parses valid JSON correctly', check:'JSON.stringify(safeParseJSON(\'{"a":1}\')) === JSON.stringify({a:1})' },
    { desc:'safeParseJSON returns null instead of crashing on invalid JSON', check:'safeParseJSON("not json") === null' }
  ]},

{ id:'m7-l2', module:6, file:'02-finally-throw.js', type:'exercise', title:'finally & Throwing Your Own Errors',
  concept:'<p>A try/catch block can carry an extra <code>finally</code> clause, which always runs no matter what -- whether the try succeeded, failed, or even returned early -- making it the right place for cleanup code.</p><p>You can also throw your own errors with <code>throw</code>, to signal that something is wrong in YOUR code’s own terms, with a clear message: <code>throw new Error("age cannot be negative")</code>. This is how real libraries communicate precise, descriptive errors back to whoever is calling them.</p><pre>function validateAge(age) {\n  if (age < 0) {\n    throw new Error("age cannot be negative");\n  }\n  return age;\n}\n\ntry {\n  validateAge(-5);\n} catch (error) {\n  console.log(error.message);   <span style="color:#6A9955">// "age cannot be negative"</span>\n} finally {\n  console.log("cleanup always runs here");\n}</pre>',
  task:'Write validateAge(age), throwing a new Error with the message "age cannot be negative" if age is less than 0, and throwing a new Error with the message "age is unrealistically high" if age is over 150. Otherwise, return age unchanged.',
  starter:'function validateAge(age) {\n  // throw new Error(...) with the right message for each invalid case\n  return age;\n}',
  solution:'function validateAge(age) {\n  if (age < 0) {\n    throw new Error("age cannot be negative");\n  }\n  if (age > 150) {\n    throw new Error("age is unrealistically high");\n  }\n  return age;\n}',
  tests:[
    { desc:'validateAge(30) === 30', check:'validateAge(30) === 30' },
    { desc:'validateAge(-5) throws with the message "age cannot be negative"', check:'__throws(() => validateAge(-5), "age cannot be negative")' },
    { desc:'validateAge(200) throws with the message "age is unrealistically high"', check:'__throws(() => validateAge(200), "age is unrealistically high")' }
  ]},

{ id:'m7-l3', module:6, file:'03-defensive-validation.js', type:'exercise', title:'Defensive Programming: Validating Your Own Assumptions',
  concept:'<p>Writing down your own assumptions directly in the code, and failing loudly and immediately when they turn out to be wrong, is far better than silently producing a wrong answer much later. A small reusable helper makes this easy to do consistently:</p><pre>function assert(condition, message) {\n  if (!condition) {\n    throw new Error(message);\n  }\n}\n\nfunction average(nums) {\n  assert(nums.length > 0, "cannot average an empty array");\n  return nums.reduce((sum, n) => sum + n, 0) / nums.length;\n}</pre><div class="callout"><b>Why this matters:</b> real testing frameworks like Jest build on exactly this idea at scale -- a function that checks a condition and throws (or fails a reported test) if it is not met. Writing your own tiny assert() here teaches you precisely what those frameworks are doing underneath their friendlier syntax.</div>',
  task:'Write assert(condition, message), throwing a new Error with that message if condition is falsy. Then write average(nums), using your assert to guarantee nums is not empty (message: "cannot average an empty array"), then returning the average.',
  starter:'function assert(condition, message) {\n  // throw if condition is falsy\n}\n\nfunction average(nums) {\n  // use assert to guarantee nums is not empty, then return the average\n}',
  solution:'function assert(condition, message) {\n  if (!condition) {\n    throw new Error(message);\n  }\n}\n\nfunction average(nums) {\n  assert(nums.length > 0, "cannot average an empty array");\n  return nums.reduce((sum, n) => sum + n, 0) / nums.length;\n}',
  tests:[
    { desc:'average([2, 4, 6]) === 4', check:'average([2,4,6]) === 4' },
    { desc:'assert does nothing when the condition is true', check:'(function(){ assert(true, "should not throw"); return true; })()' },
    { desc:'average([]) throws the exact expected message', check:'__throws(() => average([]), "cannot average an empty array")' }
  ]},

{ id:'m8-l1', module:7, file:'01-json-deep-dive.js', type:'exercise', title:'JSON.parse() & JSON.stringify() Deep Dive',
  concept:'<p>JSON (JavaScript Object Notation) is the universal format for structured data sent between a browser, a server, and an API -- in practice, almost every real API you will ever work with speaks JSON. <code>JSON.stringify(value)</code> converts a real JavaScript object/array into a JSON STRING. <code>JSON.parse(text)</code> converts a JSON string back into a real object/array.</p><pre>const data = { name: "Amey", skills: ["js", "sql"] };\nconst text = JSON.stringify(data);\n<span style="color:#6A9955">// text is now a STRING: \'{"name":"Amey","skills":["js","sql"]}\'</span>\n\nconst parsed = JSON.parse(text);\n<span style="color:#6A9955">// parsed is a real object again, deeply equal to data</span></pre><div class="callout"><b>Why this matters:</b> a JSON string looks almost exactly like an object/array on the page, but it is NOT the same thing until you parse it -- a very common beginner confusion when working with real APIs or localStorage, which can only store strings.</div>',
  task:'Write profileToJson(profile), converting an object to a JSON string with JSON.stringify(). Write jsonToProfile(text), converting a JSON string back to an object with JSON.parse(). Then prove they are inverses by round-tripping a sample object.',
  starter:'function profileToJson(profile) {\n  // your code here\n}\n\nfunction jsonToProfile(text) {\n  // your code here\n}',
  solution:'function profileToJson(profile) {\n  return JSON.stringify(profile);\n}\n\nfunction jsonToProfile(text) {\n  return JSON.parse(text);\n}',
  tests:[
    { desc:'profileToJson produces a real string', check:'typeof profileToJson({a:1}) === "string"' },
    { desc:'jsonToProfile correctly parses JSON back into an object', check:'JSON.stringify(jsonToProfile(\'{"name":"Amey","age":27}\')) === JSON.stringify({name:"Amey",age:27})' },
    { desc:'Round-tripping through both functions returns an equivalent object', check:'JSON.stringify(jsonToProfile(profileToJson({x:1,y:[1,2,3]}))) === JSON.stringify({x:1,y:[1,2,3]})' }
  ]},

{ id:'m8-l2', module:7, file:'02-modules-concept.js', type:'predict', title:'ES Modules: import & export — Predict the Output',
  concept:'<p>Real JavaScript projects are split across many files, called <strong>modules</strong>. A module uses <code>export</code> to make a function, variable, or class available to OTHER files, and <code>import</code> to pull something another module exported into the current file.</p><pre><span style="color:#6A9955">// mathUtils.js</span>\nexport function double(n) {\n  return n * 2;\n}\nexport const PI = 3.14159;\n\n<span style="color:#6A9955">// app.js</span>\nimport { double, PI } from "./mathUtils.js";\nconsole.log(double(5));   <span style="color:#6A9955">// 10</span></pre><p>This course keeps every lesson in one single file for simplicity, so you cannot literally run import/export here, but every real project you build and deploy -- including with React, Node, or a bundler like Vite -- is built entirely out of modules exactly like this.</p>',
  task:'',
  predict:{
    snippet:'// Imagine these are two separate files in a real project:\n\n// ---- mathUtils.js ----\nfunction double(n) {\n  return n * 2;\n}\nconst PI = 3.14159;\n// a real file would write: export { double, PI };\n\n// ---- app.js ----\n// a real file would write: import { double, PI } from "./mathUtils.js";\nconsole.log(double(5));\nconsole.log(PI);',
    question:'If these were two real separate files in a real project, what would the FIRST console.log print?',
    options:['10','5','double','undefined'],
    correctIndex:0,
    afterExplain:'app.js imports the double function from mathUtils.js by name, then calls double(5), which returns 5 * 2 = 10. Named imports like { double, PI } must match the exact names used after "export" in the other file -- this is the standard way real multi-file JavaScript projects share code between files.'
  }},

{ id:'m8-l3', module:7, file:'03-date-math-tour.js', type:'exercise', title:'A Tour of Built-ins: Date & Math',
  concept:'<p>JavaScript ships with built-in objects you can use immediately, no setup needed. Two you will use constantly:</p><ul><li><code>Math</code> -- <code>Math.sqrt(x)</code>, <code>Math.floor(x)</code> / <code>Math.ceil(x)</code> / <code>Math.round(x)</code>, <code>Math.random()</code> (a random number from 0 up to, but not including, 1), and the constant <code>Math.PI</code></li><li><code>Date</code> -- <code>new Date(year, monthIndex, day)</code> represents a calendar date (note: monthIndex is 0-based, so January is 0), and subtracting two dates gives the difference in milliseconds</li></ul><pre>Math.sqrt(144);   <span style="color:#6A9955">// 12</span>\n\nconst d1 = new Date(2025, 11, 25);   <span style="color:#6A9955">// Dec 25, 2025 (month 11 = December)</span>\nconst d2 = new Date(2026, 0, 1);     <span style="color:#6A9955">// Jan 1, 2026 (month 0 = January)</span>\nconst daysBetween = (d2 - d1) / (1000 * 60 * 60 * 24);   <span style="color:#6A9955">// 7</span></pre>',
  task:'Write hypotenuse(a, b) using Math.sqrt to compute the hypotenuse of a right triangle. Then write daysBetween(y1, m1, d1, y2, m2, d2), returning the number of days between two dates (m1/m2 given as normal 1-12 month numbers -- subtract 1 before passing to Date, since Date expects a 0-based month).',
  starter:'function hypotenuse(a, b) {\n  // use Math.sqrt\n}\n\nfunction daysBetween(y1, m1, d1, y2, m2, d2) {\n  // build two Date objects (remember: Date months are 0-based) and subtract\n}',
  solution:'function hypotenuse(a, b) {\n  return Math.sqrt(a ** 2 + b ** 2);\n}\n\nfunction daysBetween(y1, m1, d1, y2, m2, d2) {\n  const first = new Date(y1, m1 - 1, d1);\n  const second = new Date(y2, m2 - 1, d2);\n  return Math.round((second - first) / (1000 * 60 * 60 * 24));\n}',
  tests:[
    { desc:'hypotenuse(3, 4) === 5', check:'hypotenuse(3, 4) === 5' },
    { desc:'hypotenuse(9, 12) === 15', check:'hypotenuse(9, 12) === 15' },
    { desc:'daysBetween correctly counts a full week', check:'daysBetween(2025, 12, 25, 2026, 1, 1) === 7' }
  ]},

{ id:'m9-l1', module:8, file:'01-classes-constructor.js', type:'exercise', title:'Classes, the Constructor & Instance Methods',
  concept:'<p>A class is a blueprint for creating objects that bundle data and behavior together. <code>constructor</code> is a special method that runs automatically every time you create a new instance with <code>new ClassName(...)</code>, and is where you set up that instance’s own starting data with <code>this.property = value</code>.</p><pre>class BankAccount {\n  constructor(owner, balance) {\n    this.owner = owner;\n    this.balance = balance;\n  }\n\n  deposit(amount) {\n    this.balance += amount;\n  }\n}\n\nconst acc = new BankAccount("Amey", 100);\nacc.deposit(50);\nconsole.log(acc.balance);   <span style="color:#6A9955">// 150</span></pre>',
  task:'Build a class BankAccount with a constructor(owner, balance), a method deposit(amount) that increases the balance, a method withdraw(amount) that decreases the balance (only if sufficient funds exist, otherwise does nothing), and getBalance() returning the current balance.',
  starter:'class BankAccount {\n  // constructor, deposit, withdraw, getBalance\n}',
  solution:'class BankAccount {\n  constructor(owner, balance) {\n    this.owner = owner;\n    this.balance = balance;\n  }\n\n  deposit(amount) {\n    this.balance += amount;\n  }\n\n  withdraw(amount) {\n    if (amount <= this.balance) {\n      this.balance -= amount;\n    }\n  }\n\n  getBalance() {\n    return this.balance;\n  }\n}',
  tests:[
    { desc:'A new account starts with the correct balance', check:'new BankAccount("Amey", 100).getBalance() === 100' },
    { desc:'deposit() increases the balance correctly', check:'(function(){ const a = new BankAccount("Amey", 100); a.deposit(50); return a.getBalance() === 150; })()' },
    { desc:'withdraw() decreases the balance when funds are sufficient', check:'(function(){ const a = new BankAccount("Amey", 100); a.withdraw(30); return a.getBalance() === 70; })()' },
    { desc:'withdraw() refuses to overdraw the account', check:'(function(){ const a = new BankAccount("Amey", 100); a.withdraw(500); return a.getBalance() === 100; })()' }
  ]},

{ id:'m9-l2', module:8, file:'02-static-vs-instance.js', type:'exercise', title:'Instance Properties vs static Properties & Methods',
  concept:'<p>A property set inside the constructor with <code>this.x = ...</code> belongs to that ONE instance -- every object gets its own independent copy. A <code>static</code> property or method belongs to the CLASS itself, not to any individual instance, and is called on the class name directly rather than on an object.</p><pre>class Employee {\n  static company = "A&A Creations";   <span style="color:#6A9955">// shared by the class itself</span>\n\n  constructor(name) {\n    this.name = name;                  <span style="color:#6A9955">// unique per instance</span>\n  }\n\n  static describe() {\n    return `Everyone here works at ${Employee.company}`;\n  }\n}\n\nconsole.log(Employee.company);     <span style="color:#6A9955">// "A&A Creations"</span>\nconsole.log(Employee.describe());  <span style="color:#6A9955">// called on the CLASS, not an instance</span></pre><div class="callout"><b>Real use case:</b> static is the right tool for something that belongs to the concept of the class as a whole -- a counter of how many instances exist, a fixed configuration value, or a small utility/factory method -- not something that differs per object.</div>',
  task:'Build a class Employee with a static property company set to "A&A Creations". The constructor(name, salary) should set instance properties name and salary. Add an instance method annualSalary() returning salary * 12, and a static method describe() returning the string "Works at A&A Creations" (using Employee.company inside a template literal).',
  starter:'class Employee {\n  // static company property\n\n  constructor(name, salary) {\n    // instance properties\n  }\n\n  annualSalary() {\n  }\n\n  static describe() {\n  }\n}',
  solution:'class Employee {\n  static company = "A&A Creations";\n\n  constructor(name, salary) {\n    this.name = name;\n    this.salary = salary;\n  }\n\n  annualSalary() {\n    return this.salary * 12;\n  }\n\n  static describe() {\n    return `Works at ${Employee.company}`;\n  }\n}',
  tests:[
    { desc:'Every employee shares the same static company property', check:'new Employee("A", 1000).constructor.company === "A&A Creations" && new Employee("B", 2000).constructor.company === "A&A Creations"' },
    { desc:'Each employee keeps their own separate name and salary', check:'new Employee("A", 1000).name === "A" && new Employee("B", 2000).salary === 2000' },
    { desc:'annualSalary multiplies monthly salary by 12', check:'new Employee("A", 1000).annualSalary() === 12000' },
    { desc:'the static describe() method works correctly', check:'Employee.describe() === "Works at A&A Creations"' }
  ]},

{ id:'m9-l3', module:8, file:'03-inheritance-extends-super.js', type:'exercise', title:'Inheritance with extends & super',
  concept:'<p><code>extends</code> lets a new class reuse and build on an existing one: <code>class Dog extends Animal</code> makes Dog a more specific version of Animal, automatically getting everything Animal has. Call <code>super(...)</code> inside the child’s own constructor to run the parent’s setup logic too, instead of duplicating it -- it must be called before using <code>this</code> in the child constructor.</p><pre>class Animal {\n  constructor(name) {\n    this.name = name;\n  }\n  speak() {\n    return `${this.name} makes a sound`;\n  }\n}\n\nclass Dog extends Animal {\n  speak() {   <span style="color:#6A9955">// overrides the parent\'s version</span>\n    return `${this.name} says Woof`;\n  }\n}\n\nfor (const animal of [new Animal("Generic"), new Dog("Rex")]) {\n  console.log(animal.speak());   <span style="color:#6A9955">// each uses its OWN speak()</span>\n}</pre>',
  task:'Build a class Shape with constructor(name) and a method describe() returning a template literal like "circle has an area of 12.57" using this.area() (not yet defined on Shape itself). Build Circle extends Shape and Rectangle extends Shape, each calling super with a fixed name, each implementing their own area() method (circle: constructor(radius) stores radius, area = 3.14159 * radius * radius; rectangle: constructor(width, height) stores both, area = width * height).',
  starter:'class Shape {\n  constructor(name) {\n    this.name = name;\n  }\n\n  describe() {\n    return `${this.name} has an area of ${this.area()}`;\n  }\n}\n\nclass Circle extends Shape {\n  constructor(radius) {\n    // call super with "circle", store radius\n  }\n\n  area() {\n  }\n}\n\nclass Rectangle extends Shape {\n  constructor(width, height) {\n    // call super with "rectangle", store width and height\n  }\n\n  area() {\n  }\n}',
  solution:'class Shape {\n  constructor(name) {\n    this.name = name;\n  }\n\n  describe() {\n    return `${this.name} has an area of ${this.area()}`;\n  }\n}\n\nclass Circle extends Shape {\n  constructor(radius) {\n    super("circle");\n    this.radius = radius;\n  }\n\n  area() {\n    return 3.14159 * this.radius * this.radius;\n  }\n}\n\nclass Rectangle extends Shape {\n  constructor(width, height) {\n    super("rectangle");\n    this.width = width;\n    this.height = height;\n  }\n\n  area() {\n    return this.width * this.height;\n  }\n}',
  tests:[
    { desc:'Circle correctly inherits and uses the Shape describe() method', check:'new Circle(2).describe().includes("circle has an area of")' },
    { desc:'Circle area is computed correctly', check:'Math.abs(new Circle(2).area() - 12.56636) < 0.01' },
    { desc:'Rectangle area is computed correctly', check:'new Rectangle(4, 5).area() === 20' },
    { desc:'Each subclass uses its OWN area() through the shared describe()', check:'new Rectangle(4,5).describe() === "rectangle has an area of 20"' }
  ]},

{ id:'m9-l4', module:8, file:'04-getters-tostring.js', type:'exercise', title:'Getters & toString()',
  concept:'<p>A <strong>getter</strong>, written with <code>get</code>, lets you access a computed value using plain property syntax (no parentheses), as if it were a regular property, even though it runs real code behind the scenes: <code>circle.area</code> instead of <code>circle.area()</code>.</p><p><code>toString()</code> is a special method JavaScript calls automatically whenever an object needs to be converted to a string -- for example inside a template literal, or when passed to console.log indirectly. Defining your own gives your objects a sensible, readable default text form.</p><pre>class Point {\n  constructor(x, y) {\n    this.x = x;\n    this.y = y;\n  }\n  get magnitude() {\n    return Math.sqrt(this.x ** 2 + this.y ** 2);\n  }\n  toString() {\n    return `(${this.x}, ${this.y})`;\n  }\n}\n\nconst p = new Point(3, 4);\nconsole.log(p.magnitude);   <span style="color:#6A9955">// 5 -- called like a property, no ()</span>\nconsole.log(`Point: ${p}`);  <span style="color:#6A9955">// "Point: (3, 4)" -- toString() runs automatically</span></pre>',
  task:'Build a class Rectangle with constructor(width, height), a getter area returning width * height, and a toString() method returning a template literal like "3x4 rectangle".',
  starter:'class Rectangle {\n  constructor(width, height) {\n    this.width = width;\n    this.height = height;\n  }\n\n  get area() {\n  }\n\n  toString() {\n  }\n}',
  solution:'class Rectangle {\n  constructor(width, height) {\n    this.width = width;\n    this.height = height;\n  }\n\n  get area() {\n    return this.width * this.height;\n  }\n\n  toString() {\n    return `${this.width}x${this.height} rectangle`;\n  }\n}',
  tests:[
    { desc:'the area getter is accessed like a property, no parentheses', check:'new Rectangle(3, 4).area === 12' },
    { desc:'toString() produces the expected text', check:'new Rectangle(3, 4).toString() === "3x4 rectangle"' },
    { desc:'a template literal automatically uses toString()', check:'`${new Rectangle(3,4)}` === "3x4 rectangle"' }
  ]},

{ id:'m10-l1', module:9, file:'01-higher-order-functions.js', type:'exercise', title:'Higher-Order Functions: Functions That Take or Return Functions',
  concept:'<p>In JavaScript, a function is just another value -- it can be stored in a variable, passed as an argument to another function, or returned from one. A function that takes another function as an argument, or returns one, is called a <strong>higher-order function</strong>. You have already been using them: <code>.map()</code>, <code>.filter()</code>, and <code>.reduce()</code> all take a function as an argument.</p><pre>function makeMultiplier(factor) {\n  return function(n) {       <span style="color:#6A9955">// returns a brand new function</span>\n    return n * factor;\n  };\n}\n\nconst triple = makeMultiplier(3);\ntriple(5);   <span style="color:#6A9955">// 15 -- "triple" remembers factor = 3 via closure</span></pre>',
  task:'Write makeMultiplier(factor), returning a new function that multiplies its own argument by factor. Then write applyTwice(fn, value), a higher-order function that calls fn on value, then calls fn again on THAT result, and returns the final result.',
  starter:'function makeMultiplier(factor) {\n  // return a new function\n}\n\nfunction applyTwice(fn, value) {\n  // call fn on value, then call fn again on the result\n}',
  solution:'function makeMultiplier(factor) {\n  return function(n) {\n    return n * factor;\n  };\n}\n\nfunction applyTwice(fn, value) {\n  return fn(fn(value));\n}',
  tests:[
    { desc:'makeMultiplier(3) returns a working tripling function', check:'makeMultiplier(3)(5) === 15' },
    { desc:'makeMultiplier(10) correctly remembers its own factor', check:'makeMultiplier(10)(4) === 40' },
    { desc:'applyTwice correctly chains the function twice', check:'applyTwice(n => n + 3, 10) === 16' }
  ]},

{ id:'m10-l2', module:9, file:'02-generators.js', type:'exercise', title:'Generator Functions with function* and yield',
  concept:'<p>A <strong>generator function</strong>, defined with <code>function*</code>, uses <code>yield</code> instead of <code>return</code>. Calling it does not run the function body immediately -- it returns a special generator object that produces values one at a time, on demand, pausing exactly where it left off between each value.</p><pre>function* countdown(n) {\n  while (n > 0) {\n    yield n;\n    n--;\n  }\n}\n\nfor (const number of countdown(3)) {\n  console.log(number);   <span style="color:#6A9955">// 3, then 2, then 1</span>\n}</pre><div class="callout"><b>Why this matters:</b> generators let you represent an enormous, or even infinite, sequence while only ever holding ONE value in memory at a time -- useful for streaming data, or producing values lazily only as they are actually needed.</div>',
  task:'Write a generator function evenNumbersUpTo(n), yielding every even number from 2 up to and including n, in order. Then write firstN(generator, count), which pulls exactly count values out of any generator using .next() in a loop, and returns them as an array.',
  starter:'function* evenNumbersUpTo(n) {\n  // yield each even number, 2, 4, 6, ... up to n\n}\n\nfunction firstN(generator, count) {\n  // pull exactly `count` values out using .next(), return as an array\n  const result = [];\n  return result;\n}',
  solution:'function* evenNumbersUpTo(n) {\n  let current = 2;\n  while (current <= n) {\n    yield current;\n    current += 2;\n  }\n}\n\nfunction firstN(generator, count) {\n  const result = [];\n  for (let i = 0; i < count; i++) {\n    result.push(generator.next().value);\n  }\n  return result;\n}',
  tests:[
    { desc:'evenNumbersUpTo(10) yields 2,4,6,8,10 when collected', check:'JSON.stringify([...evenNumbersUpTo(10)]) === JSON.stringify([2,4,6,8,10])' },
    { desc:'evenNumbersUpTo is a real generator with a .next() method', check:'typeof evenNumbersUpTo(10).next === "function"' },
    { desc:'firstN correctly pulls a limited number of values out', check:'JSON.stringify(firstN(evenNumbersUpTo(100), 3)) === JSON.stringify([2,4,6])' }
  ]},

{ id:'m10-l3', module:9, file:'03-iteration-protocol-predict.js', type:'predict', title:'How for...of Really Works: the Iteration Protocol — Predict the Output',
  concept:'<p>A <code>for...of</code> loop is not magic -- it is built on a protocol. Any object you can loop over with for...of (an array, a string, a Map, a Set, a generator) exposes a special method under the key <code>Symbol.iterator</code>, which returns an iterator object with a <code>.next()</code> method. Calling .next() repeatedly returns <code>{ value, done }</code> objects, until <code>done</code> becomes true.</p><pre>const letters = ["a", "b"];\nconst it = letters[Symbol.iterator]();\nconsole.log(it.next());   <span style="color:#6A9955">// { value: "a", done: false }</span>\nconsole.log(it.next());   <span style="color:#6A9955">// { value: "b", done: false }</span>\nconsole.log(it.next());   <span style="color:#6A9955">// { value: undefined, done: true }</span></pre>',
  task:'',
  predict:{
    snippet:'const letters = ["x", "y"];\nconst it = letters[Symbol.iterator]();\nconsole.log(it.next().value);\nconsole.log(it.next().value);\nconsole.log(it.next().done);',
    question:'What does the THIRD line, it.next().done, print?',
    options:['true','false','undefined','y'],
    correctIndex:0,
    afterExplain:'After "x" and "y" have both been returned (each with done: false, since more values were still coming), a third call to next() has nothing left to give -- its value is undefined and its done flag flips to true. This exact mechanism, repeatedly calling .next() until done is true, is precisely what a for...of loop does automatically behind the scenes.'
  }},

{ id:'m10-l4', module:9, file:'04-wrapping-functions.js', type:'exercise', title:'Wrapping Functions: the Pattern Behind Real-World Middleware',
  concept:'<p>A function that takes another function and returns a NEW function which calls the original while adding extra behavior around it -- before it runs, after it runs, or both -- is an extremely common real pattern. It is exactly how logging, timing, caching, and authentication checks get added around existing code in real frameworks, without changing a single line inside the original function.</p><pre>function withLogging(fn) {\n  return function(...args) {\n    console.log("calling with:", args);\n    const result = fn(...args);\n    console.log("returned:", result);\n    return result;\n  };\n}\n\nconst loggedAdd = withLogging((a, b) => a + b);\nloggedAdd(2, 3);   <span style="color:#6A9955">// logs the call, runs the real add, logs the result, returns 5</span></pre>',
  task:'Write withTiming(fn), returning a new function that calls fn with whatever arguments it receives, and returns an object { result, ranOk } where result is whatever fn returned, and ranOk is true if fn did not throw, or false (with result set to null) if it did throw.',
  starter:'function withTiming(fn) {\n  // return a new function that wraps fn\n}',
  solution:'function withTiming(fn) {\n  return function(...args) {\n    try {\n      const result = fn(...args);\n      return { result, ranOk: true };\n    } catch (error) {\n      return { result: null, ranOk: false };\n    }\n  };\n}',
  tests:[
    { desc:'the wrapped function correctly forwards arguments and returns the real result', check:'JSON.stringify(withTiming((a,b) => a + b)(2, 3)) === JSON.stringify({result: 5, ranOk: true})' },
    { desc:'the wrapped function reports ranOk:false when the original throws', check:'JSON.stringify(withTiming(() => { throw new Error("boom"); })()) === JSON.stringify({result: null, ranOk: false})' }
  ]},

{ id:'m11-l1', module:10, file:'01-promises-async-await.js', type:'exercise', title:'Promises & async/await Basics',
  concept:'<p>Some operations -- fetching data from a server, reading a file, waiting for a timer -- take time and should not freeze everything else while waiting. A <strong>Promise</strong> represents a value that is not ready yet, but will either RESOLVE (succeed, with a value) or REJECT (fail, with an error) at some point in the future.</p><pre>function wait(ms) {\n  return new Promise(resolve => {\n    setTimeout(() => resolve("done waiting"), ms);\n  });\n}\n\nwait(100).then(message => console.log(message));</pre><p><code>async</code> / <code>await</code> is modern, cleaner syntax for working with Promises, letting asynchronous code read almost like ordinary step-by-step code. A function marked <code>async</code> always returns a Promise, and <code>await</code> pauses just that function until the awaited Promise settles.</p><pre>async function run() {\n  const message = await wait(100);\n  console.log(message);   <span style="color:#6A9955">// "done waiting", after the delay</span>\n}</pre><div class="callout"><b>Why this matters:</b> essentially every real API call in JavaScript (fetch, database calls, file access) is asynchronous and returns a Promise -- async/await is how virtually all modern JavaScript code deals with that.</div>',
  task:'Write an async function fetchUserName(userId) that awaits the given getUserFromDatabase(userId) (already defined for you, returns a Promise), then returns just the .name field from the result. (This sandbox checks your function’s structure rather than its eventual resolved value, since that resolves after the test has already finished checking -- exactly the kind of timing you are learning about in this lesson.)',
  starter:'function getUserFromDatabase(userId) {\n  return Promise.resolve({ id: userId, name: "Amey", role: "developer" });\n}\n\nasync function fetchUserName(userId) {\n  // await getUserFromDatabase(userId), then return its .name\n}',
  solution:'function getUserFromDatabase(userId) {\n  return Promise.resolve({ id: userId, name: "Amey", role: "developer" });\n}\n\nasync function fetchUserName(userId) {\n  const user = await getUserFromDatabase(userId);\n  return user.name;\n}',
  tests:[
    { desc:'fetchUserName is declared as an async function', check:'fetchUserName.constructor.name === "AsyncFunction"' },
    { desc:'fetchUserName returns a Promise (since it is an async function)', check:'fetchUserName(1) instanceof Promise' }
  ]},

{ id:'m11-l2', module:10, file:'02-testable-code.js', type:'exercise', title:'Writing Testable Code With Your Own assert()',
  concept:'<p>Every exercise in this entire course has secretly been testing your code behind the scenes using exactly this pattern. Writing your OWN tests this way is a core professional habit: a short, separate block of code that calls your function with known inputs and checks the output matches what you expect, BEFORE you ship or rely on it.</p><pre>function assert(condition, message) {\n  if (!condition) throw new Error(message);\n}\n\nfunction add(a, b) {\n  return a + b;\n}\n\n<span style="color:#6A9955">// a tiny hand-written test suite</span>\nassert(add(2, 3) === 5, "add(2,3) should be 5");\nassert(add(-1, 1) === 0, "add(-1,1) should be 0");\nconsole.log("all tests passed");</pre><div class="callout"><b>Why this matters:</b> real projects use testing frameworks like Jest or Vitest to automate exactly this pattern at scale, but the underlying idea never changes: write down what your function SHOULD do for a few representative inputs, then let the computer check it every time you change the code.</div>',
  task:'Write isPalindrome(text), returning true if text reads the same forwards and backwards (ignore case; assume text already has no spaces or punctuation for simplicity). Then write runTests(), using an assert() helper (already given) to test isPalindrome against at least 3 cases (at least one true case and one false case), returning the string "all tests passed" only if every assert succeeds.',
  starter:'function assert(condition, message) {\n  if (!condition) throw new Error(message);\n}\n\nfunction isPalindrome(text) {\n  // compare text to its own reverse, ignoring case\n}\n\nfunction runTests() {\n  // write at least 3 asserts testing isPalindrome, then return "all tests passed"\n}',
  solution:'function assert(condition, message) {\n  if (!condition) throw new Error(message);\n}\n\nfunction isPalindrome(text) {\n  const cleaned = text.toLowerCase();\n  return cleaned === cleaned.split("").reverse().join("");\n}\n\nfunction runTests() {\n  assert(isPalindrome("racecar") === true, "racecar should be a palindrome");\n  assert(isPalindrome("hello") === false, "hello should not be a palindrome");\n  assert(isPalindrome("Level") === true, "Level should be a palindrome ignoring case");\n  return "all tests passed";\n}',
  tests:[
    { desc:'isPalindrome("racecar") === true', check:'isPalindrome("racecar") === true' },
    { desc:'isPalindrome("hello") === false', check:'isPalindrome("hello") === false' },
    { desc:'isPalindrome ignores case ("Level" counts as a palindrome)', check:'isPalindrome("Level") === true' },
    { desc:'runTests completes all asserts and returns the success message', check:'runTests() === "all tests passed"' }
  ]},

/* ============================================================
   STATE
   ============================================================ */
const STORAGE_KEY = 'jsFundamentalsProgress_v2';
const DRAFTS_KEY = 'jsFundamentalsDrafts_v2';

function loadProgress(){
  try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); }
  catch(e){ return new Set(); }
}
function saveProgress(set){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...set])); } catch(e){}
}
function loadDrafts(){
  try { return JSON.parse(localStorage.getItem(DRAFTS_KEY) || '{}'); }
  catch(e){ return {}; }
}
function saveDraft(id, code){
  try {
    const drafts = loadDrafts();
    drafts[id] = code;
    localStorage.setItem(DRAFTS_KEY, JSON.stringify(drafts));
  } catch(e){}
}

const state = {
  completed: loadProgress(),
  drafts: loadDrafts(),
  openTabs: [],
  activeId: null,
  cm: null,
  predictAnswered: false
};

/* ============================================================
   CODE RUNNER (Web Worker sandbox)
   ============================================================ */
const WORKER_SRC = `
self.onmessage = function(e){
  const code = e.data.code;
  const testsCode = e.data.testsCode || '';
  const logs = [];
  const origLog = console.log;
  function fmt(a){
    if (a === undefined) return 'undefined';
    if (a === null) return 'null';
    if (typeof a === 'object') { try { return JSON.stringify(a); } catch(err){ return String(a); } }
    return String(a);
  }
  console.log = function(){ logs.push(Array.prototype.map.call(arguments, fmt).join(' ')); };
  let error = null;
  const results = [];
  try {
    const runner = new Function('__results', '__logs', code + '\\n' + testsCode);
    runner(results, logs);
  } catch(err){
    error = err.message;
  }
  console.log = origLog;
  self.postMessage({ logs: logs, error: error, results: results });
};
`;

function runInSandbox(code, testsCode, onDone){
  let finished = false;
  let worker;
  try {
    const blob = new Blob([WORKER_SRC], { type:'application/javascript' });
    worker = new Worker(URL.createObjectURL(blob));
  } catch(e){
    onDone({ logs:[], error:'Could not start the sandbox: ' + e.message, results:[], timedOut:false });
    return;
  }
  const timer = setTimeout(() => {
    if (finished) return;
    finished = true;
    worker.terminate();
    onDone({ logs:[], error:null, results:[], timedOut:true });
  }, 4000);
  worker.onmessage = function(e){
    if (finished) return;
    finished = true;
    clearTimeout(timer);
    worker.terminate();
    onDone({ logs:e.data.logs, error:e.data.error, results:e.data.results, timedOut:false });
  };
  worker.onerror = function(e){
    if (finished) return;
    finished = true;
    clearTimeout(timer);
    worker.terminate();
    onDone({ logs:[], error:e.message, results:[], timedOut:false });
  };
  worker.postMessage({ code, testsCode });
}

function buildTestsCode(tests){
  const helpers = "function __throws(fn, expectedMessage){ try { fn(); return false; } catch(e){ return expectedMessage === undefined ? true : e.message === expectedMessage; } }\n";
  return helpers + tests.map(t => {
    const descJson = JSON.stringify(t.desc);
    return 'try { var __pass = !!(' + t.check + '); __results.push({desc: ' + descJson + ', pass: __pass}); } ' +
           'catch(__e){ __results.push({desc: ' + descJson + ', pass:false, error: __e.message}); }';
  }).join('\n');
}

const collapsedFolders = new Set();

function renderSidebar(){
  const tree = document.getElementById('sidebarTree');
  tree.innerHTML = '';
  MODULES.forEach((mod, mi) => {
    const lessons = LESSONS.filter(l => l.module === mi);
    const folder = document.createElement('div');
    folder.className = 'folder' + (collapsedFolders.has(mi) ? ' collapsed' : '');
    const head = document.createElement('div');
    head.className = 'folder-head';
    const doneCount = lessons.filter(l => state.completed.has(l.id)).length;
    head.innerHTML = '<span class="folder-chevron">▾</span><span>' + (mi+1) + '. ' + mod.title + '</span><span style="margin-left:auto;color:var(--text-dim);font-weight:400;font-size:11px;">' + doneCount + '/' + lessons.length + '</span>';
    head.onclick = () => {
      if (collapsedFolders.has(mi)) collapsedFolders.delete(mi); else collapsedFolders.add(mi);
      renderSidebar();
    };
    folder.appendChild(head);
    const filesWrap = document.createElement('div');
    filesWrap.className = 'folder-files';
    lessons.forEach(l => {
      const item = document.createElement('div');
      item.className = 'file-item' + (l.id === state.activeId ? ' active' : '') + (state.completed.has(l.id) ? ' done' : '');
      item.innerHTML = '<span class="file-dot"></span><span class="file-icon">' + (l.type === 'predict' ? '?' : '{}') + '</span><span>' + l.file + '</span>';
      item.onclick = () => openLesson(l.id);
      filesWrap.appendChild(item);
    });
    folder.appendChild(filesWrap);
    tree.appendChild(folder);
  });
}

/* ============================================================
   TAB BAR
   ============================================================ */
function renderTabs(){
  const bar = document.getElementById('tabbar');
  bar.innerHTML = '';
  if (state.openTabs.length === 0){
    const empty = document.createElement('div');
    empty.className = 'tab-empty';
    empty.textContent = 'No lesson open';
    bar.appendChild(empty);
    return;
  }
  state.openTabs.forEach(id => {
    const lesson = LESSONS.find(l => l.id === id);
    if (!lesson) return;
    const tab = document.createElement('div');
    tab.className = 'tab' + (id === state.activeId ? ' active' : '');
    tab.innerHTML = '<span>' + lesson.file + '</span><span class="tab-close">✕</span>';
    tab.querySelector('span:first-child').onclick = () => openLesson(id);
    tab.querySelector('.tab-close').onclick = (e) => { e.stopPropagation(); closeTab(id); };
    bar.appendChild(tab);
  });
}

function closeTab(id){
  const idx = state.openTabs.indexOf(id);
  if (idx === -1) return;
  state.openTabs.splice(idx, 1);
  if (state.activeId === id){
    if (state.openTabs.length > 0){
      openLesson(state.openTabs[Math.max(0, idx - 1)]);
    } else {
      state.activeId = null;
      renderWelcome();
      renderTabs();
      renderSidebar();
      updateStatusBar();
    }
  } else {
    renderTabs();
  }
}

function openLesson(id){
  const lesson = LESSONS.find(l => l.id === id);
  if (!lesson) return;
  state.activeId = id;
  if (!state.openTabs.includes(id)){
    state.openTabs.push(id);
    if (state.openTabs.length > 6) state.openTabs.shift();
  }
  closeSidebarMobile();
  renderTabs();
  renderSidebar();
  renderLessonBody(lesson);
  updateStatusBar();
}

function lessonIndex(id){ return LESSONS.findIndex(l => l.id === id); }

function renderLessonBody(lesson){
  const scroll = document.getElementById('editorScroll');
  const idx = lessonIndex(lesson.id);
  const modTitle = MODULES[lesson.module].title;

  let html = '<div class="lesson">' +
    '<span class="lesson-eyebrow">MODULE ' + (lesson.module+1) + ': ' + modTitle.toUpperCase() + ' &middot; LESSON ' + (idx+1) + ' OF ' + LESSONS.length + '</span>' +
    '<h2>' + lesson.title + '</h2>' +
    '<div class="concept">' + lesson.concept + '</div>' +
    (lesson.task ? '<div class="task"><strong>Your task:</strong> ' + lesson.task + '</div>' : '');

  if (lesson.type === 'predict'){
    html += '<div id="predictHost"></div>';
  } else {
    html +=
      '<div class="editor-toolbar">' +
        '<button class="toolbar-btn run" id="runBtn">▶ Run</button>' +
        '<button class="toolbar-btn" id="resetBtn">Reset</button>' +
        '<div class="toolbar-spacer"></div>' +
      '</div>' +
      '<div id="cmHost"></div>' +
      '<div class="output-panel" id="outputPanel">' +
        '<div class="output-section-head">OUTPUT</div>' +
        '<div class="output-log" id="outputLog"><span class="empty">Click Run to see output here.</span></div>' +
        (lesson.tests && lesson.tests.length ? '<div class="output-section-head">TESTS</div><div class="test-results" id="testResults"><span class="empty" style="padding-left:14px;color:var(--text-dim);font-size:13px;">Run your code to check it against the tests.</span></div>' : '') +
        '<div id="resultBanner"></div>' +
      '</div>' +
      (lesson.solution ? '<div class="solution-box"><button class="solution-toggle" id="solutionToggle">Show solution</button><pre class="solution-code" id="solutionCode">' + escapeHtml(lesson.solution) + '</pre></div>' : '');
  }

  html +=
    '<div class="lesson-nav">' +
      '<button class="nav-btn" id="prevLessonBtn"' + (idx===0?' disabled':'') + '>&larr; Previous</button>' +
      '<button class="nav-btn" id="nextLessonBtn"' + (idx===LESSONS.length-1?' disabled':'') + '>Next &rarr;</button>' +
    '</div>' +
  '</div>';

  scroll.innerHTML = html;

  document.getElementById('prevLessonBtn').onclick = () => { if (idx>0) openLesson(LESSONS[idx-1].id); };
  document.getElementById('nextLessonBtn').onclick = () => { if (idx<LESSONS.length-1) openLesson(LESSONS[idx+1].id); };

  if (lesson.type === 'predict'){
    renderPredict(lesson);
  } else {
    initEditor(lesson);
    document.getElementById('runBtn').onclick = () => runExercise(lesson);
    document.getElementById('resetBtn').onclick = () => {
      state.cm.setValue(lesson.starter);
      saveDraft(lesson.id, lesson.starter);
    };
    const solBtn = document.getElementById('solutionToggle');
    if (solBtn){
      solBtn.onclick = () => {
        const box = document.getElementById('solutionCode');
        box.classList.toggle('show');

      };

}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function initEditor(lesson){
  const host = document.getElementById('cmHost');
  const startCode = (state.drafts[lesson.id] !== undefined) ? state.drafts[lesson.id] : lesson.starter;
  state.cm = CodeMirror(host, {
    value: startCode,
    mode: { name:'javascript' },
    theme: 'default',
    lineNumbers: true,
    matchBrackets: true,
    autoCloseBrackets: true,
    tabSize: 2,
    indentUnit: 2,
    viewportMargin: 20
  });
  let debounce;
  state.cm.on('change', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => saveDraft(lesson.id, state.cm.getValue()), 400);
  });
}

function runExercise(lesson){
  const code = state.cm.getValue();
  const testsCode = lesson.tests && lesson.tests.length ? buildTestsCode(lesson.tests) : '';
  const outputLog = document.getElementById('outputLog');
  const testResults = document.getElementById('testResults');
  const banner = document.getElementById('resultBanner');
  outputLog.innerHTML = '<span class="empty">Running...</span>';
  if (testResults) testResults.innerHTML = '';
  banner.innerHTML = '';

  runInSandbox(code, testsCode, (res) => {
    if (res.timedOut){
      outputLog.innerHTML = '';
      banner.innerHTML = '<div class="timeout-banner">Still running after 4 seconds -- this usually means an infinite loop. The sandbox was stopped automatically; check your loop condition and try again.</div>';
      return;
    }
    outputLog.innerHTML = res.logs.length
      ? res.logs.map(l => '<div>' + escapeHtml(l) + '</div>').join('')
      : '<span class="empty">No console.log output yet.</span>';
    if (res.error){
      outputLog.innerHTML += '<div class="err">Uncaught Error: ' + escapeHtml(res.error) + '</div>';
    }
    if (testResults && lesson.tests && lesson.tests.length){
      testResults.innerHTML = res.results.map(r =>
        '<div class="test-row ' + (r.pass ? 'pass' : 'fail') + '">' +
          '<span class="mark">' + (r.pass ? '✓' : '✗') + '</span>' +
          '<span>' + escapeHtml(r.desc) + (r.error && !r.pass ? '<span class="detail">' + escapeHtml(r.error) + '</span>' : '') + '</span>' +
        '</div>'
      ).join('');
      const allPass = res.results.length > 0 && res.results.every(r => r.pass);
      if (allPass){
        state.completed.add(lesson.id);
        saveProgress(state.completed);
        banner.innerHTML = '<div class="success-banner">✓ All tests passed -- lesson complete.</div>';
        renderSidebar();
        updateStatusBar();
      }
    } else if (!res.error) {
      // explore-type lesson: mark complete just by running
      if (!state.completed.has(lesson.id)){
        state.completed.add(lesson.id);
        saveProgress(state.completed);
        renderSidebar();
        updateStatusBar();
      }
    }
  });
}

/* ---------- Predict lessons ---------- */
function renderPredict(lesson){
  const host = document.getElementById('predictHost');
  const p = lesson.predict;
  host.innerHTML =
    '<div class="predict-snippet"><div id="predictCmHost"></div></div>' +
    '<div class="predict-question">' + p.question + '</div>' +
    '<div class="predict-options" id="predictOptions"></div>' +
    '<div class="predict-explain" id="predictExplain">' + p.afterExplain + '</div>' +
    '<button class="run-verify-btn" id="runVerifyBtn">▶ Run it to see the real output</button>' +
    '<div class="output-panel" style="display:none;" id="predictOutputPanel">' +
      '<div class="output-section-head">OUTPUT</div>' +
      '<div class="output-log" id="predictOutputLog"></div>' +
    '</div>';

  CodeMirror(document.getElementById('predictCmHost'), {
    value: p.snippet,
    mode: { name:'javascript' },
    theme: 'default',
    lineNumbers: true,
    readOnly: true,
    viewportMargin: Infinity
  });

  const optsWrap = document.getElementById('predictOptions');
  p.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'predict-opt';
    btn.textContent = opt;
    btn.onclick = () => {
      const allBtns = optsWrap.querySelectorAll('.predict-opt');
      allBtns.forEach((b, bi) => {
        b.disabled = true;
        if (bi === p.correctIndex) b.classList.add('correct');
        else if (bi === i) b.classList.add('wrong');
      });
      document.getElementById('predictExplain').classList.add('show');
      if (!state.completed.has(lesson.id)){
        state.completed.add(lesson.id);
        saveProgress(state.completed);
        renderSidebar();
        updateStatusBar();
      }
    };
    optsWrap.appendChild(btn);
  });

  document.getElementById('runVerifyBtn').onclick = () => {
    const panel = document.getElementById('predictOutputPanel');
    const log = document.getElementById('predictOutputLog');
    panel.style.display = 'block';
    log.innerHTML = '<span class="empty">Running...</span>';
    runInSandbox(p.snippet, '', (res) => {
      if (res.timedOut){
        log.innerHTML = '<span class="err">Timed out -- possible infinite loop.</span>';
        return;
      }
      log.innerHTML = res.logs.map(l => '<div>' + escapeHtml(l) + '</div>').join('');
      if (res.error){
        log.innerHTML += '<div class="err">Uncaught Error: ' + escapeHtml(res.error) + '</div>';
      }
    });
  };
}

/* ============================================================
   STATUS BAR
   ============================================================ */
function updateStatusBar(){
  const crumb = document.getElementById('statusBreadcrumb');
  const prog = document.getElementById('statusProgress');
  if (state.activeId){
    const lesson = LESSONS.find(l => l.id === state.activeId);
    crumb.textContent = 'JavaScript Fundamentals › ' + MODULES[lesson.module].title + ' › ' + lesson.title;
  } else {
    crumb.textContent = 'Welcome';
  }
  prog.textContent = state.completed.size + ' / ' + LESSONS.length + ' complete';
}

/* ============================================================
   MOBILE SIDEBAR
   ============================================================ */
function openSidebarMobile(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('open');
}
function closeSidebarMobile(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}
document.getElementById('hamburgerBtn').onclick = () => {
  const sb = document.getElementById('sidebar');
  if (sb.classList.contains('open')) closeSidebarMobile(); else openSidebarMobile();
};
document.getElementById('sidebarOverlay').onclick = closeSidebarMobile;
document.getElementById('navHome').onclick = () => {
  state.activeId = null;
  closeSidebarMobile();
  renderWelcome();
  renderTabs();
  renderSidebar();
};
document.getElementById('navExplorer').onclick = () => {
  if (window.innerWidth <= 860) openSidebarMobile();
};

/* ============================================================
   INIT
   ============================================================ */
renderSidebar();
renderTabs();
renderWelcome();
</script>
