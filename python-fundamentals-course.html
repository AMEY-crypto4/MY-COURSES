{ id:'m7-l1', module:6, file:'01_try_except.py', type:'exercise', title:'try / except — Handling Errors Gracefully',
  concept:'<p>Real programs deal with unpredictable input: a user types text where a number was expected, a file is missing, a network call fails. <code>try</code> / <code>except</code> lets your program catch an error and respond sensibly instead of crashing entirely.</p><pre>try:\n    age = int(input_text)\nexcept ValueError:\n    age = 0   <span style="color:#6A9955"># input was not a valid number -- fall back safely</span></pre><p>You can catch a SPECIFIC exception type (recommended, so you only handle the errors you actually expect) or use a bare <code>except:</code> to catch anything (generally discouraged, because it can silently hide real bugs you did not anticipate). You can also catch several types at once with a tuple: <code>except (ValueError, TypeError):</code>.</p><div class="callout"><b>Industry habit:</b> catch the narrowest exception type that makes sense. Catching everything with a bare except hides real bugs instead of fixing them.</div>',
  task:'Write safe_divide(a, b), returning a / b, but catching ZeroDivisionError and returning None instead of crashing when b is 0. Then write safe_int(text), converting text to an int, catching ValueError and returning None if the text is not a valid number.',
  starter:'def safe_divide(a, b):\n    # try the division, except ZeroDivisionError\n    pass\n\ndef safe_int(text):\n    # try int(text), except ValueError\n    pass',
  solution:'def safe_divide(a, b):\n    try:\n        return a / b\n    except ZeroDivisionError:\n        return None\n\ndef safe_int(text):\n    try:\n        return int(text)\n    except ValueError:\n        return None',
  tests:[
    { desc:'safe_divide(10, 2) == 5.0', check:'safe_divide(10, 2) == 5.0' },
    { desc:'safe_divide(10, 0) is None instead of crashing', check:'safe_divide(10, 0) is None' },
    { desc:'safe_int("42") == 42', check:'safe_int("42") == 42' },
    { desc:'safe_int("not a number") is None instead of crashing', check:'safe_int("not a number") is None' }
  ]},

{ id:'m7-l2', module:6, file:'02_else_finally_raise.py', type:'exercise', title:'else, finally & Raising Your Own Exceptions',
  concept:'<p>A try block can carry two extra clauses. <code>else</code> runs only if NO exception happened in the try block. <code>finally</code> always runs no matter what &mdash; whether the try succeeded, failed, or even returned early &mdash; making it the right place for cleanup code like closing a file or a connection.</p><pre>try:\n    result = risky_operation()\nexcept ValueError:\n    print("bad input")\nelse:\n    print("succeeded:", result)\nfinally:\n    print("cleanup always runs here")</pre><p>You can also raise your own exceptions with <code>raise</code>, to signal that something is wrong in YOUR code\u2019s own terms, with a clear message: <code>raise ValueError("age cannot be negative")</code>. This is how real libraries communicate precise, descriptive errors back to whoever is calling them.</p>',
  task:'Write validate_age(age), raising a ValueError with the message "age cannot be negative" if age is less than 0, and raising a ValueError with the message "age is unrealistically high" if age is over 150. Otherwise, return age unchanged.',
  starter:'def validate_age(age):\n    # raise ValueError with the right message for each invalid case\n    return age',
  solution:'def validate_age(age):\n    if age < 0:\n        raise ValueError("age cannot be negative")\n    if age > 150:\n        raise ValueError("age is unrealistically high")\n    return age',
  tests:[
    { desc:'validate_age(30) == 30', check:'validate_age(30) == 30' },
    { desc:'validate_age(-5) raises ValueError with the message "age cannot be negative"', check:'__raises_msg(ValueError, lambda: validate_age(-5), "age cannot be negative")' },
    { desc:'validate_age(200) raises ValueError with the message "age is unrealistically high"', check:'__raises_msg(ValueError, lambda: validate_age(200), "age is unrealistically high")' }
  ]},

{ id:'m7-l3', module:6, file:'03_assert_defensive.py', type:'exercise', title:'Defensive Programming with assert',
  concept:'<p><code>assert condition, "message"</code> checks that something you believe MUST be true actually is, and crashes immediately with an AssertionError (and your message) if it is not. It is a way of writing down your own assumptions directly in the code, so that if reality ever disagrees with your assumption, you find out immediately instead of getting a confusing wrong answer much later.</p><pre>def average(nums):\n    assert len(nums) > 0, "cannot average an empty list"\n    return sum(nums) / len(nums)</pre><div class="callout"><b>assert vs raise:</b> assert is mainly a development and testing tool for catching your own logic mistakes early and clearly. For errors you expect might genuinely happen with real user input (a missing file, bad user input), use try/except and raise instead -- assertions can even be stripped out of optimized production code, so never rely on them for real input validation.</div>',
  task:'Write average(nums), using an assert to guarantee nums is not empty (message: "cannot average an empty list"), then returning the average. Then write get_middle(nums), asserting the list has an odd length (message: "list must have an odd length") before returning the middle element.',
  starter:'def average(nums):\n    # assert nums is not empty, then return the average\n    pass\n\ndef get_middle(nums):\n    # assert len(nums) is odd, then return the middle item\n    pass',
  solution:'def average(nums):\n    assert len(nums) > 0, "cannot average an empty list"\n    return sum(nums) / len(nums)\n\ndef get_middle(nums):\n    assert len(nums) % 2 == 1, "list must have an odd length"\n    return nums[len(nums) // 2]',
  tests:[
    { desc:'average([2, 4, 6]) == 4', check:'average([2,4,6]) == 4' },
    { desc:'get_middle([1,2,3,4,5]) == 3', check:'get_middle([1,2,3,4,5]) == 3' },
    { desc:'average([]) raises an AssertionError instead of crashing with something else', check:'__raises(AssertionError, lambda: average([]))' },
    { desc:'get_middle([1,2,3,4]) raises an AssertionError for an even-length list', check:'__raises(AssertionError, lambda: get_middle([1,2,3,4]))' }
  ]},

{ id:'m8-l1', module:7, file:'01_reading_writing_files.py', type:'exercise', title:'Reading & Writing Files with open() and with',
  concept:'<p><code>open(filename, mode)</code> gives you a file object to read from or write to. <code>"w"</code> mode writes (creating the file, or erasing it if it already exists), <code>"a"</code> mode appends to the end, and <code>"r"</code> mode reads. The <code>with</code> statement is the standard, idiomatic way to work with a file: it automatically closes the file for you when the block ends, even if an error happens inside it.</p><pre>with open("notes.txt", "w") as f:\n    f.write("first line\\n")\n    f.write("second line\\n")\n\nwith open("notes.txt", "r") as f:\n    contents = f.read()        <span style="color:#6A9955"># the whole file as one string</span>\n    <span style="color:#6A9955"># or: f.readlines() for a list of lines</span></pre><div class="callout"><b>Why "with" and not plain open()/close():</b> if you open a file manually and an error happens before you reach your own .close() call, the file is left open, which can corrupt data or leak resources. "with" guarantees cleanup no matter what.</div><p>In this sandboxed browser environment, files you create live in an in-memory filesystem scoped to your own run &mdash; the mechanics are identical to a real local file, which is exactly the point of practicing it here.</p>',
  task:'Write a function save_and_count(lines), which writes each string in the lines list to a file called "log.txt" (one per line, using a for loop and a with block), then reads the file back and returns how many lines it contains using len() on readlines().',
  starter:'def save_and_count(lines):\n    # write each line to "log.txt", one per line\n    # then read it back and return how many lines it has\n    pass',
  solution:'def save_and_count(lines):\n    with open("log.txt", "w") as f:\n        for line in lines:\n            f.write(line + "\\n")\n    with open("log.txt", "r") as f:\n        return len(f.readlines())',
  tests:[
    { desc:'Correctly counts 3 written lines', check:'save_and_count(["a", "b", "c"]) == 3' },
    { desc:'Correctly counts a single written line', check:'save_and_count(["only one"]) == 1' }
  ]},

{ id:'m8-l2', module:7, file:'02_working_with_json.py', type:'exercise', title:'Working with JSON Data',
  concept:'<p>JSON (JavaScript Object Notation) is the universal format for structured data sent between a web browser, a server, and an API &mdash; in practice, almost every real API you will ever work with speaks JSON. Python\u2019s built-in <code>json</code> module converts between JSON TEXT and real Python objects:</p><ul><li><code>json.dumps(python_object)</code> &mdash; converts a Python dict/list into a JSON string</li><li><code>json.loads(json_string)</code> &mdash; converts a JSON string back into a Python dict/list</li></ul><pre>import json\n\ndata = {"name": "Amey", "skills": ["python", "sql"]}\ntext = json.dumps(data)\n<span style="color:#6A9955"># text is now a STRING: \'{"name": "Amey", "skills": ["python", "sql"]}\'</span>\n\nparsed = json.loads(text)\n<span style="color:#6A9955"># parsed is a real dict again, identical to data</span></pre><div class="callout"><b>Why this matters:</b> a JSON string looks almost exactly like a Python dict/list on the page, but it is NOT the same thing until you parse it -- a very common beginner confusion when working with real APIs.</div>',
  task:'Import json. Write profile_to_json(profile), converting a dict to a JSON string with json.dumps(). Write json_to_profile(text), converting a JSON string back to a dict with json.loads(). Then prove they are inverses by round-tripping a sample dict.',
  starter:'import json\n\ndef profile_to_json(profile):\n    # your code here\n    pass\n\ndef json_to_profile(text):\n    # your code here\n    pass',
  solution:'import json\n\ndef profile_to_json(profile):\n    return json.dumps(profile)\n\ndef json_to_profile(text):\n    return json.loads(text)',
  tests:[
    { desc:'profile_to_json produces a real string', check:'isinstance(profile_to_json({"a": 1}), str)' },
    { desc:'json_to_profile correctly parses JSON back into a dict', check:'json_to_profile(\'{"name": "Amey", "age": 27}\') == {"name": "Amey", "age": 27}' },
    { desc:'Round-tripping through both functions returns the original dict', check:'json_to_profile(profile_to_json({"x": 1, "y": [1,2,3]})) == {"x": 1, "y": [1,2,3]}' }
  ]},

{ id:'m8-l3', module:7, file:'03_stdlib_tour.py', type:'exercise', title:'A Tour of the Standard Library: random, math & datetime',
  concept:'<p>Python ships with a huge "standard library" of modules you can use immediately with just an <code>import</code> &mdash; no installation needed. Three you will use constantly:</p><ul><li><code>random</code> &mdash; <code>random.randint(a, b)</code> a random whole number from a to b inclusive; <code>random.choice(list)</code> a random item from a list</li><li><code>math</code> &mdash; <code>math.sqrt(x)</code>, <code>math.floor(x)</code>/<code>math.ceil(x)</code>, and the constant <code>math.pi</code></li><li><code>datetime</code> &mdash; <code>datetime.date(year, month, day)</code> represents a calendar date, and supports real subtraction to get the number of days between two dates</li></ul><pre>import math\nmath.sqrt(144)   <span style="color:#6A9955"># 12.0</span>\n\nfrom datetime import date\ndelta = date(2026, 1, 1) - date(2025, 12, 25)\ndelta.days        <span style="color:#6A9955"># 7</span></pre>',
  task:'Import math and datetime.date. Write hypotenuse(a, b) using math.sqrt to compute the hypotenuse of a right triangle (a**2 + b**2 then sqrt). Then write days_between(y1, m1, d1, y2, m2, d2), returning the number of days between two dates using date subtraction.',
  starter:'import math\nfrom datetime import date\n\ndef hypotenuse(a, b):\n    # use math.sqrt\n    pass\n\ndef days_between(y1, m1, d1, y2, m2, d2):\n    # build two date objects and subtract them\n    pass',
  solution:'import math\nfrom datetime import date\n\ndef hypotenuse(a, b):\n    return math.sqrt(a ** 2 + b ** 2)\n\ndef days_between(y1, m1, d1, y2, m2, d2):\n    return (date(y2, m2, d2) - date(y1, m1, d1)).days',
  tests:[
    { desc:'hypotenuse(3, 4) == 5.0', check:'hypotenuse(3, 4) == 5.0' },
    { desc:'hypotenuse(9, 12) == 15.0', check:'hypotenuse(9, 12) == 15.0' },
    { desc:'days_between correctly counts a full week', check:'days_between(2025, 12, 25, 2026, 1, 1) == 7' }
  ]},

{ id:'m9-l1', module:8, file:'01_classes_init_self.py', type:'exercise', title:'Classes, __init__ & self',
  concept:'<p>A class is a blueprint for creating objects that bundle data and behavior together. <code>__init__</code> is a special method that runs automatically every time you create a new instance with <code>ClassName(...)</code>, and is where you set up that instance\u2019s own starting data. <code>self</code> is the first parameter of every instance method, and always refers to the SPECIFIC instance the method was called on &mdash; Python passes it in for you automatically.</p><pre>class BankAccount:\n    def __init__(self, owner, balance):\n        self.owner = owner\n        self.balance = balance\n\n    def deposit(self, amount):\n        self.balance += amount\n\nacc = BankAccount("Amey", 100)\nacc.deposit(50)\nprint(acc.balance)   <span style="color:#6A9955"># 150</span></pre><div class="callout"><b>Why this matters:</b> a class is the natural way to model a real-world "thing" that has both state (data that can change, like balance) and behavior (actions it can take, like deposit) -- instead of passing a loose dictionary and a pile of separate functions around.</div>',
  task:'Build a class BankAccount with __init__(self, owner, balance), a method deposit(self, amount) that increases the balance, a method withdraw(self, amount) that decreases the balance (only if sufficient funds exist, otherwise does nothing), and get_balance(self) returning the current balance.',
  starter:'class BankAccount:\n    # __init__, deposit, withdraw, get_balance\n    pass',
  solution:'class BankAccount:\n    def __init__(self, owner, balance):\n        self.owner = owner\n        self.balance = balance\n\n    def deposit(self, amount):\n        self.balance += amount\n\n    def withdraw(self, amount):\n        if amount <= self.balance:\n            self.balance -= amount\n\n    def get_balance(self):\n        return self.balance',
  tests:[
    { desc:'A new account starts with the correct balance', check:'BankAccount("Amey", 100).get_balance() == 100' },
    { desc:'deposit() increases the balance correctly', check:'(lambda acc: (acc.deposit(50), acc.get_balance())[1])(BankAccount("Amey", 100)) == 150' },
    { desc:'withdraw() decreases the balance when funds are sufficient', check:'(lambda acc: (acc.withdraw(30), acc.get_balance())[1])(BankAccount("Amey", 100)) == 70' },
    { desc:'withdraw() refuses to overdraw the account', check:'(lambda acc: (acc.withdraw(500), acc.get_balance())[1])(BankAccount("Amey", 100)) == 100' }
  ]},

{ id:'m9-l2', module:8, file:'02_instance_vs_class_attributes.py', type:'exercise', title:'Instance Attributes vs Class Attributes',
  concept:'<p>An attribute set inside <code>__init__</code> with <code>self.x = ...</code> is an <strong>instance attribute</strong> &mdash; every object gets its own independent copy. An attribute defined directly inside the class body, outside any method, is a <strong>class attribute</strong> &mdash; it is shared by every instance of the class, unless a specific instance overrides it.</p><pre>class Dog:\n    species = "Canis familiaris"   <span style="color:#6A9955"># class attribute -- shared</span>\n\n    def __init__(self, name):\n        self.name = name            <span style="color:#6A9955"># instance attribute -- unique per dog</span>\n\nrex = Dog("Rex")\nfido = Dog("Fido")\nprint(rex.species, fido.species)   <span style="color:#6A9955"># both share the same species</span>\nprint(rex.name, fido.name)         <span style="color:#6A9955"># each has its own name</span></pre><div class="callout"><b>Real use case:</b> a class attribute is the right tool for something true of every instance equally, like a species name, a tax rate, or a maximum allowed value -- not something that differs per object.</div>',
  task:'Build a class Employee with a class attribute company set to "A&A Creations", shared by every instance. __init__(self, name, salary) should set instance attributes name and salary. Add a method annual_salary(self) returning salary * 12.',
  starter:'class Employee:\n    # class attribute: company\n\n    def __init__(self, name, salary):\n        # instance attributes\n        pass\n\n    def annual_salary(self):\n        pass',
  solution:'class Employee:\n    company = "A&A Creations"\n\n    def __init__(self, name, salary):\n        self.name = name\n        self.salary = salary\n\n    def annual_salary(self):\n        return self.salary * 12',
  tests:[
    { desc:'Every employee shares the same company class attribute', check:'Employee("A", 1000).company == "A&A Creations" and Employee("B", 2000).company == "A&A Creations"' },
    { desc:'Each employee keeps their own separate name and salary', check:'Employee("A", 1000).name == "A" and Employee("B", 2000).salary == 2000' },
    { desc:'annual_salary multiplies monthly salary by 12', check:'Employee("A", 1000).annual_salary() == 12000' }
  ]},

{ id:'m9-l3', module:8, file:'03_inheritance_polymorphism.py', type:'exercise', title:'Inheritance & Polymorphism',
  concept:'<p><strong>Inheritance</strong> lets a new class reuse and extend an existing one: <code>class Dog(Animal):</code> makes Dog a more specific version of Animal, automatically getting everything Animal has. Use <code>super().__init__(...)</code> inside the child\u2019s own __init__ to run the parent\u2019s setup logic too, instead of duplicating it.</p><p><strong>Polymorphism</strong> means different classes can implement the SAME method name in their own way, and calling that method on any of them "just works" correctly for its specific type &mdash; the caller does not need to know or care exactly which subclass it has:</p><pre>class Animal:\n    def __init__(self, name):\n        self.name = name\n    def speak(self):\n        return f"{self.name} makes a sound"\n\nclass Dog(Animal):\n    def speak(self):   <span style="color:#6A9955"># overrides the parent\'s version</span>\n        return f"{self.name} says Woof"\n\nfor animal in [Animal("Generic"), Dog("Rex")]:\n    print(animal.speak())   <span style="color:#6A9955"># each uses its OWN speak()</span></pre>',
  task:'Build a class Shape with __init__(self, name) and a method describe(self) returning f"{name} has an area of {area}" using self.area() (not yet defined on Shape itself). Build Circle(Shape) and Rectangle(Shape), each calling super().__init__ with a fixed name ("circle" / "rectangle"), each implementing their own area(self) method (circle: __init__(self, radius) stores radius, area = 3.14159 * radius * radius; rectangle: __init__(self, width, height) stores both, area = width * height).',
  starter:'class Shape:\n    def __init__(self, name):\n        self.name = name\n\n    def describe(self):\n        return f"{self.name} has an area of {self.area()}"\n\nclass Circle(Shape):\n    def __init__(self, radius):\n        # call super().__init__ with "circle", store radius\n        pass\n\n    def area(self):\n        pass\n\nclass Rectangle(Shape):\n    def __init__(self, width, height):\n        # call super().__init__ with "rectangle", store width and height\n        pass\n\n    def area(self):\n        pass',
  solution:'class Shape:\n    def __init__(self, name):\n        self.name = name\n\n    def describe(self):\n        return f"{self.name} has an area of {self.area()}"\n\nclass Circle(Shape):\n    def __init__(self, radius):\n        super().__init__("circle")\n        self.radius = radius\n\n    def area(self):\n        return 3.14159 * self.radius * self.radius\n\nclass Rectangle(Shape):\n    def __init__(self, width, height):\n        super().__init__("rectangle")\n        self.width = width\n        self.height = height\n\n    def area(self):\n        return self.width * self.height',
  tests:[
    { desc:'Circle correctly inherits and uses Shape describe()', check:'"circle has an area of" in Circle(2).describe()' },
    { desc:'Circle area is computed correctly', check:'abs(Circle(2).area() - 12.56636) < 0.01' },
    { desc:'Rectangle area is computed correctly', check:'Rectangle(4, 5).area() == 20' },
    { desc:'Each subclass uses its OWN area() through the shared describe()', check:'Rectangle(4,5).describe() == "rectangle has an area of 20"' }
  ]},

{ id:'m9-l4', module:8, file:'04_dunder_methods.py', type:'exercise', title:'Dunder Methods: __str__, __repr__ & __eq__',
  concept:'<p>"Dunder" methods (short for "double underscore") are special methods Python calls automatically in specific situations, letting your own classes hook into built-in language behavior. Three of the most useful:</p><ul><li><code>__str__(self)</code> &mdash; controls what <code>print(obj)</code> or <code>str(obj)</code> shows: a friendly, readable description</li><li><code>__repr__(self)</code> &mdash; a more precise, developer-facing representation, shown when you just type the object name, often written to look like valid code that could recreate it</li><li><code>__eq__(self, other)</code> &mdash; controls what <code>obj1 == obj2</code> actually checks; without it, two separate objects are never equal even with identical data, because == defaults to checking if they are literally the same object in memory</li></ul><pre>class Point:\n    def __init__(self, x, y):\n        self.x, self.y = x, y\n    def __str__(self):\n        return f"({self.x}, {self.y})"\n    def __eq__(self, other):\n        return self.x == other.x and self.y == other.y\n\nprint(Point(1, 2))                  <span style="color:#6A9955"># (1, 2) -- uses __str__</span>\nprint(Point(1, 2) == Point(1, 2))   <span style="color:#6A9955"># True -- uses __eq__</span></pre>',
  task:'Build a class Point with __init__(self, x, y), __str__(self) returning "(x, y)" formatted with an f-string, and __eq__(self, other) returning True only when both x and y match.',
  starter:'class Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def __str__(self):\n        pass\n\n    def __eq__(self, other):\n        pass',
  solution:'class Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def __str__(self):\n        return f"({self.x}, {self.y})"\n\n    def __eq__(self, other):\n        return self.x == other.x and self.y == other.y',
  tests:[
    { desc:'str(Point(1, 2)) reads exactly "(1, 2)"', check:'str(Point(1, 2)) == "(1, 2)"' },
    { desc:'Two points with the same coordinates compare equal', check:'Point(3, 4) == Point(3, 4)' },
    { desc:'Two points with different coordinates are not equal', check:'not (Point(3, 4) == Point(9, 9))' }
  ]},

{ id:'m10-l1', module:9, file:'01_iterables_iterators_predict.py', type:'predict', title:'How for Loops Really Work: Iterables & Iterators — Predict the Output',
  concept:'<p>A <code>for</code> loop is not magic &mdash; it is built on a simple protocol. Any object you can loop over (a list, a string, a dict) is called an <strong>iterable</strong>, meaning it can produce an <strong>iterator</strong> via the built-in <code>iter()</code> function. That iterator then yields one value at a time via the built-in <code>next()</code> function, until there is nothing left, at which point it raises a special <code>StopIteration</code> signal that the for loop catches silently and uses to know when to stop.</p><pre>nums = [10, 20, 30]\nit = iter(nums)\nprint(next(it))   <span style="color:#6A9955"># 10</span>\nprint(next(it))   <span style="color:#6A9955"># 20</span>\nprint(next(it))   <span style="color:#6A9955"># 30</span>\n<span style="color:#6A9955"># next(it) again here would raise StopIteration</span></pre>',
  task:'',
  predict:{
    snippet:'letters = ["a", "b"]\nit = iter(letters)\nprint(next(it))\nprint(next(it))\ntry:\n    print(next(it))\nexcept StopIteration:\n    print("no more items")',
    question:'What does the program print on its FINAL line of output?',
    options:['no more items','StopIteration','None','b'],
    correctIndex:0,
    afterExplain:'After "a" and "b" have both been returned, calling next(it) a third time has nothing left to give, so the iterator raises StopIteration. The except block catches that exact exception and prints "no more items" instead of letting the program crash. This is EXACTLY the mechanism a for loop uses internally, just normally hidden from you.'
  }},

{ id:'m10-l2', module:9, file:'02_generator_functions.py', type:'exercise', title:'Generator Functions with yield',
  concept:'<p>A <strong>generator function</strong> looks like a normal function but uses <code>yield</code> instead of <code>return</code>. Calling it does not run the function body immediately &mdash; it returns a special generator object that produces values one at a time, on demand, pausing exactly where it left off between each value. This means a generator can represent an enormous (even infinite) sequence while only ever holding ONE value in memory at a time.</p><pre>def countdown(n):\n    while n > 0:\n        yield n\n        n -= 1\n\nfor number in countdown(3):\n    print(number)   <span style="color:#6A9955"># 3, then 2, then 1</span></pre><div class="callout"><b>Why this matters in real code:</b> reading a huge file line by line, or streaming results from an API one page at a time, are both naturally expressed as generators -- you never need to load everything into memory at once just to process it piece by piece.</div>',
  task:'Write a generator function even_numbers_up_to(n), yielding every even number from 2 up to and including n, in order. Then write first_n(generator, count), which pulls exactly count values out of any generator using next() in a loop, and returns them as a list.',
  starter:'def even_numbers_up_to(n):\n    # yield each even number, 2, 4, 6, ... up to n\n    pass\n\ndef first_n(generator, count):\n    # pull exactly `count` values out using next(), return as a list\n    result = []\n    return result',
  solution:'def even_numbers_up_to(n):\n    current = 2\n    while current <= n:\n        yield current\n        current += 2\n\ndef first_n(generator, count):\n    result = []\n    for _ in range(count):\n        result.append(next(generator))\n    return result',
  tests:[
    { desc:'even_numbers_up_to(10) yields 2,4,6,8,10 when collected into a list', check:'list(even_numbers_up_to(10)) == [2,4,6,8,10]' },
    { desc:'even_numbers_up_to is a real generator, not a plain list', check:'hasattr(even_numbers_up_to(10), "__next__")' },
    { desc:'first_n correctly pulls a limited number of values out', check:'first_n(even_numbers_up_to(100), 3) == [2, 4, 6]' }
  ]},

{ id:'m10-l3', module:9, file:'03_map_filter.py', type:'exercise', title:'map(), filter() & Functional Patterns',
  concept:'<p><code>map(function, iterable)</code> applies a function to every item and gives back the transformed results. <code>filter(function, iterable)</code> keeps only the items for which the function returns a truthy value. Both return a lazy iterator (not a list directly), so you usually wrap them in <code>list(...)</code> to see or use the results right away.</p><pre>nums = [1, 2, 3, 4, 5]\ndoubled = list(map(lambda n: n * 2, nums))     <span style="color:#6A9955"># [2, 4, 6, 8, 10]</span>\nevens = list(filter(lambda n: n % 2 == 0, nums))  <span style="color:#6A9955"># [2, 4]</span></pre><div class="callout"><b>map/filter vs comprehensions:</b> a list comprehension can express the exact same idea and most Python developers consider it more readable for simple cases. You will still see map() and filter() often in real code, especially passed existing named functions instead of lambdas, so recognizing them is essential even if you usually reach for a comprehension yourself.</div>',
  task:'Given prices, use map() with a lambda to build with_tax (each price increased by 18%, rounded to 2 decimals with round() inside the lambda). Use filter() with a lambda to build affordable (only prices from the ORIGINAL list that are 100 or less). Both results should be real lists.',
  starter:'prices = [50, 120, 85, 200, 30]\n# with_tax: each price + 18%, rounded to 2 decimals, using map()\n\n\n# affordable: only prices <= 100 from the original list, using filter()\n\n',
  solution:'prices = [50, 120, 85, 200, 30]\nwith_tax = list(map(lambda p: round(p * 1.18, 2), prices))\naffordable = list(filter(lambda p: p <= 100, prices))',
  tests:[
    { desc:'with_tax correctly applies 18 percent tax to every price', check:'with_tax == [59.0, 141.6, 100.3, 236.0, 35.4]' },

{ id:'m10-l4', module:9, file:'04_decorators_predict.py', type:'predict', title:'Decorators — Functions That Wrap Functions — Predict the Output',
  concept:'<p>A <strong>decorator</strong> is a function that takes another function as input, and returns a new function that usually calls the original while adding extra behavior around it &mdash; before it runs, after it runs, or both. The <code>@decorator_name</code> syntax just above a function definition is shorthand for "pass this function through the decorator, and use the result instead."</p><pre>def shout(func):\n    def wrapper(*args, **kwargs):\n        result = func(*args, **kwargs)\n        return result.upper()\n    return wrapper\n\n@shout\ndef greet(name):\n    return f"hello {name}"\n\nprint(greet("amey"))   <span style="color:#6A9955"># HELLO AMEY</span></pre><p>This is exactly how real frameworks add logging, timing, authentication checks, or caching around a function, without changing a single line inside that function itself.</p>',
  task:'',
  predict:{
    snippet:'def shout(func):\n    def wrapper(*args, **kwargs):\n        result = func(*args, **kwargs)\n        return result.upper()\n    return wrapper\n\n@shout\ndef greet(name):\n    return f"hello {name}"\n\nprint(greet("amey"))\nprint(greet.__name__)',
    question:'What does the SECOND print line, greet.__name__, print?',
    options:['wrapper','greet','shout','HELLO AMEY'],
    correctIndex:0,
    afterExplain:'The @shout line replaced greet with whatever shout(greet) returned -- the inner "wrapper" function. So the name "greet" now actually points to a function literally named wrapper, and __name__ reports that honestly. (Real-world decorators fix this cosmetic issue with functools.wraps, but seeing the raw behavior first is the whole point here.)'
  }},

{ id:'m11-l1', module:10, file:'01_testable_code.py', type:'exercise', title:'Writing Testable Code with assert-based Tests',
  concept:'<p>Every exercise in this entire course has secretly been testing your code with assert-style checks behind the scenes. Writing your OWN tests this way is a core professional habit: a short, separate block of code that calls your function with known inputs and checks the output matches what you expect, BEFORE you ship or rely on it.</p><pre>def add(a, b):\n    return a + b\n\n<span style="color:#6A9955"># a tiny hand-written test suite</span>\nassert add(2, 3) == 5\nassert add(-1, 1) == 0\nassert add(0, 0) == 0\nprint("all tests passed")</pre><div class="callout"><b>Why this matters:</b> real projects use testing frameworks like pytest to automate exactly this pattern at scale, but the underlying idea never changes: write down what your function SHOULD do for a few representative inputs, then let the computer check it every time you change the code, instead of re-checking by hand and eye.</div>',
  task:'Write is_palindrome(text), returning True if text reads the same forwards and backwards (ignore case, compare letters only -- assume text already has no spaces or punctuation for simplicity). Then write run_tests(), which uses several assert statements to test is_palindrome against at least 3 cases (at least one True case and one False case) and returns the string "all tests passed" only if every assert succeeds.',

const STORAGE_KEY = 'pyFundamentalsProgress_v2';

function loadProgress(){
  try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); }
  catch(e){ return new Set(); }
}
function saveProgress(set){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...set])); } catch(e){}
}
function loadDrafts(){
  try { return JSON.parse(localStorage.getItem(DRAFTS_KEY) || '{}'); }
  catch(e){ return {}; }
}
function saveDraft(id, code){
  try {
    const drafts = loadDrafts();
    drafts[id] = code;
    localStorage.setItem(DRAFTS_KEY, JSON.stringify(drafts));
  } catch(e){}
}

/* ============================================================
   PYTHON RUNTIME (Pyodide, inside a persistent Web Worker)
   ============================================================ */
const PY_WORKER_SRC = `
importScripts('https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js');
let pyodideReadyPromise = loadPyodide();

self.onmessage = async function(e){
  const { code, testsCode, runId } = e.data;
  const pyodide = await pyodideReadyPromise;
  const logs = [];
  pyodide.setStdout({ batched: (s) => logs.push(s) });
  pyodide.setStderr({ batched: (s) => logs.push(s) });
  let error = null;
  let results = [];
  // Fresh global namespace per run, so variables from one run never leak into the next.
  const namespace = pyodide.runPython('dict()');
  try {
    await pyodide.runPythonAsync(code, { globals: namespace });
    if (testsCode) {
      // Make the captured print() output available to the test code as a real Python list.
      namespace.set('__logs', pyodide.toPy(logs));
      await pyodide.runPythonAsync(testsCode, { globals: namespace });
      const resultsJson = namespace.get('__results_json');
      results = JSON.parse(resultsJson);
    }
  } catch(err){
    error = err.message;
  } finally {
    namespace.destroy();
  }
  self.postMessage({ logs, error, results, runId, ready:true });
};
self.postMessage({ workerBooting:true });
`;

let pyWorker = null;
let pyWorkerBusy = false;
let pyRunCounter = 0;

function getPyWorker(){
  if (pyWorker) return pyWorker;
  const blob = new Blob([PY_WORKER_SRC], { type:'application/javascript' });
  pyWorker = new Worker(URL.createObjectURL(blob));
  return pyWorker;
}

function runPython(code, testsCode, onDone, onBooting){
  const worker = getPyWorker();
  const runId = ++pyRunCounter;
  let finished = false;
  pyWorkerBusy = true;
  if (onBooting) onBooting();

  const timer = setTimeout(() => {
    if (finished) return;
    finished = true;
    pyWorkerBusy = false;
    try { worker.terminate(); } catch(e){}
    pyWorker = null; // force a fresh runtime next time
    onDone({ logs:[], error:null, results:[], timedOut:true });
  }, 10000);

  function handler(e){
    if (e.data && e.data.workerBooting) return;
    if (e.data.runId !== runId) return;
    if (finished) return;
    finished = true;
    pyWorkerBusy = false;
    clearTimeout(timer);
    worker.removeEventListener('message', handler);
    onDone({ logs:e.data.logs, error:e.data.error, results:e.data.results, timedOut:false });
  }
  worker.addEventListener('message', handler);
  worker.onerror = function(e){
    if (finished) return;
    finished = true;
    pyWorkerBusy = false;
    clearTimeout(timer);
    try { worker.terminate(); } catch(err){}
    pyWorker = null;
    onDone({ logs:[], error:e.message, results:[], timedOut:false });
  };
  worker.postMessage({ code, testsCode, runId });
}

function buildTestsCode(tests){
  if (!tests || !tests.length) return '';
  const lines = [
    '__results = []',
    'def __raises(exc_type, fn):',
    '    try:',
    '        fn()',
    '        return False',
    '    except exc_type:',
    '        return True',
    '    except Exception:',
    '        return False',
    'def __raises_msg(exc_type, fn, expected_msg):',
    '    try:',
    '        fn()',
    '        return False',
    '    except exc_type as __e:',
    '        return str(__e) == expected_msg',
    '    except Exception:',
    '        return False'
  ];
  tests.forEach(t => {
    const descJson = JSON.stringify(t.desc);
    lines.push('try:');
    lines.push('    __pass = bool(' + t.check + ')');
    lines.push('    __results.append({"desc": ' + descJson + ', "pass": __pass})');
    lines.push('except Exception as __e:');
    lines.push('    __results.append({"desc": ' + descJson + ', "pass": False, "error": str(__e)})');
  });
  lines.push('import json as __json_mod');
  lines.push('__results_json = __json_mod.dumps(__results)');
  return lines.join('\n');
}

const collapsedFolders = new Set();

function renderSidebar(){
  const tree = document.getElementById('sidebarTree');
  tree.innerHTML = '';
  MODULES.forEach((mod, mi) => {
    const lessons = LESSONS.filter(l => l.module === mi);
    const folder = document.createElement('div');
    folder.className = 'folder' + (collapsedFolders.has(mi) ? ' collapsed' : '');
    const head = document.createElement('div');
    head.className = 'folder-head';
    const doneCount = lessons.filter(l => state.completed.has(l.id)).length;
    head.innerHTML = '<span class="folder-chevron">▾</span><span>' + (mi+1) + '. ' + mod.title + '</span><span style="margin-left:auto;color:var(--text-dim);font-weight:400;font-size:11px;">' + doneCount + '/' + lessons.length + '</span>';
    head.onclick = () => {
      if (collapsedFolders.has(mi)) collapsedFolders.delete(mi); else collapsedFolders.add(mi);
      renderSidebar();
    };
    folder.appendChild(head);
    const filesWrap = document.createElement('div');
    filesWrap.className = 'folder-files';
    lessons.forEach(l => {
      const item = document.createElement('div');
      item.className = 'file-item' + (l.id === state.activeId ? ' active' : '') + (state.completed.has(l.id) ? ' done' : '');
      item.innerHTML = '<span class="file-dot"></span><span class="file-icon">' + (l.type === 'predict' ? '?' : 'py') + '</span><span>' + l.file + '</span>';
      item.onclick = () => openLesson(l.id);
      filesWrap.appendChild(item);
    });
    folder.appendChild(filesWrap);
    tree.appendChild(folder);
  });
}

function renderTabs(){
  const bar = document.getElementById('tabbar');
  bar.innerHTML = '';
  if (state.openTabs.length === 0){
    const empty = document.createElement('div');
    empty.className = 'tab-empty';
    empty.textContent = 'No lesson open';
    bar.appendChild(empty);
    return;
  }
  state.openTabs.forEach(id => {
    const lesson = LESSONS.find(l => l.id === id);
    if (!lesson) return;
    const tab = document.createElement('div');
    tab.className = 'tab' + (id === state.activeId ? ' active' : '');
    tab.innerHTML = '<span>' + lesson.file + '</span><span class="tab-close">✕</span>';
    tab.querySelector('span:first-child').onclick = () => openLesson(id);
    tab.querySelector('.tab-close').onclick = (e) => { e.stopPropagation(); closeTab(id); };
    bar.appendChild(tab);
  });
}

function closeTab(id){
  const idx = state.openTabs.indexOf(id);
  if (idx === -1) return;
  state.openTabs.splice(idx, 1);
  if (state.activeId === id){
    if (state.openTabs.length > 0){
      openLesson(state.openTabs[Math.max(0, idx - 1)]);
    } else {
      state.activeId = null;
      renderWelcome();
      renderTabs();
      renderSidebar();
      updateStatusBar();
    }
  } else {
    renderTabs();
  }
}

function openLesson(id){
  const lesson = LESSONS.find(l => l.id === id);
  if (!lesson) return;
  state.activeId = id;
  if (!state.openTabs.includes(id)){
    state.openTabs.push(id);
    if (state.openTabs.length > 6) state.openTabs.shift();
  }
  closeSidebarMobile();
  renderTabs();
  renderSidebar();
  renderLessonBody(lesson);
  updateStatusBar();
}

        '<div id="resultBanner"></div>' +
      '</div>' +
      (lesson.solution ? '<div class="solution-box"><button class="solution-toggle" id="solutionToggle">Show solution</button><pre class="solution-code" id="solutionCode">' + escapeHtml(lesson.solution) + '</pre></div>' : '');
  }

  html +=
    '<div class="lesson-nav">' +
      '<button class="nav-btn" id="prevLessonBtn"' + (idx===0?' disabled':'') + '>&larr; Previous</button>' +
      '<button class="nav-btn" id="nextLessonBtn"' + (idx===LESSONS.length-1?' disabled':'') + '>Next &rarr;</button>' +
    '</div>' +
  '</div>';

  scroll.innerHTML = html;
  scroll.scrollTop = 0;

  document.getElementById('prevLessonBtn').onclick = () => { if (idx>0) openLesson(LESSONS[idx-1].id); };
  document.getElementById('nextLessonBtn').onclick = () => { if (idx<LESSONS.length-1) openLesson(LESSONS[idx+1].id); };

  if (lesson.type === 'predict'){
    renderPredict(lesson);
  } else {
    initEditor(lesson);
    document.getElementById('runBtn').onclick = () => runExercise(lesson);
    document.getElementById('resetBtn').onclick = () => {
      state.cm.setValue(lesson.starter);
      saveDraft(lesson.id, lesson.starter);
    };
    const solBtn = document.getElementById('solutionToggle');
    if (solBtn){
      solBtn.onclick = () => {
        const box = document.getElementById('solutionCode');
        box.classList.toggle('show');
        solBtn.textContent = box.classList.contains('show') ? 'Hide solution' : 'Show solution';
      };
    }
  }
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Pyodide tracebacks include internal runtime frames (_pyodide/_base.py, etc.) before
// reaching the student's own code. Strip those so a beginner only sees frames from
// their own script -- exactly what a real local Python traceback would show.
function cleanPythonError(raw){
  if (!raw) return raw;
  const lines = raw.split('\n');
  const out = [];
  let i = 0;
  const isFrameStart = (l) => /^\s*File "/.test(l);
  const isExcLine = (l) => /^[A-Za-z_][A-Za-z0-9_.]*(Error|Exception|Warning)\b/.test(l) || /^Traceback/.test(l);
  while (i < lines.length){
    const line = lines[i];
    if (isFrameStart(line)){
      const keep = line.includes('<exec>');
      if (keep) out.push(line);
      i++;
      while (i < lines.length && !isFrameStart(lines[i]) && !isExcLine(lines[i])){
        if (keep) out.push(lines[i]);
        i++;
      }
    } else {
      out.push(line);
      i++;
    }
  }
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

function initEditor(lesson){
  const host = document.getElementById('cmHost');
  const startCode = (state.drafts[lesson.id] !== undefined) ? state.drafts[lesson.id] : lesson.starter;
  state.cm = CodeMirror(host, {
    value: startCode,
    mode: { name:'python' },
    theme: 'default',
    lineNumbers: true,
    matchBrackets: true,
    autoCloseBrackets: true,
    tabSize: 4,
    indentUnit: 4,
    viewportMargin: 20
  });
  let debounce;
  state.cm.on('change', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => saveDraft(lesson.id, state.cm.getValue()), 400);
  });
}

function runExercise(lesson){
  const code = state.cm.getValue();
  const testsCode = buildTestsCode(lesson.tests);
  const outputLog = document.getElementById('outputLog');
  const testResults = document.getElementById('testResults');
  const banner = document.getElementById('resultBanner');
  const runBtn = document.getElementById('runBtn');
  const pill = document.getElementById('runtimePill');
  if (testResults) testResults.innerHTML = '';
  banner.innerHTML = '';
  runBtn.disabled = true;

  runPython(code, testsCode, (res) => {
    runBtn.disabled = false;
    pill.textContent = '';
    if (res.timedOut){
      outputLog.innerHTML = '';
      banner.innerHTML = '<div class="timeout-banner">Still running after 10 seconds -- this usually means an infinite loop. The Python runtime was restarted automatically; check your loop condition and try again.</div>';
      return;
    }
    outputLog.innerHTML = res.logs.length
      ? res.logs.map(l => '<div>' + escapeHtml(l) + '</div>').join('')
      : '<span class="empty">No print() output yet.</span>';
    if (res.error){
      outputLog.innerHTML += '<div class="err">' + escapeHtml(cleanPythonError(res.error)) + '</div>';
    }
    if (testResults && lesson.tests && lesson.tests.length){
      testResults.innerHTML = res.results.map(r =>
        '<div class="test-row ' + (r.pass ? 'pass' : 'fail') + '">' +
          '<span class="mark">' + (r.pass ? '✓' : '✗') + '</span>' +
          '<span>' + escapeHtml(r.desc) + (r.error && !r.pass ? '<span class="detail">' + escapeHtml(r.error) + '</span>' : '') + '</span>' +
        '</div>'
      ).join('');
      const allPass = res.results.length > 0 && res.results.every(r => r.pass);
      if (allPass){
        state.completed.add(lesson.id);
        saveProgress(state.completed);
        banner.innerHTML = '<div class="success-banner">✓ All tests passed -- lesson complete.</div>';
        renderSidebar();
        updateStatusBar();
      }
    } else if (!res.error) {
      if (!state.completed.has(lesson.id)){
        state.completed.add(lesson.id);
        saveProgress(state.completed);
        renderSidebar();
        updateStatusBar();
      }
    }
  }, () => {
    pill.textContent = pyWorker && !pyWorkerBusy ? '' : 'booting Python runtime…';
    outputLog.innerHTML = '<span class="empty">' + (pill.textContent ? 'Starting Python (first run only, a few seconds)…' : 'Running...') + '</span>';
  });
}

/* ---------- Predict lessons ---------- */
function renderPredict(lesson){
  const host = document.getElementById('predictHost');
  const p = lesson.predict;
  host.innerHTML =
    '<div class="predict-snippet"><div id="predictCmHost"></div></div>' +
    '<div class="predict-question">' + p.question + '</div>' +
    '<div class="predict-options" id="predictOptions"></div>' +
    '<div class="predict-explain" id="predictExplain">' + p.afterExplain + '</div>' +
    '<button class="run-verify-btn" id="runVerifyBtn">▶ Run it to see the real output</button>' +
    '<div class="output-panel" style="display:none;" id="predictOutputPanel">' +
      '<div class="output-section-head">OUTPUT</div>' +
      '<div class="output-log" id="predictOutputLog"></div>' +
    '</div>';

  CodeMirror(document.getElementById('predictCmHost'), {
    value: p.snippet,
    mode: { name:'python' },
    theme: 'default',
    lineNumbers: true,
    readOnly: true,
    viewportMargin: Infinity
  });

  const optsWrap = document.getElementById('predictOptions');
  p.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'predict-opt';
    btn.innerHTML = opt;
    btn.onclick = () => {
      const allBtns = optsWrap.querySelectorAll('.predict-opt');
      allBtns.forEach((b, bi) => {
        b.disabled = true;
        if (bi === p.correctIndex) b.classList.add('correct');
        else if (bi === i) b.classList.add('wrong');
      });
      document.getElementById('predictExplain').classList.add('show');
      if (!state.completed.has(lesson.id)){
        state.completed.add(lesson.id);
        saveProgress(state.completed);
        renderSidebar();
        updateStatusBar();
      }
    };
    optsWrap.appendChild(btn);
  });

  document.getElementById('runVerifyBtn').onclick = () => {
    const panel = document.getElementById('predictOutputPanel');
    const log = document.getElementById('predictOutputLog');
    panel.style.display = 'block';
    log.innerHTML = '<span class="empty">Starting Python…</span>';
    runPython(p.snippet, '', (res) => {
      if (res.timedOut){
        log.innerHTML = '<span class="err">Timed out -- possible infinite loop.</span>';
        return;
      }
      log.innerHTML = res.logs.map(l => '<div>' + escapeHtml(l) + '</div>').join('');
      if (res.error){
        log.innerHTML += '<div class="err">' + escapeHtml(cleanPythonError(res.error)) + '</div>';
      }
    });
  };
}

/* ============================================================
   STATUS BAR
   ============================================================ */
function updateStatusBar(){
  const crumb = document.getElementById('statusBreadcrumb');
  const prog = document.getElementById('statusProgress');
  if (state.activeId){
    const lesson = LESSONS.find(l => l.id === state.activeId);
    crumb.textContent = 'Python Fundamentals › ' + MODULES[lesson.module].title + ' › ' + lesson.title;
  } else {
    crumb.textContent = 'Welcome';
  }
  prog.textContent = state.completed.size + ' / ' + LESSONS.length + ' complete';
}

/* ============================================================
   MOBILE SIDEBAR
   ============================================================ */
function openSidebarMobile(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('open');
}
function closeSidebarMobile(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}
document.getElementById('hamburgerBtn').onclick = () => {
  const sb = document.getElementById('sidebar');
  if (sb.classList.contains('open')) closeSidebarMobile(); else openSidebarMobile();
};
document.getElementById('sidebarOverlay').onclick = closeSidebarMobile;
document.getElementById('navHome').onclick = () => {
  state.activeId = null;
  closeSidebarMobile();
  renderWelcome();
  renderTabs();
  renderSidebar();
};
document.getElementById('navExplorer').onclick = () => {
  if (window.innerWidth <= 860) openSidebarMobile();
};

/* ============================================================
   INIT
   ============================================================ */
renderSidebar();
renderTabs();
renderWelcome();
</script>
